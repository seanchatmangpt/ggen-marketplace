# Monetization registry: per-solution commerce configuration, root-level by
# choice (the ggen `[pack]` loader schema is the loader's, not the marketplace's).
# Pattern mirror of lifecycle.toml; see scripts/marketplace_monetization.py.
# Pure stdlib; an absent file is empty defaults, never an error.

schema_version = "1.0.0"

[monetization]
backend = "sim"                       # sim | real
billing_authorities = ["GOOGLE_CLOUD_MARKETPLACE"]
provider_id = "demo-provider"
unit_price_usd = 0.05

# Per-solution overrides. Closed key set (see ENTRY_KEYS in the loader):
# backend, billing_authorities, provider_id, unit_price_usd, plan.
# billing_authorities must hold exactly one authority.
