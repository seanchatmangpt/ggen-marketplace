[[court]]
id = "develop-manufacturing-capital-accounting-r19"
paths = ["packs/ggen-project-boundary-pack/**"]
main_only = true  # former workflow ran only on push to main
ggen = true  # scripts/ci_courts.py admits+installs ggen once and exports GGEN_BIN
run = '''
# Double-manufacture R19 capital consequences
set -euo pipefail
(cd packs/ggen-project-boundary-pack && "$GGEN_BIN" sync run)
test -f packs/ggen-project-boundary-pack/generated/project-boundary/manufacturing-capital-statement.json
test -f packs/ggen-project-boundary-pack/generated/project-boundary/manufacturing_capital_court.py
find packs/ggen-project-boundary-pack/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/r19-generated-a.sha256"
(cd packs/ggen-project-boundary-pack && "$GGEN_BIN" sync run)
find packs/ggen-project-boundary-pack/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/r19-generated-b.sha256"
cmp "$RUNNER_TEMP/r19-generated-a.sha256" "$RUNNER_TEMP/r19-generated-b.sha256"
# Execute generated manufacturing-capital court
python3 packs/ggen-project-boundary-pack/generated/project-boundary/manufacturing_capital_court.py > "$RUNNER_TEMP/manufacturing-capital-court.json"
python3 - "$RUNNER_TEMP/manufacturing-capital-court.json" <<'PY'
import json, sys
from decimal import Decimal
payload = json.load(open(sys.argv[1]))
assert payload["standing"] == "ALIVE", payload
assert Decimal(payload["net_manufacturing_capital_growth"]) == Decimal("400"), payload
assert Decimal(payload["closing_capital_stock"]) == Decimal("1400"), payload
assert Decimal(payload["capital_forming_commit_share"]) == Decimal("0.7"), payload
assert Decimal(payload["capital_productivity"]) > Decimal("2"), payload
assert payload["authority"] == "QUALIFY", payload
assert payload["actuation_performed"] is False, payload
print(json.dumps(payload, sort_keys=True))
PY
# Refuse accounting inconsistencies
grep -q 'COMMIT_CLASSIFICATION_MISMATCH' packs/ggen-project-boundary-pack/queries/r19-capital-accounting-falsifiers.rq
grep -q 'DEEPENING_WITHOUT_INSTALLED_CAPITAL' packs/ggen-project-boundary-pack/queries/r19-capital-accounting-falsifiers.rq
grep -q 'COMPOSITION_WITHOUT_DISTINCT_FAMILIES' packs/ggen-project-boundary-pack/queries/r19-capital-accounting-falsifiers.rq
grep -q 'INVALID_RECEIPT_DIGEST' packs/ggen-project-boundary-pack/queries/r19-capital-accounting-falsifiers.rq
# Generated consequences are not source
rm -rf packs/ggen-project-boundary-pack/generated
git diff --exit-code
'''

