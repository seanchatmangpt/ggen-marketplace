# Declarative pack courts: one row per former `<family>-<round>-*.yml` workflow.
# Executed by scripts/ci_courts.py inside the `courts` job of .github/workflows/ci.yml,
# which selects only the rows whose `paths` intersect the PR diff. Each `run` body is the
# original workflow's court steps verbatim (exact-head assertion and marketplace validation
# are provided once by the CI admission job; pip installs by ci/requirements-courts.txt).
# Add a court by appending a row; do not add a workflow file.

[[court]]
id = "compose-r86-forced-top25-qualification-capsule"
paths = ["packs/forced-top25-qualification-capsule-pack/**"]
run = '''
# Parse public ontology
python -c "from rdflib import Graph; Graph().parse('packs/forced-top25-qualification-capsule-pack/ontology.ttl', format='turtle')"
# Execute R86 court
pytest -q packs/forced-top25-qualification-capsule-pack/tests/test_r86_qualification_capsule.py
'''

