[[court]]
id = "premature-actuation-survival-pack"
paths = ["packs/premature-actuation-survival-pack/**"]
advisory = true  # red at baseline on the former workflow too; reported, not gating
run = '''
# Qualify canonical ontology and generated catalogs
python packs/premature-actuation-survival-pack/qualification/verify_catalog.py
# Validate gate witness court correspondence
python scripts/check_gate_witness_courts.py \
  --report "${RUNNER_TEMP}/survival-gate-courts.json"
python -m json.tool "${RUNNER_TEMP}/survival-gate-courts.json" >/dev/null
# Execute every survival gate against pass and fail witnesses
set -euo pipefail
pack="packs/premature-actuation-survival-pack"
runner="$pack/runners/semantic_runner.py"
cases=0
for gate in "$pack"/gates/*.rq; do
  stem="$(basename "$gate" .rq)"
  python "$runner" \
    --gate "$gate" \
    --witness "$pack/witnesses/pass/$stem.ttl" \
    --expectation pass
  python "$runner" \
    --gate "$gate" \
    --witness "$pack/witnesses/fail/$stem.ttl" \
    --expectation fail
  cases=$((cases + 2))
done
gates="$(find "$pack/gates" -maxdepth 1 -name '*.rq' | wc -l)"
expected=$((gates * 2))
test "$cases" -eq "$expected"
printf "survival_gates=%s survival_gate_cases=%s\n" "$gates" "$cases"
# Assert no ambient authority in shipped positive fixture
set -euo pipefail
! grep -R --line-number --fixed-string 'pas:grantsDoAuthority true' \
  packs/premature-actuation-survival-pack/witnesses/pass \
  packs/premature-actuation-survival-pack/qualification/fixtures/pos_survival.ttl
'''

