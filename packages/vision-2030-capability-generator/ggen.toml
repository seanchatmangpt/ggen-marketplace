[project]
name = "vision-2030-capability-generator"
version = "0.1.0"
description = "Deterministic Vision 2030 capability portfolio compiler."

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.io/marketplace/vision2030#"

[ontology.prefixes]
v30 = "https://ggen.io/marketplace/vision2030#"
skos = "http://www.w3.org/2004/02/skos/core#"

[inference]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "vision-2030-architecture"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/vision-2030.md.tera" }
output_file = "VISION_2030.md"
mode = "Overwrite"

[[generation.rules]]
name = "capability-index"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/capability-index.json.tera" }
output_file = "capability-index.json"
mode = "Overwrite"

[[generation.rules]]
name = "capability-graph"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/capability-graph.mmd.tera" }
output_file = "capability-graph.mmd"
mode = "Overwrite"
