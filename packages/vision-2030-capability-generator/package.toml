[package]
name = "vision-2030-capability-generator"
full_name = "chatman-ecosystem-vision-2030-capability-generator"
version = "0.2.0"
description = "Compiles an admitted cognition-abundant capability ontology into ranked projections with exact-subject qualification and bounded authority evidence."
category = "architecture"
author = "Chatman Ecosystem"
repository = "https://github.com/seanchatmangpt/ggen-marketplace"
path = "packages/vision-2030-capability-generator"
license = "MIT"
dependencies = []
features = ["50 capabilities across 10 families", "post-AGI scarcity inversion", "top-20/top-10/crown-5 selection", "primary falsifier generation", "deterministic Markdown JSON and Mermaid projections", "SHACL admission contract", "PROV-O and ODRL qualification law", "exact immutable subject receipts", "self-certification refusal", "real ggen deterministic manufacture court", "CONSTRUCT-only authority boundary", "zero DO authority"]
tags = ["vision-2030", "post-agi", "capability", "ontology", "ggen", "receipts", "brce", "gym", "planner", "enterprise"]
keywords = ["compile-cognition-out", "deterministic-manufacture", "verified-consequence", "receipt-algebra", "gym-compiler"]

[install]
type = "template"
template_path = "packages/vision-2030-capability-generator"
source_path = "packages/vision-2030-capability-generator"

[files]
"package.toml" = "package.toml"
"ggen.toml" = "ggen.toml"
"ontology.ttl" = "ontology.ttl"
"shapes.ttl" = "shapes.ttl"
"qualification/contract.ttl" = "qualification/contract.ttl"
"queries/capabilities.rq" = "queries/capabilities.rq"
"scripts/verify.py" = "scripts/verify.py"
"templates/vision-2030.md.tera" = "templates/vision-2030.md.tera"
"templates/capability-index.json.tera" = "templates/capability-index.json.tera"
"templates/capability-graph.mmd.tera" = "templates/capability-graph.mmd.tera"

[variables]
organization_name = { type = "string", default = "Chatman Ecosystem", description = "Consumer organization name." }

[docs]
quick_start = "Run ggen sync run from the package directory, then qualify the immutable subject with scripts/verify.py."
features = "Capability ontology, leverage selection, falsifiers, deterministic projections, exact-subject qualification, provenance and authority law."
use_cases = "Cognition-abundant architecture synthesis, enterprise capability planning, ggen portfolio design, self-manufacturing systems, evidence-bound capability qualification."

[marketplace]
production_ready = false
