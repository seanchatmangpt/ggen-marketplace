[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pm4pytest"
version = "0.1.0"
description = "Process Intelligence, Conformance Checking & OCPQ Pytest Plugin powered by PM4Py"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Enterprise Process Intelligence & Solution Architecture", email = "process@ggen.dev" }
]
dependencies = [
  "pytest>=8.0.0",
  "pm4py>=2.7.23.8",
  "pandas>=2.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.scripts]
pm4pytest = "pm4pytest.cli:app"
pm4pytest-cli = "pm4pytest.cli:app"

[project.entry-points.pytest11]
pm4pytest = "pm4pytest.plugin"

[project.urls]
homepage = "https://github.com/seanchatmangpt/pm4pytest"
documentation = "https://github.com/seanchatmangpt/pm4pytest#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/pm4pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
