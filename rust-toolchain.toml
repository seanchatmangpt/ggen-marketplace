[toolchain]
# Pinned to nightly for the whole repo, not just tools/marketplace-config: several
# packs (wasm4pm-compat-pack, wasm4pm-algorithms-pack, and tools/marketplace-config
# itself) depend transitively on the `wasm4pm-compat` crate, which unconditionally
# enables nightly-only features (`generic_const_exprs`, `adt_const_params`,
# `unsized_const_params`, `const_trait_impl`, `min_specialization`, `portable_simd`)
# in every published version -- there is no stable-toolchain escape from that
# dependency graph. Without a repo-root pin, any cargo invocation from outside
# tools/marketplace-config's own directory (e.g. scripts/qualify-marketplace.sh
# building a pack from repo root) fell back to rustup's global default (stable) and
# failed with E0554. Matches tools/marketplace-config/rust-toolchain.toml's channel
# so the whole repo resolves to one nightly, not two different pinned dates.
channel = "nightly-2026-06-22"
