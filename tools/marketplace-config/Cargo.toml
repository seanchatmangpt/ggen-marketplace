[package]
name = "ggen-marketplace-config"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
star-toml = { git = "https://github.com/seanchatmangpt/star-toml", rev = "8395515cf8e68bfdc9edff49fb358c4f1da7c795" }
# Reproduce star-toml's admitted Cargo.lock closure. Its manifest accepts 26.6+
# semver-compatible releases, but its exact lock at the pinned SHA admits 26.6.28;
# newer 26.8.x releases require nightly features and are not the same subject.
wasm4pm-compat = "=26.6.28"
