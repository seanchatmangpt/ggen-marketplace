# Pinned toolchain for reproducible builds.
#
# `star-toml` (this crate's config-validation dependency) has a hard,
# unconditional dependency on `wasm4pm-compat`, whose lib.rs enables
# nightly-only features unconditionally (`generic_const_exprs`,
# `adt_const_params`, `unsized_const_params`, `const_trait_impl`,
# `min_specialization`, `portable_simd`) across every published version —
# confirmed 2026-08-18 by reading wasm4pm-compat 26.6.28's and 26.8.7's
# src/lib.rs directly; this is not a feature this crate opted into, it is
# load-bearing in star-toml's own src/ocel.rs. There is no stable-toolchain
# escape from this dependency graph today.
#
# Pinned to the same nightly date the sibling `~/ggen` workspace already
# uses for its own transitive `wasm4pm-compat` dependency
# (see ~/ggen/rust-toolchain.toml), for consistency and because that date
# is already verified to build wasm4pm-compat successfully on this machine.
[toolchain]
channel = "nightly-2026-06-22"
