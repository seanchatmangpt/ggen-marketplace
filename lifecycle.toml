# Pack lifecycle registry. Canonical source for per-pack lifecycle state and planned intent.
# Contract: docs/reference/pack-lifecycle-registry.md. Procedure: docs/how-to/flag-a-pack-lifecycle.md.
# Validated by `python3 scripts/marketplace.py validate`; projected into the catalog as
# `status`/`successors`/`lifecycle`. Entries are advisory metadata: they never change
# `ggen sync run` output and never delete anything.
schema_version = "1.0.0"

