schema_version = "1.1.0"

# This marketplace repository's OWN release version -- our organization's
# identifier for a whole registry snapshot (this exact packs/ tree + the
# catalog it projects to), distinct from both individual packs' own SemVer
# (packs/<name>/pack.toml) and [ggen].version below (the pinned upstream
# ggen binary this repo qualifies against). Bumping this and publishing
# cuts an immutable, versioned GitHub Release (in addition to the always-
# rolling "packs" release) so a consumer can pin "give me marketplace
# vX.Y.Z" as a whole -- see docs/reference/catalog-command.md.
[marketplace]
version = "v26.8.10"

# Canonical-source law. Pack bytes in this repository are the authoritative
# marketplace source after admission. Other repositories may be historical
# import origins or mirrors, but their branch ancestry is provenance only and
# cannot silently become pack authority.
[source_authority]
repository = "seanchatmangpt/ggen-marketplace"
canonical_branch = "main"
mirrors_are_provenance_only = true

[qualification]
workers = 4
timeout_seconds = 5

# ggen is the execution/manufacture tool used to qualify the canonical pack
# source above. The release tag and the commit it resolves to are both pinned;
# install-ggen.sh independently verifies the tag identity before accepting a
# digest-pinned release asset.
[ggen]
repository = "seanchatmangpt/ggen"
version = "v26.8.11"
release_commit = "402cecdff8784767eb9f26e235d87c759610c066"

[ggen.assets.linux_x86_64]
archive = "ggen-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "790f8eab8b038e746af45cf70adde47c0df65fbcc5514c2c6ac8e5f80b2fe792"

[ggen.assets.linux_aarch64]
archive = "ggen-aarch64-unknown-linux-gnu.tar.gz"
sha256 = "a48721c5fbb7595c97a6c5757c842b625d704b1e69a947586534b8d53d2a84f6"

[ggen.assets.darwin_aarch64]
archive = "ggen-aarch64-apple-darwin.tar.gz"
sha256 = "8870357e5ae687fe84eee2f64b26e14772efe3d96b867e15d4f399577352a1a3"

[ggen.assets.darwin_x86_64]
archive = "ggen-x86_64-apple-darwin.tar.gz"
sha256 = "b8287051635edfa020b39d14f552b5f0b29747630b09af011145181276ef0eb3"

# The clap-noun-verb crate/macros pin baked into
# packs/clap-noun-verb-crate-pack/templates/Cargo.toml.tmpl (exact-pinned
# there so every generated CLI resolves deterministically). This is the
# source-of-truth version the qualifier checks that pin against, refusing
# with CLAP_NOUN_VERB_VERSION_DRIFT on mismatch -- the same drift-check
# shape [ggen].version already gets against the installed ggen binary.
[clap_noun_verb]
version = "26.8.22"
