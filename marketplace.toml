schema_version = "1.0.0"

# This marketplace repository's OWN release version -- our organization's
# identifier for a whole registry snapshot (this exact packs/ tree + the
# catalog it projects to), distinct from both individual packs' own SemVer
# (packs/<name>/pack.toml) and [ggen].version below (the pinned upstream
# ggen binary this repo qualifies against). Bumping this and publishing
# cuts an immutable, versioned GitHub Release (in addition to the always-
# rolling "packs" release) so a consumer can pin "give me marketplace
# vX.Y.Z" as a whole -- see docs/reference/catalog-command.md.
[marketplace]
version = "v26.8.9"

[qualification]
workers = 8
timeout_seconds = 5

[ggen]
repository = "seanchatmangpt/ggen"
version = "v26.8.8"

[ggen.assets.linux_x86_64]
