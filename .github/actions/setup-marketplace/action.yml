name: Setup marketplace
description: >-
  Assert the exact subject (the caller checks it out first, since a local action must be
  on disk before it can run), restore caches (pip, cargo registry, the compiled
  star-toml admission binary's target dir, the digest-verified ggen binary),
  admit marketplace.toml through star-toml, and optionally install the admitted
  ggen. One place for what every job used to re-do from scratch.
inputs:
  ref:
    description: Exact commit the caller checked out (PR head SHA or push SHA); asserted as HEAD
    required: true
  ggen:
    description: Install the admitted ggen release ("true"/"false"); exports GGEN_BIN and puts `ggen` on PATH
    required: false
    default: "false"
  requirements:
    description: Optional pip requirements file to install (also the pip cache key)
    required: false
    default: ""
  token:
    description: Token for the ggen release tag-identity check (contents:read)
    required: false
    default: ${{ github.token }}
outputs:
  admitted-config:
    description: Path of the admitted marketplace config receipt
    value: ${{ steps.admit.outputs.path }}
  ggen-bin:
    description: Path of the installed ggen binary (empty unless ggen=true)
    value: ${{ steps.ggen.outputs.bin }}
runs:
  using: composite
  steps:
    - name: Assert exact subject identity
      shell: bash
      env:
        EXPECTED: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        actual="$(git rev-parse HEAD)"
        if [[ "$actual" != "$EXPECTED" ]]; then
          echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$EXPECTED"
          exit 2
        fi

    - name: Set up Python (pip cache)
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: ${{ inputs.requirements != '' && 'pip' || '' }}
        cache-dependency-path: ${{ inputs.requirements }}

    - name: Install Python requirements
      if: inputs.requirements != ''
      shell: bash
      run: python -m pip install --disable-pip-version-check -r "${{ inputs.requirements }}"

    - name: Set up pinned star-toml toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: "nightly-2026-06-22"
        components: rustfmt

    # Precompilation: admit-config.sh `cargo run`s tools/marketplace-config. Caching its
    # target dir and the cargo registry makes every admission after the first an
    # incremental no-op build. Keyed on the crate's own inputs, so any change rebuilds.
    - name: Restore star-toml build cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cache/ggen-marketplace-config-target
        key: star-toml-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/marketplace-config/Cargo.toml', 'tools/marketplace-config/Cargo.lock', 'tools/marketplace-config/rust-toolchain.toml', 'tools/marketplace-config/src/**') }}
        restore-keys: |
          star-toml-${{ runner.os }}-${{ runner.arch }}-

    - name: Admit marketplace operational law through star-toml
      id: admit
      shell: bash
      run: |
        set -euo pipefail
        export GGEN_MARKETPLACE_CONFIG_TARGET_DIR="$HOME/.cache/ggen-marketplace-config-target"
        out="${RUNNER_TEMP}/admitted-config.json"
        bash scripts/admit-config.sh marketplace.toml "$out"
        python -m json.tool "$out" >/dev/null
        echo "path=$out" >> "$GITHUB_OUTPUT"
        echo "ADMITTED_CONFIG=$out" >> "$GITHUB_ENV"

    # The ggen release binary is digest-pinned by marketplace.toml; its cache key hashes that
    # file, so a version/digest change misses, and a hit skips the network entirely
    # (install-ggen.sh re-checks its marker files against the admitted digest).
    - name: Restore admitted ggen binary
      if: inputs.ggen == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ggen-marketplace-release
        key: ggen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('marketplace.toml') }}

    - name: Install admitted ggen (prebuilt binary, no Rust compile)
      id: ggen
      if: inputs.ggen == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        export GGEN_MARKETPLACE_CACHE_DIR="$HOME/.cache/ggen-marketplace-release"
        bin="$(bash scripts/install-ggen.sh "$ADMITTED_CONFIG")"
        mkdir -p "${RUNNER_TEMP}/bin"
        ln -sf "$bin" "${RUNNER_TEMP}/bin/ggen"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        echo "GGEN_BIN=$bin" >> "$GITHUB_ENV"
        echo "bin=$bin" >> "$GITHUB_OUTPUT"
        "$bin" --version
