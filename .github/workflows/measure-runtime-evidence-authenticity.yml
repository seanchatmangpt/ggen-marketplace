name: MEASURE Runtime Evidence Authenticity

on:
  pull_request:
    paths:
      - 'packs/runtime-evidence-authenticity-pack/**'
      - '.github/workflows/measure-runtime-evidence-authenticity.yml'

permissions:
  contents: read

jobs:
  authenticity-court:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace
        run: python3 scripts/marketplace.py validate
      - name: Compile authenticity runtime
        run: python3 -m py_compile packs/runtime-evidence-authenticity-pack/scripts/*.py packs/runtime-evidence-authenticity-pack/tests/*.py
      - name: Run authenticity falsifier court
        env:
          PYTHONPATH: packs/runtime-evidence-authenticity-pack
        run: python3 -m unittest discover -s packs/runtime-evidence-authenticity-pack/tests -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' packs/runtime-evidence-authenticity-pack/scripts packs/runtime-evidence-authenticity-pack/tests
