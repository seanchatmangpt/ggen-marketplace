name: MEASURE R64 Realized Capital Feedback
on:
  pull_request:
    paths:
      - 'packs/epistemic-sensor-factory-pack/queries/13*_r64_*.rq'
      - 'packs/epistemic-sensor-factory-pack/queries/1400_r64_*.rq'
      - 'packs/epistemic-sensor-factory-pack/tests/run_r64_realized_capital_feedback.py'
      - 'packs/epistemic-sensor-factory-pack/docs/r64-realized-capital-feedback-*'
      - 'receipts/measure/2026-08-25-r64-realized-capital-feedback.json'
      - '.github/workflows/measure-r64-realized-capital-feedback.yml'
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Execute R64 permanent court
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r64_realized_capital_feedback.py
      - name: Refuse ambient consequential actuation
        shell: bash
        run: |
          grep -q '"consequential_do":false' receipts/measure/2026-08-25-r64-realized-capital-feedback.json
          ! grep -R -E '(^|[^A-Z])(INSERT|DELETE|LOAD|CLEAR|DROP|CREATE|MOVE|COPY|ADD|SERVICE)[[:space:]]' packs/epistemic-sensor-factory-pack/queries/13*_r64_*.rq packs/epistemic-sensor-factory-pack/queries/1400_r64_*.rq
