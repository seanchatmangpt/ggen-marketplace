name: DEVELOP Evidence Policy Adaptive Control Exact Head
on:
  pull_request:
    paths:
      - 'packs/evidence-capital-policy-adaptive-control-pack/**'
      - 'receipts/select/2026-08-24-evidence-policy-adaptive-control.json'
      - '.github/workflows/develop-policy-realization-control-r2.yml'
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Marketplace admission
        run: python3 scripts/marketplace.py validate
      - name: Compile reusable control
        run: python3 -m py_compile packs/evidence-capital-policy-adaptive-control-pack/scripts/*.py packs/evidence-capital-policy-adaptive-control-pack/tests/*.py
      - name: Permanent adaptive-control court
        env:
          PYTHONPATH: packs/evidence-capital-policy-adaptive-control-pack
        run: python3 -m unittest discover -s packs/evidence-capital-policy-adaptive-control-pack/tests -p 'test_*.py' -v
      - name: Refuse ambient consequential DO
        run: '! grep -R -E "(subprocess\.|os\.system|requests\.(post|put|patch|delete))" packs/evidence-capital-policy-adaptive-control-pack/scripts packs/evidence-capital-policy-adaptive-control-pack/tests'
