name: DEVELOP R63 Relief Capital Allocation
on:
  pull_request:
    paths:
      - 'packs/epistemic-sensor-factory-pack/queries/13*_r63_*.rq'
      - 'packs/epistemic-sensor-factory-pack/tests/run_r63_relief_capital_allocation.py'
      - 'packs/epistemic-sensor-factory-pack/docs/r63-relief-capital-allocation-*'
      - 'receipts/develop/2026-08-25-r63-relief-capital-allocation.json'
      - '.github/workflows/develop-r63-relief-capital-allocation.yml'
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Execute R63 permanent court
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r63_relief_capital_allocation.py
      - name: Refuse ambient consequential actuation
        shell: bash
        run: |
          grep -q '"consequential_do":false' receipts/develop/2026-08-25-r63-relief-capital-allocation.json
          ! grep -R -E '(^|[^A-Z])(INSERT|DELETE|LOAD|CLEAR|DROP|CREATE|MOVE|COPY|ADD|SERVICE)[[:space:]]' packs/epistemic-sensor-factory-pack/queries/13*_r63_*.rq
