name: DEVELOP Evidence Capital Realization Control Exact Head
on:
  pull_request:
    paths:
      - 'packs/evidence-capital-realization-control-pack/**'
      - 'receipts/select/2026-08-24-evidence-capital-realization-control.json'
      - '.github/workflows/develop-evidence-capital-realization-control.yml'
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Marketplace admission
        run: python3 scripts/marketplace.py validate
      - name: Compile controller
        run: python3 -m py_compile packs/evidence-capital-realization-control-pack/scripts/*.py packs/evidence-capital-realization-control-pack/tests/*.py
      - name: Permanent courts
        env:
          PYTHONPATH: packs/evidence-capital-realization-control-pack
        run: python3 -m unittest discover -s packs/evidence-capital-realization-control-pack/tests -p 'test_*.py' -v
      - name: Refuse ambient consequential DO
        run: '! grep -R -E "subprocess\.|os\.system|requests\.(post|put|patch|delete)" packs/evidence-capital-realization-control-pack/scripts packs/evidence-capital-realization-control-pack/tests'
