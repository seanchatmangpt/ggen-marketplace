name: DEVELOP Remediation Realization Control Exact Head
on:
  pull_request:
    branches:
      - measure/owning-rail-remediation-realization-20260823
permissions:
  contents: read
jobs:
  qualify:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Marketplace admission
        run: python3 scripts/marketplace.py validate
      - name: Compile pack runtime and tests
        run: python3 -m compileall -q packs/owning-rail-remediation-realization-pack
      - name: Permanent courts
        run: python3 -m unittest discover -s packs/owning-rail-remediation-realization-pack/tests -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: '! grep -RInE "requests\.(post|put|patch|delete)|subprocess\.|os\.system|socket\." packs/owning-rail-remediation-realization-pack'
