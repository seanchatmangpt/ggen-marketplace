name: Evolvable capability semantic court

on:
  pull_request:
    paths:
      - "packs/evolvable-capability-pack/**"
      - "tests/test_evolvable_capability_pack.py"
      - ".github/workflows/evolvable-capability-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-court:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'evolvable_capability_exact_head=%s\n' "$actual"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install semantic engine
        run: python -m pip install "rdflib==7.6.0" "pytest==9.0.3"

      - name: Execute positive and negative gate witnesses
        run: python packs/evolvable-capability-pack/qualification/verify.py

      - name: Execute adversarial mutation court
        run: python -m pytest tests/test_evolvable_capability_pack.py -v -p no:cacheprovider

      - name: Benchmark gate admission against the regression bound
        run: |
          python packs/evolvable-capability-pack/qualification/bench.py \
            --sizes 200,800 --repeats 3 --receipt "${RUNNER_TEMP}/evolvable-capability-bench.json"
