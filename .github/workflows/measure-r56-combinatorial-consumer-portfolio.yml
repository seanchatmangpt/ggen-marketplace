name: MEASURE R56 Combinatorial Consumer Portfolio

on:
  pull_request:
    paths:
      - "packs/epistemic-sensor-factory-pack/**"
      - "receipts/measure/2026-08-25-r56-combinatorial-consumer-portfolio.json"
      - ".github/workflows/measure-r56-combinatorial-consumer-portfolio.yml"

permissions:
  contents: read

concurrency:
  group: measure-r56-${{ github.workflow }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Install bounded SPARQL engine
        run: python3 -m pip install 'rdflib>=7,<8'
      - name: Execute fifty R56 combinatorial portfolio courts
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r56_combinatorial_consumer_portfolio.py
      - name: Verify R56 receipt and authority ceiling
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('receipts/measure/2026-08-25-r56-combinatorial-consumer-portfolio.json'))
          assert r['semantic_query_commits'] == 50
          assert r['consequential_do'] is False
          assert r['generated_output_edited'] is False
          assert 'DO' not in r['authority']
          assert r['source_generation'] == 'R55'
          print('R56_RECEIPT=PASS')
          PY
