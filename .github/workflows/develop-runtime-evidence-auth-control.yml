name: DEVELOP Runtime Evidence Authenticity Control Exact Head
on:
  pull_request:
    paths:
      - 'packs/runtime-evidence-authenticity-control-pack/**'
      - 'receipts/select/2026-08-24-runtime-evidence-authenticity-control.json'
      - '.github/workflows/develop-runtime-evidence-auth-control.yml'
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Marketplace admission
        run: python3 scripts/marketplace.py validate
      - name: Compile reusable control substrate
        run: python3 -m compileall -q packs/runtime-evidence-authenticity-control-pack/scripts packs/runtime-evidence-authenticity-control-pack/tests
      - name: Execute permanent control court
        run: python3 -m pytest -q packs/runtime-evidence-authenticity-control-pack/tests/test_control.py
      - name: Refuse ambient consequential actuation
        run: '! grep -R -E "requests\.(post|put|patch|delete)|subprocess\.|os\.system" packs/runtime-evidence-authenticity-control-pack/scripts packs/runtime-evidence-authenticity-control-pack/tests'
