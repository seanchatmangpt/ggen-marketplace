name: Cyberpunk ggen query diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$expected"
            exit 2
          }

      - name: Install digest-pinned ggen
        shell: bash
        run: |
          set -euo pipefail
          ggen_bin="$(bash scripts/install-ggen.sh)"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
          "$ggen_bin" --version

      - name: Observe actual sync CLI
        shell: bash
        run: "$GGEN_BIN sync run --help"

      - name: Isolate generation queries
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$PWD/packs/cyberpunk-tv-platform"
          python3 - "$source_dir" <<'PY'
          from __future__ import annotations

          import copy
          import pathlib
          import shutil
          import subprocess
          import sys
          import tempfile
          import tomllib

          source = pathlib.Path(sys.argv[1])
          ggen = pathlib.Path(__import__('os').environ['GGEN_BIN'])
          original = tomllib.loads((source / 'ggen.toml').read_text())
          rules = original.get('generation', {}).get('rules', [])
          if not rules:
              raise SystemExit('REFUSED:CYBERPUNK_NO_GENERATION_RULES')

          def toml_string(value: str) -> str:
              import json
              return json.dumps(value)

          def emit_rule_manifest(data: dict, selected: dict) -> str:
              # Preserve only configuration needed to load the graph and execute
              # one generation rule. Inference and validation are intentionally
              # omitted so a query parser failure is attributable to that rule.
              project = data['project']
              ontology = data['ontology']
              output = data.get('output', {})
              templates = data.get('templates', {})
              lines = [
                  '[project]',
                  f"name = {toml_string(project['name'])}",
                  f"version = {toml_string(project['version'])}",
                  '',
                  '[ontology]',
                  f"source = {toml_string(ontology['source'])}",
              ]
              imports = ontology.get('imports', [])
              if imports:
                  lines.append('imports = [' + ', '.join(toml_string(x) for x in imports) + ']')
              if ontology.get('base_iri'):
                  lines.append(f"base_iri = {toml_string(ontology['base_iri'])}")
              prefixes = ontology.get('prefixes', {})
              if prefixes:
                  lines.extend(['', '[ontology.prefixes]'])
                  for key, value in prefixes.items():
                      lines.append(f"{key} = {toml_string(value)}")
              lines.extend(['', '[generation]', f"output_dir = {toml_string(data['generation'].get('output_dir', 'generated/'))}", '', '[[generation.rules]]'])
              lines.append(f"name = {toml_string(selected['name'])}")
              query = selected['query']
              template = selected['template']
              lines.append(f"query = {{ file = {toml_string(query['file'])} }}")
              lines.append(f"template = {{ file = {toml_string(template['file'])} }}")
              lines.append(f"output_file = {toml_string(selected['output_file'])}")
              lines.append(f"mode = {toml_string(selected.get('mode', 'Overwrite'))}")
              lines.extend(['', '[templates]', f"dir = {toml_string(templates.get('dir', 'templates'))}"])
              if 'enable_caching' in templates:
                  lines.append(f"enable_caching = {'true' if templates['enable_caching'] else 'false'}")
              if 'auto_reload' in templates:
                  lines.append(f"auto_reload = {'true' if templates['auto_reload'] else 'false'}")
              if output:
                  lines.extend(['', '[output]'])
                  for key, value in output.items():
                      if isinstance(value, str):
                          lines.append(f"{key} = {toml_string(value)}")
                      elif isinstance(value, bool):
                          lines.append(f"{key} = {'true' if value else 'false'}")
                      else:
                          lines.append(f"{key} = {value}")
              return '\n'.join(lines) + '\n'

          for rule in rules:
              with tempfile.TemporaryDirectory(prefix='cyberpunk-rule-') as raw:
                  work = pathlib.Path(raw) / 'pack'
                  shutil.copytree(source, work)
                  (work / 'ggen.toml').write_text(emit_rule_manifest(original, rule))
                  for runtime in (work / 'generated', work / '.ggen', work / '.ggen-v2'):
                      if runtime.exists():
                          shutil.rmtree(runtime)
                  print(f"=== rule:{rule['name']} query:{rule['query']['file']} ===", flush=True)
                  try:
                      result = subprocess.run(
                          [str(ggen), 'sync', 'run'],
                          cwd=work,
                          text=True,
                          capture_output=True,
                          timeout=5,
                      )
                  except subprocess.TimeoutExpired as error:
                      print(error.stdout or '', end='')
                      print(error.stderr or '', end='', file=sys.stderr)
                      raise SystemExit(f"REFUSED:CYBERPUNK_RULE_TIMEOUT:{rule['name']}")
                  if result.stdout:
                      print(result.stdout, end='')
                  if result.stderr:
                      print(result.stderr, end='', file=sys.stderr)
                  print(f"rule={rule['name']} exit={result.returncode}", flush=True)
                  if result.returncode != 0:
                      raise SystemExit(f"REFUSED:CYBERPUNK_RULE_FAILED:{rule['name']}:{rule['query']['file']}")

          print(f"CYBERPUNK_GENERATION_QUERIES_ALIVE:{len(rules)}")
          PY
