name: DEVELOP R70 Causal Manufacturing Yield

on:
  pull_request:
    paths:
      - "packs/control-plane-causality-observability-pack/**"
      - "receipts/develop/2026-08-25-r70-causal-manufacturing-yield.json"
      - ".github/workflows/develop-r70-causal-manufacturing-yield.yml"

permissions:
  contents: read

concurrency:
  group: develop-r70-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Install bounded SPARQL verifier
        run: python3 -m pip install 'rdflib>=7,<8'
      - name: Execute extensible control-plane causality and yield courts
        run: python3 packs/control-plane-causality-observability-pack/tests/test_contract.py
      - name: Verify R70 construction receipt
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('receipts/develop/2026-08-25-r70-causal-manufacturing-yield.json'))
          assert r['round'] == 'R70'
          assert r['construction_base'] == 'd92e65b761788c8ec18562d3d1183bce29c341f7'
          assert r['semantic_query_commits'] == 50
          assert r['minimum_new_semantic_commits'] >= 52
          assert r['consequential_do'] is False
          assert r['generated_output_edited'] is False
          assert r['thousand_x']['standing'] == 'NOT_ADMITTED'
          assert r['authority'] == 'OBSERVE|VERIFY|SELECT|CONSTRUCT'
          print('R70_RECEIPT=PASS')
          PY
      - name: Refuse ambient consequential DO
        run: |
          set -euo pipefail
          ! grep -R -E 'actuationPerformed[[:space:]]+true' packs/control-plane-causality-observability-pack/ontology.ttl packs/control-plane-causality-observability-pack/fixtures
          ! grep -E 'consequential_do[[:space:]]*=[[:space:]]*"(true|ALLOW)"' packs/control-plane-causality-observability-pack/pack.toml
