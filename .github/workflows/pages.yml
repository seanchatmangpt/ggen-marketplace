name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "book.toml"
      - "docs/**"
      - "ggen.toml"
      - "packs/mdbook-pattern-language-pack/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "book.toml"
      - "docs/**"
      - "ggen.toml"
      - "packs/mdbook-pattern-language-pack/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate and build mdBook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$expected"
            exit 2
          fi

      - name: Set up admitted marketplace toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "nightly-2026-04-15"

      - name: Admit marketplace config
        shell: bash
        run: bash scripts/admit-config.sh marketplace.toml "${RUNNER_TEMP}/admitted-config.json"

      - name: Install admitted ggen
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ggen_bin="$(bash scripts/install-ggen.sh "${RUNNER_TEMP}/admitted-config.json")"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
          "$ggen_bin" --version

      - name: Manufacture mdBook control surfaces from the pack
        shell: bash
        run: |
          set -euo pipefail
          rm -f book.toml docs/SUMMARY.md
          "$GGEN_BIN" sync run
          test -s book.toml
          test -s docs/SUMMARY.md

      - name: Install mdBook 0.5.3
        shell: bash
        run: cargo install mdbook --version 0.5.3 --locked

      - name: Build mdBook
        run: mdbook build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: book

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
