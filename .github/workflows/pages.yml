name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "book.toml"
      - "docs/**"
      - "ggen.toml"
      - "packs/mdbook-pattern-language-pack/**"
      - ".github/workflows/pages.yml"
      - ".github/actions/setup-marketplace/**"
  pull_request:
    branches: [main]
    paths:
      - "book.toml"
      - "docs/**"
      - "ggen.toml"
      - "packs/mdbook-pattern-language-pack/**"
      - ".github/workflows/pages.yml"
      - ".github/actions/setup-marketplace/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate and build mdBook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up cached marketplace toolchain, admit config, install ggen
        uses: ./.github/actions/setup-marketplace
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          ggen: "true"

      - name: Manufacture mdBook control surfaces from the pack
        shell: bash
        run: |
          set -euo pipefail
          rm -f book.toml docs/SUMMARY.md
          "$GGEN_BIN" sync run
          test -s book.toml
          test -s docs/SUMMARY.md

      # Precompiled: `cargo install mdbook` compiles ~400 crates. Cache the installed binary
      # (key = exact version) and only build on a miss.
      - name: Restore mdBook 0.5.3
        id: mdbook-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-0.5.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install mdBook 0.5.3
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install mdbook --version 0.5.3 --locked

      - name: Build mdBook
        run: mdbook build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: book

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
