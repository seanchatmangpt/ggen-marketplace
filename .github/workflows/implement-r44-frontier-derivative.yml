name: IMPLEMENT R44 Frontier Derivative Exact Head

on:
  pull_request:
    paths:
      - 'packs/frontier-derivative-pack/**'
      - '.github/workflows/implement-r44-frontier-derivative.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Qualify frontier derivative contract
        run: python3 packs/frontier-derivative-pack/tests/test_contract.py
      - name: Install bounded SPARQL court runtime
        run: python3 -m pip install --disable-pip-version-check 'rdflib==7.1.4'
      - name: Execute all fifty frontier derivative courts
        run: python3 packs/frontier-derivative-pack/scripts/execute_qualification_queries.py
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -R 'fd:authority "DO"\|actuation_performed": *true' \
            packs/frontier-derivative-pack/ontology.ttl \
            packs/frontier-derivative-pack/templates \
            packs/frontier-derivative-pack/fixtures
