name: PORTFOLIO R70 Autocatalytic Capital Yield

on:
  pull_request:
    paths:
      - "packs/epistemic-sensor-factory-pack/r70/**"
      - ".github/workflows/portfolio-r70-autocatalytic-capital-yield.yml"

permissions:
  contents: read

concurrency:
  group: portfolio-r70-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Install bounded SPARQL verifier
        run: python3 -m pip install 'rdflib>=7,<8'
      - name: Execute R70 causal capital-yield courts
        run: python3 packs/epistemic-sensor-factory-pack/r70/tests/test_contract.py
      - name: Refuse ambient consequential DO
        run: |
          set -euo pipefail
          ! grep -R -E 'acy:actuationPerformed[[:space:]]+true' packs/epistemic-sensor-factory-pack/r70
          grep -q 'acy:handEditedGeneratedCount 0' packs/epistemic-sensor-factory-pack/r70/fixtures/reference.ttl
          grep -q 'acy:authorityViolationCount 0' packs/epistemic-sensor-factory-pack/r70/fixtures/reference.ttl
