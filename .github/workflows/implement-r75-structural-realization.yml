name: IMPLEMENT R75 Structural Realization
on:
  pull_request:
    paths:
      - 'packs/epistemic-sensor-factory-pack/**'
      - '.github/workflows/implement-r75-structural-realization.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded verifier dependency
        run: python -m pip install 'rdflib==7.1.4'
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Execute R74 structural replication court
        run: python3 packs/epistemic-sensor-factory-pack/tests/test_r74_structural_replication.py
      - name: Execute R75 structural realization court
        run: python3 packs/epistemic-sensor-factory-pack/tests/test_r75_structural_realization.py
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -R -E 'consequentialDo[[:space:]]+true|actuationPerformed[[:space:]]+true|consequential_do[[:space:]]*=[[:space:]]*true' packs/epistemic-sensor-factory-pack/ontology.r75-structural-realization.ttl packs/epistemic-sensor-factory-pack/fixtures/r75-structural-realization.ttl
