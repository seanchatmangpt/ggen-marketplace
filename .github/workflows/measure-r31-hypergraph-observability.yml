name: MEASURE R31 Hypergraph Observability Realization

on:
  pull_request:
    paths:
      - 'packs/ggen-project-boundary-pack/**'
      - '.github/workflows/measure-r31-hypergraph-observability.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Compile permanent court
        run: python3 -m py_compile packs/ggen-project-boundary-pack/tests/test_r31_hypergraph_observability.py
      - name: Execute permanent court
        run: python3 packs/ggen-project-boundary-pack/tests/test_r31_hypergraph_observability.py
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' packs/ggen-project-boundary-pack/tests/test_r31_hypergraph_observability.py
