name: QRI Qualified Runtime Court
on:
  pull_request:
    branches: [main]
    paths:
      - "packs/interchangeable-parts-qualification-pack/**"
      - ".github/workflows/qri-qualified-runtime.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qri-qualified-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packs/interchangeable-parts-qualification-pack/requirements-court.txt
      - name: Install court dependencies
        run: python -m pip install -r packs/interchangeable-parts-qualification-pack/requirements-court.txt
      - name: Execute semantic court
        run: python packs/interchangeable-parts-qualification-pack/runners/run_court.py | tee "${RUNNER_TEMP}/qri-semantic-court.json"
      - name: Overwrite working patterns in scratch and compare
        run: python packs/interchangeable-parts-qualification-pack/runners/working_pattern_court.py --check | tee "${RUNNER_TEMP}/qri-working-pattern-court.json"
      - name: Preserve QRI receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: qri-qualified-runtime-receipts
          path: |
            ${{ runner.temp }}/qri-semantic-court.json
            ${{ runner.temp }}/qri-working-pattern-court.json
          if-no-files-found: warn
          retention-days: 14
