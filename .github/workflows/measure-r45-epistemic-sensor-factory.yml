name: MEASURE R45 Epistemic Sensor Factory

on:
  pull_request:
    paths:
      - 'packs/epistemic-sensor-factory-pack/**'
      - 'packs/replication-epistemic-observability-pack/**'
      - '.github/workflows/measure-r45-epistemic-sensor-factory.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact subject
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Qualify sensor factory contract
        run: python3 packs/epistemic-sensor-factory-pack/tests/test_contract.py
      - name: Qualify R45 sensor-family contract
        run: python3 packs/replication-epistemic-observability-pack/scripts/r45_consumer_replication_court.py
      - name: Parse public ontology and all R45 SPARQL sensors
        run: |
          python3 -m pip install --disable-pip-version-check rdflib
          python3 - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          from rdflib.plugins.sparql.processor import prepareQuery
          Graph().parse('packs/epistemic-sensor-factory-pack/ontology.ttl', format='turtle')
          q = Path('packs/replication-epistemic-observability-pack/queries')
          files = sorted(p for p in q.glob('*.rq') if 86 <= int(p.name.split('_')[0]) <= 135)
          assert len(files) == 50, len(files)
          for p in files:
              prepareQuery(p.read_text())
          print(f'R45_SPARQL_PARSE_PASS={len(files)}')
          PY
      - name: Refuse ambient consequential actuation
        run: |
          python3 packs/replication-epistemic-observability-pack/scripts/r45_consumer_replication_court.py
          grep -q 'odrl:prohibition \[ odrl:action odrl:execute \]' packs/epistemic-sensor-factory-pack/ontology.ttl
