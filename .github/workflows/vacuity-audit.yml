name: Vacuity Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vacuity-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit exact head and preserve corpus evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$expected"
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Fetch every live branch as read-only audit subjects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin/ | sort

      - name: Verify vacuity audit rules
        run: python3 scripts/test_audit_vacuity.py

      - name: Preserve exhaustive corpus audit
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/audit_vacuity.py \
            --all-remote-branches \
            --report "${RUNNER_TEMP}/vacuity-audit-corpus.json"
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            echo "::error title=REFUSED:VACUITY_CORPUS_AUDIT_EXECUTION::exit=$status"
            exit "$status"
          fi
          echo "Corpus audit exit=$status; historical findings are preserved as evidence and do not determine PR admission."

      - name: Admit exact PR head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          python3 scripts/audit_vacuity.py \
            --git-ref "$expected" \
            --report "${RUNNER_TEMP}/vacuity-audit-exact-head.json"

      - name: Preserve vacuity audit receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: vacuity-audit
          path: |
            ${{ runner.temp }}/vacuity-audit-corpus.json
            ${{ runner.temp }}/vacuity-audit-exact-head.json
          if-no-files-found: warn
          retention-days: 14
