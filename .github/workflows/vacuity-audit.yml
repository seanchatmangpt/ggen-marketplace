name: Vacuity Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vacuity-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit exact head and preserve corpus evidence
    runs-on: ubuntu-latest
    # The exhaustive all-live-branch corpus preservation pass can legitimately
    # consume most of ten minutes as the marketplace grows. Keep every audit
    # step intact and give the decisive exact-base non-regression calculation
    # enough bounded time to execute rather than cancelling it mid-proof.
    #
    # 2026-08-20: the marketplace has grown past the original 30m budget --
    # PR #87's own audit run (unrelated in content, touches only a pack's
    # MATURITY.md) ran the full 30 minutes and was cancelled mid-"Preserve
    # exhaustive corpus audit" step, never reaching the actual admit/refuse
    # decision. Real cause, not a hang: `git branch -r` on this repo returns
    # 65 live branches right now, and "Fetch every live branch as read-only
    # audit subjects" scales with that count -- exactly the growth this
    # comment already anticipated, just further along than 30m covers today.
    # Bumped to 45m; no step logic changed.
    timeout-minutes: 45
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$expected"
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Fetch every live branch as read-only audit subjects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin/ | sort

      - name: Verify vacuity audit and ERRC delta rules
        run: |
          python3 scripts/test_audit_vacuity.py
          python3 scripts/test_vacuity_delta.py

      - name: Preserve exhaustive corpus audit
        shell: bash
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/vacuity-audit-corpus.json"
          set +e
          python3 scripts/audit_vacuity.py \
            --all-remote-branches \
            --report "$report"
          status=$?
          set -e
          if [[ ! -s "$report" ]]; then
            echo "::error title=REFUSED:VACUITY_CORPUS_RECEIPT_MISSING::audit did not manufacture its corpus receipt"
            exit 2
          fi
          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            echo "::error title=REFUSED:VACUITY_CORPUS_AUDIT_EXECUTION::exit=$status"
            exit "$status"
          fi
          if [[ "$status" -eq 2 ]]; then
            echo "::notice title=VACUITY_HISTORICAL_FINDINGS_PRESERVED::corpus audit exit=$status; PR admission is decided by exact-base non-regression"
          fi

      - name: Refuse new vacuity regressions against exact base
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git rev-parse HEAD)"
          base_ref="${{ github.event.pull_request.base.ref || 'main' }}"
          baseline="$(git merge-base "refs/remotes/origin/${base_ref}" "$subject")"
          if [[ -z "$baseline" ]]; then
            echo "::error title=REFUSED:VACUITY_BASE_UNRESOLVED::base_ref=$base_ref subject=$subject"
            exit 2
          fi
          echo "VACUITY_BASELINE_REF=$baseline"
          echo "VACUITY_SUBJECT_REF=$subject"
          python3 scripts/check_vacuity_delta.py \
            --baseline-ref "$baseline" \
            --subject-ref "$subject" \
            --report "${RUNNER_TEMP}/vacuity-delta.json"

      - name: Preserve vacuity audit receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: vacuity-audit
          path: |
            ${{ runner.temp }}/vacuity-audit-corpus.json
            ${{ runner.temp }}/vacuity-delta.json
          if-no-files-found: warn
          retention-days: 14
