name: DEVELOP Option Boundary Capital R13 Exact Head
on:
  pull_request:
    paths:
      - 'packs/ggen-project-boundary-pack/**'
      - 'receipts/select/2026-08-24-option-boundary-capital-r13.json'
      - '.github/workflows/develop-option-boundary-capital-r13.yml'
permissions:
  contents: read
jobs:
  qualify:
    if: github.head_ref == 'develop/option-boundary-capital-r13-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Verify option-boundary capital surface
        run: |
          test "$(find packs/ggen-project-boundary-pack/queries -name 'r13-option-boundary-*.rq' | wc -l)" -eq 12
          grep -q 'ManufacturingPrimitive' packs/ggen-project-boundary-pack/option-boundary-capital.ttl
          grep -q 'capitalYield' packs/ggen-project-boundary-pack/option-boundary-capital.ttl
      - name: Verify SELECT receipt boundary
        run: python3 -c "import json; d=json.load(open('receipts/select/2026-08-24-option-boundary-capital-r13.json')); assert d['authority']=='SELECT' and d['actuation_performed'] is False and d['marketplace_first'] is True"
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|boto3|azure\.|google\.cloud|curl .*-(X|d)' packs/ggen-project-boundary-pack receipts/select/2026-08-24-option-boundary-capital-r13.json
