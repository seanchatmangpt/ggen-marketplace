name: DEVELOP R55 Independent Consumer Fanout

on:
  pull_request:
    paths:
      - "packs/epistemic-sensor-factory-pack/**"
      - "packs/consumer-realization-frontier-pack/**"
      - "receipts/develop/2026-08-25-r55-independent-consumer-fanout.json"
      - ".github/workflows/develop-r55-independent-consumer-fanout.yml"

permissions:
  contents: read

concurrency:
  group: develop-r55-${{ github.workflow }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Prove generation-query determinism on repaired consumer frontier
        run: python3 packs/consumer-realization-frontier-pack/tests/test_generation_ordering.py
      - name: Install bounded SPARQL engine
        run: python3 -m pip install 'rdflib>=7,<8'
      - name: Execute fifty R55 independent-consumer courts
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r55_independent_consumer_fanout.py
      - name: Verify authority and manufacturing receipt
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('receipts/develop/2026-08-25-r55-independent-consumer-fanout.json'))
          assert r['semantic_query_commits'] == 50
          assert r['grounded_fixture_commits'] == 1
          assert r['consequential_do'] is False
          assert r['generated_output_edited'] is False
          assert r['thousand_x']['standing'] == 'NOT_ADMITTED'
          assert 'DO' not in r['authority']
          print('R55_RECEIPT=PASS')
          PY
