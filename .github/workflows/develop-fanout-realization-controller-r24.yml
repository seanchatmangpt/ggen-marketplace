name: DEVELOP Fanout Realization Controller R24 Exact Head
on:
  pull_request:
permissions:
  contents: read
jobs:
  qualify:
    if: github.head_ref == 'develop/fanout-realization-controller-r24-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace
        run: python3 scripts/marketplace.py validate
      - name: Run permanent courts
        run: python3 -m unittest discover -s packs/fanout-realization-controller-pack/tests -p 'test_*.py' -v
      - name: Verify control surface
        run: test "$(find packs/fanout-realization-controller-pack/queries -name '*.rq' | wc -l)" -eq 8
      - name: Verify SELECT authority
        run: python3 -c "import json; p=json.load(open('receipts/select/2026-08-24-fanout-realization-controller-r24.json')); assert p['authority']=='SELECT' and p['actuation_performed'] is False and p['marketplace_first'] is True"
