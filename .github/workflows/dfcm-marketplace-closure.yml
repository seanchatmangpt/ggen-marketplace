name: DfCM Marketplace Closure

on:
  pull_request:
    branches: [main, dfcm-consolidation-26-9-12]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dfcm-marketplace-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: never

jobs:
  closure:
    name: Qualify canonical 12-pack closure
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "exact_head=$actual"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate complete source corpus
        run: python scripts/marketplace.py validate

      - name: Prove active scope and preserve legacy census
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marketplace_scope.py > "${RUNNER_TEMP}/scope.json"
          python scripts/consolidation_census.py --report "${RUNNER_TEMP}/legacy-census.json"
          python - "${RUNNER_TEMP}/scope.json" "${RUNNER_TEMP}/legacy-census.json" <<'PY'
          import json, sys
          scope = json.load(open(sys.argv[1]))
          census = json.load(open(sys.argv[2]))
          assert scope["active_count"] == 12, scope
          assert scope["legacy_count"] > 0, scope
          assert scope["total_count"] == scope["active_count"] + scope["legacy_count"], scope
          assert census["active_count"] == 12, census
          assert census["legacy_count"] == scope["legacy_count"], (census, scope)
          PY

      - name: Prove catalog defaults to the canonical scope
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marketplace.py catalog > "${RUNNER_TEMP}/active-catalog-a.json"
          python scripts/marketplace.py catalog > "${RUNNER_TEMP}/active-catalog-b.json"
          cmp "${RUNNER_TEMP}/active-catalog-a.json" "${RUNNER_TEMP}/active-catalog-b.json"
          python scripts/marketplace.py catalog --scope all > "${RUNNER_TEMP}/all-catalog.json"
          python - "${RUNNER_TEMP}/active-catalog-a.json" "${RUNNER_TEMP}/all-catalog.json" <<'PY'
          import json, sys
          active = json.load(open(sys.argv[1]))
          complete = json.load(open(sys.argv[2]))
          active_names = [p["name"] for p in active["packs"]]
          all_names = [p["name"] for p in complete["packs"]]
          assert active["scope"] == "active"
          assert complete["scope"] == "all"
          assert len(active_names) == 12, active_names
          assert len(all_names) > len(active_names), len(all_names)
          assert set(active_names) < set(all_names)
          PY

      - name: Prove active archive determinism
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marketplace.py archive > "${RUNNER_TEMP}/archive-a.txt"
          test "$(wc -l < "${RUNNER_TEMP}/archive-a.txt" | tr -d ' ')" = "12"
          mv dist/packs "${RUNNER_TEMP}/packs-a"
          python scripts/marketplace.py archive > "${RUNNER_TEMP}/archive-b.txt"
          cmp "${RUNNER_TEMP}/archive-a.txt" "${RUNNER_TEMP}/archive-b.txt"
          diff -rq "${RUNNER_TEMP}/packs-a" dist/packs

      - name: Set up pinned star-toml toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "nightly-2026-06-22"
          components: rustfmt

      - name: Admit marketplace config and install pinned ggen
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/admit-config.sh marketplace.toml "${RUNNER_TEMP}/admitted-config.json"
          ggen_bin="$(bash scripts/install-ggen.sh "${RUNNER_TEMP}/admitted-config.json")"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
          "$ggen_bin" --version

      - name: Qualify all twelve active packs through real ggen
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/active-qualification.json"
          python scripts/qualify_packs_r18.py \
            --scope active \
            --ggen "$GGEN_BIN" \
            --timeout-seconds 15 \
            --workers 4 \
            --report "$report"
          python - "$report" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          assert payload["scope"] == "active", payload
          assert payload["pack_count"] == 12, payload
          assert all(p["status"] != "REFUSED" for p in payload["packs"]), payload
          PY

      - name: Preserve closure receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dfcm-marketplace-closure
          path: |
            ${{ runner.temp }}/scope.json
            ${{ runner.temp }}/legacy-census.json
            ${{ runner.temp }}/active-catalog-a.json
            ${{ runner.temp }}/all-catalog.json
            ${{ runner.temp }}/active-qualification.json
          if-no-files-found: warn
          retention-days: 14
