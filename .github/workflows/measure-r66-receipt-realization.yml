name: MEASURE R66 Receipt Realization Calibration

on:
  pull_request:
    paths:
      - "packs/epistemic-sensor-factory-pack/**"
      - ".github/workflows/measure-r66-receipt-realization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Admit exact PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Install bounded SPARQL runtime
        run: python3 -m pip install --disable-pip-version-check 'rdflib>=7,<8'
      - name: Execute R66 permanent court
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r66_receipt_realization_calibration.py
      - name: Verify generation contract owns R66 projection
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'name = "receipt-realization-calibration"' packs/epistemic-sensor-factory-pack/ggen.toml
          grep -F 'queries/1502_r66_receipt_realization_projection.rq' packs/epistemic-sensor-factory-pack/ggen.toml
          grep -F 'templates/r66-receipt-realization-calibration.json.tera' packs/epistemic-sensor-factory-pack/ggen.toml
      - name: Refuse ambient consequential actuation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'consequential_do[" ]*:[ ]*true|odrl:execute' \
            packs/epistemic-sensor-factory-pack/fixtures/r66-receipt-realization-calibration.ttl \
            packs/epistemic-sensor-factory-pack/queries/*_r66_*.rq \
            packs/epistemic-sensor-factory-pack/templates/r66-receipt-realization-calibration.json.tera
