name: MEASURE R34 Portfolio Epistemic Observability

on:
  pull_request:
    paths:
      - 'packs/portfolio-epistemic-observability-pack/**'
      - 'receipts/measure/2026-08-25-r34-portfolio-epistemic-observability.json'
      - '.github/workflows/measure-r34-portfolio-observability.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded RDF verifier dependency
        run: python -m pip install 'rdflib>=7,<8'
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Run portfolio contract court
        run: python3 -m unittest discover -s packs/portfolio-epistemic-observability-pack/tests -p 'test_*.py' -v
      - name: Enforce sensor surface
        run: test "$(find packs/portfolio-epistemic-observability-pack/queries -name '*.rq' | wc -l)" -ge 24
      - name: Refuse ambient actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' packs/portfolio-epistemic-observability-pack
