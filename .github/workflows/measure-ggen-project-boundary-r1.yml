name: MEASURE ggen Project Boundary R1 Exact Head
on:
  pull_request:
    paths:
      - 'packs/ggen-project-boundary-pack/**'
      - 'receipts/measure/2026-08-24-ggen-project-boundary-r1.json'
      - '.github/workflows/measure-ggen-project-boundary-r1.yml'
permissions:
  contents: read
jobs:
  qualify:
    if: github.head_ref == 'measure/ggen-project-boundary-r1-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Verify project-boundary pack
        run: |
          test "$(find packs/ggen-project-boundary-pack/gates -name '*.rq' | wc -l)" -eq 8
          test "$(find packs/ggen-project-boundary-pack/queries -name '*.rq' | wc -l)" -eq 20
          test "$(find packs/ggen-project-boundary-pack/fixtures -name '*.ttl' | wc -l)" -eq 3
          test "$(find packs/ggen-project-boundary-pack/templates -type f | wc -l)" -eq 2
          grep -q 'FM-WRITE-002' packs/ggen-project-boundary-pack/queries/11-fm-write-002.rq
      - name: Verify MEASURE receipt boundary
        run: python3 -c "import json; d=json.load(open('receipts/measure/2026-08-24-ggen-project-boundary-r1.json')); assert d['meaningful_commits']==37 and d['generated_outputs_edited']==0 and d['actuation_performed'] is False"
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|boto3|azure\.|google\.cloud|curl .*-(X|d)' packs/ggen-project-boundary-pack receipts/measure/2026-08-24-ggen-project-boundary-r1.json
