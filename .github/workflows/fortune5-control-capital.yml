name: Fortune 5 Control Capital

on:
  pull_request:
    paths:
      - 'packs/counterfactual-frontier-replay-pack/**'
      - 'packs/runtime-evidence-authenticity-pack/**'
      - 'packs/runtime-evidence-authenticity-control-pack/**'
      - 'packs/owning-rail-observability-pack/**'
      - 'packs/owning-rail-remediation-pack/**'
      - 'tests/test_fortune5_control_capital.py'
      - '.github/workflows/fortune5-control-capital.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate complete marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Run Fortune 5 integration court
        run: python3 -m unittest tests/test_fortune5_control_capital.py -v
      - name: Run counterfactual replay proof courts
        run: python3 -m unittest discover -s packs/counterfactual-frontier-replay-pack/tests -p 'test_*.py' -v
      - name: Verify replay Fortune 5 control profile
        run: |
          test "$(find packs/counterfactual-frontier-replay-pack/gates -name '*.rq' | wc -l)" -eq 3
          python3 - <<'PY'
          import json
          p=json.load(open('packs/counterfactual-frontier-replay-pack/qualification/fortune5-profile.json'))
          required={'compiler-truth','conflict-truth','trust-truth','proof-truth'}
          assert {x['id'] for x in p['required_capabilities']} == required
          assert all(x['positive_execution'] and x['negative_refusal'] and x['receipt_replay'] for x in p['required_capabilities'])
          assert p['subject']['authority_ceiling'] == 'SELECT|CONSTRUCT|VERIFY'
          assert p['subject']['consequential_do'] is False
          PY
      - name: Run runtime authenticity falsifiers
        env:
          PYTHONPATH: packs/runtime-evidence-authenticity-pack
        run: python3 -m unittest discover -s packs/runtime-evidence-authenticity-pack/tests -p 'test_*.py' -v
      - name: Run authenticity-control falsifiers
        env:
          PYTHONPATH: packs/runtime-evidence-authenticity-control-pack
        run: python3 -m unittest discover -s packs/runtime-evidence-authenticity-control-pack/tests -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' \
            packs/counterfactual-frontier-replay-pack \
            packs/runtime-evidence-authenticity-pack \
            packs/runtime-evidence-authenticity-control-pack \
            tests/test_fortune5_control_capital.py
