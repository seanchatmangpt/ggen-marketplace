name: DEVELOP Rebloom Convergence Control R24 Exact Head
on:
  pull_request:
permissions:
  contents: read
jobs:
  qualify:
    if: github.head_ref == 'develop/rebloom-convergence-control-r24-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace
        run: python3 scripts/marketplace.py validate
      - name: Verify R24 convergence courts
        run: test "$(find packs/adjacency-rebloom-controller-pack/queries -name 'r24-convergence-*.rq' | wc -l)" -eq 13
      - name: Verify SELECT authority
        run: python3 -c "import json; p=json.load(open('receipts/select/2026-08-24-rebloom-convergence-control-r24.json')); assert p['authority']=='SELECT' and p['actuation_performed'] is False and p['marketplace_first'] is True"
