name: DEVELOP Composition Capital Controller R18 Exact Head
on:
  pull_request:
jobs:
  qualify:
    if: github.event.pull_request.head.ref == 'develop/composition-capital-controller-r18-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace
        run: python3 scripts/marketplace.py validate
      - name: Verify composition-capital surface
        run: |
          test "$(find packs/ggen-project-boundary-pack/queries -name 'r18-ccap-*.rq' | wc -l)" -eq 10
          test -f packs/ggen-project-boundary-pack/composition-capital-control-r18.ttl
          python3 -c "import json; p=json.load(open('receipts/select/2026-08-24-composition-capital-controller-r18.json')); assert p['authority']=='SELECT' and p['actuation_performed'] is False and p['marketplace_first'] is True"
