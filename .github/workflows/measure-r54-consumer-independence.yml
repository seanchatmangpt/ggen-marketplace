name: MEASURE R54 Consumer Independence

on:
  pull_request:
    paths:
      - "packs/epistemic-sensor-factory-pack/**"
      - "receipts/measure/2026-08-25-r54-consumer-independence.json"
      - ".github/workflows/measure-r54-consumer-independence.yml"

permissions:
  contents: read

concurrency:
  group: measure-r54-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Install bounded SPARQL engine
        run: python3 -m pip install 'rdflib>=7,<8'
      - name: Execute fifty R54 independence courts
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r54_consumer_independence.py
      - name: Verify R54 receipt authority
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('receipts/measure/2026-08-25-r54-consumer-independence.json'))
          assert r['semantic_query_commits'] == 50
          assert r['consequential_do'] is False
          assert r['generated_output_edited'] is False
          assert r['thousand_x']['standing'] == 'NOT_ADMITTED'
          assert r['authority'] == 'OBSERVE|VERIFY|SELECT|CONSTRUCT'
          print('R54_RECEIPT=PASS')
          PY
