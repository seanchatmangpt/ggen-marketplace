name: DEVELOP Evidence Capital Control Policy Exact Head
on:
  pull_request:
    branches: ["measure/evidence-capital-control-realization-20260824"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Marketplace admission
        run: python3 scripts/marketplace.py validate
      - name: Compile algorithms and courts
        run: python3 -m py_compile packs/evidence-capital-control-policy-pack/scripts/*.py packs/evidence-capital-control-policy-pack/tests/*.py
      - name: Permanent courts
        env:
          PYTHONPATH: packs/evidence-capital-control-policy-pack
        run: python3 -m unittest discover -s packs/evidence-capital-control-policy-pack/tests -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          if grep -R -nE 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|\bDO\b.*true' packs/evidence-capital-control-policy-pack/scripts packs/evidence-capital-control-policy-pack/templates; then exit 1; fi
