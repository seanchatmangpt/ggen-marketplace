name: DEVELOP Opportunity Portfolio Controller R17 Exact Head
on:
  pull_request:
jobs:
  qualify:
    if: github.event.pull_request.head.ref == 'develop/opportunity-portfolio-controller-r17-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace
        run: python3 scripts/marketplace.py validate
      - name: Verify R17 surface and authority receipt
        run: |
          test "$(find packs/ggen-project-boundary-pack/queries -name 'r17-portfolio-*.rq' | wc -l)" -eq 11
          python3 -c "import json; p=json.load(open('receipts/select/2026-08-24-opportunity-portfolio-controller-r17.json')); assert p['authority']=='SELECT' and p['actuation_performed'] is False and p['marketplace_first'] is True"
