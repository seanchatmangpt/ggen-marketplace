name: MEASURE Opportunity Realization R28

on:
  pull_request:
    paths:
      - 'packs/ggen-project-boundary-pack/opportunity-realization-r28.ttl'
      - 'packs/ggen-project-boundary-pack/queries/r28-opportunity-realization/**'
      - 'packs/ggen-project-boundary-pack/fixtures/r28-opportunity-realization.ttl'
      - 'packs/ggen-project-boundary-pack/innovation-capital-r28-ledger.jsonl'
      - 'packs/ggen-project-boundary-pack/receipts/r28-opportunity-realization-receipt.json'
      - 'packs/ggen-project-boundary-pack/tests/test_r28_opportunity_realization.py'
      - 'packs/ggen-project-boundary-pack/docs/r28-opportunity-realization/**'
      - '.github/workflows/measure-opportunity-realization-r28.yml'

permissions:
  contents: read

jobs:
  qualify-r28:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Compile permanent R28 court
        run: python3 -m py_compile packs/ggen-project-boundary-pack/tests/test_r28_opportunity_realization.py
      - name: Execute permanent R28 court
        run: python3 packs/ggen-project-boundary-pack/tests/test_r28_opportunity_realization.py -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' packs/ggen-project-boundary-pack/tests/test_r28_opportunity_realization.py
