name: MEASURE Option Observability Realization R27

on:
  pull_request:
    paths:
      - 'packs/ggen-project-boundary-pack/option-observability-r27.ttl'
      - 'packs/ggen-project-boundary-pack/queries/r27-option-observability/**'
      - 'packs/ggen-project-boundary-pack/fixtures/r27-option-observability-live-window.ttl'
      - 'packs/ggen-project-boundary-pack/innovation-capital-r27-ledger.jsonl'
      - 'packs/ggen-project-boundary-pack/receipts/r27-option-observability-receipt.json'
      - 'packs/ggen-project-boundary-pack/tests/test_r27_option_observability.py'
      - '.github/workflows/measure-option-observability-r27.yml'

permissions:
  contents: read

jobs:
  qualify-r27:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Compile permanent R27 court
        run: python3 -m py_compile packs/ggen-project-boundary-pack/tests/test_r27_option_observability.py
      - name: Execute permanent R27 court
        run: python3 packs/ggen-project-boundary-pack/tests/test_r27_option_observability.py -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' packs/ggen-project-boundary-pack/tests/test_r27_option_observability.py
