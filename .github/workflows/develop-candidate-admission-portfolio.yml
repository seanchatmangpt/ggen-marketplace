name: DEVELOP Candidate Admission Portfolio Exact Head
on:
  pull_request:
    paths:
      - 'packs/candidate-admission-portfolio-pack/**'
      - 'receipts/select/2026-08-24-candidate-admission-portfolio.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Marketplace admission
        run: python3 scripts/marketplace.py validate
      - name: Compile pack runtime
        run: python3 -m py_compile packs/candidate-admission-portfolio-pack/scripts/*.py packs/candidate-admission-portfolio-pack/tests/*.py
      - name: Permanent courts
        run: PYTHONPATH=packs/candidate-admission-portfolio-pack python3 -m unittest discover -s packs/candidate-admission-portfolio-pack/tests -p 'test_*.py' -v
      - name: No ambient consequential actuation
        run: '! grep -R -nE "requests\.(post|put|patch|delete)|subprocess\.|os\.system" packs/candidate-admission-portfolio-pack'
