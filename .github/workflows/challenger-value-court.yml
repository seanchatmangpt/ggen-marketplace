name: Challenger Value Court

on:
  pull_request:
    branches: [main]
    paths:
      - "packs/challenger-value-framing-pack/**"
      - ".github/workflows/challenger-value-court.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenger-value:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Execute Challenger conformance vectors
        run: python packs/challenger-value-framing-pack/reference/python/court.py
