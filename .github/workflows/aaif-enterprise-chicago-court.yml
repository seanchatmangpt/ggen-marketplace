name: Marketplace Chicago Multi-Pack Conformance Matrix

on:
  push:
    branches: [main, feat/*]
  pull_request:

jobs:
  chicago-kind-court:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Python Environment
        run: |
          python3 --version
          python3 -m venv /opt/court-venv
          /opt/court-venv/bin/pip install --upgrade pip

      - name: Install Kind & Gateway API Tools
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Spin up Ephemeral Kind Cluster
        run: |
          ./k8s/harness/setup_kind_cluster.sh ephemeral-aaif-court

      - name: Install pm4pytest and Conformance Tooling
        run: |
          /opt/court-venv/bin/pip install -e packages/pm4pytest
          /opt/court-venv/bin/pip install -e .
          /opt/court-venv/bin/pip install rdflib pyshacl pyyaml cryptography

      - name: Run Multi-Pack Chicago Conformance Courts
        run: |
          /opt/court-venv/bin/pytest tests/test_aaif_enterprise_court.py tests/test_rust_wasi_wasmex_court.py tests/test_cdbr_isolation_court.py tests/test_pqc_closed_enum_court.py -v

      - name: Validate IEEE OCEL v2 Database Integrity (AAIF & WASM Traces)
        run: |
          /opt/court-venv/bin/python -c "
          import sqlite3
          from pathlib import Path

          traces = [
              ('/tmp/aaif_chicago_trace.sqlite', 'AAIF Enterprise'),
              ('/tmp/wasm_chicago_trace.sqlite', 'Rust WASI / Wasmex')
          ]

          for db_path_str, name in traces:
              db_path = Path(db_path_str)
              assert db_path.exists(), f'{name} SQLite trace not found at {db_path}'
              assert db_path.stat().st_size > 0, f'{name} SQLite trace is empty (0 bytes)'

              conn = sqlite3.connect(str(db_path))
              cursor = conn.cursor()

              # Verify IEEE OCEL v2 relational schema presence
              cursor.execute(\"SELECT name FROM sqlite_master WHERE type='table';\")
              tables = {row[0] for row in cursor.fetchall()}
              required = {'event', 'object', 'event_object'}
              assert required.issubset(tables), f'[{name}] Missing required OCEL v2 tables: {required - tables}'

              # Verify non-empty event-object relations
              cursor.execute(\"SELECT count(*) FROM event_object;\")
              rel_count = cursor.fetchone()[0]
              assert rel_count > 0, f'[{name}] Zero event-object relations recorded'

              cursor.execute(\"SELECT count(*) FROM event;\")
              ev_count = cursor.fetchone()[0]
              cursor.execute(\"SELECT count(*) FROM object;\")
              obj_count = cursor.fetchone()[0]
              print(f'[{name}] IEEE OCEL v2 Relational Verification: {ev_count} events, {obj_count} objects, {rel_count} relations validated.')
              conn.close()
          "

      - name: Teardown Cluster (Always Executed)
        if: always()
        run: |
          ./k8s/harness/teardown_kind_cluster.sh ephemeral-aaif-court
