name: MEASURE R72 Temporal Truth
on:
  pull_request:
    paths:
      - 'packs/temporal-truth-observability-pack/**'
      - '.github/workflows/measure-r72-temporal-truth.yml'
permissions:
  contents: read
jobs:
  exact-head-court:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse RDF and all SPARQL sensors
        run: |
          python -m pip install --disable-pip-version-check 'rdflib==7.1.4'
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          from rdflib.plugins.sparql.parser import parseQuery
          root = Path('packs/temporal-truth-observability-pack')
          Graph().parse(root/'ontology.ttl', format='turtle')
          queries = sorted((root/'queries').glob('*.rq'))
          assert len(queries) == 48, len(queries)
          for q in queries:
              parseQuery(q.read_text())
          print(f'R72_ALIVE sensors={len(queries)}')
          PY
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -R -E 'kubectl apply|terraform apply|aws .*create|gcloud .*create|az .*create' packs/temporal-truth-observability-pack
