name: GitHub Package Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/setup-ggen-factory/**'
      - '.github/workflows/package-contract.yml'
      - '.github/workflows/publish-packages.yml'
      - 'packaging/github/**'
      - 'scripts/github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Factory package contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up pinned admission toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 'nightly-2026-06-22'
          components: rustfmt

      - name: Admit Marketplace and prove deterministic factory identity
        shell: bash
        run: |
          set -euo pipefail
          admitted="$(bash scripts/admit-config.sh marketplace.toml "${RUNNER_TEMP}/admitted.json")"
          python3 scripts/github/factory_manifest.py --admitted-config "$admitted" --marketplace-sha "$(git rev-parse HEAD)" --output "${RUNNER_TEMP}/factory-a.json"
          python3 scripts/github/factory_manifest.py --admitted-config "$admitted" --marketplace-sha "$(git rev-parse HEAD)" --output "${RUNNER_TEMP}/factory-b.json"
          cmp "${RUNNER_TEMP}/factory-a.json" "${RUNNER_TEMP}/factory-b.json"
          python3 - "$admitted" "${RUNNER_TEMP}/factory-a.json" <<'PY'
          import json, sys
          admitted=json.load(open(sys.argv[1], encoding='utf-8'))['config']
          factory=json.load(open(sys.argv[2], encoding='utf-8'))
          assert factory['ggen']['repository'] == admitted['ggen']['repository']
          assert factory['ggen']['version'] == admitted['ggen']['version']
          assert factory['ggen']['release_commit'] == admitted['ggen']['release_commit']
          assert factory['ggen']['assets'] == admitted['ggen']['assets']
          assert factory['marketplace']['pack_count'] == len(factory['packs'])
          assert factory['marketplace']['pack_count'] > 0
          assert factory['factory_id'].startswith('sha256:')
          PY

      - name: Static coordination and workflow court
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/github/factory_manifest.py
          bash -n scripts/github/materialize_factory_ggen.sh
          ruby -e "require 'yaml'; YAML.load_file('.github/actions/setup-ggen-factory/action.yml'); YAML.load_file('.github/workflows/publish-packages.yml')"
          if grep -REn 'v[0-9]+\.[0-9]+\.[0-9]+|ggen-(x86_64|aarch64)-unknown-linux-gnu\.tar\.gz|sha256 = ' scripts/github .github/actions/setup-ggen-factory packaging/github; then
            echo 'REFUSED:PACKAGE_PLANE_DUPLICATED_ADMITTED_GGEN_CONSTANTS' >&2
            exit 2
          fi
