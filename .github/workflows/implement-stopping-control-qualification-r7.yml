name: IMPLEMENT Stopping Control Qualification R7 Exact Head

on:
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    if: github.head_ref == 'implement/stopping-control-qualification-r7-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Verify IMPLEMENT R7 qualification surface
        run: |
          test "$(find packs/dfcm-maximalist-court-pack/queries -name 'implement-r7-*.rq' | wc -l)" -eq 25
          grep -q 'PolicyCalibrationObservation' packs/dfcm-maximalist-court-pack/ontology.ttl
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path('packs/dfcm-maximalist-court-pack/queries').glob('implement-r7-*.rq'))
          assert len(files) == 25
          for path in files:
              text = path.read_text()
              assert 'PREFIX dmc:' in text, path
              assert 'SELECT ' in text and 'WHERE' in text, path
              if 'xsd:' in text:
                  assert 'PREFIX xsd:' in text, path
          PY
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'curl .*-(X|d)|requests\.(post|put|patch|delete)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' packs/dfcm-maximalist-court-pack/queries/implement-r7-*.rq
