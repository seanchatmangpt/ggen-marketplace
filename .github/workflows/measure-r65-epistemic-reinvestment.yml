name: MEASURE R65 Epistemic Reinvestment
on:
  pull_request:
    paths:
      - 'packs/epistemic-sensor-factory-pack/**'
      - '.github/workflows/measure-r65-epistemic-reinvestment.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded SPARQL verifier
        run: python -m pip install 'rdflib>=7,<8'
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Execute R65 50-sensor court
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r65_epistemic_reinvestment.py
      - name: Refuse ambient consequential DO
        run: |
          ! grep -R 'actuationPerformed true' packs/epistemic-sensor-factory-pack/fixtures/r65-epistemic-reinvestment.ttl
          ! grep -R 'odrl:permission.*execute' packs/epistemic-sensor-factory-pack/ontology.r65-epistemic-reinvestment.ttl
