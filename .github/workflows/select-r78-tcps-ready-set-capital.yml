name: SELECT R78 TCPS Ready Set Capital
on:
  pull_request:
    paths:
      - 'packs/portfolio-epistemic-observability-pack/**'
      - '.github/workflows/select-r78-tcps-ready-set-capital.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install bounded verifier
        run: python -m pip install 'rdflib>=7,<8' pytest
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Execute R78 TCPS ready-set court
        run: python -m pytest -q packs/portfolio-epistemic-observability-pack/tests/test_r78_tcps_ready_set_capital.py
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -R -nE 'consequentialDo[[:space:]]+true.*inAdmissibleSet[[:space:]]+true|actuationPerformed[[:space:]]+true' packs/portfolio-epistemic-observability-pack/ontology.r78-tcps-ready-set-capital.ttl packs/portfolio-epistemic-observability-pack/fixtures/r78-tcps-ready-set-capital.ttl
