name: DEVELOP R65 Realized Capital Reinvestment
on:
  pull_request:
    paths:
      - 'packs/epistemic-sensor-factory-pack/queries/14*_r65_*.rq'
      - 'packs/epistemic-sensor-factory-pack/tests/run_r65_realized_capital_reinvestment.py'
      - 'packs/epistemic-sensor-factory-pack/docs/r65-realized-capital-reinvestment-*'
      - 'receipts/develop/2026-08-25-r65-realized-capital-reinvestment.json'
      - '.github/workflows/develop-r65-realized-capital-reinvestment.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Execute R65 permanent court
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r65_realized_capital_reinvestment.py
      - name: Refuse ambient consequential actuation
        shell: bash
        run: |
          grep -q '"consequential_do":false' receipts/develop/2026-08-25-r65-realized-capital-reinvestment.json
          ! grep -R -E '(^|[^A-Z])(INSERT|DELETE|LOAD|CLEAR|DROP|CREATE|MOVE|COPY|ADD|SERVICE)[[:space:]]' packs/epistemic-sensor-factory-pack/queries/14*_r65_*.rq
