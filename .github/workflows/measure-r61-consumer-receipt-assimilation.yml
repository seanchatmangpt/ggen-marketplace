name: MEASURE R61 Consumer Receipt Assimilation
on:
  pull_request:
    paths:
      - 'packs/epistemic-sensor-factory-pack/**'
      - 'receipts/measure/2026-08-25-r61-consumer-receipt-assimilation.json'
      - '.github/workflows/measure-r61-consumer-receipt-assimilation.yml'
jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Execute R61 permanent court
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r61_consumer_receipt_assimilation.py
      - name: Refuse ambient consequential actuation
        shell: bash
        run: |
          grep -q 'consequentialDo "PROHIBITED"' packs/epistemic-sensor-factory-pack/ontology.r61-consumer-receipt-assimilation.ttl
          grep -q '"consequential_do":false' receipts/measure/2026-08-25-r61-consumer-receipt-assimilation.json
