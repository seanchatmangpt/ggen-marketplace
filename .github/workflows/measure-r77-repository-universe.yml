name: MEASURE R77 Exact Repository Universe
on:
  pull_request:
    paths:
      - 'packs/portfolio-epistemic-observability-pack/**'
      - '.github/workflows/measure-r77-repository-universe.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded verifier
        run: python -m pip install 'rdflib>=7,<8' pytest
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Run R77 exact-universe court
        run: python -m pytest -q packs/portfolio-epistemic-observability-pack/tests/test_r77_repository_universe.py
      - name: Compile collector
        run: python -m py_compile packs/portfolio-epistemic-observability-pack/scripts/r77_repository_universe.py
      - name: Refuse consequential actuation
        run: |
          ! grep -R -E 'consequential_do[[:space:]]*[:=][[:space:]]*true|actuationPerformed[[:space:]]+true' packs/portfolio-epistemic-observability-pack/ontology.r77-repository-universe.ttl packs/portfolio-epistemic-observability-pack/fixtures/r77-repository-universe.ttl
