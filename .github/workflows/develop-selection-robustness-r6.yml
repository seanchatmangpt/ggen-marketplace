name: DEVELOP Selection Robustness R6 Exact Head
on:
  pull_request:
permissions:
  contents: read
jobs:
  qualify:
    if: github.head_ref == 'develop/selection-robustness-r6-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace
        run: python3 scripts/marketplace.py validate
      - name: Verify R6 selection surface
        run: test "$(find packs/dfcm-maximalist-court-pack/queries/develop -name 'r6-*.rq' | wc -l)" -ge 12
      - name: Verify SELECT receipt authority
        run: python3 -c "import json; d=json.load(open('receipts/select/2026-08-24-selection-robustness-r6.json')); assert d['authority']=='SELECT' and d['actuation_performed'] is False and d['marketplace_first'] is True"
