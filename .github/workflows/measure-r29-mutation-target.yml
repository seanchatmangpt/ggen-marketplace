name: MEASURE R29 Mutation Target Correspondence

on:
  pull_request:
    paths:
      - 'packs/ggen-project-boundary-pack/mutation-target-correspondence-r29.ttl'
      - 'packs/ggen-project-boundary-pack/fixtures/r29-mutation-target-correspondence.ttl'
      - 'packs/ggen-project-boundary-pack/queries/r29-mutation-target/**'
      - 'packs/ggen-project-boundary-pack/gates/r29-mutation-target-admission.rq'
      - 'packs/ggen-project-boundary-pack/innovation-capital-r29-mutation-ledger.jsonl'
      - 'packs/ggen-project-boundary-pack/receipts/r29-mutation-target-correspondence-receipt.json'
      - 'packs/ggen-project-boundary-pack/tests/test_r29_mutation_target_correspondence.py'
      - 'packs/ggen-project-boundary-pack/docs/r29-mutation-target/**'
      - '.github/workflows/measure-r29-mutation-target.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Compile permanent court
        run: python3 -m py_compile packs/ggen-project-boundary-pack/tests/test_r29_mutation_target_correspondence.py
      - name: Execute permanent court
        run: python3 packs/ggen-project-boundary-pack/tests/test_r29_mutation_target_correspondence.py -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' packs/ggen-project-boundary-pack/tests/test_r29_mutation_target_correspondence.py
