name: DEVELOP Evidence Capital Admission Exact Head
on:
  pull_request:
    paths:
      - 'packs/evidence-capital-admission-pack/**'
      - 'receipts/select/2026-08-24-evidence-capital-admission.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Marketplace admission
        run: python3 scripts/marketplace.py validate
      - name: Compile pack runtime
        run: python3 -m py_compile packs/evidence-capital-admission-pack/scripts/*.py packs/evidence-capital-admission-pack/tests/*.py
      - name: Permanent courts
        run: PYTHONPATH=packs/evidence-capital-admission-pack python3 -m unittest discover -s packs/evidence-capital-admission-pack/tests -p 'test_*.py' -v
      - name: No ambient consequential actuation
        run: '! grep -R -nE "requests\.(post|put|patch|delete)|subprocess\.|os\.system" packs/evidence-capital-admission-pack'
