name: DEVELOP Remediation Counterfactual Safety Exact Head
on:
  pull_request:
    paths:
      - 'packs/owning-rail-remediation-counterfactual-pack/**'
      - 'receipts/select/2026-08-24-remediation-counterfactual-safety.json'
      - '.github/workflows/develop-remediation-counterfactual-safety.yml'
permissions:
  contents: read
jobs:
  qualify:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace
        run: python3 scripts/marketplace.py validate
      - name: Compile pack
        run: python3 -m compileall -q packs/owning-rail-remediation-counterfactual-pack
      - name: Run permanent court
        run: python3 -m unittest -v packs/owning-rail-remediation-counterfactual-pack/tests/test_counterfactual_safety.py
      - name: Refuse ambient consequential DO
        run: '! grep -R -nE "requests\.(post|put|patch|delete)|subprocess\.|os\.system" packs/owning-rail-remediation-counterfactual-pack/scripts'
