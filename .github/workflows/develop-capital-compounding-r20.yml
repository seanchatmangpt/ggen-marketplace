name: DEVELOP Capital Compounding R20 Exact Head
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: develop-capital-compounding-r20-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.event.pull_request.head.ref == 'develop/capital-compounding-controller-r20-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace
        run: python3 scripts/marketplace.py validate
      - name: Verify compounding capital surface
        run: |
          test -f packs/ggen-project-boundary-pack/ontology-r20-capital-compounding.ttl
          test "$(find packs/ggen-project-boundary-pack/queries -maxdepth 1 -name 'r20-*compounding*.rq' -o -name 'r20-*index.rq' -o -name 'r20-*coverage.rq' | wc -l)" -ge 6
          python3 -c "import json; p=json.load(open('receipts/select/2026-08-24-capital-compounding-controller-r20.json')); assert p['authority']=='SELECT' and p['actuation_performed'] is False and p['marketplace_first'] is True"
