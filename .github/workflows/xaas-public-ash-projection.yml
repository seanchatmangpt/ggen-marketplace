name: XaaS public ontology to Ash

on:
  pull_request:
    paths:
      - "packs/xaas-public-ash-projection-pack/**"
      - ".github/workflows/xaas-public-ash-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-ontology-to-ash:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact marketplace subject
        uses: actions/checkout@v4

      - name: Checkout exact ggen 26.8.19 subject
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen
          ref: 7fc324df397973004059c37b752a365315d7bfb8
          path: ggen-source

      - name: Provision ggen exact sibling graph
        shell: bash
        run: |
          set -euo pipefail
          org="https://github.com/seanchatmangpt"
          repos=(lsp-max lsp-types-max wasm4pm wasm4pm-compat)
          shas=(7bcc1e16dec71ef5fb2cedea2dfd6cb5cde37f59 6773e6017ca83c565785d0ec39d75304f62c3237 0bb134b29245517ac4969a9f1916f5432931c5d0 e46155e209a750fda0218532d96ae17a9e10903e)
          for i in "${!repos[@]}"; do
            repo="${repos[$i]}"
            sha="${shas[$i]}"
            git init -q "$repo"
            git -C "$repo" remote add origin "$org/$repo"
            git -C "$repo" fetch -q --depth 1 origin "$sha"
            git -C "$repo" checkout -q FETCH_HEAD
            test "$(git -C "$repo" rev-parse HEAD)" = "$sha"
          done

      - name: Install ggen pinned nightly
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt,clippy

      - name: Install sccache
        uses: taiki-e/install-action@81ecf985428d5c2ea81dbf079bceca32bc9604ab
        with:
          tool: sccache

      - name: Build exact ggen CLI
        working-directory: ggen-source
        run: |
          cargo build -p ggen-cli-lib --bin ggen --locked
          test -x target/debug/ggen
          target/debug/ggen --version

      - name: Validate public profile gates as SPARQL refusals
        run: |
          python -m pip install --disable-pip-version-check 'rdflib==7.1.4'
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          pack = Path('packs/xaas-public-ash-projection-pack')
          graph = Graph().parse(pack / 'ontology.ttl', format='turtle')
          for gate in sorted((pack / 'gates').glob('*.rq')):
              rows = list(graph.query(gate.read_text()))
              if rows:
                  raise SystemExit(f'REFUSED:{gate.name}:{rows}')
              print(f'ALIVE:{gate.name}')
          PY

      - name: Run real ggen sync twice and prove deterministic projection
        shell: bash
        run: |
          set -euo pipefail
          GGEN="$GITHUB_WORKSPACE/ggen-source/target/debug/ggen"
          PACK="$GITHUB_WORKSPACE/packs/xaas-public-ash-projection-pack"
          cd "$PACK"
          "$GGEN" sync run
          test -s xaas-public-ash-GENERATED.sh
          bash -n xaas-public-ash-GENERATED.sh
          ! grep -q 'xar:' xaas-public-ash-GENERATED.sh
          sha256sum xaas-public-ash-GENERATED.sh > /tmp/public-ash-first.sha256
          cp xaas-public-ash-GENERATED.sh /tmp/public-ash-first.sh
          "$GGEN" sync run
          sha256sum xaas-public-ash-GENERATED.sh > /tmp/public-ash-second.sha256
          cmp /tmp/public-ash-first.sha256 /tmp/public-ash-second.sha256
          cmp /tmp/public-ash-first.sh xaas-public-ash-GENERATED.sh
          grep -q 'Xaas.Public.Function' xaas-public-ash-GENERATED.sh
          grep -q 'Xaas.Public.Organization' xaas-public-ash-GENERATED.sh

      - name: Set up exact BEAM target toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Install Ash project generators
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex igniter_new --force
          mix archive.install hex phx_new --force

      - name: Manufacture clean Ash target
        working-directory: /tmp
        run: |
          mix igniter.new xaas_public_smoke \
            --with phx.new \
            --install ash@3.32.0 \
            --yes
          test -f /tmp/xaas_public_smoke/mix.exs

      - name: Execute public-ontology-generated Ash constructor
        working-directory: /tmp/xaas_public_smoke
        run: bash "$GITHUB_WORKSPACE/packs/xaas-public-ash-projection-pack/xaas-public-ash-GENERATED.sh"

      - name: Verify manufactured public Ash subject
        working-directory: /tmp/xaas_public_smoke
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test
          mix ash.manifest.dump

      - name: Preserve exact projection receipt
        if: always()
        run: |
          {
            echo "marketplace_sha=$GITHUB_SHA"
            echo "ggen_sha=7fc324df397973004059c37b752a365315d7bfb8"
            echo "ggen_version=26.8.19"
            echo "rust_toolchain=nightly-2026-06-22"
            echo "ash_version=3.32.0"
            if [ -f /tmp/public-ash-first.sha256 ]; then cat /tmp/public-ash-first.sha256; fi
          } > /tmp/xaas-public-ash-receipt.txt
          cat /tmp/xaas-public-ash-receipt.txt

      - name: Upload projection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaas-public-ash-${{ github.sha }}
          path: |
            /tmp/xaas-public-ash-receipt.txt
            /tmp/public-ash-first.sh
          if-no-files-found: warn
          retention-days: 14
