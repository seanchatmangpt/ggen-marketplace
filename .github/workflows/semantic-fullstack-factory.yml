name: Semantic full-stack factory court

on:
  pull_request:
    paths:
      - "packs/semantic-fullstack-factory-pack/**"
      - ".github/workflows/semantic-fullstack-factory.yml"
  push:
    branches:
      - feat/semantic-fullstack-factory-v26.9.21
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  manufacture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact producer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact producer
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate marketplace source
        run: |
          python3 scripts/marketplace.py validate
          python3 scripts/marketplace.py catalog > /tmp/catalog-a.json
          python3 scripts/marketplace.py catalog > /tmp/catalog-b.json
          cmp /tmp/catalog-a.json /tmp/catalog-b.json

      - name: Install digest-verified ggen v26.9.12
        shell: bash
        env:
          GGEN_URL: https://github.com/seanchatmangpt/ggen/releases/download/v26.9.12/ggen-x86_64-unknown-linux-gnu.tar.gz
          GGEN_SHA256: ef51c03acc70752446d2147b255ee508ea1471862db45a6bdf5da3fdf62ff430
        run: |
          set -euo pipefail
          curl --fail --location "$GGEN_URL" --output /tmp/ggen.tar.gz
          echo "$GGEN_SHA256  /tmp/ggen.tar.gz" | sha256sum --check -
          mkdir -p .constructor
          tar -xzf /tmp/ggen.tar.gz -C .constructor
          test -x .constructor/ggen
          .constructor/ggen --version

      - name: Manufacture consumer from RDF only
        working-directory: packs/semantic-fullstack-factory-pack/qualification
        run: |
          rm -rf generated
          "$GITHUB_WORKSPACE/.constructor/ggen" sync run
          test -s generated/backend/app.py
          test -s generated/backend/test_generated_app.py
          test -s generated/frontend/app/page.js
          test -s generated/frontend/e2e/semantic-generated.spec.cjs

      - name: Prove generated backend
        working-directory: packs/semantic-fullstack-factory-pack/qualification/generated/backend
        run: |
          python -m pip install -r requirements.txt
          pytest -q
          uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/semantic-fastapi.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          health=json.load(open("/tmp/health.json"))
          assert health["runtime_intelligence"] == "NONE", health
          assert health["manufacture_mode"] == "DETERMINISTIC", health
          assert health["authority"] == "SELECT_CONSTRUCT_ONLY", health
          print("SEMANTIC_FASTAPI_ALIVE")
          PY

      - name: Build generated Next.js frontend
        working-directory: packs/semantic-fullstack-factory-pack/qualification/generated/frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          npm install --ignore-scripts
          npm run build
          npx playwright install --with-deps chromium

      - name: Start generated frontend
        working-directory: packs/semantic-fullstack-factory-pack/qualification/generated/frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/semantic-next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/semantic-next.log
          exit 1

      - name: Run generated browser court
        working-directory: packs/semantic-fullstack-factory-pack/qualification/generated/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          npx playwright test
          echo "SEMANTIC_NEXTJS_PLAYWRIGHT_ALIVE"

      - name: Falsify hidden intelligence and authority drift
        working-directory: packs/semantic-fullstack-factory-pack/qualification/generated
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'openai|anthropic|ollama|langchain|litellm|authority.*DO|DO_AUTHORITY' backend frontend
          grep -R "SELECT_CONSTRUCT_ONLY" backend frontend
          grep -R "ENGINEER_DISPOSITION_REQUIRED" backend frontend
          echo "ZERO_LLM_RUNTIME_AND_NO_AMBIENT_DO_OBSERVED"

      - uses: actions/upload-artifact@v4
        with:
          name: semantic-fullstack-generated-${{ github.event.pull_request.head.sha || github.sha }}
          path: packs/semantic-fullstack-factory-pack/qualification/generated
          if-no-files-found: error
          retention-days: 30
