name: EXPLORE Opportunity Hypergraph R30

on:
  pull_request:
    paths:
      - 'packs/ggen-project-boundary-pack/opportunity-hypergraph-r30.ttl'
      - 'packs/ggen-project-boundary-pack/fixtures/r30-opportunity-hypergraph.ttl'
      - 'packs/ggen-project-boundary-pack/queries/r30-opportunity-hypergraph/**'
      - 'packs/ggen-project-boundary-pack/gates/r30-opportunity-hypergraph-authority.rq'
      - 'packs/ggen-project-boundary-pack/innovation-capital-r30-ledger.jsonl'
      - 'packs/ggen-project-boundary-pack/receipts/r30-opportunity-hypergraph-receipt.json'
      - 'packs/ggen-project-boundary-pack/tests/test_r30_opportunity_hypergraph.py'
      - 'packs/ggen-project-boundary-pack/docs/r30-opportunity-hypergraph/**'
      - '.github/workflows/explore-opportunity-hypergraph-r30.yml'

permissions:
  contents: read

jobs:
  qualify-r30:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Compile permanent R30 court
        run: python3 -m py_compile packs/ggen-project-boundary-pack/tests/test_r30_opportunity_hypergraph.py
      - name: Execute permanent R30 court
        run: python3 packs/ggen-project-boundary-pack/tests/test_r30_opportunity_hypergraph.py -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' packs/ggen-project-boundary-pack/tests/test_r30_opportunity_hypergraph.py
