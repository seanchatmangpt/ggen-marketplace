name: DEVELOP R71 Orthogonal Consumer Capital

on:
  pull_request:
    paths:
      - "packs/orthogonal-consumer-capital-pack/**"
      - "receipts/develop/2026-08-25-r71-orthogonal-consumer-capital.json"
      - ".github/workflows/develop-r71-orthogonal-consumer-capital.yml"

permissions:
  contents: read

concurrency:
  group: develop-r71-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Install bounded SPARQL verifier
        run: python3 -m pip install 'rdflib>=7,<8'
      - name: Execute 51 orthogonal consumer capital courts
        run: python3 packs/orthogonal-consumer-capital-pack/tests/test_contract.py
      - name: Verify construction receipt
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('receipts/develop/2026-08-25-r71-orthogonal-consumer-capital.json'))
          assert r['round'] == 'R71'
          assert r['construction_base'] == '2469a38d0e7af8225bbd44693ad7256bc9efbf63'
          assert r['semantic_query_commits'] == 51
          assert r['minimum_new_meaningful_commits'] >= 57
          assert r['consequential_do'] is False
          assert r['generated_output_edited'] is False
          assert r['thousand_x']['standing'] == 'NOT_ADMITTED'
          print('R71_RECEIPT=PASS')
          PY
      - name: Refuse ambient consequential DO
        run: |
          set -euo pipefail
          ! grep -R -E 'occ:consequentialDo[[:space:]]+true' packs/orthogonal-consumer-capital-pack/ontology.ttl
          ! grep -E 'consequential_do[[:space:]]*=[[:space:]]*"(true|ALLOW)"' packs/orthogonal-consumer-capital-pack/pack.toml
