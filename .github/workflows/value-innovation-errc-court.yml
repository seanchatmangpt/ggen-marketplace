name: Value Innovation ERRC Court

on:
  pull_request:
    branches: [main]
    paths:
      - "packs/value-innovation-errc-pack/**"
      - ".github/workflows/value-innovation-errc-court.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  errc-court:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate

      - name: Prove deterministic catalog projection
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/marketplace.py catalog > /tmp/catalog-a.json
          python3 scripts/marketplace.py catalog > /tmp/catalog-b.json
          cmp /tmp/catalog-a.json /tmp/catalog-b.json

      - name: Execute independent ERRC reference court
        run: python3 packs/value-innovation-errc-pack/reference/python/court.py
