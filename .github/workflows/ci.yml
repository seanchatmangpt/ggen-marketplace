name: CI

# One workflow, path-classified. `plan` decides which heavy lanes are needed;
# `verify`, `qualify` and `tests` then run concurrently (none consumes another's
# artifacts). Per-pack courts live in ci/courts.json and run inside `verify`
# in parallel on one runner instead of one workflow (runner + checkout + setup)
# each. Nightly and manual runs execute every court and every lane.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR commits stop consuming compute; pushes to main run to
# completion so they seed the default-branch caches PRs restore from.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: never
  SHARD_COUNT: "4"
  # Diff anchor for path classification; empty => every court/lane runs.
  PLAN_BASE: ${{ github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || '' }}
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plan:
    name: Plan (path classification)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      qualify: ${{ steps.plan.outputs.qualify }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Classify change
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXACT_HEAD" ]] || { echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::"; exit 2; }
          if [[ -n "$PLAN_BASE" ]]; then
            git fetch --no-tags --depth=100 origin "$PLAN_BASE" "$EXACT_HEAD" || true
          fi
          python3 scripts/ci_plan.py plan --base "$PLAN_BASE" --head "$EXACT_HEAD" \
            $([[ "${{ github.event_name }}" =~ ^(schedule|workflow_dispatch)$ ]] && echo --all) | tee plan.json
          echo "qualify=$(python3 -c 'import json;print(str(json.load(open("plan.json"))["qualify"]).lower())')" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify (admission, determinism, courts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXACT_HEAD" ]] || { echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$EXACT_HEAD"; exit 2; }
          if [[ -n "$PLAN_BASE" ]]; then
            git fetch --no-tags --depth=100 origin "$PLAN_BASE" "$EXACT_HEAD" || true
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r ci/requirements.txt
      - name: Admit marketplace operational law through star-toml
        id: admit
        uses: ./.github/actions/admit-config
      - name: Assert admitted configuration
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.admit.outputs.admitted-config }}" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          assert payload["q_config"] == 1
          assert payload["standing"] == "ADMITTED"
          assert payload["star_toml_sha"] == "8395515cf8e68bfdc9edff49fb358c4f1da7c795"
          assert len(payload["witness_blake3"]) == 64
          qualification = payload["config"]["qualification"]
          assert isinstance(qualification["workers"], int) and qualification["workers"] > 0
          assert isinstance(qualification["timeout_seconds"], int) and qualification["timeout_seconds"] > 0
          PY
      - name: Guard timeout-minutes coverage
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for workflow in .github/workflows/*.yml; do
            if grep -q 'timeout-minutes:' "$workflow"; then continue; fi
            if grep -Eq '^[[:space:]]{4}uses:' "$workflow" && ! grep -Eq '^[[:space:]]{4}runs-on:' "$workflow"; then continue; fi
            missing+="${workflow}"$'\n'
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Workflow file(s) with executable local jobs missing timeout-minutes:"
            printf '%s' "$missing"
            exit 1
          fi
      - name: Validate marketplace and Diátaxis
        run: python scripts/marketplace.py validate
      - name: Supply-chain and standing hygiene (stdlib, no network)
        run: |
          python scripts/pin_actions.py --check
          python scripts/pack_capabilities.py --check
          python scripts/standing.py --check
      - name: Lint cross-pack instance references
        run: |
          python scripts/check_cross_pack_references.py --mode gate \
            --report "${RUNNER_TEMP}/cross-pack-references.json"
      - name: Prove deterministic catalog projection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marketplace.py catalog > "${RUNNER_TEMP}/catalog-a.json"
          python scripts/marketplace.py catalog > "${RUNNER_TEMP}/catalog-b.json"
          cmp "${RUNNER_TEMP}/catalog-a.json" "${RUNNER_TEMP}/catalog-b.json"
          python -m json.tool "${RUNNER_TEMP}/catalog-a.json" >/dev/null
      - name: Prove deterministic archive build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marketplace.py archive >"${RUNNER_TEMP}/archive-manifest-a.txt"
          mv dist/packs "${RUNNER_TEMP}/packs-a"
          python scripts/marketplace.py archive >"${RUNNER_TEMP}/archive-manifest-b.txt"
          diff -rq "${RUNNER_TEMP}/packs-a" dist/packs
          cmp "${RUNNER_TEMP}/archive-manifest-a.txt" "${RUNNER_TEMP}/archive-manifest-b.txt"
          rm -rf dist "${RUNNER_TEMP}/packs-a"
      - name: Fingerprint admitted corpus
        run: python scripts/marketplace.py fingerprint
      - name: Refuse migration actuator
        run: test ! -e .github/workflows/one-shot-import.yml
      - name: Run path-selected per-pack courts (parallel)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci_plan.py run --base "$PLAN_BASE" --head "$EXACT_HEAD" \
            $([[ "${{ github.event_name }}" =~ ^(schedule|workflow_dispatch)$ ]] && echo --all) \
            --receipt "${RUNNER_TEMP}/courts-receipt.json"
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-reports
          path: |
            ${{ runner.temp }}/cross-pack-references.json
            ${{ runner.temp }}/courts-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  qualify:
    name: Qualify shard ${{ matrix.shard }}/4
    needs: plan
    if: needs.plan.outputs.qualify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Admit marketplace operational law through star-toml
        id: admit
        uses: ./.github/actions/admit-config
      - name: Install ggen from admitted marketplace config (prebuilt binary, no Rust compile)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ggen_bin="$(bash scripts/install-ggen.sh "${{ steps.admit.outputs.admitted-config }}")"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
          "$ggen_bin" --version
      - name: Qualify this shard's packs through the real ggen runtime
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/shard-${{ matrix.shard }}-qualification.json"
          # Preserve the R18 contract's 15s per-pack ceiling; reduce concurrent
          # pressure rather than weaken the temporal admission law.
          python3 scripts/qualify_packs_r18.py \
            --ggen "$GGEN_BIN" \
            --shard-index ${{ matrix.shard }} \
            --shard-count "$SHARD_COUNT" \
            --timeout-seconds 15 \
            --workers 4 \
            --report "$report"
          python -m json.tool "$report" >/dev/null
      - name: Preserve this shard's qualification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}-qualification.json
          if-no-files-found: warn
          retention-days: 14
      - name: Refuse qualification source mutation (this shard's own checkout)
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$changed" ]]; then
            echo "::error title=REFUSED:QUALIFICATION_MUTATED_SUBJECT::$changed"
            exit 2
          fi

  tests:
    name: Full pytest suite (advisory until first green on main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r ci/requirements.txt
      - name: Admit marketplace operational law through star-toml
        id: admit
        uses: ./.github/actions/admit-config
      - name: Install ggen from admitted marketplace config
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ggen_bin="$(bash scripts/install-ggen.sh "${{ steps.admit.outputs.admitted-config }}")"
          mkdir -p "${RUNNER_TEMP}/bin"
          ln -sf "$ggen_bin" "${RUNNER_TEMP}/bin/ggen"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      # tests/test_new_pack.py scaffolds throwaway packs inside the real packs/
      # tree, which whole-corpus tests scan: it must not overlap any other test.
      - name: Run the suite (sharded across CPUs)
        run: python -m pytest tests/ scripts/ -q -p no:cacheprovider -n auto --dist worksteal --ignore=tests/test_new_pack.py
      - name: Run repo-mutating tests alone
        run: python -m pytest tests/test_new_pack.py -q -p no:cacheprovider

  ci-status:
    name: CI status (aggregate)
    needs: [plan, verify, qualify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Assert plan, verify and every required qualify shard succeeded
        shell: bash
        run: |
          set -euo pipefail
          plan="${{ needs.plan.result }}"; verify="${{ needs.verify.result }}"; qualify="${{ needs.qualify.result }}"
          [[ "$plan" == "success" ]] || { echo "::error title=REFUSED:PLAN_FAILED::$plan"; exit 2; }
          [[ "$verify" == "success" ]] || { echo "::error title=REFUSED:ADMISSION_FAILED::$verify"; exit 2; }
          if [[ "${{ needs.plan.outputs.qualify }}" == "true" ]]; then
            [[ "$qualify" == "success" ]] || { echo "::error title=REFUSED:QUALIFICATION_SHARD_FAILED::$qualify"; exit 2; }
          elif [[ "$qualify" != "skipped" ]]; then
            echo "::error title=REFUSED:QUALIFY_LANE_INCONSISTENT::$qualify"; exit 2
          fi
          echo "ci-status: plan=$plan verify=$verify qualify=$qualify"
      - name: Download every shard's qualification receipt
        if: needs.plan.outputs.qualify == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qualification-shard-*
          path: shards
          merge-multiple: true
      - name: Cross-check shard partition covers every admitted pack exactly once
        if: needs.plan.outputs.qualify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          names: list[str] = []
          total_reported = 0
          for path in sorted(Path("shards").glob("*.json")):
              payload = json.loads(path.read_text())
              total_reported += payload["pack_count"]
              names.extend(pack["name"] for pack in payload["packs"])
          duplicates = {name for name in names if names.count(name) > 1}
          if duplicates:
              raise SystemExit(f"REFUSED:GGEN_PACK_SHARD_OVERLAP:{sorted(duplicates)}")
          print(f"ci-status: {len(names)} unique packs qualified across all shards (sum={total_reported})")
          PY
