name: CI

# Two-tier gate: fast admission followed by exact-head pack qualification.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: never
  SHARD_COUNT: "4"

jobs:
  guard-timeout-coverage:
    name: Guard timeout-minutes coverage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail if executable workflow jobs are missing timeout-minutes
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for workflow in .github/workflows/*.yml; do
            if grep -q 'timeout-minutes:' "$workflow"; then continue; fi
            if grep -Eq '^[[:space:]]{4}uses:' "$workflow" && ! grep -Eq '^[[:space:]]{4}runs-on:' "$workflow"; then continue; fi
            missing+="${workflow}"$'\n'
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Workflow file(s) with executable local jobs missing timeout-minutes:"
            printf '%s' "$missing"
            exit 1
          fi
          echo "All executable local workflow jobs are bounded; reusable callers delegate their bound."

  admission:
    name: Fast admission (config, validate, catalog/archive determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exact_head: ${{ steps.identity.outputs.exact_head }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact subject identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$expected"
            exit 2
          fi
          echo "exact_head=$actual" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up pinned star-toml toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "nightly-2026-06-22"
          components: rustfmt
      - name: Admit marketplace operational law through star-toml
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/admit-config.sh marketplace.toml "${RUNNER_TEMP}/admitted-config.json"
          python -m json.tool "${RUNNER_TEMP}/admitted-config.json" >/dev/null
          python - "${RUNNER_TEMP}/admitted-config.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          assert payload["q_config"] == 1
          assert payload["standing"] == "ADMITTED"
          assert payload["star_toml_sha"] == "8395515cf8e68bfdc9edff49fb358c4f1da7c795"
          assert len(payload["witness_blake3"]) == 64
          PY
      - name: Validate marketplace and Diátaxis
        run: python scripts/marketplace.py validate
      - name: Lint cross-pack instance references
        run: |
          python scripts/check_cross_pack_references.py --mode gate \
            --report "${RUNNER_TEMP}/cross-pack-references.json"
      - name: Preserve cross-pack reference report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-pack-reference-report
          path: ${{ runner.temp }}/cross-pack-references.json
          retention-days: 14
      - name: Prove deterministic catalog projection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marketplace.py catalog > /tmp/catalog-a.json
          python scripts/marketplace.py catalog > /tmp/catalog-b.json
          cmp /tmp/catalog-a.json /tmp/catalog-b.json
          python -m json.tool /tmp/catalog-a.json >/dev/null
      - name: Prove deterministic archive build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marketplace.py archive >/tmp/archive-manifest-a.txt
          mv dist/packs /tmp/packs-a
          python scripts/marketplace.py archive >/tmp/archive-manifest-b.txt
          diff -rq /tmp/packs-a dist/packs
          cmp /tmp/archive-manifest-a.txt /tmp/archive-manifest-b.txt
          rm -rf dist /tmp/packs-a
      - name: Fingerprint admitted corpus
        run: python scripts/marketplace.py fingerprint
      - name: Upload admitted config (qualify shards' input)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: admitted-config
          path: ${{ runner.temp }}/admitted-config.json
          retention-days: 1
      - name: Refuse migration actuator
        run: test ! -e .github/workflows/one-shot-import.yml

  qualify:
    name: Qualify shard ${{ matrix.shard }}/4
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admission.outputs.exact_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download admitted config
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: admitted-config
          path: ${{ runner.temp }}
      - name: Install ggen from admitted marketplace config (prebuilt binary, no Rust compile)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ggen_bin="$(bash scripts/install-ggen.sh "${RUNNER_TEMP}/admitted-config.json")"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
          "$ggen_bin" --version
      - name: Qualify this shard's packs through the real ggen runtime
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/shard-${{ matrix.shard }}-qualification.json"
          # Preserve the R18 contract's 15s per-pack ceiling. Reduce concurrent
          # pressure instead of weakening the temporal admission law when hosted
          # runners are load-sensitive; the enclosing 8-minute job remains bounded.
          python3 scripts/qualify_packs_r18.py \
            --ggen "$GGEN_BIN" \
            --shard-index ${{ matrix.shard }} \
            --shard-count "$SHARD_COUNT" \
            --timeout-seconds 15 \
            --workers 4 \
            --report "$report"
          python -m json.tool "$report" >/dev/null
      - name: Preserve this shard's qualification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}-qualification.json
          if-no-files-found: warn
          retention-days: 14
      - name: Refuse qualification source mutation (this shard's own checkout)
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$changed" ]]; then
            echo "::error title=REFUSED:QUALIFICATION_MUTATED_SUBJECT::$changed"
            exit 2
          fi

  ci-status:
    name: CI status (aggregate)
    needs: [admission, qualify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Assert admission and every qualify shard succeeded
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.admission.result }}" != "success" ]]; then
            echo "::error title=REFUSED:ADMISSION_FAILED::${{ needs.admission.result }}"
            exit 2
          fi
          if [[ "${{ needs.qualify.result }}" != "success" ]]; then
            echo "::error title=REFUSED:QUALIFICATION_SHARD_FAILED::${{ needs.qualify.result }}"
            exit 2
          fi
          echo "ci-status: admission=success qualify=success"
      - name: Download every shard's qualification receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qualification-shard-*
          path: shards
          merge-multiple: true
      - name: Cross-check shard partition covers every admitted pack exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          names: list[str] = []
          total_reported = 0
          for path in sorted(Path("shards").glob("*.json")):
              payload = json.loads(path.read_text())
              total_reported += payload["pack_count"]
              names.extend(pack["name"] for pack in payload["packs"])
          duplicates = {name for name in names if names.count(name) > 1}
          if duplicates:
              raise SystemExit(f"REFUSED:GGEN_PACK_SHARD_OVERLAP:{sorted(duplicates)}")
          print(f"ci-status: {len(names)} unique packs qualified across all shards (sum={total_reported})")
          PY
