name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace:
    name: Exact-head marketplace qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$expected"
            exit 2
          fi
          echo "exact_head=$actual"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Rust for star-toml admission
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.1"

      - name: Admit marketplace operational law through star-toml
        shell: bash
        run: |
          set -euo pipefail
          admitted="$(bash scripts/admit-config.sh marketplace.toml "${RUNNER_TEMP}/ggen-marketplace-admitted.json")"
          echo "GGEN_MARKETPLACE_ADMITTED_CONFIG=$admitted" >> "$GITHUB_ENV"
          python -m json.tool "$admitted" >/dev/null
          python - "$admitted" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          assert payload["q_config"] == 1
          assert payload["standing"] == "ADMITTED"
          assert payload["star_toml_sha"] == "8395515cf8e68bfdc9edff49fb358c4f1da7c795"
          assert len(payload["witness_blake3"]) == 64
          PY

      - name: Validate marketplace and Diátaxis
        run: python scripts/marketplace.py validate

      - name: Prove deterministic catalog projection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marketplace.py catalog > /tmp/catalog-a.json
          python scripts/marketplace.py catalog > /tmp/catalog-b.json
          cmp /tmp/catalog-a.json /tmp/catalog-b.json
          python -m json.tool /tmp/catalog-a.json >/dev/null

      - name: Fingerprint admitted corpus
        run: python scripts/marketplace.py fingerprint

      - name: Install ggen from admitted marketplace config
        shell: bash
        run: |
          set -euo pipefail
          ggen_bin="$(bash scripts/install-ggen.sh "$GGEN_MARKETPLACE_ADMITTED_CONFIG")"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
          "$ggen_bin" --version

      - name: Qualify every admitted pack through admitted config
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/qualify-marketplace.sh \
            "$GGEN_MARKETPLACE_ADMITTED_CONFIG" \
            "${RUNNER_TEMP}/ggen-marketplace-qualification.json"
          python -m json.tool "${RUNNER_TEMP}/ggen-marketplace-qualification.json" >/dev/null

      - name: Preserve config and qualification receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ggen-marketplace-receipts-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ggen-marketplace-admitted.json
            ${{ runner.temp }}/ggen-marketplace-qualification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Refuse qualification source mutation
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$changed" ]]; then
            echo "::error title=REFUSED:QUALIFICATION_MUTATED_SUBJECT::$changed"
            exit 2
          fi

      - name: Refuse migration actuator
        run: test ! -e .github/workflows/one-shot-import.yml
