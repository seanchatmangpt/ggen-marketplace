name: CI

# 80/20 gate: the few jobs that catch most breakage, sharing one cached setup.
#   changes    -> decides which expensive jobs a diff can affect
#   admission  -> admit config, validate corpus + Diátaxis, hygiene, determinism (always)
#   qualify    -> real ggen runtime over 4 shards (only when packs/runtime inputs change)
#   courts     -> ci/courts.toml pack courts whose paths the diff touches (was ~100 workflows)
#   tests      -> full pytest suite (advisory until first green on main)
#   ci-status  -> the single required check
# Pushes to main run everything; that also writes the caches pull requests restore.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: never
  SHARD_COUNT: "4"
  SUBJECT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      qualify: ${{ steps.scope.outputs.qualify }}
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide which expensive jobs the diff can affect
        id: scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE" ]]; then
            echo "qualify=true" >> "$GITHUB_OUTPUT"; echo "tests=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BASE...HEAD")"
          # Anything that changes what the real runtime or the corpus means.
          if grep -Eq '^(packs/|marketplace\.toml$|tools/|scripts/(qualify|install-ggen|marketplace|admit-config|verify_source|pack_)|\.github/(workflows/ci\.yml|actions/))' <<<"$files"; then q=true; else q=false; fi
          if grep -Eq '^(packs/|tests/|scripts/|ci/|marketplace\.toml$|tools/|\.github/(workflows/ci\.yml|actions/))' <<<"$files"; then t=true; else t=false; fi
          echo "qualify=$q" >> "$GITHUB_OUTPUT"
          echo "tests=$t" >> "$GITHUB_OUTPUT"
          echo "qualify=$q tests=$t"

  admission:
    name: Fast admission
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up cached marketplace toolchain and admit config
        id: setup
        uses: ./.github/actions/setup-marketplace
        with:
          ref: ${{ env.SUBJECT }}
      - name: Assert admitted configuration
        shell: bash
        run: |
          python - "$ADMITTED_CONFIG" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          assert payload["q_config"] == 1
          assert payload["standing"] == "ADMITTED"
          assert payload["star_toml_sha"] == "8395515cf8e68bfdc9edff49fb358c4f1da7c795"
          assert len(payload["witness_blake3"]) == 64
          qualification = payload["config"]["qualification"]
          assert isinstance(qualification["workers"], int) and qualification["workers"] > 0
          assert isinstance(qualification["timeout_seconds"], int) and qualification["timeout_seconds"] > 0
          PY
      - name: Validate marketplace and Diátaxis
        run: python scripts/marketplace.py validate
      - name: Supply-chain, standing and workflow hygiene (stdlib, no network)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pin_actions.py --check
          python scripts/pack_capabilities.py --check
          python scripts/standing.py --check
          python scripts/ci_courts.py --check
          python scripts/check_qualification_headroom.py
          # Every workflow job that executes locally must be bounded.
          missing=""
          for workflow in .github/workflows/*.yml; do
            grep -q 'timeout-minutes:' "$workflow" && continue
            grep -Eq '^[[:space:]]{4}uses:' "$workflow" && ! grep -Eq '^[[:space:]]{4}runs-on:' "$workflow" && continue
            missing+="${workflow}"$'\n'
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Workflow file(s) with executable local jobs missing timeout-minutes:"; printf '%s' "$missing"; exit 1
          fi
          test ! -e .github/workflows/one-shot-import.yml
      - name: Semantic gate/witness and cross-pack court (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_gate_witness_courts
          python scripts/check_gate_witness_courts.py --report "${RUNNER_TEMP}/gate-witness-courts.json"
          python scripts/check_cross_pack_references.py --mode gate --report "${RUNNER_TEMP}/cross-pack-references.json"
          python -m json.tool "${RUNNER_TEMP}/gate-witness-courts.json" >/dev/null
          python -m json.tool "${RUNNER_TEMP}/cross-pack-references.json" >/dev/null
      - name: Prove scope, catalog and archive determinism
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marketplace_scope.py > "${RUNNER_TEMP}/scope.json"
          python scripts/consolidation_census.py --report "${RUNNER_TEMP}/legacy-census.json"
          python scripts/marketplace.py catalog > "${RUNNER_TEMP}/catalog-a.json"
          python scripts/marketplace.py catalog > "${RUNNER_TEMP}/catalog-b.json"
          cmp "${RUNNER_TEMP}/catalog-a.json" "${RUNNER_TEMP}/catalog-b.json"
          python scripts/marketplace.py catalog --scope all > "${RUNNER_TEMP}/catalog-all.json"
          python - "${RUNNER_TEMP}" <<'PY'
          import json, sys
          from pathlib import Path
          tmp = Path(sys.argv[1])
          scope = json.loads((tmp / "scope.json").read_text())
          census = json.loads((tmp / "legacy-census.json").read_text())
          active = json.loads((tmp / "catalog-a.json").read_text())
          complete = json.loads((tmp / "catalog-all.json").read_text())
          assert scope["total_count"] == scope["active_count"] + scope["legacy_count"], scope
          assert census["active_count"] == scope["active_count"], (census, scope)
          assert census["legacy_count"] == scope["legacy_count"], (census, scope)
          assert active["scope"] == "active" and complete["scope"] == "all"
          names = lambda c: {p["name"] for p in c["packs"]}
          assert len(names(active)) == scope["active_count"] and names(active) < names(complete)
          PY
          python scripts/marketplace.py archive >"${RUNNER_TEMP}/archive-a.txt"
          mv dist/packs "${RUNNER_TEMP}/packs-a"
          python scripts/marketplace.py archive >"${RUNNER_TEMP}/archive-b.txt"
          diff -rq "${RUNNER_TEMP}/packs-a" dist/packs
          cmp "${RUNNER_TEMP}/archive-a.txt" "${RUNNER_TEMP}/archive-b.txt"
          rm -rf dist
      - name: Fingerprint admitted corpus
        run: python scripts/marketplace.py fingerprint

  qualify:
    name: Qualify shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.qualify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up cached marketplace toolchain, admit config, install ggen
        uses: ./.github/actions/setup-marketplace
        with:
          ref: ${{ env.SUBJECT }}
          ggen: "true"
      - name: Qualify this shard's packs through the real ggen runtime
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/shard-${{ matrix.shard }}-qualification.json"
          # Preserve the R18 contract's 15s per-pack ceiling; reduce concurrency rather
          # than weaken the temporal admission law on load-sensitive hosted runners.
          python3 scripts/qualify_packs_r18.py \
            --ggen "$GGEN_BIN" \
            --shard-index ${{ matrix.shard }} \
            --shard-count "$SHARD_COUNT" \
            --timeout-seconds 15 \
            --workers 4 \
            --report "$report"
          python -m json.tool "$report" >/dev/null
      - name: Preserve this shard's qualification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}-qualification.json
          if-no-files-found: warn
          retention-days: 14
      - name: Refuse qualification source mutation (this shard's own checkout)
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$changed" ]]; then
            echo "::error title=REFUSED:QUALIFICATION_MUTATED_SUBJECT::$changed"
            exit 2
          fi

  courts:
    name: Pack courts (changed paths)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up cached marketplace toolchain
        uses: ./.github/actions/setup-marketplace
        with:
          ref: ${{ env.SUBJECT }}
          requirements: ci/requirements-courts.txt
          # `main_only` courts manufacture with the real ggen; pull requests skip them.
          ggen: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
      - name: Run the courts this diff touches (all courts on push/dispatch)
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE" ]]; then scope=(--base "$BASE"); else scope=(--all); fi
          python scripts/ci_courts.py "${scope[@]}" --report "${RUNNER_TEMP}/courts-report.json"
      - name: Preserve court report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: courts-report
          path: ${{ runner.temp }}/courts-report.json
          if-no-files-found: ignore
          retention-days: 14

  tests:
    name: Full pytest suite (advisory until first green on main)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up cached marketplace toolchain, admit config, install ggen
        uses: ./.github/actions/setup-marketplace
        with:
          ref: ${{ env.SUBJECT }}
          ggen: "true"
          requirements: ci/requirements-tests.txt
      - name: Run the full suite
        run: python -m pytest tests/ scripts/ -q -p no:cacheprovider

  ci-status:
    name: CI status (aggregate)
    needs: [changes, admission, qualify, courts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Assert every required job succeeded (skipped by scope is fine)
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          results = {k: v["result"] for k, v in json.loads(os.environ["RESULTS"]).items()}
          print(results)
          bad = {k: r for k, r in results.items() if r not in ("success", "skipped")}
          if results["admission"] != "success" or results["courts"] != "success" or bad:
              raise SystemExit(f"REFUSED:CI_JOB_NOT_GREEN:{bad or results}")
          PY
      - name: Download every shard's qualification receipt
        if: needs.qualify.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qualification-shard-*
          path: shards
          merge-multiple: true
      - name: Cross-check shard partition covers every admitted pack exactly once
        if: needs.qualify.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          names: list[str] = []
          total_reported = 0
          for path in sorted(Path("shards").glob("*.json")):
              payload = json.loads(path.read_text())
              total_reported += payload["pack_count"]
              names.extend(pack["name"] for pack in payload["packs"])
          duplicates = {name for name in names if names.count(name) > 1}
          if duplicates:
              raise SystemExit(f"REFUSED:GGEN_PACK_SHARD_OVERLAP:{sorted(duplicates)}")
          print(f"ci-status: {len(names)} unique packs qualified across all shards (sum={total_reported})")
          PY
