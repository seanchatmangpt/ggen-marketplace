name: MEASURE R76 Portfolio Structural Census
on:
  pull_request:
    paths:
      - 'packs/portfolio-epistemic-observability-pack/**'
      - '.github/workflows/measure-r76-portfolio-structural-census.yml'
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded RDF verifier
        run: python -m pip install 'rdflib>=7,<8' pytest
      - name: Validate marketplace corpus
        run: python scripts/marketplace.py validate
      - name: Execute R76 court
        run: pytest -q packs/portfolio-epistemic-observability-pack/tests/test_r76_structural_census.py
      - name: Refuse ambient consequential actuation
        run: |
          if grep -R -nE 'actuationPerformed[[:space:]]+true|consequential_do[[:space:]]*[:=][[:space:]]*true' packs/portfolio-epistemic-observability-pack/ontology.r76-structural-census.ttl packs/portfolio-epistemic-observability-pack/fixtures/r76-structural-census.ttl; then exit 1; fi
