name: DEVELOP Selection Frontier Exact Head
on:
  pull_request:
    branches:
      - explore/dfcm-comparison-courts-20260824
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Marketplace admission
        run: python3 scripts/marketplace.py validate
      - name: Compile pack runtime and tests
        run: python3 -m compileall -q packs/dfcm-selection-frontier-execution-pack
      - name: Permanent courts
        run: python3 -m unittest discover -s packs/dfcm-selection-frontier-execution-pack/tests -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: '! grep -RInE "requests\.(post|put|patch|delete)|subprocess\.|os\.system|socket\." packs/dfcm-selection-frontier-execution-pack'
