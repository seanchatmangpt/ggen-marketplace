name: MEASURE DfCM Experiment Inference

on:
  pull_request:
    paths:
      - 'packs/dfcm-maximalist-court-pack/queries/inference-*.rq'
      - '.github/workflows/measure-dfcm-experiment-inference.yml'

permissions:
  contents: read

jobs:
  inference-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Require complete inference court
        run: |
          test "$(find packs/dfcm-maximalist-court-pack/queries -maxdepth 1 -name 'inference-*.rq' | wc -l)" -ge 30
          grep -RIl 'ExperimentRealization' packs/dfcm-maximalist-court-pack/queries/inference-*.rq >/dev/null
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'curl |wget |gh |requests\.(post|put|patch|delete)|subprocess\.|os\.system' packs/dfcm-maximalist-court-pack/queries/inference-*.rq
