name: MEASURE Sensor Yield Calibration R29

on:
  pull_request:
    paths:
      - 'packs/ggen-project-boundary-pack/sensor-yield-calibration-r29.ttl'
      - 'packs/ggen-project-boundary-pack/fixtures/r29-sensor-yield-calibration.ttl'
      - 'packs/ggen-project-boundary-pack/queries/r29-sensor-yield/**'
      - 'packs/ggen-project-boundary-pack/gates/r29-sensor-yield-authority.rq'
      - 'packs/ggen-project-boundary-pack/innovation-capital-r29-ledger.jsonl'
      - 'packs/ggen-project-boundary-pack/receipts/r29-sensor-yield-calibration-receipt.json'
      - 'packs/ggen-project-boundary-pack/tests/test_r29_sensor_yield_calibration.py'
      - 'packs/ggen-project-boundary-pack/docs/r29-sensor-yield/**'
      - '.github/workflows/measure-sensor-yield-r29.yml'

permissions:
  contents: read

jobs:
  qualify-r29:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR subject
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Compile permanent R29 court
        run: python3 -m py_compile packs/ggen-project-boundary-pack/tests/test_r29_sensor_yield_calibration.py
      - name: Execute permanent R29 court
        run: python3 packs/ggen-project-boundary-pack/tests/test_r29_sensor_yield_calibration.py -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|urllib\.request\.(Request|urlopen)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' packs/ggen-project-boundary-pack/tests/test_r29_sensor_yield_calibration.py
