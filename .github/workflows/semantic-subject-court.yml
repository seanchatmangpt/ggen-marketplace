name: Semantic subject court

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - epoch/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-subject-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PACK: packs/semantic-manufacture-epoch-pack

jobs:
  semantic-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'admitted=%s\nobserved=%s\n' "$SUBJECT_SHA" "$actual"
          if [[ "$actual" != "$SUBJECT_SHA" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$SUBJECT_SHA"
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate marketplace schema and pack topology
        run: python scripts/marketplace.py validate

      - name: Verify semantic gate/witness correspondence fail-closed
        run: |
          mkdir -p receipt
          python scripts/check_gate_witness_courts.py --report receipt/gate-courts.json
          python -m json.tool receipt/gate-courts.json >/dev/null

      - name: Verify cross-pack references
        run: |
          python scripts/check_cross_pack_references.py --mode gate --report receipt/cross-pack.json
          python -m json.tool receipt/cross-pack.json >/dev/null

      - name: Bind graph, projection contract, gates, and witnesses to exact subject
        shell: bash
        run: |
          set -euo pipefail
          find "$PACK" -type f -print0 | sort -z | xargs -0 sha256sum > receipt/semantic-manufacture-epoch.sha256
          sha256sum receipt/semantic-manufacture-epoch.sha256 | awk '{print $1}' > receipt/material-set.sha256

      - name: Manufacture bounded semantic-subject receipt
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          material_set="$(cat receipt/material-set.sha256)"
          case_count="$(python - <<'PY'
          import json
          payload = json.load(open('receipt/gate-courts.json'))
          matches = [c for c in payload['courts'] if c['pack'] == 'semantic-manufacture-epoch-pack']
          if len(matches) != 1:
              raise SystemExit('REFUSED:SEMANTIC_MANUFACTURE_COURT_CARDINALITY')
          print(matches[0]['case_count'])
          PY
          )"
          cat > receipt/subject.json <<JSON
          {
            "subject_sha": "$actual",
            "pack": "semantic-manufacture-epoch-pack",
            "material_set_sha256": "$material_set",
            "gate_case_count": $case_count,
            "authority": "semantic_admission_only",
            "publication": "not_attempted",
            "merge": "not_attempted",
            "runtime_execution": "not_claimed",
            "standing": "candidate_evidence_only"
          }
          JSON
          python -m json.tool receipt/subject.json

      - name: Refuse court mutation of the admitted subject
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all -- . ':!receipt')"
          if [[ -n "$changed" ]]; then
            echo "::error title=REFUSED:COURT_MUTATED_SUBJECT::$changed"
            exit 2
          fi

      - name: Preserve semantic subject receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-subject-${{ env.SUBJECT_SHA }}
          path: receipt
          if-no-files-found: error
          retention-days: 14
