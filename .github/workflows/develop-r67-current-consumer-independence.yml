name: DEVELOP R67 Current Consumer Independence

on:
  pull_request:
    paths:
      - "packs/epistemic-sensor-factory-pack/**"
      - "receipts/develop/2026-08-25-r67-current-independence-capital.json"
      - ".github/workflows/develop-r67-current-consumer-independence.yml"

permissions:
  contents: read

concurrency:
  group: develop-r67-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Install bounded SPARQL verifier
        run: python3 -m pip install 'rdflib>=7,<8'
      - name: Execute fifty current independence courts
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r67_consumer_independence.py
      - name: Verify construction receipt authority
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('receipts/develop/2026-08-25-r67-current-independence-capital.json'))
          assert r['construction_base'] == '5eac35d1a597080cab8388f4a72cb5278b3e4c92'
          assert r['semantic_query_commits'] == 50
          assert r['consequential_do'] is False
          assert r['generated_output_edited'] is False
          assert r['thousand_x']['standing'] == 'NOT_ADMITTED'
          assert r['authority'] == 'OBSERVE|VERIFY|SELECT|CONSTRUCT'
          print('R67_RECEIPT=PASS')
          PY
      - name: Refuse ambient consequential DO
        run: |
          ! grep -R -E 'odrl:permission[^\n]*odrl:execute|actuationPerformed[[:space:]]+true' packs/epistemic-sensor-factory-pack/ontology/r67-consumer-independence.ttl packs/epistemic-sensor-factory-pack/fixtures/r67-consumer-independence-current.ttl
