name: DEVELOP Selection Falsifier Closure Exact Head
on:
  pull_request:
    paths:
      - 'packs/dfcm-selection-falsifier-closure-pack/**'
      - 'receipts/select/2026-08-24-selection-falsifier-closure.json'
      - '.github/workflows/develop-selection-falsifier-closure.yml'
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Marketplace admission
        run: python3 scripts/marketplace.py validate
      - name: Compile reusable control
        run: python3 -m py_compile packs/dfcm-selection-falsifier-closure-pack/scripts/*.py packs/dfcm-selection-falsifier-closure-pack/tests/*.py
      - name: Permanent control court
        env:
          PYTHONPATH: packs/dfcm-selection-falsifier-closure-pack
        run: python3 -m unittest discover -s packs/dfcm-selection-falsifier-closure-pack/tests -p 'test_*.py' -v
      - name: Refuse ambient consequential DO
        run: '! grep -R -E "(subprocess\.|os\.system|requests\.(post|put|patch|delete))" packs/dfcm-selection-falsifier-closure-pack/scripts packs/dfcm-selection-falsifier-closure-pack/tests'
