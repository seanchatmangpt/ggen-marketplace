name: IMPLEMENT R62 Dependency Relief Replication

on:
  pull_request:
    paths:
      - "packs/epistemic-sensor-factory-pack/queries/12*_r62_*.rq"
      - "packs/epistemic-sensor-factory-pack/tests/run_r62_dependency_relief_replication.py"
      - "receipts/implement/2026-08-25-r62-dependency-relief-replication.json"
      - ".github/workflows/implement-r62-dependency-relief.yml"

permissions:
  contents: read

jobs:
  r62:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR subject
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Run R62 permanent court
        run: python3 packs/epistemic-sensor-factory-pack/tests/run_r62_dependency_relief_replication.py
      - name: Refuse ambient consequential actuation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'consequentialDo[[:space:]]+"?(true|ALLOWED)|authority[[:space:]]+"[^"]*DO' \
            packs/epistemic-sensor-factory-pack/ontology*.ttl \
            receipts/implement/2026-08-25-r62-dependency-relief-replication.json
