name: Registry projection synchronizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.ref == 'agent/seed-ggen-marketplace'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout exact purpose-branch subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact subject and branch
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$expected"
            exit 2
          }
          test "${{ github.event.pull_request.head.ref }}" = "agent/seed-ggen-marketplace" || {
            echo "::error title=REFUSED:WRONG_PURPOSE_BRANCH::${{ github.event.pull_request.head.ref }}"
            exit 2
          }

      - name: Manufacture exact registry projection
        shell: bash
        run: |
          set -euo pipefail
          cd packs/autofde-semantic-registry-pack
          python3 gates/build_aggregate.py
          unexpected="$(git status --short -- . ':!ontology.ttl')"
          test -z "$unexpected" || {
            echo "::error title=REFUSED:REGISTRY_PROJECTION_SIDE_EFFECT::$unexpected"
            exit 2
          }
          if git diff --quiet -- ontology.ttl; then
            echo "registry_projection=already_synchronized"
            exit 0
          fi
          sha256sum ontology.ttl
          git diff --check -- ontology.ttl

      - name: Commit only the manufactured aggregate when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packs/autofde-semantic-registry-pack/ontology.ttl; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packs/autofde-semantic-registry-pack/ontology.ttl
          test "$(git diff --cached --name-only)" = "packs/autofde-semantic-registry-pack/ontology.ttl" || {
            echo "::error title=REFUSED:REGISTRY_PROJECTION_STAGE_SCOPE::$(git diff --cached --name-only | tr '\n' ' ')"
            exit 2
          }
          git commit -m "chore(registry): synchronize generated aggregate"
          git push origin HEAD:agent/seed-ggen-marketplace
