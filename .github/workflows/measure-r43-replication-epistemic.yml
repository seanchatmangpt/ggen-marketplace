    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Admit exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Qualify immutable sensor contract
        run: python3 packs/replication-epistemic-observability-pack/tests/test_contract.py
      - name: Install bounded SPARQL court runtime
        run: python3 -m pip install --disable-pip-version-check 'rdflib==7.1.4'
      - name: Execute all fifty sensors on grounded fixture
        run: python3 packs/replication-epistemic-observability-pack/scripts/execute_reference.py
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -R 'actuation_performed":true\|actuationPerformed true' packs/replication-epistemic-observability-pack
