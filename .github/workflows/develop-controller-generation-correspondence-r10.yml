name: DEVELOP Controller Generation Correspondence R10 Exact Head
on:
  pull_request:
    paths:
      - 'packs/dfcm-maximalist-court-pack/controller-generation-correspondence.ttl'
      - 'packs/dfcm-maximalist-court-pack/queries/develop-r10-corr-*.rq'
      - 'receipts/select/2026-08-24-controller-generation-correspondence-r10.json'
      - '.github/workflows/develop-controller-generation-correspondence-r10.yml'
permissions:
  contents: read
jobs:
  qualify:
    if: github.head_ref == 'develop/controller-generation-correspondence-r10-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Verify correspondence courts
        run: |
          count=$(find packs/dfcm-maximalist-court-pack/queries -maxdepth 1 -name 'develop-r10-corr-*.rq' | wc -l)
          test "$count" -eq 11
          grep -q 'ControllerGenerationCorrespondence' packs/dfcm-maximalist-court-pack/controller-generation-correspondence.ttl
      - name: Verify SELECT boundary
        run: python3 -c "import json; d=json.load(open('receipts/select/2026-08-24-controller-generation-correspondence-r10.json')); assert d['marketplace_first'] is True and d['actuation_performed'] is False and d['authority']=='SELECT'"
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|boto3|azure\.|google\.cloud|curl .*-(X|d)' packs/dfcm-maximalist-court-pack/controller-generation-correspondence.ttl packs/dfcm-maximalist-court-pack/queries/develop-r10-corr-*.rq receipts/select/2026-08-24-controller-generation-correspondence-r10.json
