name: MEASURE Evidence Capital Policy Realization

on:
  pull_request:
    paths:
      - packs/evidence-capital-policy-realization-pack/**
      - .github/workflows/measure-evidence-capital-policy-realization.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Admit exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate marketplace corpus
        run: python3 scripts/marketplace.py validate
      - name: Compile policy-realization pack
        run: python3 -m py_compile packs/evidence-capital-policy-realization-pack/scripts/*.py packs/evidence-capital-policy-realization-pack/tests/*.py
      - name: Run permanent policy-realization courts
        env:
          PYTHONPATH: packs/evidence-capital-policy-realization-pack
        run: python3 -m unittest discover -s packs/evidence-capital-policy-realization-pack/tests -p 'test_*.py' -v
      - name: Refuse ambient consequential actuation
        run: |
          ! grep -REn 'requests\.(post|put|patch|delete)|subprocess\.|os\.system|boto3|azure\.|google\.cloud' packs/evidence-capital-policy-realization-pack/scripts packs/evidence-capital-policy-realization-pack/tests
