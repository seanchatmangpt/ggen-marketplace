name: One-shot exact-SHA pack import

on:
  push:
    branches:
      - agent/seed-ggen-marketplace
    paths:
      - .github/workflows/one-shot-import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout marketplace purpose branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/seed-ggen-marketplace
          fetch-depth: 0

      - name: Checkout exact ggen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: seanchatmangpt/ggen
          ref: c37b46015b8e5ab40be771d61aafe3d7c7af084c
          path: .migration-source/ggen
          persist-credentials: false

      - name: Assert source identity and import packs byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          expected=c37b46015b8e5ab40be771d61aafe3d7c7af084c
          actual="$(git -C .migration-source/ggen rev-parse HEAD)"
          test "$actual" = "$expected"
          test -d .migration-source/ggen/packs
          rm -rf packs
          cp -a .migration-source/ggen/packs ./packs
          rm -rf .migration-source
          printf '%s\n' "$expected" > .ggen-packs-source-sha
          test "$(find packs -mindepth 1 -maxdepth 1 -type d | wc -l)" -gt 0
          git status --short

      - name: Commit exact-source migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packs .ggen-packs-source-sha
          git diff --cached --quiet && exit 0
          git commit -m 'feat: import ggen packs at c37b4601'
          git push origin HEAD:agent/seed-ggen-marketplace
