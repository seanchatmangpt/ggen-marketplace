version: 2
updates:
  # Every action in this repo's workflows is pinned to a full commit SHA
  # (see AGENTS.md's working discipline and the workflows themselves) --
  # Dependabot opens a PR to bump the pin (and its version comment) when a
  # new release lands, rather than this repo drifting to a stale, unpatched
  # commit with no automated signal.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
