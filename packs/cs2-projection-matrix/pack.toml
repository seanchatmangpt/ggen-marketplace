[pack]
name = "cs2-projection-matrix"
version = "0.1.0"
description = "Subject-independent N-subject × N-consumer RDF projection manufacturing pack"
profile = "projection"

[rdf]
sources = ["ontology.ttl", "fixtures/fleet.ttl"]

[[queries]]
name = "projection-matrix"
path = "queries/projection-matrix.rq"

[[templates]]
name = "consumer-manifest"
path = "templates/consumer-manifest.toml.tera"
output = "generated/{{ consumer_slug }}/projection.toml"

[[templates]]
name = "binding-turtle"
path = "templates/binding.ttl.tera"
output = "generated/{{ consumer_slug }}/binding.ttl"
