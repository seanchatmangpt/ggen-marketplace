[pack]
name = "filesystem-capability-pack"
version = "0.1.0"
description = """
Qualified capability contract for the filesystem family: nine pinned semantic
capabilities (File.Read, File.Write, File.Copy, File.Move, File.Delete,
File.Exists, Dir.List, Dir.Mkdir, Dir.Remove; dcterms:identifier dotted IDs per
the v26.9.30 pinned resolutions) that a capability-resolution engine resolves
against qualified realizations.

CAPABILITY is not IMPLEMENTATION: each capability is a semantic identity with
inputs, outputs, preconditions, postconditions, typed success/failure outcomes,
evidence requirements, authority requirements and execution properties
(durability, idempotency, reversibility class, isolation, concurrency). A
realization is a provider-specific implementation carrying provider metadata
(hex coordinates only -- reactor_file 0.18.5 and Erlang/OTP :file were cited
from hex/hexdocs listings, never claimed as local code inspection) plus the
qualification conditions under which it counts as the capability.

Failed edges recorded in README: reactor_file v0.18.5 ships no move, no
exists-check and no directory-listing DSL entity (witnessed from its hexdocs
api-reference listing 2026-09-30), so File.Move realizes via OTP :file.rename/2,
File.Exists via :file.read_file_info/1, Dir.List via Reactor.File.Step.Glob with
an added pattern-confinement condition.

Gates are violation-row SELECTs (rows mean refusal): capability-without-
realization, realization-without-qualification-conditions, typed-failure-set-
missing, authority-unbound-on-consequential (ProviderAvailable is not
Authorized), path-safety-precondition-required (family falsifier: no File.*/Dir.*
capability without a path-safety precondition), mutator-execution-properties
(File.Move reversible, File.Delete compensable). Every gate has a witnessed
negative fixture; python3 qualification/verify.py is the anti-vacuity court.

This pack is SELECT-only and grants zero execution authority: a plan is not an
execution, a capability is not a permission, and a generated projection is not
an admission. Consequential actuation remains outside this pack behind BRCE.
"""
