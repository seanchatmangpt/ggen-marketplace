[pack]
name = "platform-eng-ch03"
version = "0.1.0"
description = "Chapter 3 ('Identity, Access, and Policy Guardrails') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch03' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. This directory contains comprehensive examples and tools for implementing security best practices in Kubernetes-based platforms. The chapter covers securing platform access through multiple layers: OAuth/OIDC-based identity and access management with Keycloak, role-based access control (RBAC), policy-as-code enforcement with Open Policy Agent (OPA), network policies for zero-trust networking, and automated TLS certificate management. These examples enable platform teams to balance developer autonomy with protecting platform system components from accidental damage while implementing the principle of least privilege."
