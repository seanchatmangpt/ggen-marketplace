[pack]
name = "ash-extension-pack"
version = "0.3.0"
description = """
Consolidates ash-extension-core-pack and ash-extension-starter-pack into one canonical
pack. This pack supersedes both source packs; the two source packs (and
ash-reactor-domain-error-contract-pack) were deleted from the marketplace in 9e9c23875.

Two real conflicts this consolidation resolves, both surfaced by reading the two source
ontologies and pack.toml files in full rather than by summary:

1. **Competing reactor_pipeline templates targeting the same output path.**
   ash-extension-core-pack's `templates/reactor_pipeline.ex.tmpl` hardcodes ash_r2rml's
   own fixed five-step pipeline body (compile_resources -> verify_alignment/
   evaluate_differential -> attach_provenance -> apply_policy -> render_r2rml_turtle).
   ash-extension-starter-pack's `templates/reactor_pipeline_dynamic.ex.tmpl` generates an
   arbitrary spec-declared step DAG from `aex:ReactorStep` rows and would write the same
   generated module path for any spec that opts into `aex:workflowReactor`. Resolution:
   starter-pack's dynamic, query-gated template is the sole winner going forward -- it is
   a strict generalization (a spec with zero `aex:ReactorStep` rows and `workflowReactor
   = true` is the one case core-pack's fixed template covered that the dynamic template
   does not automatically reproduce, since the dynamic template needs step rows to render
   anything). Core-pack's fixed five-step template is retired and NOT carried into this
   pack at all.
2. **The `aex:workflowReactor` vs `aex:generatesReceiptedAction` boundary.** These are
   independent, composable capabilities, not a hierarchy or mutual exclusion -- a spec may
   set either, both, or neither. `aex:workflowReactor` is a plain opt-in Reactor pipeline
   (steps + optional compensate/undo). `aex:generatesReceiptedAction` layers an
   idempotency-key-gated admission step, a sealed receipt entity, and a deterministic
   replay path around that pipeline. This ontology's comment block near both properties
   states this explicitly (see ontology.ttl), resolving a real boundary that was
   previously underspecified across the two source packs.

Verification (re-measured 2026-09-27, v26.9.27): the receipted-action projection
(templates/receipt.ex.tmpl + templates/receipted_action.ex.tmpl, driven by
verify/fixtures/receipted_spec.ttl) is generated by BOTH generator identities:

- ggen_igniter `mix ggen_igniter.sync --pack-dir` (oxigraph + WASM Tera; `.tmpl` routes to
  Tera since ggen_igniter v26.9.27), then compiled and exercised against an
  upstream-manufactured Ash resource in
  ggen_igniter test/ggen_igniter_ash_receipted_action_test.exs (replay, conflict, in-flight,
  failure, and a conflict-clause mutation court).
- Rust `ggen sync run` 26.9.18 via a consumer ggen.toml `[[generation.rules]]`: it writes both
  files. The ggen 26.8.28 `/workspace` [FM-PACK-001]/[FM-PACK-002] blocker did not reproduce.
  Rust strict_mode requires ORDER BY on every SELECT (E0013); the receipted-action queries
  now carry it.

Generator parity: the two outputs are identical after two normalizations, and each
normalization is a named divergence rather than equivalence:
(a) Rust rule mode emits the template's `---` frontmatter block into the output;
(b) ggen_igniter runs Code.format_string!/1 on generated Elixir.
The other templates in this pack have not been re-measured on either generator.
"""
