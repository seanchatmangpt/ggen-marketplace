[pack]
name = "ash-extension-pack"
version = "0.4.0"
description = """
Canonical Ash-extension manufacturer for ggen-marketplace.

This pack is the single reusable manufacturing surface for Ash/Spark extension semantics.
It consolidates and supersedes ash-extension-core-pack and ash-extension-starter-pack.
Those legacy generic manufacturers are removed from the repository in the Vision 2040
consolidation; reusable Ash-extension discoveries extend this pack's capability families
rather than creating sibling generic Ash packs.

The governing search order is REUSE -> COMPOSE -> EXTEND -> INVENT. A new capability may
be invented only when it is not in the closure of existing capability families, and the
result is added here as a generalizable semantic capability rather than as another
Ash-extension manufacturer.

Spark is the semantic waist. Behaviorally meaningful extension semantics must be represented
in Spark and consumed by the implementation:

  implementation_semantics - spark_semantics = empty
  spark_semantics - consumed_semantics = empty

Explicitly admitted implementation mechanics may remain outside Spark only when they carry
no independent domain/configuration semantics.

The pack manufactures and qualifies composable capability families including Spark DSL
sections/entities/schema, transformers, verifiers, Info/introspection, structured errors,
Igniter installation, Reactor realization, context propagation, lifecycle/activation,
durability/replay, observation/evidence, and knowledge/documentation projections. Frameworks
such as Reactor, AshOban, AshStateMachine, Splode, and Igniter are qualified realizations of
those capabilities, not private semantic authorities.

Domain-specific packs (for example GraphLaw or R2RML projections) may remain separate when
they carry independent semantic authority. Their reusable Ash projection patterns belong
here; their domain ontologies do not.

Vision 2040 planning and the no-pack-proliferation rule are specified in
planning/vision2040.hddl and VISION_2040.md. Qualification includes structural courts,
Spark<->implementation parity, mutation/falsifier courts, regeneration, composition,
Igniter idempotence, Reactor fidelity, and temporal burn-in. A surviving reusable gap is
fed back into this canonical pack and the manufacture cycle is rerun.
"""
