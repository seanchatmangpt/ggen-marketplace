[pack]
name = "ashdspy-pack"
version = "0.1.0"
description = """
The ash_dspy semantic vocabulary + violation gates as RDF: what a
SemanticProgram, a Signature (typed input/output fields), a Metric, a
Requirement, an Implementation on the 8-rung intelligence lattice, a
CompiledRoute and a CourtVerdict are, such that DSPy generalizes: the
IMPLEMENTATION of a Signature is absent from the contract and selected by
court over an intelligence lattice (precedence 1..8, lower = lower
intelligence = preferred when known). The lattice encodes the KNOWN law:
a non-LLM implementation with a passing CourtVerdict for the same Signature
makes an LLM-selected route a refusal (gate 030) -- intelligence is
demoted to residue as soon as a lower rung is witnessed.

PUBLIC vocabulary first: CompiledRoute is a prov:Entity (a derived
artifact), CourtVerdict is an earl:TestResult subclass (it IS a pass/fail
result with typed score dimensions), metadata via dcterms. The custom
ashdspy: namespace exists ONLY for the failed edges recorded in
ontology.ttl: no public vocabulary expresses (a) an intelligence lattice
ordered by preference with a KNOWN-implies-no-LLM allocation law,
(b) a Signature's typed field contract with oneOf output domains, or
(c) a court-verdict-before-selection admission obligation over compiled
routes.

Gates (violation-row SELECT: returning rows = refusal, FM-PACK-013):
010_closed_lattice (an Implementation whose class is outside the 8 lattice
subclasses -- typed with the bare base class or referenced as a route
implementation with no lattice typing -- is a violation row naming it),
020_court_required_before_select (a CompiledRoute with no CourtVerdict is
a violation), 030_known_implies_no_llm (a CompiledRoute selecting an
LLMImplementation while a non-LLM implementation exists for the same
Signature with a passing CourtVerdict is a violation -- the KNOWN =>
Allocation_LLM = 0 law as a refusal), 040_receipt_shape (a CompiledRoute
missing ashdspy:evidenceDigest, or whose CourtVerdict lacks
ashdspy:verdictDigest, is a violation row). Anti-vacuity fixtures ship
under qualification/fixtures/ (neg-* must fire, pos-* must be clean);
every gate is proven 0-rows-clean AND >= 1 firing row under BOTH locked
engines (sparql 0.3.12 and oxigraph).

Authority boundary: Declarative facts + gates only. No runtime, no
actuation authority; compiled routes are candidates until admitted by
external machinery (SA2A/BRCE). NOT claimed: court execution (the gates
describe what a CourtVerdict must look like; running a court is outside
this pack), implementation selection POLICY beyond the precedence law
(the gates refuse an LLM route only when a passing lower-rung
implementation is already witnessed; choosing among passing candidates is
the consumer's admission machinery), lattice extension authority (adding
a 9th rung is a SemVer-major ontology change, never a consumer-side
subclass), or metric computation. Consumers mint their own programs,
signatures, implementations, routes and verdicts; this pack ships zero
consumer individuals except the ticket-triage worked fixture named in
ontology.ttl that witnesses the gates clean.
"""
