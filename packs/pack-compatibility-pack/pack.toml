[pack]
name = "pack-compatibility-pack"
version = "0.1.0"
description = """
Real pack-to-runtime and pack-to-dependency compatibility matrix for the
ggen-marketplace, ported directly from a real, working reference this
session found by surveying the ecosystem: /Users/sac/beam4pm's
BeamPM.Pro.Compatibility module (real semver requirement strings, checked
via Elixir's Version.match?/2, never hand-rolled comparison). This pack is
the ontology-first source of truth; scripts/check_pack_compatibility.py
loads its pc:CompatibilityRequirement individuals and checks real candidate
versions against them using packaging.specifiers.SpecifierSet /
packaging.version.Version (the Python equivalent of Version.match?/2 --
real PEP 440 semver machinery, not a hand-rolled comparator).

Fills a real, previously-named gap: scripts/marketplace.py validates pack
STRUCTURE (files present, TOML well-formed, catalog deterministic) but
never checked "is pack X's declared dependency version actually
compatible with what's installed" -- a marketplace could validate cleanly
while a consumer's real `ggen sync run` fails on an incompatible Reactor
or ggen runtime pin. This pack and its checker close exactly that gap for
the bounds it declares, incrementally (starting with the ggen runtime
version this marketplace itself pins in marketplace.toml, plus the real
reactor/spark version pins already load-bearing in ggen_igniter's own
mix.lock -- not a hypothetical matrix).

Every requirement string here is a real, currently-true fact, verified
against the actual pinned versions in this repo (marketplace.toml's
[ggen].version) and in /Users/sac/ggen_igniter/mix.lock (reactor 1.0.6,
which itself requires spark >= 2.3.3 and < 3.0.0-0) at the time this pack
was written -- not invented bounds. Extending the matrix to a new
component means adding one real, checkable pc:CompatibilityRequirement
individual, verified the same way, not editing a hand-maintained code
table.
"""
