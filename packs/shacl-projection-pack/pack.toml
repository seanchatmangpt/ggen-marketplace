[pack]
name = "shacl-projection-pack"
version = "0.2.0"
description = """
Shared, target-agnostic law for SHACL-shape-driven projection.

The pack reuses standard SHACL directly. A projected field must have sh:path and exactly one
value kind: primitive sh:datatype or nested sh:node. Primitive datatypes remain bounded to
xsd:string, xsd:boolean, xsd:integer|xsd:long, and xsd:decimal|xsd:float|xsd:double. Nested
nodes must be real sh:NodeShape resources and carry an explicit sp:projectionName supplied by
the consumer graph. Repetition is explicit through sp:collection true; JSON nullability is
explicit through sp:nullable true. sp:derivedFromShape binds a target projection to its source
shape and sp:isPrimaryOutput marks fields that actually belong to the projected artifact.

The gate refuses missing/ambiguous value kinds, invalid datatypes, invalid projected
identifiers, duplicate field names, malformed boolean metadata, empty/unsafe string enums,
unresolved nested shapes, and projections with no real output field. Names are admitted
source facts and are echoed, never synthesized.

ggen packs cannot declare pack-to-pack dependencies in pack.toml. Consumers must explicitly
compose this law pack together with a target pack such as shacl-to-pydantic-pack or
shacl-to-zod-pack so the shared gate runs over the merged graph.

Ships zero domain individuals.
"""
