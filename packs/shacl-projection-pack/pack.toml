[pack]
name = "shacl-projection-pack"
version = "0.3.0"
description = """
Shared, target-agnostic law for SHACL-shape-driven projection.

The pack reuses standard SHACL directly. A projected field must have sh:path and exactly one
value kind: primitive sh:datatype or nested sh:node. Primitive datatypes remain bounded to
xsd:string, xsd:boolean, xsd:integer|xsd:long, and xsd:decimal|xsd:float|xsd:double. Nested
nodes must be real sh:NodeShape resources and carry an explicit sp:projectionName supplied by
the consumer graph. Repetition is explicit through sp:collection true; JSON nullability is
explicit through sp:nullable true. sp:derivedFromShape binds a target projection to its source
shape and sp:isPrimaryOutput marks fields that actually belong to the projected artifact.

The gate refuses missing/ambiguous value kinds, invalid datatypes, invalid projected
identifiers, duplicate field names, malformed boolean metadata, empty/unsafe string enums,
unresolved nested shapes, and projections with no real output field. Names are admitted
source facts and are echoed, never synthesized.

This is a LAW pack: it ships zero domain individuals. Composing it cannot inject any shape,
projection, or field into a consumer's output -- the consumer supplies its own
sh:NodeShape / shp:SchemaModel individuals. Its templates render importable TypeScript
(src/shacl_zod_schemas.ts, which imports "zod") and JSON Schema
(schemas/shacl_projection.schema.json), so a TS consumer needs zod + typescript
to type-check the projection (see [consumer_contract]).

ggen packs cannot declare pack-to-pack dependencies in pack.toml. Consumers must explicitly
compose this law pack together with a target pack such as shacl-to-pydantic-pack or
shacl-to-zod-pack so the shared gate runs over the merged graph.

Ships zero domain individuals.
"""

[capabilities]
provides = ["urn:ggen:pack:shacl-projection-pack"]

[consumer_contract]
# Deps pulled by the pack's PROJECTED code (not by the pack itself).
# src/shacl_zod_schemas.ts is the only importing artifact; verified by grep over templates/.
runtime = ["zod", "typescript"]
# No optional runtime deps: the projected schemas use zod + tsc only.
optional_runtime = []
# Rendered into the consumer's graph by the consumer's own ontology file.
peer_context = """
Consumer supplies its own sh:NodeShape + shp:SchemaModel individuals in its
own RDF graph — the pack ships zero individuals and the shared gates (010/020)
run over the merged graph.

Vocabulary namespace (bind to your own prefix; gates are IRI-exact, the
prefix string is irrelevant):
http://seanchatmangpt.github.io/packs/shacl-projection#

Terms declared in the pack's ontology.ttl: shp:SchemaModel (rdfs:Class),
shp:className, shp:derivedFromShape, shp:isPrimaryOutput, shp:nullable.
Additionally asserted by consumers and checked by gates/010: projectionName
(required on nested sh:node targets) and collection (xsd:boolean repetition
flag).

Prefix duality: the same namespace IRI is bound to `sp:` in
gates/010_shape_validity.rq and to `shp:` in gates/020_schema_model_named.rq,
templates/, and ontology.ttl. Both resolve to the identical IRIs; either
prefix is lawful at the consumer.

Required per shp:SchemaModel: exactly one valid shp:className identifier and
an shp:derivedFromShape link to a real sh:NodeShape (enforced by gate 020).
"""
# All projected output goes to the consumer-declared [templates] target dirs;
# no standalone helper files are projected outside the schema module.
projected_helpers = []
