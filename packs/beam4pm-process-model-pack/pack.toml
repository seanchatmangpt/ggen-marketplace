[pack]
name = "beam4pm-process-model-pack"
version = "0.1.5"
description = "Projects an admitted bpm:RecordType graph into real, compiling Erlang and Elixir type and struct definitions, constructors with required-field validation, and Chicago-style (no mocks) unit tests. Ships templates and vocabulary only -- the actual process-mining record definitions (OCEL events and objects, directly-follows edges, Petri net places, transitions and arcs, and conformance-checking alignment moves) are admitted instance data supplied by the consuming project's own ontology.ttl (e.g. beam4pm). v0.1.1 (2026-08-30): six new igniter/ EEx recipe templates (rendered via mix ggen_igniter.sync, rf-family conventions): beam4pm_revenue_economics{,_test} (rework-cost quantification, cycle-to-cash with the first real CaseStats/SojournTime producers, DFG+ETC conformance-leakage findings over the committed BPI-2020 revenue-process fixtures), beam4pm_revenue_metering{,_test} (governed-estate usage-event emission with sha256-deterministic event ids deduplicating inside the existing BeamPM.Billing.reconcile/4, plus the bill-only-if-entitled admit_entitled_usage join), and beam4pm_claude_workflow_reactor{,_test} (a real Reactor DAG modeling the Claude Code workflow orchestration shape, tested against a committed real workflow journal). All six verified by real engine actuation (RECONCILIATION_ALIVE receipts) and a 6-file qualify lint, PASS each. v0.1.4 (2026-08-31): two new igniter/ EEx recipe templates from a deep-research synthesis on beam4pm_pro commercial capabilities: beam4pm_pro_ocpm_discovery{,_test} (object-centric process mining primitives -- per-event object-type co-occurrence sets and per-object-type activity frequency over OCEL data, the flagship-differentiator OCPM slice per Celonis/Apromore/academic literature) and beam4pm_pro_simulation{,_test} (real what-if simulation over a discovered DFG -- edge add/remove, BFS reachability, DFS cycle detection). Both fully static (runtime-data operations, not ontology-time bindings) and both name their own real, deliberate gaps via a gaps/0 function rather than overclaiming completeness. v0.1.5 (2026-08-31): beam4pm_pro_tenancy.ex.eex moduledoc now names Triplex (Elixir/Ecto schema-per-tenant) as identified-but-deliberately-not-adopted, since beam4pm's Ets-backed data layer makes it an architecture mismatch today -- named as real future work, not silently omitted."
