[pack]
name = "beam4pm-process-model-pack"
version = "0.1.11"
description = "Projects an admitted bpm:RecordType graph into real, compiling Erlang and Elixir type and struct definitions, constructors with required-field validation, and Chicago-style (no mocks) unit tests. Ships templates and vocabulary only -- the actual process-mining record definitions (OCEL events and objects, directly-follows edges, Petri net places, transitions and arcs, and conformance-checking alignment moves) are admitted instance data supplied by the consuming project's own ontology.ttl (e.g. beam4pm). v0.1.1 (2026-08-30): six new igniter/ EEx recipe templates (rendered via mix ggen_igniter.sync, rf-family conventions): beam4pm_revenue_economics{,_test} (rework-cost quantification, cycle-to-cash with the first real CaseStats/SojournTime producers, DFG+ETC conformance-leakage findings over the committed BPI-2020 revenue-process fixtures), beam4pm_revenue_metering{,_test} (governed-estate usage-event emission with sha256-deterministic event ids deduplicating inside the existing BeamPM.Billing.reconcile/4, plus the bill-only-if-entitled admit_entitled_usage join), and beam4pm_claude_workflow_reactor{,_test} (a real Reactor DAG modeling the Claude Code workflow orchestration shape, tested against a committed real workflow journal). All six verified by real engine actuation (RECONCILIATION_ALIVE receipts) and a 6-file qualify lint, PASS each. v0.1.4 (2026-08-31): two new igniter/ EEx recipe templates from a deep-research synthesis on beam4pm_pro commercial capabilities: beam4pm_pro_ocpm_discovery{,_test} (object-centric process mining primitives -- per-event object-type co-occurrence sets and per-object-type activity frequency over OCEL data, the flagship-differentiator OCPM slice per Celonis/Apromore/academic literature) and beam4pm_pro_simulation{,_test} (real what-if simulation over a discovered DFG -- edge add/remove, BFS reachability, DFS cycle detection). Both fully static (runtime-data operations, not ontology-time bindings) and both name their own real, deliberate gaps via a gaps/0 function rather than overclaiming completeness. v0.1.5 (2026-08-31): beam4pm_pro_tenancy.ex.eex moduledoc now names Triplex (Elixir/Ecto schema-per-tenant) as identified-but-deliberately-not-adopted, since beam4pm's Ets-backed data layer makes it an architecture mismatch today -- named as real future work, not silently omitted. v0.1.6 (2026-09-04): externalized the bpm:fieldType -> per-language-representation mapping from a duplicated if/elif dispatch ladder (measured: 26 \"field_type ==\" comparisons across 12 template files) into a single shared bpm:FieldType vocabulary in ontology.ttl (erlangTypeExpr/elixirTypeExpr/gleamTypeExpr/jsonSchemaType/jsonSchemaItemsType/isAtomCodec/sample*), joined generically by every affected template's own `fields` SPARQL query. gates/020_field_type_enum.rq now anti-joins against the same vocabulary instead of hand-duplicating the 8-value string enum. Net effect: admitting a 9th field type now touches exactly the ontology.ttl vocabulary block, not 12 template files + this gate (14 sites -> 1). Also closes a real, previously-silent gap in beam4pm_types.schema.json.tmpl: the old if/elif chain had no else/default arm, so a field type falling through every branch emitted a JSON Schema property with no \"type\" key and no generator error; the new mandatory JOIN instead makes an unmapped field type disappear from the `fields` result set entirely -- a visible empty-join symptom, not a silent one. No consumer-owned ontology.ttl changes required; every existing admitted bpm:Field individual's bpm:fieldType literal is untouched. v0.1.7 (2026-09-04): externalized beam4pm_revenue_economics.ex.eex's rework/cycle-to-cash activity-marker vocabulary (rejected_marker, submitted_marker, payment_activity) from three compile-time module attributes into a per-call runtime argument -- rework_cost/3 and cycle_to_cash/3 (with rework_cost/2, cycle_to_cash/2 defaulting to the same BPI-2020 markers via the new default_vocabulary/0, so every existing caller and fixture-pinned test is unaffected). Root problem closed: the prior module attributes were shared, compile-time constants baked into ONE compiled beam4pm_pro release and therefore identical for every concurrently-served tenant on that node, with zero per-request override path -- a tenant whose process used different activity wording (a support-ticket \"FILED\"/\"REOPENED\"/\"Ticket Closed\" grammar instead of BPI-2020's declaration grammar) was silently misclassified (zero rework rows, every case landing in open_obligations), never refused. A malformed vocabulary (missing key, non-string marker) is now a typed `{:error, {:invalid_vocabulary, vocabulary}}` refusal from a new validate_vocabulary check, never a silent zero-match or a crash. New test coverage in beam4pm_revenue_economics_test.exs.eex exercises a second, non-BPI-2020 tenant vocabulary end-to-end (rework_cost/3 and cycle_to_cash/3 against synthetic support-ticket fixtures) alongside the BPI-2020 default on the SAME compiled functions, proving both tenants score correctly on one node -- the concrete multi-tenant case the prior single-vocabulary design could not admit. v0.1.8 (2026-09-04): first formal-projection leg (VISION-2030 section 10, S23 formal future search): two new Tera templates, beam4pm_pddl.domain.pddl.tmpl and beam4pm_pddl.problem.pddl.tmpl, fan out (for_each: contracts) over every consumer-admitted bpmg:ProcessContract into schema/pddl/<processId>.domain.pddl + .problem.pddl -- every bpma:AdmittedActuation becomes one :action named by its bpma:actionName with each bpma:requiresFact a 0-arity precondition atom and one static (allows_<action> ?from ?to) predicate; each contract's states become typed objects, bpmg:initialState the :init state, each bpmg:ProcessTransition (ordinal order) one allows_ :init fact, every named actuation's requiresFact an :init fact assumed satisfied at process start, and the highest-ordinal toState the :goal. Zero bpmg:ProcessContract individuals is a lawful zero-row skip. New gates/040_transition_actuation_admitted.rq refuses a transition naming an un-admitted actuation (the projection would otherwise emit an allows_ fact whose predicate no domain declares). Proven in beam4pm by test/beam4pm_pddl_projection_test.exs against the real ferroplan planner: both admitted contracts solve to exactly their ordinal actuationName sequence; deleting any one transition or required fact yields no_plan, never a fabricated plan. v0.1.9 (2026-09-05): per-chain tip index for the igniter receipt-chain recipe. BeamPM.ReceiptChain.link_fields/3 (new; beam4pm_actuation.ex.eex now passes the exact receipt path it is about to write) finds the chain tip through <receipts_dir>/.chain-tips/<sha256(chain_id)>.json plus the ONE tip receipt it names, instead of the former link_fields/2 scan that read and JSON-decoded EVERY top-level receipt in the flat directory across ALL chains and then discarded every one whose chain_id did not match -- Theta(N) in the lifetime receipt count (nothing prunes receipts_dir; measured on the retained scan body 1.8ms @N=33, 56ms @1,000, 0.64s @10,000, 2.2s @30,000 per governed write) reduced to O(1) (0.57ms @33, 0.78ms @1,000, 0.94ms @10,000, 0.96ms @30,000 per write, index write included -- 3x/70x/680x/2,300x cheaper). Three rules, each pinned by a real test in beam4pm_receipt_chain_test.exs.eex: index-first write (the tip is recorded BEFORE the caller's own File.write!, so a crash between the two leaves an index naming a missing file, never a stale-but-valid one), validated read (an entry is trusted only if the named file exists directly in receipts_dir as *.json, decodes as beam4pm-brce/v1, carries the requested chain_id and records exactly the claimed chain_seq -- any failure is a miss, never an error), and scan fallback (the ORIGINAL scan body is retained byte-for-byte as the public, read-only oracle link_fields_by_scan/2 and rebuilds the index on a miss). verify/2 is untouched and never consults the index, so it stays the independent ground truth: the one disclosed divergence (a well-formed next-link receipt dropped into the directory WITHOUT the writer) is pinned as a test that shows verify/2 flagging :duplicate_or_missing_seq rather than either writer's output being silently accepted. The legacy link_fields/2 is kept and now also invalidates the chain's index so a scan-only writer can never leave a stale tip behind an indexed one. Differential test: 360 randomly interleaved writes over 7 chains (one with a path-unsafe id) plus unchained noise, index == scan before every write, verify/2 accepts every chain; wall-clock falsifier at 3,000 foreign receipts asserts the indexed write is at least 20x cheaper than the scan while returning the identical link. v0.1.10 (2026-09-05): hand-authored-source admission vocabulary (VISION-2030 section 2 \"the exception is visible, bounded, and counted as manufacturing debt\"; section 24 falsifier \"ggen-only manufacture requires routine privileged handwritten source commits\"). New closed bpm:AuthorshipKind vocabulary (native_engine_facade / hand_authored_qualification counted as debt; manufacturing_input / reference_evidence not) each with a hard bpm:debtCeiling, and bpm:HandAuthoredSource -- one consumer-declared individual per file under a manufactured root that carries no GENERATED marker, holding the privileged-exception capability-object fields (sourcePath, authorizingPrincipal, admissionReason, acceptanceCommand, optional acceptancePrerequisite, contentSha256, admittedAtCommit, admissionExpires, sunsetPlan). Three new Tera templates render the admitted set into schema/beam4pm_hand_authored_source.tsv (marker-carrying, machine-readable manifest the consumer's scripts/gate_authorship_check.sh diffs against `git ls-files` -- refusing REFUSED_UNADMITTED / REFUSED_STALE_ADMISSION / REFUSED_CONTRADICTION / REFUSED_SHA_DRIFT / REFUSED_EXPIRED / REFUSED_MISSCOPED / REFUSED_UNBOUND_DEBT, and with --exercise REFUSED_ACCEPTANCE_FAILED / REFUSED_VACUOUS_ACCEPTANCE vs ACCEPTANCE_BLOCKED_PREREQUISITE), docs/reference/beam4pm_hand_authored_source.md (the counted ledger, per kind, with admitted-vs-ceiling), and test/beam4pm_authorship_gate_test.exs (Chicago: runs the real gate as a subprocess against the real tree and against planted git-init fixtures that must be refused by name). Three new gates: 050 refuses an individual missing a capability-object field (debt kinds must carry sha256 + expiry + sunset plan -- a path-only admission is a standing grant), 060 anti-joins the kind against the closed vocabulary and refuses a duplicated path, 070 refuses a kind pushed past its ceiling. Measured in beam4pm at f44dcd0: 33 unmarked files (12 facades + 14 tests = 26 debt; 1 app.src + 6 docs not debt) with zero prior admission records; all four planted violations (missing property, unknown kind, duplicate path, 13th facade) refused by the named gate before render. v0.1.11 (2026-09-05): beam4pm_authorship_gate_test.exs.tmpl pins the gate's regeneration-window rule -- an admitted path that is tracked in the git index but absent from disk is reported TRANSIENT_ABSENT (not a finding), because beam4pm's gate_m2_check.sh stashes its hand-authored dependent tests out of test/ while the igniter leg runs `mix test` (and therefore this gate) mid-pass-3; the same admission becomes REFUSED_STALE_ADMISSION the moment the deletion is staged, which is the state any clean CI checkout sees. Caught by reasoning through gate_m2's own stash window before running it, then pinned as a fixture test (19 fixture/real-tree tests total)."
