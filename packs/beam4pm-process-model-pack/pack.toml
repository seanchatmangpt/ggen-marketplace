[pack]
name = "beam4pm-process-model-pack"
version = "0.1.17"
description = "Projects an admitted bpm:RecordType graph into real, compiling Erlang and Elixir type and struct definitions, constructors with required-field validation, and Chicago-style (no mocks) unit tests. Ships templates and vocabulary only -- the actual process-mining record definitions (OCEL events and objects, directly-follows edges, Petri net places, transitions and arcs, and conformance-checking alignment moves) are admitted instance data supplied by the consuming project's own ontology.ttl (e.g. beam4pm). v0.1.1 (2026-08-30): six new igniter/ EEx recipe templates (rendered via mix ggen_igniter.sync, rf-family conventions): beam4pm_revenue_economics{,_test} (rework-cost quantification, cycle-to-cash with the first real CaseStats/SojournTime producers, DFG+ETC conformance-leakage findings over the committed BPI-2020 revenue-process fixtures), beam4pm_revenue_metering{,_test} (governed-estate usage-event emission with sha256-deterministic event ids deduplicating inside the existing BeamPM.Billing.reconcile/4, plus the bill-only-if-entitled admit_entitled_usage join), and beam4pm_claude_workflow_reactor{,_test} (a real Reactor DAG modeling the Claude Code workflow orchestration shape, tested against a committed real workflow journal). All six verified by real engine actuation (RECONCILIATION_ALIVE receipts) and a 6-file qualify lint, PASS each. v0.1.4 (2026-08-31): two new igniter/ EEx recipe templates from a deep-research synthesis on beam4pm_pro commercial capabilities: beam4pm_pro_ocpm_discovery{,_test} (object-centric process mining primitives -- per-event object-type co-occurrence sets and per-object-type activity frequency over OCEL data, the flagship-differentiator OCPM slice per Celonis/Apromore/academic literature) and beam4pm_pro_simulation{,_test} (real what-if simulation over a discovered DFG -- edge add/remove, BFS reachability, DFS cycle detection). Both fully static (runtime-data operations, not ontology-time bindings) and both name their own real, deliberate gaps via a gaps/0 function rather than overclaiming completeness. v0.1.5 (2026-08-31): beam4pm_pro_tenancy.ex.eex moduledoc now names Triplex (Elixir/Ecto schema-per-tenant) as identified-but-deliberately-not-adopted, since beam4pm's Ets-backed data layer makes it an architecture mismatch today -- named as real future work, not silently omitted. v0.1.6 (2026-09-04): externalized the bpm:fieldType -> per-language-representation mapping from a duplicated if/elif dispatch ladder (measured: 26 \"field_type ==\" comparisons across 12 template files) into a single shared bpm:FieldType vocabulary in ontology.ttl (erlangTypeExpr/elixirTypeExpr/gleamTypeExpr/jsonSchemaType/jsonSchemaItemsType/isAtomCodec/sample*), joined generically by every affected template's own `fields` SPARQL query. gates/020_field_type_enum.rq now anti-joins against the same vocabulary instead of hand-duplicating the 8-value string enum. Net effect: admitting a 9th field type now touches exactly the ontology.ttl vocabulary block, not 12 template files + this gate (14 sites -> 1). Also closes a real, previously-silent gap in beam4pm_types.schema.json.tmpl: the old if/elif chain had no else/default arm, so a field type falling through every branch emitted a JSON Schema property with no \"type\" key and no generator error; the new mandatory JOIN instead makes an unmapped field type disappear from the `fields` result set entirely -- a visible empty-join symptom, not a silent one. No consumer-owned ontology.ttl changes required; every existing admitted bpm:Field individual's bpm:fieldType literal is untouched. v0.1.7 (2026-09-04): externalized beam4pm_revenue_economics.ex.eex's rework/cycle-to-cash activity-marker vocabulary (rejected_marker, submitted_marker, payment_activity) from three compile-time module attributes into a per-call runtime argument -- rework_cost/3 and cycle_to_cash/3 (with rework_cost/2, cycle_to_cash/2 defaulting to the same BPI-2020 markers via the new default_vocabulary/0, so every existing caller and fixture-pinned test is unaffected). Root problem closed: the prior module attributes were shared, compile-time constants baked into ONE compiled beam4pm_pro release and therefore identical for every concurrently-served tenant on that node, with zero per-request override path -- a tenant whose process used different activity wording (a support-ticket \"FILED\"/\"REOPENED\"/\"Ticket Closed\" grammar instead of BPI-2020's declaration grammar) was silently misclassified (zero rework rows, every case landing in open_obligations), never refused. A malformed vocabulary (missing key, non-string marker) is now a typed `{:error, {:invalid_vocabulary, vocabulary}}` refusal from a new validate_vocabulary check, never a silent zero-match or a crash. New test coverage in beam4pm_revenue_economics_test.exs.eex exercises a second, non-BPI-2020 tenant vocabulary end-to-end (rework_cost/3 and cycle_to_cash/3 against synthetic support-ticket fixtures) alongside the BPI-2020 default on the SAME compiled functions, proving both tenants score correctly on one node -- the concrete multi-tenant case the prior single-vocabulary design could not admit. v0.1.8 (2026-09-04): first formal-projection leg (VISION-2030 section 10, S23 formal future search): two new Tera templates, beam4pm_pddl.domain.pddl.tmpl and beam4pm_pddl.problem.pddl.tmpl, fan out (for_each: contracts) over every consumer-admitted bpmg:ProcessContract into schema/pddl/<processId>.domain.pddl + .problem.pddl -- every bpma:AdmittedActuation becomes one :action named by its bpma:actionName with each bpma:requiresFact a 0-arity precondition atom and one static (allows_<action> ?from ?to) predicate; each contract's states become typed objects, bpmg:initialState the :init state, each bpmg:ProcessTransition (ordinal order) one allows_ :init fact, every named actuation's requiresFact an :init fact assumed satisfied at process start, and the highest-ordinal toState the :goal. Zero bpmg:ProcessContract individuals is a lawful zero-row skip. New gates/040_transition_actuation_admitted.rq refuses a transition naming an un-admitted actuation (the projection would otherwise emit an allows_ fact whose predicate no domain declares). Proven in beam4pm by test/beam4pm_pddl_projection_test.exs against the real ferroplan planner: both admitted contracts solve to exactly their ordinal actuationName sequence; deleting any one transition or required fact yields no_plan, never a fabricated plan. v0.1.9 (2026-09-05): per-chain tip index for the igniter receipt-chain recipe. BeamPM.ReceiptChain.link_fields/3 (new; beam4pm_actuation.ex.eex now passes the exact receipt path it is about to write) finds the chain tip through <receipts_dir>/.chain-tips/<sha256(chain_id)>.json plus the ONE tip receipt it names, instead of the former link_fields/2 scan that read and JSON-decoded EVERY top-level receipt in the flat directory across ALL chains and then discarded every one whose chain_id did not match -- Theta(N) in the lifetime receipt count (nothing prunes receipts_dir; measured on the retained scan body 1.8ms @N=33, 56ms @1,000, 0.64s @10,000, 2.2s @30,000 per governed write) reduced to O(1) (0.57ms @33, 0.78ms @1,000, 0.94ms @10,000, 0.96ms @30,000 per write, index write included -- 3x/70x/680x/2,300x cheaper). Three rules, each pinned by a real test in beam4pm_receipt_chain_test.exs.eex: index-first write (the tip is recorded BEFORE the caller's own File.write!, so a crash between the two leaves an index naming a missing file, never a stale-but-valid one), validated read (an entry is trusted only if the named file exists directly in receipts_dir as *.json, decodes as beam4pm-brce/v1, carries the requested chain_id and records exactly the claimed chain_seq -- any failure is a miss, never an error), and scan fallback (the ORIGINAL scan body is retained byte-for-byte as the public, read-only oracle link_fields_by_scan/2 and rebuilds the index on a miss). verify/2 is untouched and never consults the index, so it stays the independent ground truth: the one disclosed divergence (a well-formed next-link receipt dropped into the directory WITHOUT the writer) is pinned as a test that shows verify/2 flagging :duplicate_or_missing_seq rather than either writer's output being silently accepted. The legacy link_fields/2 is kept and now also invalidates the chain's index so a scan-only writer can never leave a stale tip behind an indexed one. Differential test: 360 randomly interleaved writes over 7 chains (one with a path-unsafe id) plus unchained noise, index == scan before every write, verify/2 accepts every chain; wall-clock falsifier at 3,000 foreign receipts asserts the indexed write is at least 20x cheaper than the scan while returning the identical link. v0.1.10 (2026-09-05): hand-authored-source admission vocabulary (VISION-2030 section 2 \"the exception is visible, bounded, and counted as manufacturing debt\"; section 24 falsifier \"ggen-only manufacture requires routine privileged handwritten source commits\"). New closed bpm:AuthorshipKind vocabulary (native_engine_facade / hand_authored_qualification counted as debt; manufacturing_input / reference_evidence not) each with a hard bpm:debtCeiling, and bpm:HandAuthoredSource -- one consumer-declared individual per file under a manufactured root that carries no GENERATED marker, holding the privileged-exception capability-object fields (sourcePath, authorizingPrincipal, admissionReason, acceptanceCommand, optional acceptancePrerequisite, contentSha256, admittedAtCommit, admissionExpires, sunsetPlan). Three new Tera templates render the admitted set into schema/beam4pm_hand_authored_source.tsv (marker-carrying, machine-readable manifest the consumer's scripts/gate_authorship_check.sh diffs against `git ls-files` -- refusing REFUSED_UNADMITTED / REFUSED_STALE_ADMISSION / REFUSED_CONTRADICTION / REFUSED_SHA_DRIFT / REFUSED_EXPIRED / REFUSED_MISSCOPED / REFUSED_UNBOUND_DEBT, and with --exercise REFUSED_ACCEPTANCE_FAILED / REFUSED_VACUOUS_ACCEPTANCE vs ACCEPTANCE_BLOCKED_PREREQUISITE), docs/reference/beam4pm_hand_authored_source.md (the counted ledger, per kind, with admitted-vs-ceiling), and test/beam4pm_authorship_gate_test.exs (Chicago: runs the real gate as a subprocess against the real tree and against planted git-init fixtures that must be refused by name). Three new gates: 050 refuses an individual missing a capability-object field (debt kinds must carry sha256 + expiry + sunset plan -- a path-only admission is a standing grant), 060 anti-joins the kind against the closed vocabulary and refuses a duplicated path, 070 refuses a kind pushed past its ceiling. Measured in beam4pm at f44dcd0: 33 unmarked files (12 facades + 14 tests = 26 debt; 1 app.src + 6 docs not debt) with zero prior admission records; all four planted violations (missing property, unknown kind, duplicate path, 13th facade) refused by the named gate before render. v0.1.11 (2026-09-05): beam4pm_authorship_gate_test.exs.tmpl pins the gate's regeneration-window rule -- an admitted path that is tracked in the git index but absent from disk is reported TRANSIENT_ABSENT (not a finding), because beam4pm's gate_m2_check.sh stashes its hand-authored dependent tests out of test/ while the igniter leg runs `mix test` (and therefore this gate) mid-pass-3; the same admission becomes REFUSED_STALE_ADMISSION the moment the deletion is staged, which is the state any clean CI checkout sees. Caught by reasoning through gate_m2's own stash window before running it, then pinned as a fixture test (19 fixture/real-tree tests total). v0.1.12 (2026-09-05): the SAME window rule applied to the test's own real-tree assertions -- a real gate_m2_check.sh run (not reasoning) failed 3 of the real-tree tests inside the igniter leg's `mix test` because the three stashed admitted files were absent: sha256 of a missing file, `File.regular?` on a missing file, and the PASS line reporting 30 (not 33) unmarked files. The real-tree tests now split admitted paths into present vs transient_absent (tracked in the index, missing on disk), assert TRANSIENT_ABSENT for the latter, expect exactly the present count in the PASS line, and skip disk-only assertions for the absent ones -- verified 19/19 both on the normal tree and with the three files moved out of test/ to simulate the window, then restored. v0.1.13 (2026-09-05): Ash is the fourth sibling projection and must preserve semantic identity with the Erlang/Elixir/JSON legs (VISION-2030 section 4 \"No language is allowed to erase distinctions merely because another language's representation is convenient\", section 23 Polyglot BEAM). The igniter Ash templates (beam4pm_ash_resource.ex.eex, beam4pm_ash_resource_test.exs.eex) dispatched Ash attribute types through a hardcoded 8-branch `ash_type = fn` ladder with no fallthrough, and that ladder mapped datetime to :utc_datetime -- Ash's constraints: [precision: :second] type -- so the microseconds every other leg carries verbatim on the wire were TRUNCATED on the Ash leg (measured on the real generated OcelEvent resource, Ash 3.32.1: \"2026-08-29T12:00:00.123456Z\" created, ~U[2026-08-29 12:00:00Z] read back, DateTime.compare :lt), invisibly, because the test template's private fixture had no fractional seconds. Fix, as bounded work: (1) new bpm:ashTypeExpr on every bpm:FieldType individual (datetime -> \":utc_datetime_usec\", the other seven exactly as the ladder had them), so the Ash type is an ontology fact like erlangTypeExpr/elixirTypeExpr/gleamTypeExpr/jsonSchemaType; (2) new igniter/queries/ash_fields.rq -- fields.rq plus an OPTIONAL JOIN to the FieldType vocabulary for ?ash_type_expr and ?sample_elixir -- consumed ONLY by the two Ash templates, so fields.rq's other consumers (per-type doc pages, the cross-engine manifest probe) keep running on the consumer graph alone; the join is OPTIONAL and both templates raise BY RECORD AND FIELD NAME on an unbound ?ash_type_expr, so an unadmitted type, a FieldType lacking the property, or a consumer-only graph is a named render refusal (measured: consumer-only run exits 1 with zero files written), never a silently dropped attribute and never the old FunctionClauseError; (3) new gates/035_field_type_ash_expr.rq refuses a bpm:FieldType carrying anything but exactly one bpm:ashTypeExpr on the Rust `ggen sync run` leg too; (4) the test template's fixtures now come from the SAME bpm:sampleElixir the codec/roundtrip (GATE M5) templates render, and FieldType_datetime's codec/roundtrip sample* literals move to the six-microsecond-digit \"2026-08-29T12:00:00.123456Z\" (opaque binary()/String.t()/JSON string on those legs, so they round-trip unchanged); (5) the Ash identity relation for datetime is stated in the generated test and here as DateTime.compare(ash_read, DateTime.from_iso8601(wire)) == :eq over a normalized UTC %DateTime{} with microsecond {n, 6} -- explicitly NOT byte or struct identity (a no-fraction wire value parses {0, 0} but reads back {0, 6}; \".5Z\" {500000, 1} vs {500000, 6}). Falsifier run: the regenerated ocel_event test against the pre-fix :utc_datetime resource fails with left: :lt; against the regenerated :utc_datetime_usec resource it passes. Consumer wiring: ggen_igniter loads exactly one --ontology file, so beam4pm's scripts/igniter_sync.sh concatenates consumer ontology.ttl + this pack's ontology.ttl into a fixed gitignored tmp_probe/ontology_merged.ttl for the two Ash steps (measured: 0 Ash types bound on the consumer graph alone, all 1074 field rows on the merge). Note the engine contract this exposed: GgenIgniter.Query.Oxigraph returns PLAIN lexical values (Literal::value()), so the templates' historical raw-N-Triples quote-stripping norm/1 must not be applied to a sample literal that legitimately begins with a quote character -- the two new columns are read verbatim. Ash is still not exercised by beam4pm's scripts/roundtrip_check.sh (the M5 wire proof stays Erlang<->Elixir); the Ash leg's identity is proven per resource by its generated ExUnit test against the shared fixture, not by the cross-language wire script. v0.1.14 (2026-09-05): the \"Deterministic sample values\" comment block in beam4pm_roundtrip.ex.tmpl, beam4pm_roundtrip.erl.tmpl and beam4pm_codec_tests.erl.tmpl still hardcoded the pre-0.1.13 no-fraction datetime literal in prose while the generated code below it now carries the six-microsecond-digit vocabulary fixture -- a stale statement in generated output, caught by grepping the regenerated tree for the old literal. The three comments now name the bpm:sampleElixir/bpm:sampleErlang vocabulary literal as the source and describe the datetime fixture by property (ISO 8601 UTC, six microsecond digits, shared with the Ash-leg tests) instead of by value. Comment lines only; no generated code changes. v0.1.15 (2026-09-05): the Ash projection joins the GATE M5 wire proof (VISION-2030 section 23 Polyglot BEAM). Two new igniter/ EEx recipe templates, both single-output on records + ash_fields.rq over the merged consumer+pack graph: beam4pm_ash_roundtrip.ex.eex renders BeamPM.AshRoundtrip, which for every admitted record type x {full, minimal} takes the SAME wire fixture the Erlang and Elixir legs exchange (the consumer's scripts/roundtrip_check.sh writes <record>.<variant>.erl.json / .ex.json), decodes it through BeamPM.Codec (the cross-engine path), creates the generated Ash.Resource on the real Ash.DataLayer.Ets, reads it back BY PRIMARY KEY (both variants of a record share one table per VM, so a read-all can never match one row) and compares field by field against BeamPM.Roundtrip.sample/2 -- the independent construction the other two legs compare against. The relation is stated precisely because BeamPM.Codec.to_map/1 does not apply to an Ash struct (to_known_map stringifies atoms; Ash reads atoms back): attributes whose bpm:ashTypeExpr is in the :utc_datetime family use DateTime.compare(ash_read, DateTime.from_iso8601(wire)) == :eq with nil == nil for an optional datetime absent from the minimal wire (DateTime.from_iso8601(nil) raises), every other attribute uses == against BOTH the sample and the codec-decoded struct, and the synthetic uuid_primary_key :id is disclosed as the only Ash-only public attribute and asserted so per record (a second Ash-only attribute is a named failure). Which attributes are datetime is an ontology fact rendered from ash_fields.rq (unbound ?ash_type_expr refused by record and field name, as in the two sibling Ash templates), and beam4pm_ash_roundtrip_test.exs.eex pins that fact against Ash.Resource.Info.attribute types at test time. That test template is the same-language (\"ex\") exercise: a full 578-fixture sweep, the :id-only disclosure over every resource, and two falsifiers run rather than reasoned -- a fixture with one datetime rewritten to the no-fraction form and one with a string mutated must each be refused naming record, variant and field (the tampered wire is self-consistent through Ash, so only comparison against the independent sample catches it). The test cleans its own ETS rows up (Ash.DataLayer.Ets.stop/1 per resource, waiting until :ets.whereis/1 reports the table gone) because the per-resource suite reads back with a one-row read-all. Measured in beam4pm (Ash 3.32.1, 289 record types): ash-verifies-wire 578 pass, 0 fail on the Erlang-written fixtures; 77 resources carry 79 :utc_datetime_usec attributes (158 DateTime.compare/2 comparisons per sweep across full+minimal); Ash-only attributes beyond :id: none. Scope disclosure, not a claim: Ash :string defaults (trim?: true, allow_empty?: false) mean whitespace-padded or empty strings would not round-trip identically on the Ash leg -- no fixture on any leg exercises that class, so the gate proves identity for the fixture class only, the same scope the Erlang/Elixir legs have always had. v0.1.16 (2026-09-05): observed vs inferred edges over tracing spans (VISION-2030 section 24 falsifier \"telemetry adjacency cannot be distinguished from causality well enough for trustworthy process inference\"; section 7 \"observed\" and \"inferred\" are distinct views of the twin). Measured before: every discovery projection (beam4pm_discovery.erl/ex/gleam.tmpl) derived directly-follows edges from TEMPORAL ADJACENCY only -- traces_from_events sorts by {event_time, event_id} and promotes every consecutive pair inside a case to a dfg_edge; no code path read a span parent/child link, and the consumer's admitted service_span carried no ordering field and no trace partition key, so the two evidence classes could not even be computed on the same input. The increment, all three sibling projections in lockstep (no Gleam divergence added): traces_from_spans/1 -- one log_trace per trace_id ordered by {start_time, span_id}, parent_span_id never read (the temporal-adjacency reading, deliberately the same dfg_from_traces code path event logs feed) -- and causal_dfg_from_spans/1, which returns {ok, %{observed, adjacent, inferred_only, observed_not_adjacent, orphans}}: observed = one edge per (parent service_name, child service_name) parent/child link with frequency = link count; adjacent = traces_from_spans -> dfg_from_traces re-tagged; inferred_only = adjacent pairs no link supports (what adjacency invented); observed_not_adjacent = linked pairs adjacency never produced (causality it cannot see) -- the two sets are NOT nested, so BOTH differences are returned; orphans = {span_id, parent_span_id} for every span whose parent is absent from the input, never an invented edge, never dropped, and still placed in the adjacency arm so missing evidence is distinguishable from invention. Typed refusals: {error, {duplicate_span_id, Id}} (an index would last-write-win) and {error, {parent_in_other_trace, ChildId}} (links never cross traces). The edges are a NEW admitted record shape the consumer declares, span_edge (source_service, target_service, frequency, evidence in {parent_child_link, temporal_adjacency} as a bpm:fieldType atom), deliberately not dfg_edge: an OpenTelemetry parent -> child link is invocation/containment causality (the child ran INSIDE the parent's interval), not directly-follows, and the evidence class must survive a caller merging the lists -- so it lives ON the record. Terminology pinned in every generated doc: parent/child links, never the distinct OpenTelemetry `links` field. Consumer-side manufacturing inputs this version expects: service_span gains trace_id (string, required) and start_time (datetime, required), span_edge is admitted; qualification/consumer.ttl carries both so the qualification render has the same accessor arities as the reference consumer. The discovery templates' schema-driven accessor list adds \"service_span\" and \"span_edge\" (erl) / the VALUES clause (ex, ex test); beam4pm_discovery.gleam.tmpl and beam4pm_gleam_test.tmpl now render the admitted record count from the records query instead of a stale hard-coded 35. Falsifier fixture shared verbatim across the Erlang, Elixir and Gleam test templates: one root (gateway) with two CONCURRENT children (orders, inventory); with orders starting first adjacency yields gateway->orders, orders->inventory while links yield gateway->orders, gateway->inventory -- asserted two-sided with exact frequencies that inferred_only == [orders->inventory] and observed_not_adjacent == [gateway->inventory]; swapping the children's start order leaves the observed arm byte-identical and flips the adjacency arm and both differences; plus orphan-by-name, duplicate refusal, cross-trace refusal, empty/root-only, same-service self edge, per-pair frequency over two traces, and interleaved traces never crossing trace_id (the intra-span complement of the PI3 cross-case falsifier). Honest standing this earns for the section 24 falsifier: PARTIAL_ALIVE scoped to span-linked telemetry on the admitted service_span shape -- parent/child links only; OpenTelemetry `links`, async/cross-trace causality (B4PM-903) and trustworthy inference over link-less telemetry stay open. v0.1.17 (2026-09-05): native engine surfaces are ontology facts and the engine facades are manufactured (VISION-2030 section 2 \"visible, bounded, counted as manufacturing debt\"; section 24 falsifier \"ggen-only manufacture requires routine privileged handwritten source commits\"). The reference consumer's largest block of counted debt was the four native-engine facade triples (12 of 26 files: src/beam4pm_<engine>.erl, lib/beam4pm_<engine>.ex, gleam/src/beam4pm/<engine>.gleam over rust4pm, ferroplan, petgraph, tract), each admitted with the sunset plan \"admit the engine's function surface as ontology facts and render all three facades from one pack template family\"; the cycle-7 measurement (tract and petgraph Elixir wrappers identical modulo rename, 89 core lines; ferroplan comment-stripped identical; rust4pm one behavioral line apart; every Erlang facade a pure delegation, every Gleam facade a pure @external) showed one family fits. New closed vocabulary: bpm:Engine (engineName/engineModule/engineDoc/engineOrdinal/wasmExportPrefix/wasmArtifactPath/wasmBuildScript/optional wasmBuildHint/dispatchSource/healthId/handleNoun/cheapTimeoutMs/optional heavyTimeoutMs/errorCollapse), bpm:EngineOp (opName, optional opWireName, opOrder, opDoc, opTimeoutClass, opKind wire|host_helper with opDelegatesTo, optional opElixirPredicate, per-leg opExposeErlang/opExposeGleam), bpm:EngineArg (argName, optional argWireKey, argOrder, argType, argEncoding, argMode, argDefault) with CLOSED member vocabularies bpm:EngineArgType (handle string binary path integer number boolean map optional_map list list_string tensor_list fact_pairs -- each carrying its Elixir typespec + guard, Erlang type + optional local -type decl, Gleam type, the engine-surface analogue of bpm:FieldType's per-language expressions), bpm:ArgEncoding (passthrough base64 tensor_list pair_list omit_when_nil merge_map), bpm:ArgMode (required optional keyword), bpm:TimeoutClass (cheap heavy), bpm:EngineOpKind, bpm:ErrorCollapse (single_key_inspect vs any_key_raw -- rust4pm's measured one-line divergence, pinned by its facades test asserting a raw error prefix, so it is a fact, not normalized away). Four new Tera templates: beam4pm_engine.ex.tmpl / .erl.tmpl / .gleam.tmpl (for_each: engines -- the wasmex lifecycle, linear-memory JSON ABI call sequence, restart-on-trap, .Health probe and put_optional helper are template, emitted only where an op needs them; the surface is facts) and beam4pm_engine_ops.tsv.tmpl (schema/beam4pm_engine_ops.tsv, the manifest the consumer's scripts/gate_engine_dispatch_check.sh joins against each crate's string-literal \"<op>\" => dispatch arms, refusing a manufactured op the crate does not dispatch and reporting -- never silently exposing -- an arm no fact names) plus beam4pm_engine_dispatch_gate_test.exs.tmpl (Chicago test running that gate as a subprocess against the real tree and planted fixtures). Two new gates: 080 refuses a missing required engine/op/arg property, a heavy op on an engine without heavyTimeoutMs, a host_helper without a delegate, an optional/keyword arg without a default; 090 anti-joins every closed vocabulary and refuses duplicate engine/op/wire names, more than one non-required arg per op (the Erlang facade renders exactly one extra arity), a pipe encoding without optional mode, and a host_helper delegating outside its engine's wire ops. qualification/consumer.ttl gains one synthetic engine exercising every vocabulary member. Measured in beam4pm: petgraph and tract converted first -- the six hand-authored files deleted, their six bpm:HandAuthoredSource admissions removed, GATE AUTHORSHIP 33 admitted / 26 debt -> 27 / 20, the unchanged sha-pinned parity suites (petgraph 10, tract 8) and direct engine tests pass 0 skipped against the real wasm engines and the rebuilt gleam beams, code-only diff of generated vs hand-authored is formatting only (pipe-form call, guard on its own line, 30000 vs 30_000, Erlang tract facade calls the minimal Elixir arity instead of passing an explicit []); GATE ENGINE DISPATCH 14 wire ops across 2 engines, 0 unexposed arms. bpm:AuthorshipKind_native_engine_facade's debtCeiling drops 12 -> 6 so the two converted engines cannot quietly return to hand-authoring; ferroplan and rust4pm remain admitted debt until their facts land (the vocabulary already carries their shapes: merge_map, pair_list, omit_when_nil, any_key_raw, per-leg exposure)."
