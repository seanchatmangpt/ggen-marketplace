[pack]
name = "beam4pm-process-model-pack"
version = "0.1.0"
description = "Projects an admitted bpm:RecordType graph into real, compiling Erlang and Elixir type and struct definitions, constructors with required-field validation, and Chicago-style (no mocks) unit tests. Ships templates and vocabulary only -- the actual process-mining record definitions (OCEL events and objects, directly-follows edges, Petri net places, transitions and arcs, and conformance-checking alignment moves) are admitted instance data supplied by the consuming project's own ontology.ttl (e.g. beam4pm)."
