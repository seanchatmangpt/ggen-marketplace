[pack]
name = "beam4pm-process-model-pack"
version = "0.1.7"
description = "Projects an admitted bpm:RecordType graph into real, compiling Erlang and Elixir type and struct definitions, constructors with required-field validation, and Chicago-style (no mocks) unit tests. Ships templates and vocabulary only -- the actual process-mining record definitions (OCEL events and objects, directly-follows edges, Petri net places, transitions and arcs, and conformance-checking alignment moves) are admitted instance data supplied by the consuming project's own ontology.ttl (e.g. beam4pm). v0.1.1 (2026-08-30): six new igniter/ EEx recipe templates (rendered via mix ggen_igniter.sync, rf-family conventions): beam4pm_revenue_economics{,_test} (rework-cost quantification, cycle-to-cash with the first real CaseStats/SojournTime producers, DFG+ETC conformance-leakage findings over the committed BPI-2020 revenue-process fixtures), beam4pm_revenue_metering{,_test} (governed-estate usage-event emission with sha256-deterministic event ids deduplicating inside the existing BeamPM.Billing.reconcile/4, plus the bill-only-if-entitled admit_entitled_usage join), and beam4pm_claude_workflow_reactor{,_test} (a real Reactor DAG modeling the Claude Code workflow orchestration shape, tested against a committed real workflow journal). All six verified by real engine actuation (RECONCILIATION_ALIVE receipts) and a 6-file qualify lint, PASS each. v0.1.4 (2026-08-31): two new igniter/ EEx recipe templates from a deep-research synthesis on beam4pm_pro commercial capabilities: beam4pm_pro_ocpm_discovery{,_test} (object-centric process mining primitives -- per-event object-type co-occurrence sets and per-object-type activity frequency over OCEL data, the flagship-differentiator OCPM slice per Celonis/Apromore/academic literature) and beam4pm_pro_simulation{,_test} (real what-if simulation over a discovered DFG -- edge add/remove, BFS reachability, DFS cycle detection). Both fully static (runtime-data operations, not ontology-time bindings) and both name their own real, deliberate gaps via a gaps/0 function rather than overclaiming completeness. v0.1.5 (2026-08-31): beam4pm_pro_tenancy.ex.eex moduledoc now names Triplex (Elixir/Ecto schema-per-tenant) as identified-but-deliberately-not-adopted, since beam4pm's Ets-backed data layer makes it an architecture mismatch today -- named as real future work, not silently omitted. v0.1.6 (2026-09-04): externalized the bpm:fieldType -> per-language-representation mapping from a duplicated if/elif dispatch ladder (measured: 26 \"field_type ==\" comparisons across 12 template files) into a single shared bpm:FieldType vocabulary in ontology.ttl (erlangTypeExpr/elixirTypeExpr/gleamTypeExpr/jsonSchemaType/jsonSchemaItemsType/isAtomCodec/sample*), joined generically by every affected template's own `fields` SPARQL query. gates/020_field_type_enum.rq now anti-joins against the same vocabulary instead of hand-duplicating the 8-value string enum. Net effect: admitting a 9th field type now touches exactly the ontology.ttl vocabulary block, not 12 template files + this gate (14 sites -> 1). Also closes a real, previously-silent gap in beam4pm_types.schema.json.tmpl: the old if/elif chain had no else/default arm, so a field type falling through every branch emitted a JSON Schema property with no \"type\" key and no generator error; the new mandatory JOIN instead makes an unmapped field type disappear from the `fields` result set entirely -- a visible empty-join symptom, not a silent one. No consumer-owned ontology.ttl changes required; every existing admitted bpm:Field individual's bpm:fieldType literal is untouched. v0.1.7 (2026-09-04): externalized beam4pm_revenue_economics.ex.eex's rework/cycle-to-cash activity-marker vocabulary (rejected_marker, submitted_marker, payment_activity) from three compile-time module attributes into a per-call runtime argument -- rework_cost/3 and cycle_to_cash/3 (with rework_cost/2, cycle_to_cash/2 defaulting to the same BPI-2020 markers via the new default_vocabulary/0, so every existing caller and fixture-pinned test is unaffected). Root problem closed: the prior module attributes were shared, compile-time constants baked into ONE compiled beam4pm_pro release and therefore identical for every concurrently-served tenant on that node, with zero per-request override path -- a tenant whose process used different activity wording (a support-ticket \"FILED\"/\"REOPENED\"/\"Ticket Closed\" grammar instead of BPI-2020's declaration grammar) was silently misclassified (zero rework rows, every case landing in open_obligations), never refused. A malformed vocabulary (missing key, non-string marker) is now a typed `{:error, {:invalid_vocabulary, vocabulary}}` refusal from a new validate_vocabulary check, never a silent zero-match or a crash. New test coverage in beam4pm_revenue_economics_test.exs.eex exercises a second, non-BPI-2020 tenant vocabulary end-to-end (rework_cost/3 and cycle_to_cash/3 against synthetic support-ticket fixtures) alongside the BPI-2020 default on the SAME compiled functions, proving both tenants score correctly on one node -- the concrete multi-tenant case the prior single-vocabulary design could not admit."
