[pack]
name = "beam4pm-process-model-pack"
version = "0.1.1"
description = "Projects an admitted bpm:RecordType graph into real, compiling Erlang and Elixir type and struct definitions, constructors with required-field validation, and Chicago-style (no mocks) unit tests. Ships templates and vocabulary only -- the actual process-mining record definitions (OCEL events and objects, directly-follows edges, Petri net places, transitions and arcs, and conformance-checking alignment moves) are admitted instance data supplied by the consuming project's own ontology.ttl (e.g. beam4pm). v0.1.1 (2026-08-30): six new igniter/ EEx recipe templates (rendered via mix ggen_igniter.sync, rf-family conventions): beam4pm_revenue_economics{,_test} (rework-cost quantification, cycle-to-cash with the first real CaseStats/SojournTime producers, DFG+ETC conformance-leakage findings over the committed BPI-2020 revenue-process fixtures), beam4pm_revenue_metering{,_test} (governed-estate usage-event emission with sha256-deterministic event ids deduplicating inside the existing BeamPM.Billing.reconcile/4, plus the bill-only-if-entitled admit_entitled_usage join), and beam4pm_claude_workflow_reactor{,_test} (a real Reactor DAG modeling the Claude Code workflow orchestration shape, tested against a committed real workflow journal). All six verified by real engine actuation (RECONCILIATION_ALIVE receipts) and a 6-file qualify lint, PASS each."
