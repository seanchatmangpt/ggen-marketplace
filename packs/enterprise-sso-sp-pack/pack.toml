[pack]
name = "enterprise-sso-sp-pack"
version = "0.2.0"
description = """
SAML 2.0 / OIDC relying-party (Service Provider) ontology, SHACL shapes,
refusal gates, and frontmatter templates for Semantic Jira product SSO —
customer IdP federation into the SJ product as SP/RP (metadata, ACS, PKCE,
group claims → product roles). Explicitly NOT Smalt IdP: Smalt owns the
identity-plane IdP face (`smalt-substrate-pack` saml2-idp / queued oidc).
Grants no DO / token-mint authority; templates project admitted federation
facts to metadata and config only.
"""

[metadata]
category = "identity"
tags = ["sso", "saml", "oidc", "relying-party", "service-provider", "sjira", "enterprise", "pkce", "shacl"]

[capabilities]
provides = [
  "urn:ggen:pack:enterprise-sso-sp-pack",
  "urn:ggen:capability:saml-sp",
  "urn:ggen:capability:oidc-rp",
  "urn:ggen:capability:sso-claim-map",
]
requires = []
