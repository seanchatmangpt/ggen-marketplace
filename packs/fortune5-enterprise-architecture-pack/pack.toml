# fortune5-enterprise-architecture-pack
# Fortune 5 EA-as-Code: heterogeneous SBB realization groups + ABB/SBB
# qualification ladder + multi-cloud realization skeletons.
#
# Hygiene law (docs/reference/industry-closure-contract.md:22): this pack
# NEVER declares, re-types or prefix-declares an ea:, togaf:, eap: or eom:
# term. All ea: terms are consumed by full IRI from the canonical semantic
# owner (seanchatmangpt/chatman-ecosystem#296).
#
# RFC DoD #9 (ggen/docs/rfc/v26.9.26/abb-sbb-implementation.md):
# "Never make Pack == ABB or Pack == SBB." Groups in this pack REFERENCE
# ea:SolutionBuildingBlock individuals; they are never themselves ABBs/SBBs.

schema = "ggen.pack.v1"
# Display title (loader [pack].name must equal the directory name):
# "Fortune 5 Enterprise Architecture (EA-as-Code) Pack"
license = "UNLICENSED"
authors = ["Sean Chatman"]

authority = "NONE"
authority_ceiling = "SELECT"

[pack]
name = "fortune5-enterprise-architecture-pack"
version = "26.10.9"
description = """
Deployment-topology SBB solution groups (guest/host/network/verification domains),
a 6-stage ABB/SBB qualification ladder (gates/), and per-provider SBB realization
skeletons (aws/gcp/azure). Authority NONE; ceiling SELECT. No DO individual,
class or property is declared in this namespace.
"""

[capabilities]
ontology = "ontology.ttl"
queries = "queries/"
templates = "templates/"
schemas = "schema/"

[dependencies]
# Consumed vocabularies (by IRI only — never re-declared):
# - ea:  https://chatman.ai/ontology/enterprise-architecture#
#        (semantic owner: seanchatmangpt/chatman-ecosystem#296)
# - ic:  industry-closure-ledger-pack (ladder residual/evidence vocabulary)
# Orthogonal sibling pack (deployment homonym, never conflated):
# - fortune5-deployment-blocks-pack (ggen.bblock.catalog.v1)
