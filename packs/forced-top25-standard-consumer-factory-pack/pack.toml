[pack]
name = "forced-top25-standard-consumer-factory-pack"
version = "26.8.26"
description = "Compose R80 admissibility into canonical exact-head consumer and qualification projections"

[composition]
requires = ["forced-top25-admissibility-factory-pack"]

[capabilities]
forced_population = 25
standard_consumer_projection = true
qualification_projection = true
preserve_unknown_targets = true
zero_ambient_do = true

[qualification]
command = "python3 -m unittest discover -s packs/forced-top25-standard-consumer-factory-pack/tests -p 'test_*.py' -v"
