[pack]
name = "observation-capability-pack"
version = "0.1.0"
description = """
Evidence-first qualified capability contracts for the observation and telemetry family,
written for a capability-resolution engine (ash_pplan v26.9.30) to resolve against.

CAPABILITY = SEMANTIC IDENTITY, NEVER A PACKAGE. The three pinned identities
Observation.Tap, Observation.Sample, Telemetry.Emit (dotted IDs via rdfs:label and
dcterms:identifier; namespace ocap:) name what an actor CAN DO. Realizations name the
implementing provider with metadata (repo, module, version-pin policy) and never change
the capability identity.

EVIDENCE-FIRST LAW: every realization of an observation capability MUST state its
evidence requirement -- the receipt or observation record that proves the observation
happened (what record, what chain verifies it). A tap that cannot produce evidence is
refused by gate 040: either it declares no ocap:evidenceRequirement (REFUSED:
observation-without-evidence) or it declares ocap:evidenceCapable false (REFUSED:
evidence-incapable-tap). A gate with no witnessed refusal carries no bits; each gate
here has a negative fixture in qualification/fixtures/ that fires it (witnessed by
tests/test_observation_capability_pack.py, real rdflib SPARQL execution).

VERIFICATION SEMANTICS composed from public EARL (http://www.w3.org/ns/earl#): an
evidence record must be re-expressible as an earl:Assertion whose earl:result/
earl:outcome says whether the observed surface passed. EARL itself has no
delivery-semantics or authority vocabulary (recorded failed edge), which is why ocap:
extends rather than imports.

Delivery semantics are declared per capability (atLeastOnce / atMostOnce /
exactlyOnce / sampleMayDrop). ProviderAvailable != Authorized is encoded like the
sibling event-state pack: Telemetry.Emit and Observation.Flush are consequential
through their sink; a realization onto a consequential sink without an explicit bound
ocap:authorityRequirement is refused by gate 050, and ocap:providerAvailable true never
discharges authority.

Realization provider coordinates are cited, never fabricated: zcode-cli
src/ocel-tap.ts and xaas lib/xaas/telemetry/ocel_ndjson.ex + ocel_ash_emitter.ex were
confirmed by direct read on 2026-09-30; :telemetry / :telemetry_poller and Ash surfaces
are cited as public API coordinates without local inspection.

Grants no execution authority. Qualification is marketplace admission + real-ggen sync
only.
"""
