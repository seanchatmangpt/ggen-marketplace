[pack]
name = "ggen-self-pack"
version = "0.1.1"
description = "v0.1.1: `ggen pack new <name>` now also scaffolds packs/<name>/examples/README.md and packs/<name>/playground/SCRATCH.md -- real, runnable-demonstration and scratch-experimentation directories every newly constructed pack starts with, matching the convention several real existing packs (github-actions-pack, chicago-tdd-tools-pack, dfcm-develop-maximalist-pack, enterprise-architecture-connection-pack) already followed by hand but this constructor never scaffolded. Two new generation.rules entries, sourced from the SAME queries/pack_new.rq query every other scaffolded file already uses -- no new sp: vocabulary needed, since examples/playground presence is a structural convention of every pack, not a per-pack fact. v0.1.0: The canonical constructor for ggen packs. Its ontology describes pack structure itself (sp:Pack — name, description, template roles, required gate); `ggen pack new <name>` binds one sp:Pack individual from CLI args into input.ttl and runs this pack's own ggen.toml through the ordinary ggen-engine sync pipeline. Every future structural requirement on packs (e.g. \"packs must declare ownership\") is an edit to this pack's ontology.ttl/templates, not new Rust — and is inherited by every pack created afterward, never rediscovered by scanning existing packs. `ggen init self` materializes this pack into a project-local, hand-editable copy; that copy — not the one embedded in the ggen binary — is what `pack new` actually reads."
category = "infrastructure"
author = "ggen"
repository = "https://github.com/seanchatmangpt/ggen"
license = "MIT OR Apache-2.0"
production_ready = false

[pack.metadata]
tags = ["ggen", "meta-pack", "constructor", "self-pack", "bootstrap"]
keywords = ["ggen", "pack", "scaffold", "constructor", "ontology-first"]
