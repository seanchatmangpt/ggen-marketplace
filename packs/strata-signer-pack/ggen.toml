# strata-signer-pack generation contract.
#
# Detached-signature attestation constants projected from RDF for the Strata
# runtime. The [validation] gate refuses any AttestationKey that is not the
# ML-DSA-65 triple (signatureLen 3309, publicKeyLen 1952), so a malformed or
# weakened key spec is a typed refusal at sync time, never a silent projection.

[project]
name = "strata-signer-pack"
version = "0.1.0"
description = "Detached-signature attestation constants projected from RDF for the Strata runtime"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"

[validation]
gates = [
  "gates/010_mldsa65_lengths.rq",
  "gates/020_digest_binding.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "signer-keys"
query = { file = "queries/keys.rq" }
template = { file = "templates/signer.rs.tera" }
output_file = "signer.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "digest-binding"
query = { file = "queries/digest_bindings.rq" }
template = { file = "templates/signing.rs.tera" }
output_file = "signing.rs"
skip_empty = false
mode = "Overwrite"
