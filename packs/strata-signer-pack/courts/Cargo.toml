[package]
name = "strata-signer-courts"
version = "0.1.0"
edition = "2021"
publish = false

# Real ML-DSA-65 sign/verify courts (S3 extension, lane L24). The generated
# signing.rs is compiled UNMODIFIED into this crate via #[path] include; the
# ground-truth algorithm (~/strata/strata_protocol/src/signer.rs) is ported
# over the same ml-dsa crate version strata pins (0.1.1). Not a generated
# consequence: qualify_packs' decisions-keyed cargo sweep never targets it;
# run it directly with `cargo test --offline` from this directory.

[dependencies]
ml-dsa = "0.1.1"

[dev-dependencies]
