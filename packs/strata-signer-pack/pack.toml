[pack]
name = "strata-signer-pack"
version = "0.1.0"
description = """
Detached-signature attestation for Strata: attestation keys and detached
signatures over receipts and frames carried by the CLAP-PDU protocol types
from strata-protocol-pack.
"""
[capabilities]
# requires restored 2026-10-20 (F04 closure lane): qualify_packs.py resolves cross-pack
# capabilities.requires via transitive-closure consumer entries/shims, so the strata
# composition chain is declared here again (FM-PACK-018 tooling now handles it).
# (single-pack [packs] capsule), so a cross-pack require (attestation is carried by the CLAP-PDU protocol types) can never
# resolve there (FM-PACK-018). The composition relationship is documented in
# the description and the relationship note below.
provides = ["urn:ggen:pack:strata-signer-pack"]
requires = ["urn:ggen:pack:strata-protocol-pack"]

# Relationship note (NOT a pack.toml [dependencies] entry): the detached-signature attestation is carried by the CLAP-PDU protocol types
# modeled in packs/strata-protocol-pack (0.1.0), but ggen refuses a
# [dependencies] entry unless the consumer lists that pack in its own ggen.toml
# [packs] table (FM-PACK-014), and scripts/qualify_packs.py qualifies every pack
# in isolation with a single-pack [packs] table -- so a declared dependency
# could never resolve here. The relationship is documentation-only via
# [capabilities].requires above. Same precedented remediation as
# packs/a2a-durability-pack (FM-PACK-014).
