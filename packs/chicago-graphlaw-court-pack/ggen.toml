# Pack-local manifest: self-verification only (writes under generated/, never into a consumer).
# Consumers use consumer/ggen.toml (installed as <consumer>/ggen.toml).
[project]
name = "chicago-graphlaw-court-pack"
version = "26.9.29"
description = "Chicago GraphLaw court generator (pack-local self-verification)"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://chicago.graphlaw.dev/court#"
imports = ["cases/a.ttl", "cases/b.ttl"]

[ontology.prefixes]
cc = "https://chicago.graphlaw.dev/court#"
sh = "http://www.w3.org/ns/shacl#"
xsd = "http://www.w3.org/2001/XMLSchema#"

[generation]
output_dir = "."

[[generation.rules]]
name = "chicago-fibo-court"
query = { file = "queries/cases_fibo.rq" }
template = { file = "templates/chicago_court.rs.tmpl" }
output_file = "generated/tests/chicago_fibo.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "chicago-cross-authority-court"
query = { file = "queries/cases_xauth.rq" }
template = { file = "templates/chicago_court.rs.tmpl" }
output_file = "generated/tests/chicago_cross_authority.rs"
skip_empty = false
mode = "Overwrite"
