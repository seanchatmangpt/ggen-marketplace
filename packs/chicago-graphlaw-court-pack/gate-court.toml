# Semantic gate witness court (scripts/check_gate_witness_courts.py): every gate in gates/
# has a same-stem witness under witnesses/pass and witnesses/fail. Witnesses are graphs merged
# with ontology.ttl by verify/validate.py (`validate.py witnesses` runs them for real).
[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true
