[pack]
name = "dsrust-pack"
version = "0.1.0"
description = """
Universal DsRust generation vocabulary grounded in seanchatmangpt/dsrust at exact source commit
f24adde08c1d8850e4d7079d019643bb40f905cb (crate 0.1.0-alpha.2). This is the Rust-native
counterpart to dspy-pack: consumers declare signatures, modules, agent tools, and optimizers as RDF;
ggen projects them into compilable Rust construction code without granting generated code ambient
execution authority.

Admitted module kinds are exactly the public DsRust exports observed at that commit: Predict,
ChainOfThought, ReAct, ReActV2, MultiChainComparison, BestOfN, Refine, and Parallel. Admitted
optimizer kinds are exactly LabeledFewShot, BootstrapFewShot, COPRO, MIPROv2, and GEPA. The gate
fails closed for DSPy constructs not exported by DsRust at the admitted source identity (including
ProgramOfThought, CodeAct, RLM, retrieval/KNN, Ensemble, and KNNFewShot) rather than manufacturing
fictional Rust APIs.

Arbitrary tool bodies, reward bodies, metric bodies, trainset contents, and provider credentials are
consumer-owned authority. ggen therefore emits explicit panic/error seams for those bodies: generated
construction compiles, but attempting to execute an unimplemented consumer function fails loudly.
That is the Rust equivalent of dspy-pack's NotImplementedError scaffolds.
"""
