[pack]
name = "dsrust-pack"
version = "0.1.0"
description = """
Real dsrust (github.com/seanchatmangpt/dsrust, "a faithful, byte-for-byte Rust port of DSPy")
generation vocabulary, verified against dsrust's actual published source (0.1.0-alpha.2, not
docs prose) -- every dsrust API this pack's template calls (LM::new, with_openai_base_url,
with_openai_key, configure, Signature::from_str/with_instructions, Predict::from_signature,
call!, Prediction::get) was read directly from dsrust's real src/ on GitHub before this pack
was written, and the generated output was compiled and run for real (see evidence/).

Pure law -- ontology.ttl ships zero individuals, so composing this pack cannot inject any
signature, module, or LM config into a consumer's generated src/dsrust_program.rs. A consumer
project supplies its own individuals against this vocabulary in its own .ttl, the same
convention this marketplace's dspy-pack (Python DSPy) already establishes -- this pack mirrors
that pattern for dsrust (Rust DSPy) rather than duplicating a second, incompatible convention.

dsrust:Signature/InputField/OutputField -- fields admit a primitive dsrust:rustType (String/
bool/i64/f64) OR dsrust:hasLiteralOption (an ordered enum constraint) -- exactly one of the two
per field. A field with dsrust:hasLiteralOption gets its allowed values written directly into
the generated Signature's real instructions text via dsrust's real
Signature::with_instructions(), not left implicit -- the real, verified fix for the exact
failure this pack's first consumer (ggen-legacy's dsrust-disposition-proposer) hit by hand: an
unconstrained free-text output field, asked of a real model, does not reliably return one of a
closed vocabulary's exact values.

dsrust:Module -- one real dsrust module kind for this version: Predict, built via dsrust's real
Predict::from_signature(signature) (confirmed in dsrust's own src/predict.rs), not the
predict!() string macro, precisely so a literal-constrained signature's modified instructions
can be threaded through. ChainOfThought and other real dsrust module kinds
(ReAct/BestOfN/Refine/MultiChainComparison/Parallel-as-execution-policy, per dsrust's own real
module vocabulary) are real and out of scope for v0.1.0, not silently assumed present.

dsrust:LMConfig -- an OpenAI-compatible provider configuration via dsrust's real
LM::new/with_openai_base_url/with_openai_key builder. dsrust:apiKeyEnv names the environment
variable the generated binary reads the credential from at runtime -- never a literal key value,
which this ontology has no property for at all (a credential is not a fact this graph can carry).

Non-goals for v0.1.0: dsrust's real Optimizer types (BootstrapFewShot/COPRO/MIPROv2/GEPA/...),
ReAct/MCP tool use, Pydantic-equivalent nested-struct output fields, and the derive-macro typed
`#[derive(Signature)]` path (real and more efficient at scale, but its exact attribute grammar
was not independently verified against dsrust's real source before this version -- the string
Signature + Predict::from_signature path used here was verified end-to-end, compiled and run
for real, before being generated by this pack).
"""
