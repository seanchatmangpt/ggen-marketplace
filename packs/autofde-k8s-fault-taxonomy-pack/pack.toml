[pack]
name = "autofde-k8s-fault-taxonomy-pack"
version = "1.0.0"
description = "Packages the real AutoFDE Kubernetes fault-taxonomy vocabulary (Component x FailureMode x AppTopology x Severity, a standard public K8s troubleshooting vocabulary) as an admission gate: a customer's own fault-catalog entries (afl:FaultCatalogEntry) are typed against the enumerated afl:Component and afl:FailureMode individuals and refused if they reference an unknown or misspelled fault code. This pack admits fault-catalog data against a taxonomy; it does not detect, monitor, or claim any live-cluster incident."
