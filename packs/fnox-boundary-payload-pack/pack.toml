[pack]
name = "fnox-boundary-payload-pack"
version = "0.1.0"
description = """fnox FNOX-PRD-08 boundary payload shapes as capital: closed SHACL NodeShapes
(`bnd:MonetaryAmountPayload` targeting FIBO MonetaryAmount, `bnd:ActivityPayload` targeting PROV-O
Activity) over public terms only (FIBO, PROV-O, DCTerms), copied from fnox
ontology/boundary/payload-shapes.ttl with provenance. One frontmatter template
(templates/boundary_models.py.tera) projects them to deterministic Pydantic models
(`extra="forbid"`, optional when sh:minCount is 0) at
pipeline/enterprise_pipeline/boundary/boundary_models.py; an unsupported xsd datatype renders a
loud failure token rather than a silent type. Generated models carry no DO authority and prove
only shape projection, not runtime payload validation."""

[metadata]
category = "data-modeling"
tags = ["fnox", "shacl", "pydantic", "boundary", "fibo", "prov-o"]

[capabilities]
provides = ["urn:ggen:pack:fnox-boundary-payload-pack"]
requires = []
