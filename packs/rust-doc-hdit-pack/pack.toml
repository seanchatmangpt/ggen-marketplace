[pack]
name = "rust-doc-hdit-pack"
version = "0.1.0"
description = "ggen-first documentation manufacturing for Rust crates: extracts code-surface facts (modules, functions, structs, enums, resources, actions, verbs with signatures/params/defaults/errors/invariants) into RDF, renders Diataxis skeletons (rigid reference tables, bounded commentary fences for how-to/explanation), verifies doc coverage against the code surface with VSA hypervectors (H_code/H_doc), and certifies passing documents with a BLAKE3 receipt via affidavit. Runtime deps: oxigraph (SPARQL), tree-sitter (AST extraction), wasi (sandboxed runners)."
