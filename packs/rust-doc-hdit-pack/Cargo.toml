[package]
name = "doc-hdit"
version = "0.1.0"
edition = "2021"
description = "VSA + information-theory verification core for HDIT doc-quality courts"
license = "MIT"

[lib]
name = "doc_hdit"
path = "src/lib.rs"

[[bin]]
name = "doc-hdit"
path = "src/bin/doc-hdit.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", optional = true }

[features]
default = []
blake3 = ["dep:blake3"]

[profile.release]
opt-level = 3
