[project]
name = "fanout-realization-controller-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "fanout-realization-control-plan"
query = { file = "queries/80-clean-control-frontier.rq" }
template = { file = "templates/control-plan.json.tera" }
output_file = "generated/fanout-realization/control-plan.json"

[[generation.rules]]
name = "fanout-realization-control-court"
query = { file = "queries/80-clean-control-frontier.rq" }
template = { file = "templates/control-court.py.tera" }
output_file = "generated/fanout-realization/qualification_court.py"

[[generation.rules]]
name = "fanout-control-realization-report-r25"
query = { file = "queries/r25-29-clean-current-decision-frontier.rq" }
template = { file = "templates/control-realization-report.json.tera" }
output_file = "generated/fanout-realization/control-realization-r25.json"

[[generation.rules]]
name = "fanout-control-realization-court-r25"
query = { file = "queries/r25-29-clean-current-decision-frontier.rq" }
template = { file = "templates/control-realization-court.py.tera" }
output_file = "generated/fanout-realization/control-realization-r25-court.py"
