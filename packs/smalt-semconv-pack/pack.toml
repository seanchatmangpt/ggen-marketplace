[pack]
name = "smalt-semconv-pack"
version = "26.10.16"
description = """
Semantic-convention projection pack for smalt telemetry (W2b / W7): projects
lib/smalt/telemetry/semconv/registry.ex from smaltv:SemConvEvent,
smaltv:SemConvAttribute and smaltv:OcelMappingRule individuals — the full
smalt.yaml semconv model (weaver definition/2 style) as ontology rows, plus
the runtime-key bindings and the otel-weaver-ocel-pack OTEL→OCEL mapping
table. The sealed hand-render of the YAML model becomes a true graph
projection; the YAML stays as the mirrored human-readable model and the
test/semconv_test.exs model fence stays as the behavioral gate.
"""

[capabilities]
provides = ["urn:ggen:pack:smalt-semconv-pack"]
requires = ["urn:ggen:pack:graphlaw-ash-capability-pack"]
