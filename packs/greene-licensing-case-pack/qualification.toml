# Isolated marketplace qualification (scripts/qualify_packs.py) loads only a
# pack's root ontology.ttl; the case, deck and bridge instance files are
# unioned in here so the qualification render projects the real packet.
[consumer]
extra_ontologies = [
  "ontology/greene-case.ttl",
  "ontology/greene-deck.ttl",
  "ontology/cs-pres-bridge.ttl",
]
