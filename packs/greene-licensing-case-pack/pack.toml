[pack]
name = "greene-licensing-case-pack"
version = "0.1.0"
description = "Licensing proposal packet for the strategic-doctrine executable lab, modeled as a canonical Semantic Case Study (cs:CaseStudy, semantic-case-study-pack). The case binds five claims to the exact autofde-lab doctrine-lab receipt digests (ledger tail, matrix, report, report.json and ledger.jsonl sha256) and to the strategic-doctrine-pack catalog digest, each with standing ALIVE_FIXTURE, evidence ceiling REPO_LOCAL_FIXTURE and authority ceiling NONE; five explicit cs:NonClaim nodes (not licensed; no affiliation or support implied; no book excerpts; no real-world performance claims; draft authored by the user and never sent). ontology/cs-pres-bridge.ttl maps cs:Projection onto pptx-presentation-pack's pres:Presentation/pres:Slide so the 10-slide deck in ontology/greene-deck.ttl is a lawful projection that may omit claims and never add one. Templates (ggen sparql frontmatter) project the proposal letter (at most two pages, signed by the user as sender, status PROPOSAL_DRAFT), the rights table, the evidence appendix (digests plus replay commands) and the demo spec; the deck facts are modeled here but NOT rendered by this pack: pptx-presentation-pack ships only .eex templates, which ggen refuses (FM-PACK-005), so runners/render_packet.py renders the four packet documents only and any .pptx is built outside this pack from greene-deck.ttl. Imports (semantic-case-study-pack, pptx-presentation-pack, evidence-standing-pack, decision-optionality-pack) are declared here and wired by runners/render_packet.py, not as pack.toml [dependencies]: ggen refuses a [dependencies] entry unless the consumer lists that pack in [packs] (FM-PACK-014), refuses template-less packs (pptx: .eex only; decision-optionality: none) as [packs] entries (FM-PACK-005), and scripts/qualify_packs.py qualifies each pack in isolation without composing dependencies. The runner therefore lists semantic-case-study-pack in [packs], imports the other three at ontology level, and passes this pack's ontology/ instance files as extra_ontologies (ggen loads only a pack's root ontology.ttl); qualification.toml does the same for isolated qualification. Three fail-closed SPARQL gates (050 no affiliation/support language, 060 no quoted source text, 070 letter author is the user and nothing is sent) with an exact-stem gate-witness court and semantic runner. Authority NONE, ceiling SELECT/CONSTRUCT, never DO; nothing in this pack is sent to anyone."

