[pack]
name = "sa2a-chicago-court-pack"
version = "0.2.0"
description = """
SPARQL-driven Chicago adversarial court suite generator, rebuilt on the REAL
ash_a2a court machinery (SA2A-B5 authority/BRCE dispatch path, SA2A-B11 wire
path, the authority harness, and the independent-postcondition court).
Generates an ExUnit court suite (setup/teardown over real collaborators,
a positive control plus a kill per court, Chicago zero-mock rules) bound to
the consumer's resource/skill names via chi:SuiteConfig -- templates never
hardcode module names (gates/000 refuses the wave-1 failure mode).
"""

[dependencies]
"praxis-core-pack" = "0.1.0"
# Kept from 0.1.x, now meaningful: the parallel M4 lane revived this pack, and
# the Spark DSL entities it defines are what the generated suite's `use` of the
# agent extension compiles against.
"sa2a-spark-dsl-pack" = "0.1.0"
"sa2a-governed-process-pack" = "0.1.0"
