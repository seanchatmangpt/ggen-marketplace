[pack]
name = "sa2a-chicago-court-pack"
version = "0.1.0"
description = """
Self-contained, ggen-pack-only full deployment of Chicago-style adversarial courts.
Generates complete Elixir test suites exercising real collaborators with zero mocks,
falsifiers (positive, negative, mutation), exact-SHA receipts, and OCEL 2.0 telemetry.
Solves the bootstrap, chicken-and-egg, first-mile, and last-mile testing dilemmas.
"""

[dependencies]
"praxis-core-pack" = "0.1.0"
"sa2a-spark-dsl-pack" = "0.1.0"
"sa2a-governed-process-pack" = "0.1.0"
