# Pack-local manifest: self-verification only (writes under generated/, never
# into a consumer). Consumers copy this manifest into their own project, point
# chi:SuiteConfig at their own resource/skill names, and sync: the courts
# query joins their bindings and the template renders their court suite.

[project]
name = "sa2a-chicago-court-pack"
version = "0.2.0"
description = "Chicago court suite generator (pack-local self-verification)"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "urn:chicago:court:"
imports = []

[ontology.prefixes]
chi = "urn:chicago:court:"
xsd = "http://www.w3.org/2001/XMLSchema#"

[generation]
output_dir = "."

[[generation.rules]]
name = "chicago-court-suite"
query = { file = "queries/courts.rq" }
template = { file = "templates/chicago_suite_test.exs.tmpl" }
output_file = "generated/chicago_court_suite_test.exs"
skip_empty = false
mode = "Overwrite"
