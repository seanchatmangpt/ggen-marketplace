[project]
name = "swarmsh-autonomic-coordination"
version = "26.8.25"
description = "Manufacture swarmsh coordination capability projections without granting execution authority"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/swarmsh-autonomic-coordination#"
imports = []

[ontology.prefixes]
sw = "https://ggen.dev/ontology/swarmsh-autonomic-coordination#"
prov = "http://www.w3.org/ns/prov#"
skos = "http://www.w3.org/2004/02/skos/core#"
dcterms = "http://purl.org/dc/terms/"
odrl = "http://www.w3.org/ns/odrl/2/"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"

[generation]
output_dir = "."

[[generation.rules]]
name = "shell-capability-projection"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/swarmsh-capabilities.sh.tmpl" }
output_file = "consumer/swarmsh/generated/swarmsh-capabilities.sh"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "rust-capability-projection"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/swarmsh_capabilities.rs.tmpl" }
output_file = "consumer/swarmsh-v2/generated/swarmsh_capabilities.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "capability-reference"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/SWARMSH_CAPABILITIES.md.tmpl" }
output_file = "consumer/reference/SWARMSH_CAPABILITIES.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "qualification-contract"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/swarmsh-qualification.json.tmpl" }
output_file = "consumer/qualification/swarmsh-qualification.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "release-standing"
query = { file = "queries/release.rq" }
template = { file = "templates/RELEASE_STANDING.json.tmpl" }
output_file = "consumer/qualification/RELEASE_STANDING.json"
skip_empty = false
mode = "Overwrite"
