[pack]
name = "ex-noun-verb-cli-pack"
version = "26.9.11"
description = """
Milestone 2 of ex_noun_verb_cli's design spec
(~/ex_noun_verb_cli/docs/superpowers/specs/2026-09-11-ex-noun-verb-cli-design.md,
section 5): the concrete Python-displacement evidence for scripts/marketplace.py.

Named `ex-noun-verb-cli-pack` after the library it exercises (`ex_noun_verb_cli`),
not `marketplace-cli-pack` -- every pack here already lives in the marketplace,
so a pack name repeating "marketplace" is redundant with its own location.

Unlike this marketplace's other packs, this pack's real deliverable is not a
Tera-templated generator -- ex_noun_verb_cli is generator-first per its own
charter, but proving the library works against a real consumer is this
milestone's actual job. The deliverable is a real, runnable, hand-built Elixir
consumer application under `packages/marketplace-cli/`:

  * `mix marketplace_cli.validate` / `mix marketplace_cli.catalog` -- real
    ex_noun_verb_cli-based Igniter.Mix.Tasks, dispatching through
    `ExNounVerbCli.Dispatcher.dispatch/2` against a real
    `ExNounVerbCli.Registry.Generated`-backed registry
    (`MarketplaceCli.Registry`), exactly as `~/ex_noun_verb_cli`'s own generic
    `mix ex_noun_verb_cli marketplace validate --root <path>` adapter would
    dispatch the same call.
  * `MarketplaceCli.GraphProvider.GgenIgniterProvider` -- a real
    `ExNounVerbCli.GraphProvider` implementation wrapping
    `GgenIgniter.Ontology.load!/1` + `GgenIgniter.Query.run/2` (real oxigraph
    NIF-backed SPARQL via ggen_igniter's default `sparql` engine path), used
    to report each pack's real ontology triple count -- the one place in
    `scripts/marketplace.py`'s validate/catalog logic that is genuinely
    SPARQL-shaped rather than plain file/TOML inspection. Every other piece
    of `marketplace.py`'s `inspect_marketplace()`/`validate()`/`catalog()`
    logic (pack.toml TOML parsing, SemVer validation, ontology/template/gate
    file discovery, required-Diataxis-doc checks) is plain filesystem
    walking, ported as such in `MarketplaceCli.Inspector` with no graph query
    forced in where none is genuinely useful.
  * `MarketplaceCli.Inspector` -- the real Elixir port of
    `inspect_marketplace()`/`validate()`/`catalog()`, verified for real
    behavioral parity against `python3 scripts/marketplace.py validate` run
    against this same marketplace tree (see the consumer app's own test
    suite and this pack's own commit message for the real comparison
    output).

This pack's own `ontology.ttl` describes the milestone's capability shape (not
a template's generation target) so `scripts/marketplace.py inspect_marketplace()`'s
`ONTOLOGY_SOURCE_MISSING` check admits this pack like any other. Its
`nvc:CliVerb`/`nvc:noun`/`nvc:verb`/`nvc:belongsTo`/`nvc:displaces`/
`nvc:usesLibrary`/`nvc:usesGraphEngine` facts each have a real consuming
SPARQL query under `queries/` (`cli_verbs.rq`, `capability_shape.rq`) --
this pack's generation-adjacent consumer in place of a Tera template --
executed for real by `packages/marketplace-cli/test/marketplace_cli/cli_verbs_query_test.exs`.

Scaffolded via `ggen pack new ex-noun-verb-cli-pack` (the canonical self-pack
constructor), not hand-authored from scratch -- see this pack's own README.md
for the generator's real receipt.

## Extension: real capability-parity graph vs. clap-noun-verb (26.9.11)

Beyond the milestone-2 marketplace_cli evidence above, this pack's
`ontology.ttl` also models, as real data, how much of the Rust original
`~/clap-noun-verb`'s design `~/ex_noun_verb_cli` actually ports: 10
`nvc:PortedCapability` individuals (each with a real `file:line` citation
into `~/ex_noun_verb_cli/lib/`, read and verified in full) and 8
`nvc:DeferredCapability` individuals (each with a real design-spec
non-goal citation, a real in-code TODO citation, or an explicitly verified
absence note -- never an invented gap). It also models the real 10 example
programs under `~/clap-noun-verb/examples/` that demonstrate the cited
verbs, the real local `clap-noun-verb-capability-pack`, and the 12 real
`clap-noun-verb-*-pack` packs already living in this same marketplace
(their real `gates/*.rq` counts and, for the schema pack, real
`ontology.ttl` class count).

7 gates under `gates/*.rq` enforce this graph's own integrity (every ported
claim has file evidence, every deferred claim has spec evidence, no
capability escapes the closed PORTED/DEFERRED dichotomy, no citation blurs
both evidence shapes at once, every verb/example/pack carries a real
traceable path or count). 6 further queries under `queries/*.rq` read this
graph back for real, each designed to back one real `ExUnit` test in
`packages/marketplace-cli/test/` (asserting exact row counts: 10 ported,
8 deferred, 10 example->verb links, 12 marketplace packs, 26 total gates
across all cited packs).

See `errc-tracker.md` for the ERRC pass over this extension (what's
promotable from DEFERRED to PORTED next, and what net-new capital this
extension itself manufactures).

## Extension 2: a real generation layer (26.9.11)

Beyond documenting capability parity, `ontology.ttl`'s "EXTENSION 2" section
adds a real, renderable shape: `nvc:GeneratedCliProject` /
`nvc:GeneratedVerb` (`rdfs:subClassOf nvc:CliVerb`) / `nvc:GeneratedArgument`.
Given a project instance graph (`playground/greet-cli.ttl`, a real two-noun/
four-verb `greet_cli` CLI: `greet hello`/`greet shout`/`math add`/
`math multiply`), 5 real Tera templates under `templates/*.tmpl`
(`mix.exs.tmpl`, `config.exs.tmpl`, `registry.ex.tmpl`, `handler_stub.ex.tmpl`,
`README.md.tmpl`) produce a genuine, compiling Elixir consumer of
`~/ex_noun_verb_cli`'s real public API (`ExNounVerbCli.Registry.Generated`'s
`verbs:` shape, `ExNounVerbCli.Escript` as `mix.exs`'s `escript:
main_module`) -- not stubs: `nvc:handlerBodyExpr` playground facts (e.g.
`"x + y"`) become real, non-`todo!()` handler function bodies.

`verify/render_check.exs` is the real proof: run via
`cd ~/ggen_igniter && mix run <this pack>/verify/render_check.exs`, it loads
`playground/greet-cli.ttl`, parses each template's real frontmatter
(`GgenIgniter.Frontmatter.split_template/1`), runs every named SPARQL query
via the real oxigraph engine (`GgenIgniter.Query.Oxigraph.run/2` --
`ORDER BY`-correct, unlike the default `sparql`-hex engine), renders both the
`to:` path and the template body via the real WASM Tera renderer
(`GgenIgniter.Render.TeraWasm.render/2`), writes every output under
`examples/greet-cli/`, and `Code.string_to_quoted!/1`-validates every
generated `.ex`/`.exs` file. Verified 2026-09-11: 6 files written, 5 Elixir
files, all 5 quoted-ok, `render_check: PASS`.

Ceiling verification, not just floor: a scratch copy of the generated project
(with a `path:` override for `{:ex_noun_verb_cli, ...}` since it is not yet
published to Hex -- confirmed 404, `nvc:exNounVerbCliVersion`'s own comment
-- plus an explicit `{:igniter, "~> 0.5"}` dep, since `ex_noun_verb_cli`
declares `:igniter` as `optional: true`, which Mix does not pull in for a
consumer that does not itself depend on it) really ran `mix deps.get`,
`mix compile --warnings-as-errors` (clean), `mix escript.build`, and the
built `./greet_cli` binary for real, producing real JSON envelopes for all
four verbs plus a real `unknown_verb` error envelope on an unregistered
`math divide`.

4 new gates (`gates/080`-`083`) enforce this generation shape's own
integrity, ASK-true-means-violation per this pack's existing convention,
each verified BOTH clean (`ASK=False`) against the real `playground/
greet-cli.ttl` AND falsification-hardened (a real, independent mutation per
gate flips its ASK to `True`) via `rdflib`, 2026-09-11 -- see README.md for
the full falsifier table.
"""
category = "cli-framework"
author = "ggen"
license = "MIT OR Apache-2.0"
production_ready = false

[pack.metadata]
tags = ["ggen", "noun-verb", "cli", "elixir", "capability-parity", "clap-noun-verb"]
keywords = ["ggen", "pack", "ex_noun_verb_cli", "marketplace-python-displacement", "clap-noun-verb-parity"]
