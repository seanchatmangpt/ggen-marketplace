[project]
name = "castle-paas"
version = "26.8.26"
description = "Generate CASTLE Ash/Reactor platform resources, catalogs, and public-ontology references"
authors = ["Sean Chatman"]
license = "AGPL-3.0"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/castle-paas#"

[ontology.prefixes]
cp = "https://ggen.dev/ontology/castle-paas#"
dcterms = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"
odrl = "http://www.w3.org/ns/odrl/2/"
dcat = "http://www.w3.org/ns/dcat#"
skos = "http://www.w3.org/2004/02/skos/core#"
sosa = "http://www.w3.org/ns/sosa/"
sh = "http://www.w3.org/ns/shacl#"
schema = "https://schema.org/"

[generation]
output_dir = "."

[[generation.rules]]
name = "castle-paas-ash-resources"
query = { file = "queries/resources.rq" }
template = { file = "templates/lib/castle_paas/generated/resources.ex.tmpl" }
output_file = "generated/lib/castle_paas/generated/resources.ex"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-paas-ash-domain"
query = { file = "queries/resources.rq" }
template = { file = "templates/lib/castle_paas/generated/domain.ex.tmpl" }
output_file = "generated/lib/castle_paas/generated/domain.ex"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-paas-resource-catalog"
query = { file = "queries/resources.rq" }
template = { file = "templates/lib/castle_paas/generated/resource_catalog.ex.tmpl" }
output_file = "generated/lib/castle_paas/generated/resource_catalog.ex"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-paas-reactor-catalog"
query = { file = "queries/reactors.rq" }
template = { file = "templates/lib/castle_paas/generated/reactor_catalog.ex.tmpl" }
output_file = "generated/lib/castle_paas/generated/reactor_catalog.ex"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-paas-public-ontology-manifest"
query = { file = "queries/public-ontologies.rq" }
template = { file = "templates/priv/semantic/public_ontology_manifest.ttl.tmpl" }
output_file = "generated/priv/semantic/public_ontology_manifest.ttl"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-paas-resource-reference"
query = { file = "queries/resources.rq" }
template = { file = "templates/CASTLE_PAAS_GENERATED.md.tmpl" }
output_file = "generated/docs/CASTLE_PAAS_GENERATED.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-paas-reactor-reference"
query = { file = "queries/reactors.rq" }
template = { file = "templates/CASTLE_PAAS_REACTORS.md.tmpl" }
output_file = "generated/docs/CASTLE_PAAS_REACTORS.md"
skip_empty = false
mode = "Overwrite"
