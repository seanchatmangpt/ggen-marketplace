[pack]
name = "receipt-provenance-unification-pack"
version = "0.1.0"
description = """
One schema for the five receipt contracts currently hand-maintained in five separate, non-communicating places across the gym ecosystem: ggen-ecosystem's ecosystem-sync/v2 (a 200-line python3 block embedded in scripts/verify-receipt.sh, whose field contract is ALSO restated as a markdown table in docs/RECEIPT-SCHEMA.md), ggen-ecosystem's ecosystem-bootstrap/v1 (a receipt shape on disk with NO validator), gym-ecosystem's gym-autonomic-crown/v2 (artifacts/autonomic-crown.json, emitted by scripts/crown-submodules.py, NO validator), autofde-lab's receipt.schema.json (chain-digest verification only, no field-shape checks), and autofde-lab's chatman-clean-session-receipt.schema.json (JSON Schema, NO executable validator). Every individual carries rp:sourceFile/rp:sourceLine citations to the real file it was transcribed from. Reuses prov:/dcterms:/dcat:/skos:/dqv:; mints rp: only for dottedPath/valueForm/reasonDelimiter/contractKey, which no public vocabulary covers.

Generates (1) generated/unified_receipt_validator.py -- one validator covering all five contracts, with dotted-path resolution including `submodules[].current`-style array mapping (which no existing validator does), and (2) generated/receipt_contract_matrix.json -- a machine-consumable census.

Verified live 2026-09-06 with ggen 26.8.28: `ggen sync run` writes both files (graph_hash 8737195c..., closure recorded); second run reports `skipped: unchanged: content identical` for the matrix. The generated validator reaches 4/4 exit-code parity with the REAL hand-written scripts/verify-receipt.sh across valid / bad-sha1 / missing-mandatory-field / placeholder-under-ALIVE fixtures, and returns VALID on the two real receipts on disk (artifacts/autonomic-crown.json, 13 submodule elements checked per-element; receipts/bootstrap-ggen-ecosystem-sync.json) -- neither of which has any validator today. Falsified, not just asserted: mutating one submodule SHA to 'NOTASHA' and one default_ref from refs/heads/main to 'main' both produce exit 1 with the exact failing value-form and its source file.

Measured divergence recorded as a dqv:Consistency annotation, not an opinion: the SAME standing token is mutually invalid across the two repos. `REFUSED[MARKETPLACE_IDENTITY_MISMATCH]` passes verify-receipt.sh (exit 0) and fails clean_session (exit 1); `REFUSED:MARKETPLACE_IDENTITY_MISMATCH` fails verify-receipt.sh (exit 1) and passes clean_session (exit 0) -- a perfect XOR, so no receipt can express a typed refusal that both repos accept.

Authority boundary (see PROVENANCE.md, gates/01_no_actuation.rq): read-only predicate + data census only. Writes nothing, admits nothing; consequential DO stays behind GymAct/BRCE. NOT claimed: subsumption of receipt_store.verify_chain's chain-link re-derivation (an algorithm over an ordered ledger, out of field-shape scope), parity beyond the 4 exercised fixtures, or any adoption -- this pack is purely additive and modifies no existing pack, script, schema, or receipt.
"""
