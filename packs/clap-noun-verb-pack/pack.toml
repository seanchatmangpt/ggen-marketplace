[pack]
name = "clap-noun-verb-pack"
version = "0.1.0"
# DEPRECATED. Superseded by clap-noun-verb-schema-pack, clap-noun-verb-crate-pack,
# clap-noun-verb-routing-pack, clap-noun-verb-behavior-pack, clap-noun-verb-boundary-pack, and
# clap-noun-verb-verification-pack (see description below for the full account).
#
# [pack] here holds ONLY name/version/description on purpose. ggen's real pack
# loader (invoked when another project composes this pack as a dependency --
# scripts/qualify_packs.py's non-"project"-profile qualification path exercises
# exactly that route) deserializes [pack] with deny-unknown-fields and admits
# only those three keys; any sibling key or table (flat or nested, e.g. a prior
# `deprecated = true` / `superseded_by = [...]` pair, or a `[pack.lifecycle]`
# sub-table) is refused at load time with FM-PACK-003, independent of what
# docs/reference/pack-contract.md's "extension tables are allowed" describes for
# marketplace.py's own lenient cataloging. Verified live: re-running
# `python3 scripts/qualify_packs.py` after each shape (flat keys, then a
# `[pack.lifecycle]` sub-table) reproduced the same FM-PACK-003 refusal; only
# name/version/description qualifies (121/122 -> 122/122). See this pack's
# `description` below for the deprecation/successor narrative in prose.
description = "DEPRECATED, superseded by clap-noun-verb-schema-pack, clap-noun-verb-crate-pack, clap-noun-verb-routing-pack, clap-noun-verb-behavior-pack, clap-noun-verb-boundary-pack, and clap-noun-verb-verification-pack. Compatibility-only route-skeleton pack. It preserves the legacy packed cnv:args representation, built-in session/user specimen commands, raw cnv:staticResponse surface, and crate::verbs::handlers::* seam for existing consumers such as receiptctl. New CLIs must compose the successor packs instead. The zero-code compiler uses first-class cnv:Argument nodes, closed typed behavior enums, admitted boundaries, real compiled-binary tests, and never imports this pack or its specimen commands."
