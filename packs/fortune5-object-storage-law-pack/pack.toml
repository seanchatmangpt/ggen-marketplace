[pack]
name = "fortune5-object-storage-law-pack"
version = "26.7.31"
description = """
Constitutional object-storage law for Fortune 5 evidence and object
buckets. Admitted by fortune5-deployment-blocks-pack as the
object-storage bb:commonPack alongside fortune5-retention-pack.
Declares versioning, encryption-at-rest, immutable-capable posture,
lifecycle rules, and evidence requirements. SPARQL gates and SHACL
shapes refuse incomplete storage contracts, disabled versioning or
encryption, non-positive lifecycle days, and any ontology-declared
direct cloud actuation. Frontmatter templates project inventory +
contract TTL under infrastructure/data/object-storage/. Broker-only:
BRCE remains the actuation boundary. No secrets, access keys, or sealed
object payloads are minted.
"""

[metadata]
category = "governance"
tags = [
  "fortune5",
  "f500",
  "f5",
  "object-storage",
  "versioning",
  "lifecycle",
  "immutable",
  "broker-only",
]

[capabilities]
provides = ["urn:ggen:pack:fortune5-object-storage-law-pack"]
requires = []

[consumer_contract]
runtime = []
elixir_tier = "none (law pack; Ash/data-plane owned by downstream provider packs)"
peer_context = "catalog sibling fortune5-retention-pack (directory fortune5-retention-legal-hold-pack provides that catalog URN)"
projected_outputs = [
  "infrastructure/data/object-storage/object_storage_inventory.md",
  "infrastructure/data/object-storage/object_storage_contract.ttl",
]

# Frontmatter-schema pack (ggen 26.11.5): gates in pack.toml, not ggen.toml.
# Any row returned by a gate = refusal.
[validation]
gates = [
  "gates/010_storage_contract.rq",
  "gates/020_broker_only_no_actuation.rq",
]
