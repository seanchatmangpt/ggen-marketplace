[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
runner = "python3 qualification/verify.py"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true

[[gate]]
stem = "010_profile_enum_closure"
pass = "witnesses/pass/010_profile_enum_closure.ttl"
fail = "witnesses/fail/010_profile_enum_closure.ttl"

[[gate]]
stem = "020_profile_required"
pass = "witnesses/pass/020_profile_required.ttl"
fail = "witnesses/fail/020_profile_required.ttl"
