[project]
name = "aaif-profile-tailoring-pack"
version = "0.1.0"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "aaift-k8s-overlay"
query = { file = "queries/10-profile.rq" }
template = { file = "templates/k8s-overlay.yaml.tmpl" }
output_file = "dist/profile/k8s-overlay.yaml"

[[generation.rules]]
name = "aaift-profile-summary"
query = { file = "queries/20-profile-summary.rq" }
template = { file = "templates/deployment-profile.json.tmpl" }
output_file = "dist/profile/deployment-profile.json"

[validation]
gates = [
  "gates/010_profile_enum_closure.rq",
  "gates/020_profile_required.rq",
]
