# composition-solver-pack generation contract.
#
# Bounded stratified cover: [[inference.rules]] run once each, in order, and each sees the
# triples folded in by its predecessors. Stage 0 admits the given propositions; stages
# 1..4 are one identical CONSTRUCT unrolled four times, so derivation depth is bounded by
# the stage count. gates/020_stage_bound_converged.rq refuses a graph that a fifth stage
# would still change, so a depth overrun is a typed refusal, never a silent miss.
# The stage bound is documented in docs/reference/composition-solver-contract.md (L1).
#
# Authority: queries SELECT, templates CONSTRUCT candidate JSON. DO atoms are never
# enabled; they surface only as BLOCKED_AUTHORITY. Output standing is UNKNOWN, authority NONE.

[project]
name = "composition-solver-pack"
version = "26.9.0"

[ontology]
source = "ontology.ttl"
imports = ["ontology/basis.ttl", "ontology/requirements.ttl"]

[generation]
output_dir = "."

[[inference.rules]]
name = "stage-0-given"
order = 0
construct = 'PREFIX p: <https://seanchatmangpt.github.io/packs/composition-solver-pack#> CONSTRUCT { ?x p:derivable true } WHERE { ?x p:given true }'

[[inference.rules]]
name = "stage-1-compose"
order = 1
construct = 'PREFIX p: <https://seanchatmangpt.github.io/packs/composition-solver-pack#> CONSTRUCT { ?a p:enabled true . ?prov p:derivable true } WHERE { ?a a p:CapabilityAtom ; p:provides ?prov ; p:authorityClass ?c . FILTER(?c != "DO") FILTER NOT EXISTS { ?a p:requires ?r . FILTER NOT EXISTS { ?r p:derivable true } } }'

[[inference.rules]]
name = "stage-2-compose"
order = 2
construct = 'PREFIX p: <https://seanchatmangpt.github.io/packs/composition-solver-pack#> CONSTRUCT { ?a p:enabled true . ?prov p:derivable true } WHERE { ?a a p:CapabilityAtom ; p:provides ?prov ; p:authorityClass ?c . FILTER(?c != "DO") FILTER NOT EXISTS { ?a p:requires ?r . FILTER NOT EXISTS { ?r p:derivable true } } }'

[[inference.rules]]
name = "stage-3-compose"
order = 3
construct = 'PREFIX p: <https://seanchatmangpt.github.io/packs/composition-solver-pack#> CONSTRUCT { ?a p:enabled true . ?prov p:derivable true } WHERE { ?a a p:CapabilityAtom ; p:provides ?prov ; p:authorityClass ?c . FILTER(?c != "DO") FILTER NOT EXISTS { ?a p:requires ?r . FILTER NOT EXISTS { ?r p:derivable true } } }'

[[inference.rules]]
name = "stage-4-compose"
order = 4
construct = 'PREFIX p: <https://seanchatmangpt.github.io/packs/composition-solver-pack#> CONSTRUCT { ?a p:enabled true . ?prov p:derivable true } WHERE { ?a a p:CapabilityAtom ; p:provides ?prov ; p:authorityClass ?c . FILTER(?c != "DO") FILTER NOT EXISTS { ?a p:requires ?r . FILTER NOT EXISTS { ?r p:derivable true } } }'

[[generation.rules]]
name = "requirement-coverage"
query = { file = "queries/10-coverage.rq" }
template = { file = "templates/coverage.json.tera" }
output_file = "generated/composition-solver/coverage.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "selected-atoms"
query = { file = "queries/20-selected-atoms.rq" }
template = { file = "templates/selected-atoms.json.tera" }
output_file = "generated/composition-solver/selected-atoms.json"
skip_empty = false
mode = "Overwrite"
