[pack]
name = "platform-eng-ch07"
version = "0.1.0"
description = "Chapter 7 ('Self-Service Onboarding') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch07' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. This directory contains production-ready code examples for implementing a self-service platform onboarding system as described in 'The Platform Engineer's Handbook' Chapter 7. The implementation demonstrates how to transform platform onboarding from a multi-day, ticket-driven obstacle into a fully automated experience completed in minutes."
