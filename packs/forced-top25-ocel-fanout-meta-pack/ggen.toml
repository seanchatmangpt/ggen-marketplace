[project]
name = "forced-top25-ocel-fanout-meta-pack"

[ontology]
files = ["ontology.ttl", "targets/*.ttl"]

[[generation]]
name = "consumer_manifests"
query = "queries/ready-consumers.rq"
template = "templates/consumer-manifest.tera"
output = "consumer-manifests/{{ row.repo }}.json"
for_each = "ready_consumers"

[[generation]]
name = "ocel_transitions"
query = "queries/material-transitions.rq"
template = "templates/ocel-transition.tera"
output = "ocel-events/{{ row.repo }}-{{ row.event }}.json"
for_each = "material_transitions"
