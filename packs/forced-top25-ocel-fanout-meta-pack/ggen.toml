[project]
name = "forced-top25-ocel-fanout-meta-pack"
version = "26.8.26"

[ontology]
source = "ontology.ttl"

[templates]
dir = "templates"

[generation]
output_dir = "."

[[generation.rules]]
name = "consumer-manifests"
query = { file = "queries/ready-consumers.rq" }
template = { file = "templates/consumer-manifest.tera" }
output_file = "generated/consumer-manifests/{{ repo }}.json"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "ocel-transitions"
query = { file = "queries/material-transitions.rq" }
template = { file = "templates/ocel-transition.tera" }
output_file = "generated/ocel-events/{{ repo }}-{{ event }}.json"
mode = "Overwrite"
skip_empty = true

[law]
rules = []
