[pack]
name = "readme-diataxis-pack"
version = "0.1.0"
description = "Splits a flat, boilerplate-style README (API reference, install steps, env vars, FAQ, roadmap, tech stack, deployment, tests) into RDF facts and projects them into a correctly-quadranted Diataxis doc set: tutorials/getting-started.md (learning path), how-to/*.md (task recipes), reference/*.md (exact contracts, table-shaped), explanation/*.md (rationale), plus one docs/index.md nav page and one docs/meta.md page for project-identity/license/contributing/support content Diataxis itself keeps outside the four quadrants."
