[project]
name = "strata-tx-pack"
version = "0.1.0"
description = "Strata transaction model: Tx framing over CLAP-PDU conventions projected from RDF (roadmap slice S2)"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"
tx = "https://strata.chatman.ai/ontology/tx#"

[validation]
gates = [
  "gates/010_tx_layout.rq",
  "gates/020_tx_closure.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "tx-consts"
query = { file = "queries/tx_constants.rq" }
template = { file = "templates/tx_consts.rs.tera" }
output_file = "tx_consts.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "tx-model"
query = { file = "queries/tx_constants.rq" }
template = { file = "templates/tx_model.rs.tera" }
output_file = "tx_model.rs"
skip_empty = false
mode = "Overwrite"
