[pack]
name = "runtime-evidence-authenticity-pack"
version = "0.1.0"
description = "Reusable exact-subject measurement pack for proving that runtime/process evidence is dynamically sourced, cross-surface correspondent, ground-truth checked, current, and non-actuating."

[authority]
allowed = ["OBSERVE", "VERIFY", "SELECT", "CONSTRUCT"]
consequential_do = "BRCE_ONLY"

[manufacture]
ontology = "ontology.ttl"
ggen = "ggen.toml"
generated_outputs_are_consequences = true
