[project]
name = "runtime-evidence-authenticity"
version = "26.8.24"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatman.ai/ontology/runtime-evidence-authenticity#"

[generation]
output_dir = "."

[[generation.rules]]
name = "authenticity-observation"
query = { file = "queries/generation-context.rq" }
template = { file = "templates/authenticity-observation.json.tera" }
output_file = "generated/runtime-evidence-authenticity/observation.json"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "authenticity-court"
query = { file = "queries/generation-context.rq" }
template = { file = "templates/authenticity-court.py.tera" }
output_file = "generated/runtime-evidence-authenticity/qualification_court.py"
skip_empty = true
mode = "Overwrite"
