[project]
name = "composition-leverage-matrix-pack"
version = "26.8.25"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "leverage-matrix"
query = { file = "queries/11-total-leverage.rq" }
template = { file = "templates/leverage.json.tera" }
output_file = "generated/composition-leverage/leverage.json"

[[generation.rules]]
name = "qualification-court"
query = { file = "queries/12-qualified-compositions.rq" }
template = { file = "templates/court.py.tera" }
output_file = "generated/composition-leverage/court.py"
