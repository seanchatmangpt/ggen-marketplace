[project]
name = "dfcm-develop-maximalist-consumer"
version = "26.8.24"
description = "Manufacture selected DfCM capabilities into development and qualification consequences"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/dfcm-develop#"
imports = []

[ontology.prefixes]
dev = "https://ggen.dev/ontology/dfcm-develop#"
dct = "http://purl.org/dc/terms/"

[generation]
output_dir = "."

[[generation.rules]]
name = "selection-receipt"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/selection_receipt.json.tera" }
output_file = "consumer/develop/selection_receipt.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "methodology-matrix"
query = { file = "queries/methodologies.rq" }
template = { file = "templates/methodology_matrix.json.tera" }
output_file = "consumer/develop/methodology_matrix.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "authority-contract"
query = { file = "queries/authority.rq" }
template = { file = "templates/authority_contract.json.tera" }
output_file = "consumer/develop/authority_contract.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "falsifier-registry"
query = { file = "queries/falsifiers.rq" }
template = { file = "templates/falsifier_registry.json.tera" }
output_file = "consumer/develop/falsifier_registry.json"
skip_empty = false
mode = "Overwrite"
