# Pack-local manifest: self-verification only (writes under generated/, never
# into a consumer). Consumers copy this manifest into their own project, point
# el: at their own claim individuals, and sync.

[project]
name = "trade-reticle-electrical"
version = "0.1.0"
description = "Trade-reticle electrical & switchgear prior generator (pack-local self-verification)"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "urn:trade:reticle:electrical:"
imports = []

[ontology.prefixes]
el = "urn:trade:reticle:electrical:"
xsd = "http://www.w3.org/2001/XMLSchema#"

[generation]
output_dir = "."

[[generation.rules]]
name = "trade-reticle-electrical"
query = { file = "queries/claims.rq" }
template = { file = "templates/trade_reticle_electrical.ex.tmpl" }
output_file = "generated/trade_reticle_electrical.ex"
skip_empty = false
mode = "Overwrite"

[validation]
gates = [
  "gates/010_claim_complete.rq",
  "gates/020_prior_sanity.rq",
  "gates/030_telemetry_coverage_law.rq",
]
