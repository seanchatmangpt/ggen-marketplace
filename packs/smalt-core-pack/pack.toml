# smalt-core-pack manifest (lane I6, 2026-11-03)
# Filing truth: K5's blocker + the identity catalog's known violation — this
# pack existed with content but no manifest, so require_admitted() refused
# every whole-corpus qualification load with MANIFEST_MISSING.
[pack]
name = "smalt-core-pack"
version = "0.1.0"
description = """
Vendoring lane for official standards ontologies and shared admission shapes.
Official RDF encodings vendored verbatim (PROVENANCE headers, in-file):
DCMI Metadata Terms (dcterms.ttl), W3C ORG (org.ttl), W3C Web Access Control
(wac.ttl), W3C Security vocabulary (security.ttl), SODALITE TOSCA OWL
(tosca.ttl), OGF OCCI 1.2 (occi.ttl). Hand-derived mini-ontologies where the
standards body publishes no official RDF encoding (declared in-file, NOT
official artifacts): KMIP v1.4 (kmip.ttl), CIMI/DSP0263 (cimi.ttl),
NIST RBAC (rbac.ttl). Shared admission shapes at ontology/smalt-core-shapes.ttl.
Standing PARTIAL_ALIVE per PACK-NOTES.md on projection coverage: files parse
(rdflib exit 0, ontology/ only) and carry the shape-consumed surface; SA-15
(2026-11-03) added the loader-required root ontology.ttl aggregate, one
exemplar projection (templates/shapes_index.md.tmpl; packaging profile
projection), and a sync-time term-closure gate (gates/010_shape_term_closure.rq
under [validation]). Deeper projections remain future work.
"""
[capabilities]
provides = ["urn:ggen:pack:smalt-core-pack"]
# No requires — leaf pack, depends on nothing.
# No [dependencies] table — none exist.

[validation]
gates = [
  "gates/010_shape_term_closure.rq",
]
