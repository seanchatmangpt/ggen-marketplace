[pack]
name = "refusal-vocabulary-pack"
version = "0.1.0"
description = "Canonical FAIL-CLOSED crosswalk between erlmcp's integer refusal codes (erlmcp_refusal.hrl, 1001-1089) and ash_a2a's RFC-SA2A-001 S42 refusal classes (AshA2A.Semantic.Refusal, 18 classes) plus the JSON-RPC error law from AshA2A.Protocol.JsonRpc.Error. One Class per ash_a2a refusal class; one individual per erlmcp code carrying erlmcpCode, ashA2aClass, optional jsonRpcCode, httpStatus, and severity. Gates enforce totality (51/51 codes placed, exactly one class each) and coverage (all 18 classes targeted >=1). Purely declarative classification vocabulary: nothing here grants runtime actuation authority -- consequential DO stays behind BRCE admission."
