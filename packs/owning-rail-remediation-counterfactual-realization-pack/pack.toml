# NOTE: the real ggen 26.8.28 pack.toml schema admits ONLY a single
# top-level [pack] table with fields name/version/description -- verified
# live against the deployed binary (ghcr.io/seanchatmangpt/ggen-ecosystem:
# v26.8.28): every extra top-level table tried here (a separate [authority]
# table, [manufacture], [measurement]) was rejected the same way as the
# original inline `authority`/`consequential_do` fields under [pack]
# ("unknown field ..., expected `pack`" / "expected one of `name`,
# `version`, `description`"). This is not scoped to this one field --
# sibling packs chatman-ecosystem-v26-9-1-release-gate and
# cyberpunk-tv-platform carry the same class of extra pack.toml metadata
# (`[authority]`, `license`, `normative_authority`, etc.) and are equally
# unparseable by this ggen version; that is a pre-existing, wider defect
# out of this fix's scope, not evidence that this pack's extra fields were
# a supported convention here.
#
# The fields below therefore are NOT silently dropped -- they are preserved
# as this comment, real information this pack still asserts, just not
# representable in pack.toml under the currently-deployed schema:
#   authority          = "OBSERVE|VERIFY"
#   consequential_do    = "BRCE_ONLY"
#   [manufacture]
#     source                          = "ontology.ttl"
#     deterministic                   = true
#     consumer_outputs_are_projections = true
#   [measurement]
#     positive_standing_ceiling   = "PARTIAL_ALIVE"
#     requires_exact_subject      = true
#     requires_held_out_outcomes  = true
[pack]
name = "owning-rail-remediation-counterfactual-realization-pack"
version = "26.8.24"
description = "Held-out realization MSA for remediation counterfactual effect, regret, rollback safety and owning-rail standing. Authority=OBSERVE|VERIFY, consequential_do=BRCE_ONLY, manufacture.source=ontology.ttl (deterministic, consumer_outputs_are_projections), measurement.positive_standing_ceiling=PARTIAL_ALIVE (requires_exact_subject, requires_held_out_outcomes) -- see this file's header comment for the full untruncated field-by-field record; only name/version/description are schema-parsed by the deployed ggen pack.toml loader."
