[project]
name = "closed-loop-option-capital-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "closed-loop-option-capital-portfolio"
query = { file = "queries/48-frontier.rq" }
template = { file = "templates/expansion-portfolio.json.tera" }
output_file = "generated/closed-loop-option-capital/portfolio.json"

[[generation.rules]]
name = "closed-loop-option-capital-court"
query = { file = "queries/48-frontier.rq" }
template = { file = "templates/qualification-court.py.tera" }
output_file = "generated/closed-loop-option-capital/qualification_court.py"
