[project]
name = "planning-federation-pack"
version = "26.9.4"
description = "Manufacture a planner federation from one admitted semantic world"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.io/marketplace/planning-federation#"
imports = []

[ontology.prefixes]
pf = "https://ggen.io/marketplace/planning-federation#"
prov = "http://www.w3.org/ns/prov#"
pplan = "http://purl.org/net/p-plan#"
sosa = "http://www.w3.org/ns/sosa/"
odrl = "http://www.w3.org/ns/odrl/2/"
skos = "http://www.w3.org/2004/02/skos/core#"
qudt = "http://qudt.org/schema/qudt/"

[generation]
output_dir = "."

[[generation.rules]]
name = "planner-ir"
query = { file = "queries/model.rq" }
template = { file = "templates/planner_ir.json.tera" }
output_file = "consumer/planning-federation/compiler/planner_ir.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "planner-catalog"
query = { file = "queries/model.rq" }
template = { file = "templates/catalog.py.tera" }
output_file = "consumer/planning-federation/compiler/catalog.py"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "planner-symbolic-backends"
query = { file = "queries/model.rq" }
template = { file = "templates/symbolic.py.tera" }
output_file = "consumer/planning-federation/compiler/symbolic.py"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "planner-interchange-backends"
query = { file = "queries/model.rq" }
template = { file = "templates/interchange.py.tera" }
output_file = "consumer/planning-federation/compiler/interchange.py"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "planner-binary-materializers"
query = { file = "queries/model.rq" }
template = { file = "templates/binary.py.tera" }
output_file = "consumer/planning-federation/compiler/binary.py"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "planner-federation-backend"
query = { file = "queries/model.rq" }
template = { file = "templates/projector.py.tera" }
output_file = "consumer/planning-federation/compiler/projector.py"
skip_empty = false
mode = "Overwrite"
