[pack]
name = "a2a-conformance-pack"
version = "0.1.0"
description = """
Conformance-machinery manufacturer for the A2A Protocol v1.0 as pinned by
the ash_a2a repository (truth source: /Users/sac/ash_a2a).

This pack packages the conformance SURFACE, not protocol semantics (the
protocol surface itself lives in the sibling a2a-v1-protocol-pack): the
court runner, the 25-court family inventory, the 36-example frozen spec
corpus, the vendored pristine a2a.proto, and the point-in-time TCK
compatibility-run matrix. Everything here is an admitted projection of a
REAL executed artifact, cited by its file path:

  CourtRunner        -> Mix.Tasks.AshA2a.V1ConformanceReport
                        lib/mix/tasks/ash_a2a.v1_conformance_report.ex
  CourtFamily        -> 25 a2ac:CourtFile individuals, one per
                        test/ash_a2a_v1_*.exs on the runner's @v1_courts list
  SpecCorpus         -> priv/a2a_v1_spec_corpus/v1_spec_examples.json
                        (36 examples, 9 families, 30 conformant + 6
                        codec_gap findings pinned, never lib/-edited away)
  SpecIdl            -> priv/a2a_v1_spec_corpus/a2a.proto, vendored
                        byte-for-byte from a2aproject/A2A, sha256
                        945df6e34001b2bfd0fd62d9484b63094dfad9d78705e41e2873441c419ae2d1
  TCKRun             -> a2aproject/a2a-tck, python 3.12 venv,
                        run_tck.py --transport jsonrpc, 2026-10-05:
                        69.2% overall (MUST 70.4% / SHOULD 42.9% / MAY 100%),
                        3 MUST infrastructure failures fixed in-session,
                        5 remaining jsonrpc failures pinned as the echo-SUT
                        behavioral contract, NOT spec violations
  ProtoFidelityCourt -> test/ash_a2a_v1_proto_fidelity_test.exs,
                        verdict all-MATCH

Nothing in this pack claims TCK certification. CONFORMANT in the cited
statement means "the pinned court in this repo passes" — a point-in-time
court verdict, not a standing certification.

Templates manufacture a NEW spec requirement's conformance-court SKELETON
(ExUnit + positive control + kill, the house style of the cited court
family) and a spec-corpus entry in exactly the frozen corpus's key shape.

Falsifier: "the runner task exists and its court list matches the pack's
inventory" — executed by gates/verify_runner_completeness.sh against the
real runner source and the real filesystem, with the SPARQL half in
gates/020_runner_completeness.rq over this pack's own graph.
"""
