[pack]
name = "platform-eng-ch06"
version = "0.1.0"
description = "Chapter 6 ('The Developer Portal (Backstage)') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch06' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. This chapter demonstrates how to deploy and curate a **developer portal** as the single pane of glass for your organization's technical capabilities. The portal is NOT the platform itself, but rather the **discovery and interaction layer** that enables developers to understand, access, and operate available services, APIs, and tools."
