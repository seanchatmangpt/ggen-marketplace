[pack]
name = "smalt-substrate-pack"
version = "26.10.14"
description = """
Sovereign Azure Drop-In Replacement Substrate pack for smalt.
Models a 41-type ARM control-plane registry with pinned TypeBindings/apiVersions
(Smalt.Registry: compute, network incl. private endpoints/DNS zones, KeyVault + managedHSM,
CosmosDB, ServiceBus, EventHub, EventGrid, Storage incl. blob containers + immutabilityPolicies,
ConfidentialLedger/managedCCFs, Attestation, App/containerApps, managedClusters, insights/Purview/Defender),
SHACL shape bindings per type with a hard-crash (compile-error) shapes-coverage gate
enforced via the smalt GraphLaw validator, data-plane invariants (blob ETag/If-Match
optimistic concurrency, secure key release (SKR) attestation, WORM legal-hold/immutability),
and AMQP 1.0 dialect notes (Service Bus on 5672, Event Hubs on 5673).
Projects native Elixir/OTP router specifications, Ash domain resources, and SHACL hard-crash
validation gates via ggen and ggen_igniter.
"""

[capabilities]
provides = ["urn:ggen:pack:smalt-substrate-pack", "urn:ggen:pack:smalt-substrate-pack#v2-shapes"]
requires = ["urn:ggen:pack:graphlaw-ash-capability-pack", "urn:ggen:pack:azure-terraform-pack"]
