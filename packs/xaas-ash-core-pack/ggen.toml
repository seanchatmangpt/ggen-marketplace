[project]
name = "xaas-ash-core-pack"
version = "0.2.0"
description = "Real ggen sync generation of the XaaS Ash resource build script from the 44 real ce:Capability individuals"
authors = ["Sean Chatman"]

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.io/ontology/xaas-ash-render#"
imports = []

[ontology.prefixes]
xar = "https://ggen.io/ontology/xaas-ash-render#"
pcc = "https://seanchatmangpt.github.io/chatman-ecosystem/ontology/platform-console-capabilities#"
togaf = "http://www.semanticweb.org/ontologies/2020/4/OntologyTOGAFContentMetamodel.owl#"
skos = "http://www.w3.org/2004/02/skos/core#"

[generation]
output_dir = "."

[[generation.rules]]
name = "xaas-ash-build-base-generated"
query = { file = "queries/render-targets.rq" }
template = { file = "templates/gen-resources.sh.tmpl" }
output_file = "xaas-ash-build-base-GENERATED.sh"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "xaas-ash-build-extend-generated"
query = { file = "queries/render-targets.rq" }
template = { file = "templates/gen-extend.sh.tmpl" }
output_file = "xaas-ash-build-extend-GENERATED.sh"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "xaas-ash-build-changes-generated"
query = { file = "queries/render-targets.rq" }
template = { file = "templates/gen-changes.sh.tmpl" }
output_file = "xaas-ash-build-changes-GENERATED.sh"
skip_empty = false
mode = "Overwrite"
