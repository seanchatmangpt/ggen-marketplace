[project]
name = "xaas-ash-core-pack"
version = "0.1.0"
description = "Public-ontology-first Ash construction-program projection"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "urn:xaas:profile:ash-togaf:"
imports = ["profiles/public-shapes.ttl"]

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
owl = "http://www.w3.org/2002/07/owl#"
xsd = "http://www.w3.org/2001/XMLSchema#"
sh = "http://www.w3.org/ns/shacl#"
prof = "http://www.w3.org/ns/dx/prof/"
prov = "http://www.w3.org/ns/prov#"
dcterms = "http://purl.org/dc/terms/"
skos = "http://www.w3.org/2004/02/skos/core#"

[validation]
gates = [
  "gates/010_no_custom_vocabulary.rq",
  "gates/020_public_target_classes.rq",
  "gates/030_profile_well_formed.rq",
  "gates/040_resource_name_collisions.rq",
  "gates/050_supported_datatypes.rq",
  "gates/060_object_property_projection_pending.rq",
]

[generation]
output_dir = "."

[[generation.rules]]
name = "ash-gen-commands"
query = { file = "queries/ash-gen-commands.rq" }
template = { file = "templates/gen-commands.sh.tera" }
output_file = "generated/xaas-ash.gen.sh"
skip_empty = false
mode = "Overwrite"
