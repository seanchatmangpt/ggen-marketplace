[scope]
standard = "TOGAF Standard, 10th Edition"
source = "https://publications.opengroup.org/standards/togaf"
role = "architecture-work scope and governance lens; not an RDF ontology"
architecture_domains = ["business", "data", "application", "technology"]
adm_scope = [
  "preliminary",
  "requirements_management",
  "architecture_vision",
  "business_architecture",
  "information_systems_data",
  "information_systems_application",
  "technology_architecture",
  "opportunities_and_solutions",
  "migration_planning",
  "implementation_governance",
  "architecture_change_management",
]

[architecture.business]
mapping_status = "unmapped"
competency_questions = [
  "What stakeholders, organizations, roles, capabilities, value streams, products, services, and business processes exist?",
  "What objectives, constraints, policies, authorities, obligations, risks, and measures govern them?",
  "What baseline-to-target business gaps must be closed?",
]

[architecture.data]
mapping_status = "unmapped"
competency_questions = [
  "What data assets, datasets, schemas, information objects, provenance, quality, lineage, ownership, and retention constraints exist?",
  "Which business and application capabilities consume or produce each data asset?",
  "What evidence establishes data fitness, sovereignty, privacy, and lifecycle standing?",
]

[architecture.application]
mapping_status = "unmapped"
competency_questions = [
  "What application services, functions, actions, APIs, events, agents, components, packages, and integrations realize required capabilities?",
  "What contracts, interfaces, dependencies, identity boundaries, and policy surfaces constrain those realizations?",
  "Which Ash resources/actions are lawful projections of admitted public semantics rather than hand-authored domain invention?",
]

[architecture.technology]
mapping_status = "unmapped"
competency_questions = [
  "What compute, network, storage, runtime, platform, observability, identity, security, and deployment resources realize the application architecture?",
  "What topology, region, jurisdiction, capacity, resilience, cost, and lifecycle constraints apply?",
  "Which consequential changes require BRCE authority rather than ordinary application authorization?",
]

[adm.preliminary]
mapping_status = "required"
coverage = ["architecture capability", "principles", "governance", "roles", "toolchain", "semantic admission policy"]

[adm.requirements_management]
mapping_status = "required"
coverage = ["requirements", "constraints", "traceability", "change", "evidence", "standing"]

[adm.architecture_vision]
mapping_status = "required"
coverage = ["stakeholders", "drivers", "goals", "outcomes", "scope", "baseline", "target", "value hypothesis"]

[adm.business_architecture]
mapping_status = "required"
coverage = ["organization", "capability", "value", "service", "process", "role", "policy", "authority"]

[adm.information_systems_data]
mapping_status = "required"
coverage = ["data asset", "provenance", "quality", "lineage", "ownership", "privacy", "retention"]

[adm.information_systems_application]
mapping_status = "required"
coverage = ["application", "service", "function", "action", "API", "event", "integration", "agent"]

[adm.technology_architecture]
mapping_status = "required"
coverage = ["platform", "runtime", "compute", "network", "storage", "security", "observability", "resilience"]

[adm.opportunities_and_solutions]
mapping_status = "required"
coverage = ["gap", "candidate", "solution building block", "dependency", "work package", "simulation", "feasibility"]

[adm.migration_planning]
mapping_status = "required"
coverage = ["transition architecture", "roadmap", "priority", "cost", "risk", "benefit", "reversibility"]

[adm.implementation_governance]
mapping_status = "required"
coverage = ["conformance", "authority", "admission", "actuation", "verification", "receipt", "exception"]

[adm.architecture_change_management]
mapping_status = "required"
coverage = ["observation", "change trigger", "reconciliation", "counterexample", "learning", "benefit realization", "retirement"]
