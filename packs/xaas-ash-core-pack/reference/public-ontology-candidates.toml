[policy]
status = "candidate-only"
rule = "No candidate becomes build truth until its exact artifact, version/status, publisher, license/usage terms, imports, and digest are admitted."
composition = "profile/alignment/SHACL/SPARQL first; owl:imports and owl:equivalentClass are not default composition mechanisms"

[foundational]
candidates = [
  "W3C PROF",
  "W3C PROV-O",
  "W3C DCAT 3",
  "Dublin Core Terms",
  "W3C SKOS",
  "W3C SHACL",
  "W3C ORG",
  "W3C ODRL 2.2",
  "W3C SOSA/SSN",
  "OWL-Time",
  "QUDT",
  "GeoSPARQL",
  "SPDX 3",
]

[business]
candidates = [
  "W3C ORG",
  "GoodRelations",
  "FIBO",
  "ODRL",
  "PROV-O",
  "QUDT",
  "vCard",
  "FOAF",
]

[data]
candidates = [
  "DCAT 3",
  "DQV",
  "Dublin Core Terms",
  "PROV-O",
  "SKOS",
  "DPV",
  "PREMIS",
  "SPDX 3",
]

[application]
candidates = [
  "Function Ontology (FnO)",
  "W3C Web of Things Thing Description",
  "Hydra Core Vocabulary",
  "PROV-O",
  "P-PLAN",
  "SPDX 3",
  "SAREF",
]

[technology]
