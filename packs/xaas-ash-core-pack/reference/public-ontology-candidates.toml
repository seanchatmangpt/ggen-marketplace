]

[governance_security_privacy]
candidates = [
  "ODRL",
  "DPV",
  "UCO",
  "AIRO",
  "SHACL",
  "PROV-O",
]

[non_rdf_semantic_authorities]
authorities = [
  "TOGAF Standard, 10th Edition",
  "ArchiMate Specification",
  "OASIS TOSCA",
  "OpenAPI",
  "Terraform provider schemas",
  "Kubernetes OpenAPI",
  "Crossplane CRDs/XRDs",
  "OpenTelemetry semantic conventions",
  "FinOps Open Cost and Usage Specification (FOCUS)",
  "OpenSLO",
  "NIST OSCAL",
  "BPMN",
  "DMN",
]
rule = "Map/profile these authorities; do not pretend they are RDF ontologies."
