[pack]
name = "xaas-ash-core-pack"
version = "0.1.0"
description = """First proof of the O_public -> O* -> ggen -> Ash architecture: one real ce:Capability individual (pcc:ApprovalLegalHoldRelease, from chatman-ecosystem's ontology/platform-console-capabilities.ttl -- a maker-checker action releasing a legal hold, ce:reversible false, ce:brokerRequired true, ce:receiptRequired true) rendered as one real, syntax-valid Ash.Resource module via templates/resource.ex.tera. This is deliberately the smallest possible slice, per the settled architecture: Ash resource = projection, not ontology truth; ggen manufactures it from the admitted graph, the same discipline azure-terraform-pack/gh-terraform-pack already apply for Terraform. Ash.Policy (actor X may call action Y) is generated from ce:requiredAuthority; it is explicitly NOT equivalent to BRCE execution authority (this pack's generated `change {}` block only ever constructs an Intent struct -- it never calls an external system directly, per the settled Change -> Intent, never Change -> external-system law). ce:reversible false is rendered as a comment marker only -- no destructive default action is generated for it; that mapping is a real open question, not resolved here. This pack does NOT yet include Ash.Domain wiring, AshPostgres, AshAuthentication, or AshGraphql/AshJsonApi -- single-resource proof only, real disclosed scope, not a finished xaas-ash-core-pack."""
