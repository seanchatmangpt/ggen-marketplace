[pack]
id = "xaas-ash-core-pack"
name = "xaas-ash-core-pack"
version = "0.1.0"
description = "TOGAF-scoped, public-ontology-first projection from admitted SHACL profiles to canonical Ash/Igniter generator commands."
owner = "platform-engineering"
license = "MIT"
namespace = "urn:xaas:profile:ash-togaf:"
access = "public"
status = "alpha"

[[generation_rules]]
name = "ash-gen-commands"
query_ref = "queries/ash-gen-commands.rq"
template_ref = "templates/gen-commands.sh.tera"
output_path = "generated/xaas-ash.gen.sh"
mode = "Overwrite"

[validation]
gates = [
  "gates/010_no_custom_vocabulary.rq",
  "gates/020_public_target_classes.rq",
  "gates/030_profile_well_formed.rq",
  "gates/040_resource_name_collisions.rq",
  "gates/050_supported_datatypes.rq",
  "gates/060_object_property_projection_pending.rq",
]
