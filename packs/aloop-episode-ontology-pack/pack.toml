[pack]
name = "aloop-episode-ontology-pack"
version = "0.1.0"
description = """
The ALOOP episode model as RDF: one ontology for an autonomous-execution episode
(multi-agent, multi-provider) and the OCEL 2.0-shaped event/object vocabulary that
instruments it. Object classes (Episode, Objective, Requirement, WorkOrder,
Authority, Repository, Subject, Provider, Worker, WorkerRun, Plan, Capability,
Candidate, Consequence, Evidence, Receipt, Failure, Benchmark, Release) and the 28
event classes (episode.start, observe, gap.detect, candidate.construct,
candidate.admit, plan.select, workorder.issue, provider.select, worker.claim,
execution.start, tool.admit, actuate, checkpoint, execution.crash, receipt.persist,
verify, falsifier.run, benchmark.run, failure.detect, reconcile, replan,
provider.replace, commit, merge, reobserve, goal.satisfied, goal.blocked,
episode.terminal) with the contract qualifiers (subject, originAuthority, provider,
worker, input, output, evidence, consequence, receipt, parentEpisode, predecessor).

PUBLIC vocabulary first: every object class is a prov: subclass (prov:Activity /
prov:Entity / prov:Agent / prov:Plan), WorkOrder is the documented dual type
oslc_cm:ChangeRequest + earl:TestRequirement (the marketplace's own ticket law),
verification events assert through EARL shapes, metadata via dcterms, and the event
model follows the OCEL 2.0 metamodel (https://ocel-standard.org) with each event
class a named rdfs:Class instead of an opaque ocel:eventType label. The custom
aloop: namespace exists ONLY for what the failed-edge record in ontology.ttl shows
no public vocabulary expresses: the closed two-axis standing vocabulary
(execution: AUTONOMOUS|ASSISTED|BLOCKED_AUTHORITY|BLOCKED_INFORMATION|FAILED;
verification: ALIVE|PARTIAL_ALIVE|BLOCKED|REFUSED|UNSUPPORTED|UNKNOWN), the
autonomy-epoch boundary, and the human-causal-edge detector (a post-epoch actuation
event associated with a human agent is a violation row) -- Lane 1's crown input.

Gates (violation-row SELECT: returning rows = refusal, FM-PACK-013):
010 episode integrity (every event bound to an Episode; every Episode pursues an
Objective; every WorkOrder dual-typed oslc_cm:ChangeRequest), 020 human-causal-edge
detector, 030 closed standing vocabulary.

Authority boundary: observation and admission vocabulary ONLY. NOT claimed: any
actuation authority (the ontology carries Authority as a describable object and
asserts nothing about who may DO), provider selection policy, planner semantics,
receipt validation of provider-specific payloads, or OCEL log serialization (the
ocel: XML/SQLite interchange format is out of scope; this pack shapes the RDF
projection only). Consumers mint their own episode individuals; this pack ships one
dogfood instance (episode ALOOP-ZCODE-DOGFOOD-001) so the gates are witnessed
non-vacuous against a real graph.
"""
