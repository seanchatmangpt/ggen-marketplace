[pack]
name = "platform-eng-ch14"
version = "0.1.0"
description = "Chapter 14 ('AI-Augmented Platform Engineering') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch14' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. This chapter builds AI-augmented tooling for platform engineering — agents that triage incidents, answer documentation questions, enforce safety guardrails, and measure their own impact. Every script runs locally with mock data by default; add an API key to connect a real LLM."
