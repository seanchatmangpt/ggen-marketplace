[pack]
name = "pack-bootstrap-pack"
version = "26.10.20"
description = """
Bootstrap pack: generates a new ggen pack's manifest, ontology, gates, verifies,
and registry template from a census of an existing project ontology.
Consumed via `mix ggen_igniter.sync --pack-dir` with per-template invocations
(see README.md). Legacy profile: no gp:profile in the graph.
"""

[capabilities]
provides = ["urn:ggen:pack:pack-bootstrap-pack"]
