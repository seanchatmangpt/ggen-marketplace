[pack]
name = "cgap-pack"
version = "26.11.2"
description = """
cgap-pack: the canonical Arrow columnar graph behind the `cgap` substrate
(freestanding, branchless, zero-dependency Apache Arrow representation layer).
Admits the modeled surface: every Arrow type family as PhysicalLayout
individuals with exact formatCode/formatPrefix and densely indexed 64-byte
aligned BufferSlots; ArrowSchema + ArrowArray C Data Interface ABI structs with
sourceText projected to include/cgap.h; schema flags; promise-vs-content
refusal gates for alignment, C-ABI parity, and format coverage. Consumed by
the ~/cgap repo via `ggen sync run`. Grants no execution authority.
"""

[validation]
# Declarative list; the 26.10.11 runner enumerates every gates/*.rq in sorted
# filename order and refuses on any ASK-true / SELECT-row violation
# ([FM-PACK-013]). Witnessed per-gate: docs/jira/v26.11.3/receipts/sa-5.md.
gates = [
  "gates/010_subject_identity.rq",
  "gates/020_promise_vs_content.rq",
  "gates/030_alignment_invariant.rq",
  "gates/040_format_completeness.rq",
  "gates/050_slot_continuity.rq",
  "gates/060_lever_identity.rq",
  "gates/070_mutation_law.rq",
  "gates/080_target_measured_pair.rq",
  "gates/090_grounding_regex.rq",
  "gates/100_gate_linkage.rq",
  "gates/110_manifest_fact_coverage.rq",
  "gates/120_court_subject_regex.rq",
  "gates/130_lever_status_law.rq",
  "gates/140_bench_file_exists.rq",
  "gates/150_receipt_sha_format.rq",
  "gates/160_cap_module_regex.rq",
  "gates/arrow_layout.rq",
  "gates/170_layout_closure.rq",
  "gates/180_status_closure.rq",
]

[capabilities]
provides = ["urn:ggen:pack:cgap-pack"]
