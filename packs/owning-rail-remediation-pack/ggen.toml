[project]
name = "owning-rail-remediation-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatman.ai/ontology/owning-rail-remediation#"

[generation]
output_dir = "."

[[generation.rules]]
name = "remediation-plan"
query = { file = "queries/010_blocker_cut.rq" }
template = { file = "templates/remediation-plan.md.tmpl" }
output_file = "remediation/PLAN.md"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "qualification-court"
query = { file = "queries/020_recovery_frontier.rq" }
template = { file = "templates/qualification-court.md.tmpl" }
output_file = "remediation/QUALIFICATION_COURT.md"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "remediation-receipt"
query = { file = "queries/010_blocker_cut.rq" }
template = { file = "templates/remediation-receipt.json.tmpl" }
output_file = "receipts/remediation.json"
skip_empty = true
mode = "Overwrite"
