# strata-store-pack generation contract.
#
# Content-addressed store (roadmap slice S6, GREENFIELD). The [validation]
# gates refuse a malformed STORE_CONSTANTS layout (missing/malformed/
# non-positive values) or a store model that breaks closure (unknown
# properties, receipt roots matching no store) at sync time — typed refusal,
# never a silent projection.

[project]
name = "strata-store-pack"
version = "0.1.0"
description = "Content-addressed store: ContentStore trait + in-memory SHA-256-keyed impl with marker rollback and typed refusals projected from RDF (roadmap slice S6)"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"
so = "https://strata.chatman.ai/ontology/store#"

[validation]
gates = [
  "gates/010_store_layout.rq",
  "gates/020_store_closure.rq",
  "gates/030_store_cas_composition.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "store-consts"
query = { file = "queries/store_constants.rq" }
template = { file = "templates/store_consts.rs.tera" }
output_file = "store_consts.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "store-engine"
query = { file = "queries/store_constants.rq" }
template = { file = "templates/store_engine.rs.tera" }
output_file = "store_engine.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "store-cas"
query = { file = "queries/store_cas.rq" }
template = { file = "templates/store_cas.rs.tera" }
output_file = "store_cas.rs"
skip_empty = false
mode = "Overwrite"
