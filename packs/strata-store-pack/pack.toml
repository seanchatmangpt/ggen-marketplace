[pack]
name = "strata-store-pack"
version = "0.1.0"
description = """
Content-addressed storage for Strata (roadmap slice S6,
docs/sjira/v26.10.8/STRATA-BLOCKCHAIN-ROADMAP.md — GREENFIELD: no storage
code existed to reuse). ContentStore trait (put/get/contains/len/rollback)
with an in-memory content-addressed impl keyed by inline SHA-256, marker
rollback (journal of keys inserted since the marker; append-only store with
tombstone-free rollback), and typed capacity/rollback refusals.
"""
[capabilities]
# requires is empty: scripts/qualify_packs.py qualifies every pack in isolation
# (single-pack [packs] capsule), so a cross-pack require can never resolve there
# (FM-PACK-018). The relationship to strata-hash-pack's SHA-256 primitive is
# documentation-only via ontology comment — no owl:imports — same remediation as
# strata-signer-pack (S3) and strata-ledger-pack (S4); per
# docs/sjira/v26.10.8/STRATA-BLOCKCHAIN-ROADMAP.md slice S6 (GREENFIELD).
provides = ["urn:ggen:pack:strata-store-pack", "urn:strata:store:v1"]
requires = []
