[project]
name = "dfcm-full-deployment-consumer"
version = "26.8.14"
description = "Generate the complete DfCM control plane"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology/dfcm.ttl"
base_iri = "https://ggen.dev/ontology/dfcm#"
imports = []

[ontology.prefixes]
dfcm = "https://ggen.dev/ontology/dfcm#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
prov = "http://www.w3.org/ns/prov#"
odrl = "http://www.w3.org/ns/odrl/2/"

[generation]
output_dir = "."

[[generation.rules]]
name = "dfcm-runtime"
query = { file = "queries/components.rq" }
template = { file = "templates/dfcm_runtime.py.tmpl" }
output_file = "consumer/dfcm/dfcm_runtime.py"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "dfcm-verifier"
query = { file = "queries/transitions.rq" }
template = { file = "templates/verify_dfcm.py.tmpl" }
output_file = "consumer/dfcm/verify_dfcm.py"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "lean-admission-boundary"
query = { file = "queries/components.rq" }
template = { file = "templates/DfcmAdmission.lean.tmpl" }
output_file = "consumer/dfcm/formal/DfcmAdmission.lean"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "deployment-manifest"
query = { file = "queries/components.rq" }
template = { file = "templates/dfcm_deployment.toml.tmpl" }
output_file = "consumer/dfcm/dfcm-deployment.toml"
skip_empty = false
mode = "Overwrite"
