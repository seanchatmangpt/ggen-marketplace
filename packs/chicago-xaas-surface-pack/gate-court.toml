# Semantic gate witness court (scripts/check_gate_witness_courts.py): every gate
# in gates/ has a same-stem witnessed corpus entry under
# test/fixtures/witnesses/pass and test/fixtures/witnesses/fail. Witnesses are
# graphs merged with the pack source by the verify tooling; a gate passes only
# when the pass witness is admitted and the fail witness is refused
# (anti-vacuity: a gate that never refuses carries no bits). Gates are
# SPARQL ASK queries where TRUE = VIOLATION (REFUSED_CHICAGO_*).
[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
gate_dir = "gates"
pass_dir = "test/fixtures/witnesses/pass"
fail_dir = "test/fixtures/witnesses/fail"
require_pass = true
require_fail = true
