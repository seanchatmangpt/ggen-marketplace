# Pack-local manifest: self-verification only (writes under generated/, never
# into a consumer). Consumers use consumer/ggen.toml. Strict law: every rule is
# a SELECT query ending in ORDER BY; templates are Tera; output is deterministic
# (two runs are byte-identical). Edit the source graphs / queries / templates,
# never generated output.
[project]
name = "chicago-xaas-surface-pack"
version = "26.10.1"
description = "Chicago XaaS surface renderer: machine, verification, executive and replay JSON projections from the v26.10.1 sJira graph (authority NONE)"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen-igniter.dev/sjira/v26.10.1/chicago#"
imports = [
  "source/goal.ttl",
  "source/chicago.ttl",
  "source/projections.ttl",
  "source/narrative.ttl",
  "source/provenance.ttl",
]

[ontology.prefixes]
sj = "https://ggen-igniter.dev/ontology/semantic-jira#"
chi = "https://ggen-igniter.dev/sjira/v26.10.1/chicago#"
dcterms = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"

[generation]
output_dir = "."

[[generation.rules]]
name = "chicago-machine"
query = { file = "queries/machine.rq" }
template = { file = "templates/chicago_machine.json.tmpl" }
output_file = "generated/chicago.machine.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "chicago-verification"
query = { file = "queries/verification.rq" }
template = { file = "templates/chicago_verification.json.tmpl" }
output_file = "generated/chicago.verification.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "chicago-executive"
query = { file = "queries/executive.rq" }
template = { file = "templates/chicago_executive.json.tmpl" }
output_file = "generated/chicago.executive.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "chicago-replay"
query = { file = "queries/replay.rq" }
template = { file = "templates/chicago_replay.json.tmpl" }
output_file = "generated/chicago.replay.json"
skip_empty = false
mode = "Overwrite"
