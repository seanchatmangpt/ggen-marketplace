[pack]
name = "durability-capability-pack"
version = "0.1.0"
description = """
THE qualified capability-contract pack for the durability/replay/resume family
(v26.9.30 capability-ecology wave, lane 5). Admits the pinned dotted capability IDs
Durability.Checkpoint, Durability.Replay, Durability.Resume, Workflow.Halt,
Workflow.Resume (dcap: namespace, RESOLUTIONS-pinned) plus two grounded family
siblings (Durability.Continuation, Workflow.Compensate), each as a SEMANTIC
requirement — never an implementation — with declared execution properties, evidence
kinds, closed outcome sets (success + typed failures), and the independent
COMPENSATABLE / REVERSIBLE flags (neither implies the other; both must be stated).

Every capability carries realizations as provider metadata only: repo, module, source
coordinates, version-pin policy, an inspected flag (did a session actually open the
source — false means hex-coordinate citation), and >=1 QualificationCondition.
Provider availability is never authority; selecting a realization never alters
workflow identity (mirrors ~/ash_pplan AshPPlan.Provider, opened 2026-09-30).

Deep durability semantics are modeled on the real surfaces opened this session:
checkpoint identity binds by CONTENT (qce:closureDigest composed from
qualified-capability-ecology, urn:gall:checkpoint identities, 40-hex base_sha —
Xaas.Gall.Checkpoint/CheckpointBinding); replay determinism is the ecosystem
byte-identical exact-SHA discipline (qce:ReplayReceipt, Xaas.Sa2a.Bridge.replay/2,
AshPPlan.FOND.Replay bundles); resume across a projection-version boundary is lawful
only as a typed refusal (REFUSED_VERSION_BOUNDARY) or an explicit requalification
receipt; Workflow.Halt opens a human-approval gap in which NO execution authority
exists and Workflow.Resume must re-bind FRESH authority (qce:AuthorityEnvelope);
idempotency keys follow the sha256(work_order_digest|query|plan_hash) unique-identity
discipline of Xaas.Sa2a.Execution.

Seven refusal gates (real-ggen violation-row SELECTs) with witnessed positive AND
negative fixtures (anti-vacuity court in qualification/verify.py): a gate that never
refuses carries no bits. Consumers: the ash_pplan v26.9.30 capability-resolution
engine resolves AshPPlan.Provider candidates against this pack's capability
contracts. Grants no execution authority.
"""
