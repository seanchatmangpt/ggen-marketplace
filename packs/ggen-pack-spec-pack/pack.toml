[pack]
name = "ggen-pack-spec-pack"
version = "0.1.0"
description = "Executable specification pack for RFC-GPACK-001 (the GGEN Semantic Pack Protocol). Declares the canonical gp: vocabulary (https://ggen.dev/ns/pack#) -- classes, profiles, renderers, authority ceilings, lifecycle states, pack classes, properties, and the typed refusal codes -- as RDF, and ships the section-14 SPARQL admission gates (010 pack identity completeness, 020 manifest/graph identity correspondence). Self-governing per section 93: the pack's own graph describes this pack (section 94) and must pass its own gates; qualification corpus layout contract lives in qualification/ (corpus dirs are separate tickets T02/T03/T04)."
