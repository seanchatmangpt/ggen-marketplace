# T03 invalid corpus — attack: unknown key inside [pack]
# RFC-GPACK-001 v26.9.17 §7.1: name, version, and description are REQUIRED and
# "A Core v1 implementation MUST reject unknown keys inside [pack]."
# `qualification_attack` is deliberately not part of the §7.1 schema, so a
# conforming engine must refuse this manifest at parse/admission time —
# before identity, graph, or projection laws are evaluated (§7.2: the
# manifest MUST NOT become a second ontology; extra metadata belongs in RDF).
[pack]
name = "mkt03-manifest-unknown-key"
version = "1.0.0"
description = "T03 negative fixture: manifest carries an unknown key inside [pack]."
qualification_attack = "unknown-key-inside-pack-table"
