# T03 invalid corpus — attack: a returning SELECT planted in gates/
# RFC-GPACK-001 v26.9.17 §14: a gate is a falsifier; for a SELECT gate,
# Violation = RowCount > 0, so sync MUST refuse. §96 row 2 names this exact
# falsifier ("Put same violating SELECT in gates/; sync must refuse").
# The pack is otherwise lawful and its graph is non-empty, so the gate
# provably returns rows and the attack reaches the gate (§15/§77).
[pack]
name = "mkt03-gate-positive-select"
version = "1.0.0"
description = "T03 negative fixture: SELECT gate returns rows on a non-empty graph."
