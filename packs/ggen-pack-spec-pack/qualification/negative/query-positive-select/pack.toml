# T03 invalid corpus — control: the same SELECT in queries/ must NOT refuse
# RFC-GPACK-001 v26.9.17 §96 row 1: "Put a returning SELECT in queries/;
# rows must not refuse." This pack is structurally identical to
# ../gate-positive-select/ except the byte-identical SELECT lives under
# queries/ (§13 query surface) instead of gates/ (§14 gate surface). An
# engine that refuses here has collapsed Query into Gate — the D1
# conflation the RFC exists to kill (§4.4 divergence D1, §5.6).
[pack]
name = "mkt03-query-positive-select"
version = "1.0.0"
description = "T03 negative-fixture control: returning SELECT in queries/ must render rows, not refuse."
