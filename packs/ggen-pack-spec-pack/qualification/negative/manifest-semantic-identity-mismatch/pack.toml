# T03 invalid corpus — attack: bootstrap identity != semantic identity
# RFC-GPACK-001 v26.9.17 §8: admission requires Project(I_S) == I_B. The
# bootstrap manifest below is internally valid (§7.1) — the attack is that
# ontology.ttl declares a DIFFERENT gp:name, so a conforming engine must
# refuse with REFUSED:PACK_IDENTITY_MISMATCH instead of admitting either
# identity silently. The manifest and the graph must not become competing
# authorities (§8); the refusal is the arbitration.
[pack]
name = "mkt03-identity-mismatch-bootstrap"
version = "1.0.0"
description = "T03 negative fixture: manifest name disagrees with the semantic graph name."
