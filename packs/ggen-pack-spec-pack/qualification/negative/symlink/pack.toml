# T03 invalid corpus — attack: symlinked source file
# RFC-GPACK-001 v26.9.17 §72: the strict portable source profile refuses
# symlinks inside pack source (REFUSED:PACK_SYMLINK) until a future profile
# defines safe symlink semantics. The attack is NOT committed: setup.sh
# materializes templates/linked-source.tera as a symlink at test time, and
# assert/run.sh does it on a scratch copy, so git never stores a symlink
# (ticket acceptance #3; repo law "No symlinks under packs/"). Everything
# committed here is lawful so the refusal can only come from §72.
[pack]
name = "mkt03-symlink"
version = "1.0.0"
description = "T03 negative fixture: setup.sh plants a symlinked source file; run.sh attacks a scratch copy."
