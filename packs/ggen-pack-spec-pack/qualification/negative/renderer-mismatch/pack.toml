# T03 invalid corpus — attack: EEx template fed to a Tera-only profile
# RFC-GPACK-001 v26.9.17 §19: gp:EEx1 is an Igniter extension; a pack
# requiring EEx MUST advertise it (ontology.ttl declares gp:renderer
# gp:EEx1 below), and an implementation lacking EEx MUST classify the
# projection as UNSUPPORTED:RENDERER:EEx1 rather than pretending the pack
# is malformed (§100 prefers UNSUPPORTED:<extension> over silent fallback).
# Appendix C additionally names REFUSED:RENDERER_PROFILE_MISMATCH. This is
# the §96 "Renderer identity" falsifier ("Feed EEx template to Tera-only
# profile"); assert/run.sh accepts exactly those two lawful outcomes.
[pack]
name = "mkt03-renderer-mismatch"
version = "1.0.0"
description = "T03 negative fixture: advertised EEx1 renderer meets a Tera-only engine profile."
