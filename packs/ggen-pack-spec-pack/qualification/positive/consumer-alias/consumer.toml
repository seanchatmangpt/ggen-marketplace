# RFC-GPACK-001 §9 — consumer configuration assigning a LOCAL alias.
# Verbatim §9 example shape: alias key "payments" -> canonical pack
# "acme-payments-pack". The alias is consumer-local; §9 requires engines to
# preserve both identities (see expected/receipt.json) and forbids the
# alias from overwriting canonical identity in receipts or dependency
# resolution.

[packs]
payments = { path = "../packs/acme-payments-pack" }
