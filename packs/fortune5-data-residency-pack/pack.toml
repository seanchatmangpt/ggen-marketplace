[pack]
name = "fortune5-data-residency-pack"
version = "26.7.31"
description = """
Constitutional data-residency law for Fortune 5 transactional data.
Admitted by fortune5-deployment-blocks-pack as the transaction-data
bb:commonPack alongside fortune5-transaction-data-law-pack. Declares
jurisdiction pins, allowed regions, forbid-cross-border replication,
and evidence requirements. SPARQL gates and SHACL shapes refuse incomplete
residency contracts and any ontology-declared direct cloud actuation.
Frontmatter templates project residency inventory + contract TTL under
infrastructure/data/transactional/. Broker-only: BRCE remains the
actuation boundary. No secrets or customer tenant ids are minted.
"""

[metadata]
category = "governance"
tags = [
  "fortune5",
  "f500",
  "f5",
  "data-residency",
  "transaction-data",
  "jurisdiction",
  "broker-only",
]

[capabilities]
provides = ["urn:ggen:pack:fortune5-data-residency-pack"]
requires = []

[consumer_contract]
runtime = []
elixir_tier = "none (law pack; Ash/data-plane owned by downstream provider packs)"
peer_context = "catalog sibling fortune5-transaction-data-law-pack (directory absent on disk — composition court BLOCKED)"
projected_outputs = [
  "infrastructure/data/transactional/residency_inventory.md",
  "infrastructure/data/transactional/residency_contract.ttl",
]

# Frontmatter-schema pack (ggen 26.11.5): gates in pack.toml, not ggen.toml.
# Any row returned by a gate = refusal.
[validation]
gates = [
  "gates/010_residency_contract.rq",
  "gates/020_broker_only_no_actuation.rq",
]
