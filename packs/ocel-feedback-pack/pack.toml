[pack]
name = "ocel-feedback-pack"
version = "1.0.0"
description = "Closes the loop from observed OCEL 2.0 evidence back into ggen's own generation decisions. Consumes cnv-ocel:Signal individuals (produced by clap_noun_verb::ocel::compute_signals + signals_to_rdf, from a real merged fleet-wide OCEL corpus -- native clap-noun-verb binaries and clap-noun-verb-any-wrapped foreign targets alike) composed alongside a project's own cnv:Cli/cnv:Noun/cnv:Command graph. Ships one fail-closed admission gate: any cnv:Command whose noun:verb id matches a cnv-ocel:Signal marked cnv-ocel:recommendation \"prune\" is refused -- real usage evidence that a command has never once been invoked across the whole observed fleet blocks regenerating it, forcing a human to explicitly remove it from the ontology (or produce fresh evidence) rather than silently manufacturing dead code forever. Composes clap-noun-verb-schema-pack for the cnv:Command/cnv:Noun vocabulary; adds no new classes to that vocabulary, only the cnv-ocel:Signal shape and the one gate that reads it."
