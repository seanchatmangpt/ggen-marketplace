[pack]
name = "ocel-feedback-pack"
version = "1.0.0"
description = "Closes the loop from observed OCEL 2.0 evidence back into ggen's own generation decisions. Consumes cnv-ocel:Signal individuals (produced by clap_noun_verb::ocel::compute_signals + signals_to_rdf, from a real merged fleet-wide OCEL corpus -- native clap-noun-verb binaries and clap-noun-verb-any-wrapped foreign targets alike) composed alongside a project's own cnv:Cli/cnv:Noun/cnv:Command graph. Ships three fail-closed admission gates, one per non-Keep SignalRecommendation: 005 refuses any cnv:Command matching a cnv-ocel:Signal marked recommendation \"prune\" (never invoked across the whole observed fleet); 010 refuses one marked \"harden\" (invoked recently but below the configured success-rate threshold); 015 refuses one marked \"review\" (invoked at least once, but not within the recency window checked). Composing this pack enforces all three -- a project that wants only the prune gate should filter cnv-ocel:Signal individuals to \"prune\"-only before composing (e.g. in the signals-pack-generation step), since gates read whatever Signal graph is composed, not a per-gate opt-in. Composes clap-noun-verb-schema-pack for the cnv:Command/cnv:Noun vocabulary; adds no new classes to that vocabulary, only the cnv-ocel:Signal shape and the gates that read it."
