[pack]
name = "court-kit-pack"
version = "0.1.0"
description = """
Anti-vacuity court kit for typed-refusal registers. Renders a consumer's
refusal register into a typed enum, and generates a twin-court test module
(a shadow twin register that must NOT fire, plus a refusal-live KAT per
registered code). The pack's own gate enforces the honest-limits law: every
row in the register graph must have been OBSERVED firing (observedTrigger
present) -- `ggen sync run && cargo test` passes only if each registered
refusal code has a witnessed trigger. Method-not-domain: this pack ships the
admission machinery, not a domain register; the 5 sample codes are
transcribed from graphlaw docs/refusals.md (sourceVersion-pinned) as data and
the register is append-only / consumer-extensible. The receipt-chain and
vacuity-court capabilities are a disclosed HAND-WRITTEN port of the graphlaw
chain discipline, not generated from graphlaw source.
"""

[capabilities]
provides = [
  "urn:ggen:pack:court-kit-pack",
  "urn:ggen:capability:refusal-register",
  "urn:ggen:capability:receipt-chain",
  "urn:ggen:capability:vacuity-court",
]
requires = []
