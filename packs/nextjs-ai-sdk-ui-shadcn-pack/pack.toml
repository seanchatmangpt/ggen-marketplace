[pack]
name = "nextjs-ai-sdk-ui-shadcn-pack"
version = "0.2.0"
description = """
Semantic profile of the local Next.js 16 / React 19 project at /Users/sac/ggen/examples/nextjs-ai-sdk (pnpm-managed, AI SDK v7 chat app with Neon/Drizzle and better-auth). The project is shadcn-configured (components.json present, style=new-york, ui alias @/components/ui) but shadcn usage on disk is minimal and partial: exactly one shadcn-style primitive exists, components/ui/button.tsx, built with class-variance-authority (cva) and a cn() helper (lib/utils.ts, clsx + tailwind-merge) — the canonical shadcn composition pattern. However no radix-ui packages appear anywhere in package.json dependencies or devDependencies, so Button is a hand-rolled shadcn-shaped component rather than a Radix-backed shadcn primitive; no other components/ui/*.tsx files (no card.tsx, dialog.tsx, input.tsx, etc.) exist. cn()/cva usage is real and confirmed at five additional call sites under components/ai-elements/ (tool.tsx, confirmation.tsx, prompt-input.tsx, message.tsx, conversation.tsx), which consume Button/the cn() helper but are themselves bespoke, not shadcn-generated files. deck.gl was scanned for (deck.gl, DeckGL, ScatterplotLayer, GeoJsonLayer, HexagonLayer, ArcLayer, viewport/view-state) and found nowhere in package.json or any .tsx/.ts source file; deck.gl is entirely absent from this project, not merely unused. Projects
components/ui/button.tsx (cva), five components/ai-elements/* components, and
lib/utils.ts whose cn() body (clsx + tailwind-merge) is kept semantically
stable; byte-identity with the jotp-benchmark-site-shadcn-pack helper does not
hold today (FM-PACK-008 dual-pack hazard) and is the single-sourcing wave's
decision."""""

[capabilities]
provides = ["urn:ggen:pack:nextjs-ai-sdk-ui-shadcn-pack"]

[consumer_contract]
# Derived mechanically from templates/*.tmpl bare imports (non-relative,
# non-alias). `@/lib/utils` is the pack's own projected helper (lib/utils.ts),
# listed under projected_helpers, not a runtime dep.
runtime = [
  "ai",
  "class-variance-authority",
  "clsx",
  "lucide-react",
  "react",
  "tailwind-merge",
]
# Type-check tool used by the qualification court (strict tsc), not an
# import of any template.
dev_tools = ["typescript"]
# Consumer's tsconfig must map `@/*` to the project root so that
# `@/lib/utils` resolves to the projected lib/utils.ts.
peer_context = "@/ path alias resolving @/lib/utils to the projected lib/utils.ts"
projected_helpers = ["lib/utils.ts"]
