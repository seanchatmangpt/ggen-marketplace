# pack.toml — smalt-k8s-pack (ProfilePack), ported from smalt packs/smalt-k8s-pack
# (lane BK-MKT1, v26.10.22). Licence: P28-SIL v2.1.0 (see README.md provenance).
#
# Extends kubernetes-workload-pack with the deployable shapes its template cannot
# model: StatefulSet, headless/multi-port Services, env varieties (fieldRef,
# secretKeyRef), volumes, affinity. Renders the FULL deployable set (Secret,
# ConfigMap, headless + ClusterIP + NodePort Services, StatefulSet) from admitted facts.

[pack]
name = "smalt-k8s-pack"
version = "0.1.0"
description = "smalt-local extension of kubernetes-workload-pack: renders the full deployable k8s manifest set (StatefulSet + headless/ClusterIP/NodePort Services + Secret + ConfigMap) from admitted facts. Swarm hardening gates: 010 required-facts for the extended shapes, 030 podAntiAffinity required for multi-replica StatefulSets, 040 headless per-pod-DNS Service required, 050 BEAM dist-port range pinned (erl-dist 9000 + ERL_AFLAGS inet_dist_listen 9000..9009), 060 NetworkPolicy with allow rule, 070 release cookie sourced from Secret. Privilege refusal (SEC-PRIV-001) stays with the upstream pack's gate 020, which matches k8s:Container/k8s:inWorkload regardless of workload kind."

[capabilities]
provides = ["urn:ggen:pack:smalt-k8s-pack"]
requires = ["urn:ggen:pack:kubernetes-workload-pack"]
