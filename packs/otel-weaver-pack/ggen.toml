[project]
name = "otel-weaver"
version = "26.8.18"
description = "Generate a governed OpenTelemetry Weaver semantic-convention registry from admitted RDF"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatmangpt.com/ontology/otel-weaver#"
imports = ["ontology/coverage.ttl", "shapes/otel-weaver.shacl.ttl"]

[ontology.prefixes]
otelw = "https://chatmangpt.com/ontology/otel-weaver#"
dcterms = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"

[generation]
output_dir = "."

[[generation.rules]]
name = "otel-weaver-manifest"
query = { file = "queries/artifacts.rq" }
template = { file = "templates/manifest.yaml.tmpl" }
output_file = "manifest.yaml"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "otel-weaver-config"
query = { file = "queries/artifacts.rq" }
template = { file = "templates/weaver.toml.tmpl" }
output_file = ".weaver.toml"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "otel-weaver-model"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/model/service.yaml.tmpl" }
output_file = "model/service.yaml"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "otel-weaver-policy"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/policies/registry.rego.tmpl" }
output_file = "policies/registry.rego"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "otel-weaver-ci"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/ci/otel-weaver.yml.tmpl" }
output_file = ".github/workflows/otel-weaver.yml"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "otel-weaver-reference"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/docs/OTEL_WEAVER.md.tmpl" }
output_file = "docs/OTEL_WEAVER.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "otel-weaver-dfcm-coverage"
query = { file = "queries/coverage.rq" }
template = { file = "templates/docs/DFCM_COVERAGE.md.tmpl" }
output_file = "docs/DFCM_COVERAGE.md"
skip_empty = false
mode = "Overwrite"
