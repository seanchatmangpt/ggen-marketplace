[project]
name = "realization-calibration-hypergraph-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "realization-calibration-portfolio"
query = { file = "queries/80-calibrated-frontier.rq" }
template = { file = "templates/calibration-portfolio.json.tera" }
output_file = "generated/realization-calibration/portfolio.json"

[[generation.rules]]
name = "realization-calibration-court"
query = { file = "queries/80-calibrated-frontier.rq" }
template = { file = "templates/calibration-court.py.tera" }
output_file = "generated/realization-calibration/qualification_court.py"
