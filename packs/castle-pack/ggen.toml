[project]
name = "castle"
version = "26.8.18+dfcm.1"
description = "Generate CASTLE semantic bindings, Fortune-5 readiness controls, federated security identity, and architecture references from admitted marketplace RDF"
authors = ["Sean Chatman"]
license = "AGPL-3.0"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatmangpt.com/ontology/castle#"
imports = [
  "ggen-rdf-capability.ttl",
  "v26.8.18.ttl",
  "v26.8.18-dfcm.1.ttl",
  "security-universe.ttl",
  "security-tools.ttl",
]

[ontology.prefixes]
castle = "https://chatmangpt.com/ontology/castle#"
dcterms = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"
skos = "http://www.w3.org/2004/02/skos/core#"
odrl = "http://www.w3.org/ns/odrl/2/"

[generation]
output_dir = "."

[[generation.rules]]
name = "castle-semantic-bindings"
query = { file = "queries/bindings.rq" }
template = { file = "templates/src/generated.rs.tmpl" }
output_file = "src/generated.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-architecture-reference"
query = { file = "queries/bindings.rq" }
template = { file = "templates/GENERATED_ARCHITECTURE.md.tmpl" }
output_file = "docs/GENERATED_ARCHITECTURE.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-fortune5-runtime-profile"
query = { file = "queries/fortune5-requirements.rq" }
template = { file = "templates/src/fortune5_generated.rs.tmpl" }
output_file = "src/fortune5_generated.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-fortune5-reference"
query = { file = "queries/fortune5-requirements.rq" }
template = { file = "templates/FORTUNE5_REQUIREMENTS.md.tmpl" }
output_file = "docs/FORTUNE5_REQUIREMENTS.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-security-sources"
query = { file = "queries/security-sources.rq" }
template = { file = "templates/src/security_sources_generated.rs.tmpl" }
output_file = "src/security_sources_generated.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-security-tools"
query = { file = "queries/security-tools.rq" }
template = { file = "templates/src/security_tools_generated.rs.tmpl" }
output_file = "src/security_tools_generated.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-security-core"
query = { file = "queries/security-core.rq" }
template = { file = "templates/src/security_core_generated.rs.tmpl" }
output_file = "src/security_core_generated.rs"
skip_empty = false
mode = "Overwrite"
