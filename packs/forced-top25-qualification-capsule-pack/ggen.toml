[project]
name = "forced-top25-qualification-capsule-pack"
version = "26.8.26"

[ontology]
source = "ontology.ttl"

[templates]
dir = "templates"

[generation]
output_dir = "."

[[generation.rules]]
name = "forced-top25-qualification-capsules"
query = { file = "queries/10-capsule-ready-set.rq" }
template = { file = "templates/qualification-capsule.json.tmpl" }
output_file = "generated/forced-top25-capsules/{{ rank }}.json"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "forced-top25-semantic-standing"
query = { file = "queries/20-semantic-standing.rq" }
template = { file = "templates/semantic-standing.json.tmpl" }
output_file = "generated/forced-top25-semantic-standing/{{ consumer_repo }}.json"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "forced-top25-materialization-plan"
query = { file = "queries/30-materialization-plan.rq" }
template = { file = "templates/materialization-plan.json.tmpl" }
output_file = "generated/forced-top25-materialization/{{ consumer_repo }}.json"
mode = "Overwrite"
skip_empty = true

[law]
rules = []
