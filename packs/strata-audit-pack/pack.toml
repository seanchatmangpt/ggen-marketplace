[pack]
name = "strata-audit-pack"
version = "0.1.0"
description = """
Strata external audit surface (roadmap slice S10, docs/sjira/v26.10.8/
STRATA-BLOCKCHAIN-ROADMAP.md): the fuzz/known-attack corpus manifest and a
self-contained audit runner over the LANDED strata engines. The runner
executes inline provenance COPIES of the target functions (hash/merkle from
strata-hash-pack, tx decode from strata-tx-pack, chain validation from
strata-chain-pack, tip selection from strata-consensus-pack, ledger
transition conservation from strata-ledger-pack) with a deterministic LCG
corpus (1000 cases per target) and the five known-attack regressions.
Honest boundary: the copies audit the LAW AS CAPTURED at the copied SHA;
re-run the audit against freshly regenerated engine modules after any
engine edit. strata-net-pack (S9 hardening) is corpus-pending and is
deliberately not a target.
"""

[capabilities]
# requires is empty: scripts/qualify_packs.py qualifies every pack in isolation
# (single-pack [packs] capsule), so a cross-pack require can never resolve there
# (FM-PACK-018). The relationships to the S1-S8 engine packs are
# documentation-only via ontology comments — no owl:imports, no code vendoring.
provides = ["urn:ggen:pack:strata-audit-pack", "urn:strata:audit:v1"]
requires = []
