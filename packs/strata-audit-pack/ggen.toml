[project]
name = "strata-audit-pack"
version = "0.1.0"
description = "Strata external audit surface: fuzz-target + known-attack corpus manifest and a self-contained audit runner projected from RDF (roadmap slice S10)"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"

[validation]
gates = [
  "gates/010_audit_layout.rq",
  "gates/020_attack_closure.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "audit-corpus"
query = { file = "queries/audit_corpus.rq" }
template = { file = "templates/audit_corpus.rs.tera" }
output_file = "audit_corpus.rs"
skip_empty = false
mode = "Overwrite"
