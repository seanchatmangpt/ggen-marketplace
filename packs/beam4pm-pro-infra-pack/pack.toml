[pack]
name = "beam4pm-pro-infra-pack"
version = "0.1.0"
description = "v0.1.0: GCP Cloud Run deployment substrate for beam4pm_pro, manufactured from typed b4pi: facts instead of hand-written HCL. Schema-only pack (dspy-pack/github-actions-pack v0.2.0 contract: ontology.ttl ships ZERO individuals; a consumer supplies its own b4pi:Deployment facts in its own .ttl). Vocabulary: b4pi:Deployment with b4pi:serviceName / b4pi:region / b4pi:containerImage / b4pi:cpuLimit / b4pi:memoryLimit / b4pi:minInstances / b4pi:maxInstances / b4pi:port / b4pi:allowUnauthenticated (all nine required, refused by gates/010_required.rq if missing) plus optional b4pi:purpose. Four templates render a complete, self-contained Terraform module at infra/gcp/cloudrun/ (main.tf: google_cloud_run_v2_service + conditional allUsers run.invoker IAM member; variables.tf: graph facts become variable DEFAULTS so an operator can still override any of them at plan time without editing generated files; outputs.tf; README.md with the module's honest standing). Adapted from two real reference modules -- erlmcp marketplace/gcp/terraform/modules/cloud-run (variable surface, conditional public-invoker IAM, no-public-access-by-default posture) and tai-erlang-autonomics gcp/cloud-run.tf (scaling annotations-as-facts, probe discipline, labels) -- rebuilt on the Cloud Run v2 resource family (both references still used v1 google_cloud_run_service), with product-specific bits (erlmcp secrets/domain-mapping/random-suffix, TAI Firestore/pubsub env wiring) deliberately not ported. Templates assume exactly one b4pi:Deployment per consumer graph (fixed output paths; deployments[0] after ORDER BY). Standing ceiling of everything this pack renders: locally verified only -- terraform init -backend=false + terraform validate + tofu validate on the rendered module. No plan, no apply, no credentials, no real project id (project_id defaults to the placeholder beam4pm-pro-demo); actual marketplace listing/purchase/entitlement remains BLOCKED on external authorities and this pack cannot and does not claim otherwise."
