[pack]
name = "beam4pm-pro-infra-pack"
version = "0.1.3"
description = "v0.1.3 (bounded/local fix, not phase-change): added gates/030_cardinality.rq. Both gates/010_required.rq and gates/020_packerimage_required.rq are per-property presence checks scoped to `?s a b4pi:Deployment`/`?s a b4pi:PackerImage`, so a consumer graph asserting a SECOND fully-populated individual of either class produced zero rows from both -- read as \"nothing missing\" -- while cloudrun_main_tf.tmpl/cloudrun_variables_tf.tmpl and packer-beam4pm-image.pkr.hcl.tmpl/packer-variables.pkr.hcl.tmpl render only `deployments[0]`/`image[0]` (the row after ORDER BY) and silently drop every fact belonging to the rest. Confirmed the real gap with rdflib: both required-facts gates stayed at rows=0 against a synthetic fixture with two fully-populated Deployment individuals (and again for two PackerImage individuals), while the real qualification fixture (qualification/consumer.ttl, one of each) and the empty schema-only baseline both stayed at rows=0 on every gate including the new one. gates/030_cardinality.rq (COUNT(DISTINCT ?s) GROUP BY ?class HAVING > 1) now fires exactly on the two violating fixtures and stays silent on the real fixture and the empty baseline -- verified by direct execution, not asserted. This is a local closure of a real, previously-undetected refusal gap; the pack's documented single-Deployment/single-PackerImage-per-consumer-graph contract, its nine/twelve required properties, and every template/render path are unchanged. v0.1.1: Refactored templates/packer-beam4pm-image.pkr.hcl.tmpl's Packer provisioning from a single inline heredoc (one `file` provisioner emitting a monolithic beam4pm-provision.sh body -- apt-get install, docker pull, systemd unit install, provenance-facts write, all as literal HCL heredoc content) into two files: a new, fully-static templates/packer-setup.sh.tmpl (zero b4pi:* fact interpolation, {% raw %}-wrapped so Tera passes its own shell/HCL escape sequences through untouched) rendering to infra/gcp/packer/setup.sh and uploaded to the build VM via its own `file` provisioner (`source = \"setup.sh\"`), plus the pre-existing fact-driven content (the systemd unit body keyed on b4pi:containerName/b4pi:servicePort, the `docker pull ${var.container_image}` line, and the provenance-facts write) left inline in beam4pm-image.pkr.hcl.tmpl's own heredoc, unmoved. That content cannot move to the new static file: Packer's `file` provisioner copies externally-sourced bytes verbatim and never HCL-interpolates `${var.*}` inside them, so anything needing a build-time `${var.container_image}` or a per-render `{{ img.* }}` value has to stay where Tera and Packer both still evaluate it. Zero new b4pi: vocabulary, zero new gate rows, zero change to the rendered systemd unit or provenance-facts shape -- templates/packer-readme.md.tmpl documents the two-file split. v0.1.0: GCP Cloud Run deployment substrate for beam4pm_pro, manufactured from typed b4pi: facts instead of hand-written HCL. Schema-only pack (dspy-pack/github-actions-pack v0.2.0 contract: ontology.ttl ships ZERO individuals; a consumer supplies its own b4pi:Deployment facts in its own .ttl). Vocabulary: b4pi:Deployment with b4pi:serviceName / b4pi:region / b4pi:containerImage / b4pi:cpuLimit / b4pi:memoryLimit / b4pi:minInstances / b4pi:maxInstances / b4pi:port / b4pi:allowUnauthenticated (all nine required, refused by gates/010_required.rq if missing) plus optional b4pi:purpose. Four templates render a complete, self-contained Terraform module at infra/gcp/cloudrun/ (main.tf: google_cloud_run_v2_service + conditional allUsers run.invoker IAM member; variables.tf: graph facts become variable DEFAULTS so an operator can still override any of them at plan time without editing generated files; outputs.tf; README.md with the module's honest standing). Adapted from two real reference modules -- erlmcp marketplace/gcp/terraform/modules/cloud-run (variable surface, conditional public-invoker IAM, no-public-access-by-default posture) and tai-erlang-autonomics gcp/cloud-run.tf (scaling annotations-as-facts, probe discipline, labels) -- rebuilt on the Cloud Run v2 resource family (both references still used v1 google_cloud_run_service), with product-specific bits (erlmcp secrets/domain-mapping/random-suffix, TAI Firestore/pubsub env wiring) deliberately not ported. Templates assume exactly one b4pi:Deployment per consumer graph (fixed output paths; deployments[0] after ORDER BY). Standing ceiling of everything this pack renders: locally verified only -- terraform init -backend=false + terraform validate + tofu validate on the rendered module. No plan, no apply, no credentials, no real project id (project_id defaults to the placeholder beam4pm-pro-demo); actual marketplace listing/purchase/entitlement remains BLOCKED on external authorities and this pack cannot and does not claim otherwise."
