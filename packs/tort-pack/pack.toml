[pack]
name = "tort-pack"
version = "0.1.0"
description = """p99 Torture Matrix pack (GA-12): the five sovereign torture injections — tort-1 bimodal-heap, tort-2 stall-walk, tort-3 cache-stride, tort-4 tamper-inundation, tort-5 supervisor-churn — modeled as queryable RDF individuals with measured sovereign ceilings (only AF-2-SUPPORTED numbers encoded as measured: tort-2 <12 us citing ab-10's receipted 113,132 fps stall-injection soak = 8.84 us/frame; tort-5 5.8-7.4 ms citing ab-17's landed churn receipt) and TARGET-UNMEASURED ceilings (tort-1 <850 ns, tort-3 <450 ns, tort-4 <1.5 us) pending AF-37's injection bench, plus the legacy cloud blowout individuals (gRPC 4M ns, JVM 50k/sec, Go 12.4 MB/s, JSON 45k ns, Node 180 MB/s, TCP 8.5k fps) all standing TARGET-UNMEASURED per AF-18's census, with courtLane edges to the landed ab-* receipts, projected into the torture matrix table (docs/torture-matrix.md) and the open-targets queue (docs/torture-targets-open.md), with 4 sync-time gates: injection-id band closure, ceiling-source-or-TARGET closure, cloud-blowout anti-fabrication (any CloudBlowout without TARGET standing = FM-PACK-013), and measured-ceiling landed-receipt closure."""

[capabilities]
provides = ["urn:ggen:pack:tort-pack"]

[validation]
# Declarative list; the 26.10.11 runner enumerates every gates/*.rq under
# this pack's gates/ directory in sorted filename order (the directory
# listing, not this list, is the runner's truth) and evaluates each as ASK
# (true = violation) or SELECT (any row = violation) against the union
# graph; any violation refuses the sync with [FM-PACK-013]. Witnessed
# per-gate: ggen docs/jira/v26.11.3/receipts/ga-12-tort-pack.md.
gates = [
  "gates/010_injection_band_closure.rq",
  "gates/020_ceiling_source_closure.rq",
  "gates/030_cloud_blowout_target.rq",
  "gates/040_measured_source_landed.rq",
]
