[project]
name = "consumer-realization-frontier-pack"
version = "26.8.25"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/consumer-realization-frontier#"

[generation]
output_dir = "."

[[generation.rules]]
name = "five-axis-realization-plans"
query = { file = "queries/20-five-axis-realization-plan.rq" }
template = { file = "templates/plans.json.tera" }
output_file = "realization-plans.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "consumer-bound-plans"
query = { file = "queries/21-consumer-realization-cross-product.rq" }
template = { file = "templates/consumer-plans.json.tera" }
output_file = "consumer-plans.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "reversible-frontier"
query = { file = "queries/22-reversible-cross-product.rq" }
template = { file = "templates/reversible-frontier.json.tera" }
output_file = "reversible-frontier.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "authority-frontier"
query = { file = "queries/24-authority-transition-frontier.rq" }
template = { file = "templates/authority-frontier.json.tera" }
output_file = "authority-frontier.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "frontier-cardinality"
query = { file = "queries/25-frontier-cardinality.rq" }
template = { file = "templates/frontier-cardinality.json.tera" }
output_file = "frontier-cardinality.json"
skip_empty = false
mode = "Overwrite"
