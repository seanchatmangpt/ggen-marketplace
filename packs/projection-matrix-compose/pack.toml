.tera/.tmpl renderer set deduped to the .tmpl set), and the retired
cs2-projection-matrix (which minted this exact IRI — the two-owners-one-IRI
collision; its adapterKind term is conserved as a module term in
ontology/cs2-adapter.ttl alongside its formerly-undeclared fixture vocabulary).
Modules: ontology/core.ttl (Subject/Consumer/Adapter/Projection + identity),
ontology/bindings.ttl (generation contract as declared facts, FM-PACK-003-safe),
ontology/cs2-adapter.ttl (closed adapter-kind vocabulary, anti-join-gated).
One uniform exact-stem witness court (gates/010_required_identity,
020_single_valued, 030_value_constraints; qualification/verify.py) — the merged
pack is no longer gate-free. Grants no execution authority; projections are
consequences, never hand-edited.
"""
