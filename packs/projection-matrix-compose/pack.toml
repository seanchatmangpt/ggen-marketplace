version = "0.2.0"
description = """
Subject-independent RDF projection matrix manufacturing pack — the SINGLE owner
of the pm: namespace (https://ggen.dev/ontology/projection-matrix#), consolidated
(v26.9.30 wave) from three packs: this pack's core + generation contract, the
retired strict-subset projection-matrix-pack (chatmangpt.com IRI; 11 terms mapped
