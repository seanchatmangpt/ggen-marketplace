[pack]
name = "projection-matrix-compose"
version = "0.1.0"
description = "Subject-independent RDF projection matrix manufacturing pack"

[[inputs]]
path = "fixtures/fleet.ttl"
format = "turtle"

[[projections]]
name = "consumer-bindings"
query = "queries/consumer-bindings.rq"
template = "templates/consumer-binding.ttl.tera"
output = "generated/{{ consumer_slug }}/bindings/{{ subject_slug }}.ttl"

[[projections]]
name = "package-manifests"
query = "queries/consumer-bindings.rq"
template = "templates/package-manifest.toml.tera"
output = "generated/{{ consumer_slug }}/{{ subject_slug }}/pack.toml"
