[pack]
name = "canonical-ash-projection-generator"
version = "0.2.0"
description = "Ontology and SPARQL cardinality gates (migrated from SHACL shapes) for canonical Ash resource projection profiles (resources, attributes, Ash types, primary keys, semantic predicates, source digests), a resource-projection SPARQL query, a gate refusing resources without an explicit primary key, and semantic-map Turtle templates. v0.2.0 adds the A2A capability surface: apg:Skill/apg:SkillArgument vocabulary grounded in the compiled capability index (lib/ash_a2a/capability_index/compiler.ex: skill id \"<Resource>.<action>\", consequence from Ash action type, resource authority gate), skill-projection queries, skill-shape / skillId-uniqueness / named-IRI gates feeding the RDFC-1.0 canonical identity (lib/ash_a2a/semantic/canonical_graph.ex), and a semantic_map_a2a.ttl template projecting each resource's a2a skills as RDF individuals under <urn:ash-a2a:vocab:> and <https://a2a-protocol.org/ontology#> (lib/ash_a2a/semantic/vocabulary.ex registry). Includes an Atlassian Issue fixture profile."
