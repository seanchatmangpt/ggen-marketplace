[pack]
name = "canonical-ash-projection-generator"
version = "0.1.1"
description = "Ontology and SPARQL cardinality gates (migrated from SHACL shapes) for canonical Ash resource projection profiles (resources, attributes, Ash types, primary keys, semantic predicates, source digests), a resource-projection SPARQL query, a gate refusing resources without an explicit primary key, and a semantic-map Turtle template. Includes an Atlassian Issue fixture profile."
