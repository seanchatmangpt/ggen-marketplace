[pack]
name = "canonical-ash-projection-generator"
version = "0.3.0"
description = """
Ontology and SPARQL cardinality gates (migrated from SHACL shapes) for
canonical Ash resource projection profiles (resources, attributes, Ash types,
primary keys, semantic predicates, source digests), a resource-projection
SPARQL query, a gate refusing resources without an explicit primary key, and
semantic-map Turtle templates. v0.2.0 adds the A2A capability surface:
apg:Skill/apg:SkillArgument vocabulary grounded in the compiled capability
index (lib/ash_a2a/capability_index/compiler.ex: skill id
"<Resource>.<action>", consequence from Ash action type, resource authority
gate), skill-projection queries, skill-shape / skillId-uniqueness / named-IRI
gates feeding the RDFC-1.0 canonical identity
(lib/ash_a2a/semantic/canonical_graph.ex), and a semantic_map_a2a.ttl template
projecting each resource's a2a skills as RDF individuals under
<urn:ash-a2a:vocab:> and <https://a2a-protocol.org/ontology#>
(lib/ash_a2a/semantic/vocabulary.ex registry). Includes an Atlassian Issue
fixture profile.

v0.3.0 adds the consumer contract: the pack projects Turtle only (zero code
imports in templates/), so runtime deps are none -- the consumer provides the
RDF vocabulary (apg: ProjectionProfile/Resource/Attribute/Skill/SkillArgument)
and an RDF parsing runtime; structural validity is courted via rapper/rdflib
and the Elixir tier via the ash_a2a consumer's mix runtime.
"""
[capabilities]
provides = ["urn:ggen:pack:canonical-ash-projection-generator"]
requires = []

[consumer_contract]
# Derived mechanically from templates/*.tmpl content: an import/require/from
# census over all three templates returns ZERO code imports -- the pack
# projects Turtle only (generated/ash/semantic_map.ttl,
# generated/ash/semantic_map_a2a.ttl). No hex/npm package is a runtime dep.
runtime = []
# Elixir tier: the projected TTL is consumed by AshA2A.Semantic code inside
# the consumer app itself (ash_a2a); the pack pins no hex packages.
elixir_tier = "consumer-app (ash_a2a); pack pins no hex deps"
# Consumer must declare the apg: vocabulary individuals its profile uses
# (ProjectionProfile, Resource, Attribute, Skill, SkillArgument) and run
# `ggen sync run` to render both .ttl outputs.
# Consumer must declare the apg: vocabulary individuals its profile uses and
# run `ggen sync run` (ggen >= 26.9.28) to render the .ttl outputs.
peer_context = "apg: vocabulary individuals supplied by the consumer ontology"
projected_outputs = [
  "generated/ash/semantic_map.ttl",
  "generated/ash/semantic_map_a2a.ttl",
]
