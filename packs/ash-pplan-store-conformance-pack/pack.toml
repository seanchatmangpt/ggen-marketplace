[pack]
name = "ash-pplan-store-conformance-pack"
version = "0.1.0"
description = """
Generalizes ash_pplan's generated Store-conformance machinery -- machinery that
exists in no other marketplace pack -- into reusable, consumer-facing
manufacturing capital:

1. A generated ExUnit conformance suite over ANY store behaviour: every
   behaviour callback is a scb:Callback row, every behavioural law an scb:Law
   row with an executable Elixir body, and the suite refuses to render when a
   callback is covered by no law (coverage is checked at render time, from the
   ontology).
2. The broken-store negative control: a sabotage wrapper that delegates every
   callback to the consumer's real store except one deliberately broken
   callback, plus a court asserting the suite refuses the sabotaged store.
   A suite a broken store passes is vacuous.
3. The conformance court: a self-contained reference store + sabotage wrapper
   + suite execution in one script, exit 1 on any violated invariant
   (Chicago-style: real store processes, real assertions, no mocks).

Generalized from ash_pplan's test/support/durable/store_conformance.ex
(generated from priv/ggen/ash-pplan-store-conformance-pack, where the
lease-claim/consume-once/FIFO laws were first witnessed on real stores).

Templates render against a consumer's OWN behaviour module, suite namespace,
boot body and start function (declared as scb:Target rows in the
consumer-facing ontology): no ash_pplan module is ever embedded in rendered
output.

Verification (measured 2026-10-01, ggen_igniter 0abed8a from ~/ash_pplan,
MIX_BUILD_ROOT=_build-x5): suite + court rendered via
`mix ggen_igniter.sync --pack-dir` into ~/ash_pplan/tmp/x5/store-conformance/
(manifest tmp/mf-x5); the rendered .ex compiles in a bare `elixir` VM; the
rendered court ran the REAL suite against a real reference store (all laws
pass) and a real sabotaged store (suite refuses it), exit 0. Gates + unbound
companions + cardinality contracts run fail-closed via
`mix ggen_igniter.verify --pack-dir`.
"""
