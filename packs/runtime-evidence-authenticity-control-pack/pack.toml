[pack]
name = "runtime-evidence-authenticity-control-pack"
version = "0.1.1"
description = "Compatibility control projection over runtime-evidence-authenticity-pack measurement law. Applies production admission, owner-failure dominance, and BRCE-only consequential DO to exact-subject authenticity measurements; it does not own a second identity vocabulary for subjectSha, semanticDigest, evidence, or receipts. Migration target: reuse the canonical runtime-evidence-authenticity-pack ontology while retaining this directory only as a control/profile surface until consumers are rewired."

[authority]
allowed = ["OBSERVE", "VERIFY", "SELECT", "CONSTRUCT"]
consequential_do = "BRCE_ONLY"

[manufacture]
ontology = "ontology.ttl"
ggen = "ggen.toml"
generated_outputs_are_consequences = true
