[project]
name = "runtime-evidence-authenticity-control"
version = "26.8.24"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatman.ai/ontology/runtime-evidence-authenticity-control#"

[generation]
output_dir = "."

[[generation.rules]]
name = "control-decision"
query = { file = "queries/generation-context.rq" }
template = { file = "templates/control-decision.json.tmpl" }
output_file = "generated/runtime-evidence-control-decision.json"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "control-court"
query = { file = "queries/generation-context.rq" }
template = { file = "templates/control-court.py.tmpl" }
output_file = "generated/test_runtime_evidence_control.py"
skip_empty = true
mode = "Overwrite"
