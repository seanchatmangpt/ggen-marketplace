# Court: exact-stem pass/fail witness pairs per SPARQL gate (gates/*.rq).
# Every gate is enumerated with its pass+fail witness pair, so a missing
# witness fails the court loudly instead of silently shrinking coverage. The
# runner keeps the exactly-one-gate-fires law on every fail leg.
[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true
runner = "python3 runners/semantic_runner.py --gate {gate} --witness {witness} --expectation {expectation}"

[[case]]
gate = "010_module_required_props"
pass = "witnesses/pass/010_module_required_props.ttl"
fail = "witnesses/fail/010_module_required_props.ttl"

[[case]]
gate = "020_op_order_closure"
pass = "witnesses/pass/020_op_order_closure.ttl"
fail = "witnesses/fail/020_op_order_closure.ttl"

[[case]]
gate = "030_error_code_order_closure"
pass = "witnesses/pass/030_error_code_order_closure.ttl"
fail = "witnesses/fail/030_error_code_order_closure.ttl"

[[case]]
gate = "040_export_prefix_c_identifier"
pass = "witnesses/pass/040_export_prefix_c_identifier.ttl"
fail = "witnesses/fail/040_export_prefix_c_identifier.ttl"

[[case]]
gate = "050_limits_positive_bounded"
pass = "witnesses/pass/050_limits_positive_bounded.ttl"
fail = "witnesses/fail/050_limits_positive_bounded.ttl"

[[case]]
