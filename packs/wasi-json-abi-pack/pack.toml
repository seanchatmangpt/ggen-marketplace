[pack]
name = "wasi-json-abi-pack"
version = "26.10.0"
description = """Generic WASI JSON-ABI module substrate: renders the FFI shell
(<prefix>_abi_version/_alloc/_free/_call with null/oversize guards and typed limit
errors), ABI metadata (version, limits, op table, error codes), capability registry,
ABI doc (exports table), op examples, cargo stack/profile fragments and an
artifact-pin skeleton from an ontology of wja:WasmModule / wja:Op / wja:ErrorCode.
Wire conventions are ontology parameters supplied by the consumer: return
convention (packed-u64 | out-len-pointer), versioned symbol suffix, op symbol
prefix, input-release ownership split (call-consumes | host-dealloc with a
dealloc/free pair), abi-version export name, zero-import invariant, startup
convention, result-digest envelope with parameterized digest facts, and per-op
replay companions. Project specifics are ontology parameters supplied by the
consumer."""
