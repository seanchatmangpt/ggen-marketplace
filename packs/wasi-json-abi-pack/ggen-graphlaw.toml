# ggen-graphlaw.toml -- graphlaw-wasm (graphlaw v26.9.29) qualification profile. Renders
# generated/graphlaw/ from qualification/graphlaw-consumer.ttl + graphlaw-ops.ttl merged with this
# pack's ontology. ggen reads only ./ggen.toml: copy this file to ggen.toml in a scratch copy of the pack and
# run `ggen sync run`. The ffi rule renders generated/graphlaw/ffi.rs (vec buffers, 256 MiB
# outstanding cap, no gl_abi_version export); see HANDWRITTEN-graphlaw.md for what remains residue.
# Strict mode: every query ends with ORDER BY; SELECT columns are Tera vars.

[project]
name = "wasi-json-abi-pack"
version = "26.10.0"

[ontology]
source = "qualification/graphlaw-consumer.ttl"
imports = ["qualification/graphlaw-ops.ttl", "ontology.ttl"]

[generation]
output_dir = "."

[[generation.rules]]
name = "ffi"
mode = "Overwrite"
query = { file = "queries/ffi.rq" }
template = { file = "templates/wasm_ffi.rs.tmpl" }
output_file = "generated/graphlaw/ffi.rs"

[[generation.rules]]
name = "meta"
mode = "Overwrite"
query = { file = "queries/meta.rq" }
template = { file = "templates/wasm_abi_meta.rs.tmpl" }
output_file = "generated/graphlaw/abi_meta.rs"

[[generation.rules]]
name = "registry"
mode = "Overwrite"
query = { file = "queries/registry.rq" }
template = { file = "templates/wasm_capability_registry.json.tmpl" }
output_file = "generated/graphlaw/capability-registry.json"

[[generation.rules]]
name = "examples"
mode = "Overwrite"
query = { file = "queries/examples.rq" }
template = { file = "templates/wasm_op_examples.json.tmpl" }
output_file = "generated/graphlaw/op-examples.json"

[[generation.rules]]
name = "cargo-config"
mode = "Overwrite"
query = { file = "queries/cargo.rq" }
template = { file = "templates/wasm_cargo_config.toml.tmpl" }
output_file = "generated/graphlaw/cargo-config.toml"

[[generation.rules]]
name = "cargo-profile"
mode = "Overwrite"
query = { file = "queries/cargo.rq" }
template = { file = "templates/wasm_cargo_profile.toml.tmpl" }
output_file = "generated/graphlaw/cargo-profile.toml"

[[generation.rules]]
name = "artifacts"
mode = "Overwrite"
query = { file = "queries/artifacts.rq" }
template = { file = "templates/wasm_artifacts.sha256.tmpl" }
output_file = "generated/graphlaw/ARTIFACTS.sha256"

[[generation.rules]]
name = "guards"
mode = "Overwrite"
query = { file = "queries/guards.rq" }
template = { file = "templates/wasm_guards.rs.tmpl" }
output_file = "generated/graphlaw/guards.rs"

[[generation.rules]]
name = "harness"
mode = "Overwrite"
query = { file = "queries/harness.rq" }
template = { file = "templates/wasm_test_harness.rs.tmpl" }
output_file = "generated/graphlaw/tests_common.rs"
