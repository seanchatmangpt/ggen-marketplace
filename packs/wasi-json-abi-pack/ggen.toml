# ggen.toml -- pack-local self-proof profile. Renders generated/ from the qualification
# consumer graph (toy module ex / echo-wasm) merged with this pack's ontology.
# Strict mode: every query ends with ORDER BY; SELECT columns are Tera vars.

[project]
name = "wasi-json-abi-pack"
version = "26.9.28"

[ontology]
source = "qualification/consumer.ttl"
imports = ["ontology.ttl"]

[generation]
output_dir = "."

[[generation.rules]]
name = "ffi"
mode = "Overwrite"
query = { file = "queries/ffi.rq" }
template = { file = "templates/wasm_ffi.rs.tmpl" }
output_file = "generated/ffi.rs"

[[generation.rules]]
name = "meta"
mode = "Overwrite"
query = { file = "queries/meta.rq" }
template = { file = "templates/wasm_abi_meta.rs.tmpl" }
output_file = "generated/abi_meta.rs"

[[generation.rules]]
name = "registry"
mode = "Overwrite"
query = { file = "queries/registry.rq" }
template = { file = "templates/wasm_capability_registry.json.tmpl" }
output_file = "generated/capability-registry.json"

[[generation.rules]]
name = "examples"
mode = "Overwrite"
query = { file = "queries/examples.rq" }
template = { file = "templates/wasm_op_examples.json.tmpl" }
output_file = "generated/op-examples.json"

[[generation.rules]]
name = "cargo-config"
mode = "Overwrite"
query = { file = "queries/cargo.rq" }
template = { file = "templates/wasm_cargo_config.toml.tmpl" }
output_file = "generated/cargo-config.toml"

[[generation.rules]]
name = "cargo-profile"
mode = "Overwrite"
query = { file = "queries/cargo.rq" }
template = { file = "templates/wasm_cargo_profile.toml.tmpl" }
output_file = "generated/cargo-profile.toml"

[[generation.rules]]
name = "artifacts"
mode = "Overwrite"
query = { file = "queries/artifacts.rq" }
template = { file = "templates/wasm_artifacts.sha256.tmpl" }
output_file = "generated/ARTIFACTS.sha256"

[[generation.rules]]
name = "guards"
mode = "Overwrite"
query = { file = "queries/guards.rq" }
template = { file = "templates/wasm_guards.rs.tmpl" }
output_file = "generated/guards.rs"

[[generation.rules]]
name = "harness"
mode = "Overwrite"
query = { file = "queries/harness.rq" }
template = { file = "templates/wasm_test_harness.rs.tmpl" }
output_file = "generated/tests_common.rs"
