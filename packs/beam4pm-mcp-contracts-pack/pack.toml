[pack]
name = "beam4pm-mcp-contracts-pack"
version = "0.1.0"
description = "Projects an admitted mcp:MessageType graph into real, compiling Erlang and Elixir type and struct definitions, JSON Schema, constructors with required-field validation, and Chicago-style (no mocks) unit tests -- following the exact pattern established by beam4pm-process-model-pack's bpm:RecordType and beam4pm-ai-contracts-pack's aic:ContractType. Ships vocabulary (and, once other streams land, templates) only: the ten canonical MCP (Model Context Protocol) wire-message data shapes -- the JSON-RPC 2.0 envelope (request, success response, error response, notification) plus the tools/resources message payloads (tool, tool-call request/result, resource, resource-read request/result) -- are admitted instance data supplied by the consuming project's own ontology.ttl (e.g. beam4pm). Verified against the real MCP specification at https://modelcontextprotocol.io/specification/2025-06-18/ -- field names below are transcribed verbatim from that spec, not invented. This pack is manufactured, not hand-written: modeling these ten wire-message shapes as ggen-admitted O* individuals and generating real projections compresses what would otherwise be days of hand-written codec/type work to minutes, the same compression already proven for beam4pm-ai-contracts-pack and beam4pm-post-llm-runtime-pack. Data shapes only -- this pack models MCP's wire-message envelopes, not tool execution, transport, or authority semantics of any kind."
