[project]
name = "ash-runtime-integration-contract-pack"
version = "26.8.27"

[ontology]
source = "ontology.ttl"

[templates]
dir = "templates"

[generation]
output_dir = "."

[[generation.rules]]
name = "exact-subject"
query = { file = "queries/01-exact-subject.rq" }
template = { file = "templates/exact_subject.ex.tmpl" }
output_file = "generated/exact_subject.ex"
mode = "Overwrite"
skip_empty = true

