[pack]
name = "dspy-pack"
version = "0.2.0"
description = """
Ontology-driven DSPy generation with admitted typed signatures, input/output fields, and closed
module kinds (Predict, ChainOfThought, ReAct) for modular LM programs.

Round 2 (2026-08-10): adds MCP-tool-backed dspy.ReAct agent generation, modeled verbatim on
dspy.ai's own "DSPy + MCP" tutorial (https://dspy.ai/tutorials/mcp/) -- a dspy:Module with
kind="ReAct" and dspy:usesMCPServer admits a dspy:MCPServerConnection (stdio launch command +
ordered dspy:ServerArg individuals) and generates an async run_<module>() function using the
tutorial's exact real pattern: StdioServerParameters -> stdio_client -> ClientSession ->
session.initialize() -> session.list_tools() -> dspy.Tool.from_mcp_tool(session, tool) per tool
-> dspy.ReAct(Signature, tools=dspy_tools) -> .acall(...). The MCP SERVER side (the tutorial's
own mcp_server.py, a FastMCP app) is deliberately out of scope here -- fastmcp-pack already owns
generating FastMCP servers; compose the two packs to cover the tutorial end-to-end rather than
duplicating server-generation logic. Tool discovery itself is genuinely dynamic (session.
list_tools() against a live server process) and is never enumerated as a fixed ontology fact --
only the fixed, generation-time-knowable wiring (signature, server launch command/args, which
ReAct module uses which server) is admitted.
"""
