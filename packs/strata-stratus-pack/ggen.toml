[project]
name = "strata-stratus-pack"
version = "0.1.0"
description = "Stratus witness valves and state registers projected from RDF for the Strata runtime"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/2000/01/rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"

[validation]
gates = ["gates/010_register_guards.rq"]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "stratus-valves"
query = { file = "queries/valves.rq" }
template = { file = "templates/valves.rs.tera" }
output_file = "valves.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "stratus-registers"
query = { file = "queries/registers.rq" }
template = { file = "templates/registers.rs.tera" }
output_file = "registers.rs"
skip_empty = false
mode = "Overwrite"
