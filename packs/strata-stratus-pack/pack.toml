[pack]
name = "strata-stratus-pack"
version = "0.1.0"
description = """
Stratus witnessing layer for Strata: witness valves that gate state-register
transitions. Composes the temprun arena (fuel-leased actuation) and the
CLAP-PDU protocol types.
"""
[capabilities]
provides = ["urn:ggen:pack:strata-stratus-pack"]
requires = ["urn:ggen:pack:strata-temprun-pack", "urn:ggen:pack:strata-protocol-pack"]

[dependencies]
strata-protocol-pack = "0.1.0"
strata-temprun-pack = "0.1.0"
