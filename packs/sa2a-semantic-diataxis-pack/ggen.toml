[project]
name = "sa2a-semantic-diataxis"
version = "26.9.30"
description = "Semantic Diataxis contracts for SA2A agents"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/sa2a-semantic-diataxis#"
imports = []

[ontology.prefixes]
sd = "https://ggen.dev/ontology/sa2a-semantic-diataxis#"

[validation]
gates = [
  "gates/010_required_fields.rq",
  "gates/020_single_quadrant.rq",
  "gates/030_complete_procedures.rq",
  "gates/040_authority_separation.rq",
  "gates/050_exact_identity.rq",
  "gates/060_standing_evidence.rq",
  "gates/070_unsupported_extensions.rq",
  "gates/080_typed_links.rq",
  "gates/090_output_uniqueness.rq",
]

[generation]
output_dir = "."

[[generation.rules]]
name = "diataxis-tutorial"
query = { file = "queries/documents.rq" }
template = { file = "templates/tutorial.md.tmpl" }
output_file = "consumer/docs/tutorial.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "diataxis-how-to"
query = { file = "queries/documents.rq" }
template = { file = "templates/how-to.md.tmpl" }
output_file = "consumer/docs/how-to.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "diataxis-reference"
query = { file = "queries/documents.rq" }
template = { file = "templates/reference.md.tmpl" }
output_file = "consumer/docs/reference.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "diataxis-explanation"
query = { file = "queries/documents.rq" }
template = { file = "templates/explanation.md.tmpl" }
output_file = "consumer/docs/explanation.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "projection-sa2a"
query = { file = "queries/documents.rq" }
template = { file = "templates/sa2a.json.tmpl" }
output_file = "consumer/projections/sa2a.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "projection-chatman-spg"
query = { file = "queries/documents.rq" }
template = { file = "templates/chatman-spg.json.tmpl" }
output_file = "consumer/projections/chatman-spg.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "projection-capability-marketplace"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/capability-marketplace.json.tmpl" }
output_file = "consumer/projections/capability-marketplace.json"
skip_empty = false
mode = "Overwrite"

