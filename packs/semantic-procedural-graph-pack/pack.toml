[pack]
name = "semantic-procedural-graph-pack"
version = "0.1.0"
description = "Canonical Semantic Procedural Graph (SPG) vocabulary and admission shapes. Reuses PROV-O, P-Plan, DCTERMS and SKOS; mints only the procedural remainder needed for typed transitions, guards, evidence, authority, consequence, receipts, projection bindings, and prior-art/novelty admission. This pack grants no runtime authority and performs no consequential DO."
