[project]
name = "ggen-dashboard-pack"
description = "Reusable ontology-backed dashboard projection pack."

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.io/ontology/dashboard#"

[ontology.prefixes]
dash = "https://ggen.io/ontology/dashboard#"
prov = "http://www.w3.org/ns/prov#"
skos = "http://www.w3.org/2004/02/skos/core#"
odrl = "http://www.w3.org/ns/odrl/2/"
dct = "http://purl.org/dc/terms/"

[templates]
dir = "templates"
