# ggen.toml -- self-proof profile: renders generated/ from qualification/consumer.ttl.
# A real consumer replaces [ontology].source with its own afc: graph.
[project]
name = "affidavit-consumer-pack"
version = "26.9.30"

[ontology]
source = "qualification/consumer.ttl"
imports = ["ontology.ttl", "qualification/affidavit-wasm.ttl"]

[generation]
output_dir = "."

[[generation.rules]]
name = "events-ts"
mode = "Overwrite"
query = { file = "queries/vocab.rq" }
template = { file = "templates/affidavit_events.ts.tmpl" }
output_file = "generated/affidavit_events.ts"

[[generation.rules]]
name = "events-py"
mode = "Overwrite"
query = { file = "queries/vocab.rq" }
template = { file = "templates/affidavit_events.py.tmpl" }
output_file = "generated/affidavit_events.py"

[[generation.rules]]
name = "verify-action"
mode = "Overwrite"
query = { file = "queries/vocab.rq" }
template = { file = "templates/action.yml.tmpl" }
output_file = "generated/action.yml"

[[generation.rules]]
name = "host-ts"
mode = "Overwrite"
query = { file = "queries/host.rq" }
template = { file = "templates/affidavit_host.ts.tmpl" }
output_file = "generated/affidavit_host.ts"

[[generation.rules]]
name = "host-py"
mode = "Overwrite"
query = { file = "queries/host.rq" }
template = { file = "templates/affidavit_host.py.tmpl" }
output_file = "generated/affidavit_host.py"
