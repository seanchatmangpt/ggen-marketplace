[pack]
name = "affidavit-consumer-pack"
version = "26.9.30"
description = """Adopt affidavit in a third-party project. The project declares, as RDF, the event types and object types its pipeline emits and the receipt profile it targets (core/v1); this pack projects that vocabulary into typed event constants and object-ref builders for TypeScript and Python (strings match affidavit's wire format id:type[:qualifier], lowercase-dash event types) and a GitHub composite action that fails the build when `affi receipt verify` exits non-zero (0 ACCEPT, 2 REJECT, 3 USAGE, 4 IO). Closure derived by capability-closure-pack: REUSE wasi-json-abi-pack and github-actions-pack conventions; BUILD this vocabulary; also generates TypeScript (node:wasi) and Python (wasmtime) wasm hosts from the module's wja: facts, with sha256 pin and typed AffidavitRefusal, proven against the real affidavit.wasm over all 9 op examples. Replaces the stale affidavit-pack v26.6.22 fork for consumers. Certifies, never decides; authority ceiling NONE."""
