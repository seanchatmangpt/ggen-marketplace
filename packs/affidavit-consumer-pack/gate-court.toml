[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true
runner = "python3 runners/semantic_runner.py --gate {gate} --witness {witness} --expectation {expectation}"

[[case]]
gate = "010_single_consumer"
pass = "witnesses/pass/010_single_consumer.ttl"
fail = "witnesses/fail/010_single_consumer.ttl"

[[case]]
gate = "020_profile_core_v1"
pass = "witnesses/pass/020_profile_core_v1.ttl"
fail = "witnesses/fail/020_profile_core_v1.ttl"

[[case]]
gate = "030_wire_names"
pass = "witnesses/pass/030_wire_names.ttl"
fail = "witnesses/fail/030_wire_names.ttl"

[[case]]
gate = "040_declares_events"
pass = "witnesses/pass/040_declares_events.ttl"
fail = "witnesses/fail/040_declares_events.ttl"

[[case]]
gate = "050_unique_names"
pass = "witnesses/pass/050_unique_names.ttl"
fail = "witnesses/fail/050_unique_names.ttl"
