[pack]
name = "autofde-lab-hook-contracts-pack"
version = "26.11.1"
description = "Single-sources the abstract hook contracts autofde-lab hand-writes in builders/domain and builders/solver (class, hook, signature, contract) and manufactures a Chicago-style contract court: per hook, a concrete subclass that satisfies it and a bare subclass that must raise HookNotImplementedError. Evidence only: authority NONE; no runtime code is emitted."
