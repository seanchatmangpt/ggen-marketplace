[pack]
name = "ggen-igniter-bootstrap-pack"
version = "0.1.0"
description = """
Manufactures the module SCAFFOLD ONLY (mix.exs + 5 module stub files: real @moduledoc,
real function signatures/@spec, `# TODO: hand-written glue` bodies) for `ggen_igniter` --
a pure-Elixir library that replicates the narrow ontology -> SPARQL -> template slice of
`ggen` needed for ash-extension-core-pack-style generation, using real, current, maintained
Hex packages (`rdf` 3.0.1, `sparql` 0.3.12, stdlib `EEx`, `igniter` 0.8.3) instead of
hand-building an RDF/SPARQL/template engine from scratch. This is a self-application of the
same "extract a real, working shape into a pack" move already used for ash_r2rml ->
ash-extension-core-pack, applied to ggen_igniter's own architecture: this pack does not
implement any query/render/actuate logic itself -- it only manufactures the module shell
that a human then fills in by hand (the same construct_only boundary ash_r2rml's own ggen
compiler observes).

v1 scope: 5 modules -- GgenIgniter.Ontology (wraps RDF.Turtle.read_file!/1),
GgenIgniter.Query (wraps SPARQL.execute_query/2), GgenIgniter.Render (wraps
EEx.eval_string/3), GgenIgniter.Actuate (v1: plain File.write!/2 for greenfield files;
Igniter AST-patch actuation is an explicit, disclosed follow-on, not built this pass), and
Mix.Tasks.GgenIgniter.Sync (the `use Igniter.Mix.Task` CLI entrypoint wiring the other four
in sequence). Templating choice: stdlib EEx, not the `solid` Liquid package -- ggen's own
Tera templates use a similar-looking but not syntax-identical control-flow grammar
(`{% set %}`, `| filter(attribute=..., value=...)`, `spec[0].field` indexing) that would
need porting either way; EEx avoids adding a second templating paradigm's own learning
curve on top of that port.

Explicit non-goals for this pack version: gates/SHACL-equivalent verification, the other 6
ash-extension-core-pack templates (persist/verify/info/install/reactor_pipeline/
composition_test) beyond the single `extension.ex` scaffold this bootstrap proves the
mechanism against, and general-purpose ggen parity. Acceptance bar for the manufactured
result once hand-glued: real RDF.Turtle.read_file!/SPARQL.execute_query/EEx.eval_string
round-trip against ash-extension-core-pack's REAL, already-proven ontology.ttl
(aex:AuditTrailSpec), Code.string_to_quoted!-clean output, and a structural (not
byte-identical) diff against the Rust-ggen-generated resource.ex this marketplace's own
ash-extension-core-pack already produced for the same spec.
"""
