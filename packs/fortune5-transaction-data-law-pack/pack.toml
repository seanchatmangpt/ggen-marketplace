[pack]
name = "fortune5-transaction-data-law-pack"
version = "26.7.31"
description = """
Constitutional transactional-data durability law for Fortune 5.
Admitted by fortune5-deployment-blocks-pack as the transaction-data
bb:commonPack alongside fortune5-data-residency-pack. Declares
multi-zone durability, encryption-at-rest, backups, point-in-time
recovery, and replication policy. SPARQL gates and SHACL shapes refuse
incomplete durability contracts, disabled PITR/encryption/multi-zone,
non-positive backup retention, and any ontology-declared direct cloud
actuation. Frontmatter templates project inventory + contract TTL under
infrastructure/data/transactional/. Broker-only: BRCE remains the
actuation boundary. No secrets, connection strings, or customer tenant
ids are minted.
"""

[metadata]
category = "governance"
tags = [
  "fortune5",
  "f500",
  "f5",
  "transaction-data",
  "durability",
  "backup",
  "pitr",
  "broker-only",
]

[capabilities]
provides = ["urn:ggen:pack:fortune5-transaction-data-law-pack"]
requires = []

[consumer_contract]
runtime = []
elixir_tier = "none (law pack; Ash/data-plane owned by downstream provider packs)"
peer_context = "catalog sibling fortune5-data-residency-pack (present on disk)"
projected_outputs = [
  "infrastructure/data/transactional/txn_durability_inventory.md",
  "infrastructure/data/transactional/txn_durability_contract.ttl",
]

# Frontmatter-schema pack (ggen 26.11.5): gates in pack.toml, not ggen.toml.
# Any row returned by a gate = refusal.
[validation]
gates = [
  "gates/010_durability_contract.rq",
  "gates/020_broker_only_no_actuation.rq",
]
