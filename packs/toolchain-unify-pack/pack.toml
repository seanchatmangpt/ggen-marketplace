[pack]
name = "toolchain-unify-pack"
version = "0.1.0"
description = """
Canonical asdf toolchain unifier for ggen-marketplace.

Renders one canonical `.tool-versions` (Elixir + Erlang/OTP) and a
setup-beam CI matrix snippet from a single RDF source of truth
(tu:ToolchainChoice), so N repos stop hand-maintaining N divergent
version pins. Consumer repos get `.tool-versions` only; CI matrices that
deliberately test version floors stay untouched (gate 020 enforces that
the pack itself never edits workflows it does not own).

Reference shape: packs/ash-extension-pack. Sibling: gym-ci-toolchain-bblock-pack
(CI preamble pins; this pack owns the local .tool-versions surface).
"""
