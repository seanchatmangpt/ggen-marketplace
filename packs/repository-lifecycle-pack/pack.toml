[pack]
name = "repository-lifecycle-pack"
version = "26.9.12"
description = """
Canonical repository lifecycle chain: Source -> Build -> Verify -> Release,
each stage a real individual, tied together by a ReleaseReceipt. Instantiates
real individuals for a Repository and its full lifecycle chain, and refuses
(gates/010_no_verify_no_release.rq) any Release individual that lacks a
preceding Verify-stage individual with a passing result.
"""
