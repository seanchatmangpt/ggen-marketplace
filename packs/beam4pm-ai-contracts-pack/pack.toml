[pack]
name = "beam4pm-ai-contracts-pack"
version = "0.1.1"
description = "Projects an admitted aic:ContractType graph into real, compiling Erlang and Elixir type and struct definitions, JSON Schema, constructors with required-field validation, and Chicago-style (no mocks) unit tests -- following the exact pattern established by beam4pm-process-model-pack's bpm:RecordType. Ships vocabulary (and, once other streams land, templates) only: the seven canonical AI-contract data shapes drawn from the post-LLM capability architecture roadmap (evidence_envelope, research_task, candidate_claim, tool_intent, admission_decision, model_call_receipt, evidence_hit) are admitted instance data supplied by the consuming project's own ontology.ttl (e.g. beam4pm). This pack is manufactured, not hand-written: the roadmap proposed 45-68 person-weeks of hand-built service code for these contract shapes; modeling them as ggen-admitted O* individuals and generating real projections compresses that to minutes. Data shapes only -- no execution authority, admission, or actuation semantics of any kind live here; those are the exclusive, separately-owned responsibility of beam4pm-post-llm-runtime-pack's rt: vocabulary. v0.1.1 (2026-09-04): externalized the aic:fieldType -> per-language-representation mapping from a duplicated if/elif dispatch ladder (measured: 21 \"field_type ==\" comparisons across 9 template files, byte-for-byte the same ladder as beam4pm-process-model-pack's) into a single shared aic:FieldType vocabulary in ontology.ttl, mirroring that pack's identical fix. gates/020_field_type_enum.rq now anti-joins against the vocabulary instead of hand-duplicating the 8-value string enum. Admitting a 9th field type now touches exactly the ontology.ttl vocabulary block (9 template files + this gate -> 1 site). No consumer-owned ontology.ttl changes required."
