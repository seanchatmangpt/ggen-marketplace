[pack]
name = "shadcn-ui-primitives-pack"
version = "0.2.0"
description = """
Real shadcn/ui primitive components confirmed absent from every other pack in
this marketplace (verified by grepping every *-shadcn-pack's templates/ for
`to: components/ui/*.tsx`): Card family, Badge, Label, Skeleton, Separator,
Tabs, Table family. Matches the cva/cn conventions used by the existing
button.tsx primitive (nextjs-ai-sdk-pack) so consumers can mix primitives from
both packs without style drift.

This pack projects ONLY components/ui/*.tsx: it installs no npm dependencies
and no lib/utils glue. The projected files compile only in a consumer that
already satisfies [consumer_contract] below — a fresh repo without
clsx/tailwind-merge/class-variance-authority/@radix-ui/react-tabs installed
and without @/lib/utils fails with TS2307 unresolvable-import errors
(witnessed on a fresh Next.js repo this session).
"""

[capabilities]
provides = ["urn:ggen:pack:shadcn-ui-primitives-pack"]

[consumer_contract]
# What a consumer MUST provide before projecting this pack, for the
# projected components/ui/*.tsx to compile.
runtime = [
  "clsx",
  "tailwind-merge",
  "class-variance-authority",
  "@radix-ui/react-tabs",
]
# cn helper: every template imports { cn } from "@/lib/utils".
# The consumer needs either the shadcn/ui lib/utils.ts (clsx + twMerge)
# or an equivalent export named `cn` at that path.
peer_context = "@/lib/utils via projected lib/utils.ts"
