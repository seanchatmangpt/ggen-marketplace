[project]
name = "latency-hazard-radar"
version = "0.1.0"
description = "Response-latency hazard radar: robust median/MAD estimation and hazard Z-score triage projected from RDF to an Elixir module"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "urn:latency-hazard-radar:"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
owl = "http://www.w3.org/2002/07/owl#"
xsd = "http://www.w3.org/2001/XMLSchema#"
sh = "http://www.w3.org/ns/shacl#"
lhr = "urn:latency-hazard-radar:"

[validation]
gates = [
  "gates/010_estimator_closure.rq",
  "gates/020_mad_zero_typed_refusal.rq",
  "gates/030_threshold_default.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "hazard-radar"
query = { file = "queries/hazard_policy.rq" }
template = { file = "templates/hazard_radar.ex.tera" }
output_file = "hazard_radar.ex"
skip_empty = false
mode = "Overwrite"
