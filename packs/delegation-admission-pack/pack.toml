[pack]
name = "delegation-admission-pack"
version = "0.1.0"
description = """
Reusable semantic contract for judgment evidence derived from arXiv:2609.29473 and
generalized into a delegation/admission calculus. A DelegationArtifact must bind
Explain, Verify, Modify, and Account evidence to the exact subject; verification
must be independent; every obligation declares scopeUnits; delegated work may not
exceed the minimum evidenced scope; Modify carries a changed-requirement probe;
Account carries authority, consequence, receipt, replay, and standing. Gates are
violation-row SELECT queries: rows mean refusal. Declarative only: this pack grants
no DO authority and does not establish production standing.
"""
