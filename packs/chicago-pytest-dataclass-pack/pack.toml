[pack]
name = "chicago-pytest-dataclass-pack"
version = "0.1.0"
description = "Generates runnable Chicago-style pytest proofs over ggen-generated Python dataclass modules from cpd:DataclassProof facts. Sibling to chicago-tdd-tools-pack (which covers the Rust CLI-boundary axis); this covers the dataclass-projection axis that autofde-lab hand-writes ten times over in tests/test_constitution_*_chicago.py. Two templates: a reusable runtime module (real importlib import, real construction, real state assertions, real dataclasses.FrozenInstanceError) and the per-class test module that dispatches through it, so no per-class import/construct/frozen logic is duplicated. Facts are grounded in the real generated src/autofde_lab/constitution/evidence.py, not invented. Verified 2026-09-06 against ggen 26.8.28: sync run wrote both files and 10 generated tests passed against the real module; a sabotaged-fact copy failed exactly one test, proving the generated proof binds to the module on disk. Carries NO runtime actuation authority (gates/040)."
