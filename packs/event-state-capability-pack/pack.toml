[pack]
name = "event-state-capability-pack"
version = "0.1.0"
description = """
Qualified capability contracts for the event and observed-state family, written for a
capability-resolution engine (ash_pplan v26.9.30) to resolve against.

CAPABILITY = SEMANTIC IDENTITY, NEVER A PACKAGE. The four pinned identities
Event.Emit, Event.Subscribe, State.Observe, State.Query (dotted IDs via rdfs:label and
dcterms:identifier; namespace escap:) name what an actor CAN DO, not which package does
it. A realization names the implementing provider (repo, module, version-pin policy,
qualification conditions) and never changes the capability's identity.

Semantics this pack admits as graph facts:
  * delivery semantics are declared per capability: atLeastOnce (duplicates possible,
    consumers must be idempotent), exactlyOnce (effect-once inside a declared dedupe
    window), atMostOnce (loss is a typed failure, never a silent one);
  * observed-state semantics: monotonicObservedState (observed state never regresses),
    pointInTimeSnapshot, streamingTail;
  * AUTHORITY: State.Observe is NON-consequential (observation needs no authority).
    Event.Emit is consequential THROUGH ITS TOPIC: emitting on a topic marked
    escap:consequentialTopic true requires an explicit bound authority requirement on
    the realization. ProviderAvailable != Authorized: a realization's mere existence
    (escap:providerAvailable true) never discharges the authority requirement -- gate
    050 refuses a consequential realization with no escap:authorityRequirement.

Realization provider coordinates are cited, never fabricated: Ash.Notifier/pubsub and
Ash read actions are cited as public `ash` API coordinates without local inspection;
:telemetry / :telemetry_poller as public hex coordinates; the OCEL-tap realization
coordinates (zcode-cli src/ocel-tap.ts, xaas lib/xaas/telemetry/ocel_ndjson.ex +
ocel_ash_emitter.ex) were confirmed by direct read on 2026-09-30.

Invariants encoded: Plan != Execution (a capability contract is a plan-level fact; a
realization is not an execution), Policy != Authority, ProviderAvailable != Authorized,
Projection != Source, Generated != Admitted. Standing vocabulary reuses the public APS
individuals. Failed edges against prior art (process-intelligence-pack pi:, the three
observability packs, EARL) are recorded in README.md.

Grants no execution authority. Qualification is marketplace admission + real-ggen sync
only.
"""
