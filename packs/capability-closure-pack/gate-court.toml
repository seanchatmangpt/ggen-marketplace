# Court: exact-stem pass/fail witness pairs per SPARQL gate (gates/*.rq).
[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true
runner = "python3 runners/semantic_runner.py --gate {gate} --witness {witness} --expectation {expectation}"

[[case]]
gate = "010_unique_capability_id"
pass = "witnesses/pass/010_unique_capability_id.ttl"
fail = "witnesses/fail/010_unique_capability_id.ttl"

[[case]]
gate = "020_provider_declared"
pass = "witnesses/pass/020_provider_declared.ttl"
fail = "witnesses/fail/020_provider_declared.ttl"

[[case]]
gate = "030_requires_resolves"
pass = "witnesses/pass/030_requires_resolves.ttl"
fail = "witnesses/fail/030_requires_resolves.ttl"

[[case]]
gate = "040_requires_acyclic"
pass = "witnesses/pass/040_requires_acyclic.ttl"
fail = "witnesses/fail/040_requires_acyclic.ttl"

[[case]]
gate = "050_standing_closed"
pass = "witnesses/pass/050_standing_closed.ttl"
fail = "witnesses/fail/050_standing_closed.ttl"

[[case]]
gate = "060_need_shape"
pass = "witnesses/pass/060_need_shape.ttl"
fail = "witnesses/fail/060_need_shape.ttl"
