[pack]
name = "capability-closure-pack"
version = "26.9.30"
description = """Semantic capability closure and residual-gap solver. Given a requirement graph (sJira sj:requiresCapability / cc:Requirement), computes which required capabilities the marketplace index already provides (REUSE), which have a same-family provider that must be extended (EXTEND), and the irreducible residual (BUILD). Only the residual becomes work. The index (index/declared.ttl) is a hand-declared projection of what packs provide, each claim carrying an evidence path that a verifier checks against the packs tree; coverage is reported by count and is NOT the whole marketplace. Authority ceiling NONE: SELECT and report only, no actuation."""
