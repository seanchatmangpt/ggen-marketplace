[project]
name = "github-controloutcome-observation"
version = "26.8.25"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "observation-ledger"
query = { inline = '''SELECT
  ("github-controloutcome-observation" AS ?subject)
WHERE {}
ORDER BY ?subject
''' }
template = { file = "templates/observation-ledger.tera" }
output_file = "controloutcome-observation.jsonl"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "qualification-court"
query = { inline = '''SELECT
  ("github-controloutcome-observation" AS ?subject)
WHERE {}
ORDER BY ?subject
''' }
template = { file = "templates/qualification-court.tera" }
output_file = "qualify-controloutcome.py"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "opportunity-realization-r29"
query = { file = "queries/r29-opportunity-realization/20-clean-realization-candidate-frontier.rq" }
template = { file = "templates/opportunity-realization-r29.json.tera" }
output_file = "opportunity-realization-r29.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "opportunity-realization-r29-court"
query = { file = "queries/r29-opportunity-realization/20-clean-realization-candidate-frontier.rq" }
template = { file = "templates/opportunity-realization-r29-court.py.tera" }
output_file = "qualify-opportunity-realization-r29.py"
skip_empty = false
mode = "Overwrite"
