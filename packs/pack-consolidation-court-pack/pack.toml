description = "ERRC consolidation court for ggen-marketplace pack capital. Classifies pack relationships as HARD_MERGE, EXTRACT_SHARED_ONTOLOGY, META_COMPOSE, DEPRECATE_INSTANCE, KEEP_DISTINCT, or UNKNOWN_WITH_REASON; generates a deterministic consolidation plan while refusing malformed or authority-ambiguous classifications. New packs are expected to prove that an existing canonical pack or composition does not already own the proposed semantic authority."
