[pack]
name = "scim-lifecycle-pack"
version = "0.2.0"
description = """SCIM 2.0 identity-lifecycle KernelPack: RDF vocabulary for RFC 7643
Users, Groups, ServiceProviderConfig, ResourceTypes, and Schemas (plus the HTTP
endpoint surface from RFC 7644), SHACL NodeShapes under shapes/scim.shacl.ttl,
fail-closed SPARQL gates, and frontmatter templates that project admitted facts
to Ash semantic maps, HTTP/schema registries, and lifecycle-operation catalogs.
PUBLIC-ONTOLOGY-FIRST: schema identity reuses the IETF SCIM schema URNs
(`urn:ietf:params:scim:schemas:core:2.0:User|Group|ServiceProviderConfig`);
FOAF/ORG cover person/org where they fit; PROV-O/DCTERMS carry provenance and
immutable identifiers. DISCLOSED MINTED TERMS under
`https://ggen.dev/ontology/scim-lifecycle#` (prefix `scim:`): lifecycle
operation individuals, Ash projection targets, HTTP endpoint cards, and
ResourceType/Schema discovery individuals needed for sync-time projection —
no public ontology enumerates SCIM protocol verbs or Ash module targets.
Grants no DO authority: templates emit Turtle/Markdown only (zero Elixir
runtime, zero hex deps). Declaring a User or Group never authorizes
provisioning; runtime actuation remains a separate consumer court."""

[metadata]
category = "identity"
tags = [
  "scim",
  "scim-2.0",
  "rfc-7643",
  "rfc-7644",
  "users",
  "groups",
  "service-provider-config",
  "resource-types",
  "schemas",
  "ash",
  "http",
  "shacl",
  "identity-lifecycle",
  "ontology",
]

[capabilities]
provides = ["urn:ggen:pack:scim-lifecycle-pack"]
requires = []

[consumer_contract]
# Templates project Turtle + Markdown only — no code imports. Runtime Elixir
# (Ash resources, Phoenix routers, ash_json_api) is owned by the consumer app
# after a later lane lands real generators; this pack pins no hex packages.
runtime = []
elixir_tier = "none (projections only; consumer app owns Ash/HTTP runtime later)"
peer_context = "scim: vocabulary individuals supplied by this pack; consumer may extend with tenant fixtures"
projected_outputs = [
  "generated/scim/ash_semantic_map.ttl",
  "generated/scim/http_endpoint_catalog.md",
  "generated/scim/ash_resource_design.md",
  "generated/scim/schema_urn_registry.md",
  "generated/scim/lifecycle_operations.md",
]

# Frontmatter-schema pack (ggen 26.11.5): gates live here, not in ggen.toml
# (FM-CONFIG-101 refuses a [validation] table beside frontmatter templates).
# Any row returned by a gate = refusal.
[validation]
gates = [
  "gates/010_user_required.rq",
  "gates/020_group_required.rq",
  "gates/030_spc_required.rq",
  "gates/040_schema_urn_closure.rq",
  "gates/050_no_password_literal.rq",
  "gates/060_http_endpoint_shape.rq",
  "gates/070_ash_projection_pk.rq",
  "gates/080_resource_type_required.rq",
]
