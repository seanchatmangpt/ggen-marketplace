[pack]
name = "gym-ci-toolchain-bblock-pack"
version = "0.1.0"
description = "Fortune-5 deployment building block for the gym ecosystem's CI toolchain preamble: one SHA-pinned composite action plus a measured pin-drift report, generated from facts grepped out of the real vendor/ trees."
license = "MIT"

[ontology]
source = "ontology.ttl"

[templates]
dir = "templates"
aggregate_modules = false

[gates]
dir = "gates"

[authority]
direct_actuation = false
note = "Renders CI preamble only. Gate 020_no_actuation.rq refuses any step that deploys, publishes, pushes, or applies. Consequential DO stays behind GymAct/BRCE admission."
