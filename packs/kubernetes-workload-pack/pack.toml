[pack]
name = "kubernetes-workload-pack"
version = "0.1.0"
description = "v0.1.0: first real slice. Schema-only k8s: vocabulary (dspy-pack contract -- ontology.ttl ships ZERO individuals; a consumer admits its own k8s:Workload/k8s:Container/k8s:Service facts in its own .ttl) for rendering real Kubernetes Deployment+Service YAML from typed facts, modeled directly on github-actions-pack's proven gha: shape (self-contained sync.rs-native to:/sparql:/for_each: template format, per-file 'GENERATED by ggen. Do not edit.' provenance header, real SPARQL refusal gates rather than post-hoc lint). First real consumer: ~/xaas's k8s/deployment.yaml -- built by hand-authoring k8s:Workload/k8s:Container facts matching that file's already-live-validated-on-kind-xaas shape (RBAC ServiceAccount, pod+container securityContext, resource requests/limits, readiness/liveness probes, envFrom ConfigMap+Secret refs) and confirming the rendered output is schema-valid via `kubectl apply --dry-run=client` and semantically equivalent to the hand-written original. gate 010 refuses a k8s:Container with no resource requests/limits (the real OOM-kill/CPU-throttle risk the xaas resource-quotas.yaml header comment already documents empirically) or a k8s:Workload with no securityContext fact bound (the HIGH-severity gap the 2026-08-20 xaas k8s-fault-scan-report found present on every workload before this session's manual hardening pass). Scope of this first slice: Deployment + Service only -- NetworkPolicy, RBAC, PodDisruptionBudget, ResourceQuota, HorizontalPodAutoscaler, and Secret/ConfigMap generation are explicit, disclosed backlog (v0.2.0+), not silently out of scope."
