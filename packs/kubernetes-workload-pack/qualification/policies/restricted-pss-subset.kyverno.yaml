apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restricted-pss-subset
  annotations:
    policies.kyverno.io/title: Restricted PSS subset (privileged, allowPrivilegeEscalation, capabilities.drop, digest-pinned images)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Privileged mode is disallowed. The fields spec.containers[*].securityContext.privileged,
          spec.initContainers[*].securityContext.privileged, and
          spec.ephemeralContainers[*].securityContext.privileged must be unset or set to `false`.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: '{{ merge(`{"privileged": false}`, element.securityContext || `{}`).privileged }}'
                    operator: Equals
                    value: true
          - list: "request.object.spec.initContainers[] || `[]`"
            deny:
              conditions:
                any:
                  - key: '{{ merge(`{"privileged": false}`, element.securityContext || `{}`).privileged }}'
                    operator: Equals
                    value: true
          - list: "request.object.spec.ephemeralContainers[] || `[]`"
            deny:
              conditions:
                any:
                  - key: '{{ merge(`{"privileged": false}`, element.securityContext || `{}`).privileged }}'
                    operator: Equals
                    value: true

    - name: require-allow-privilege-escalation-false
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          allowPrivilegeEscalation must be explicitly set to `false` on every container,
          initContainer, and ephemeralContainer.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: '{{ not_null((element.securityContext || `{}`).allowPrivilegeEscalation, `"unset"`) }}'
                    operator: NotEquals
                    value: false
          - list: "request.object.spec.initContainers[] || `[]`"
            deny:
              conditions:
                any:
                  - key: '{{ not_null((element.securityContext || `{}`).allowPrivilegeEscalation, `"unset"`) }}'
                    operator: NotEquals
                    value: false
          - list: "request.object.spec.ephemeralContainers[] || `[]`"
            deny:
              conditions:
                any:
                  - key: '{{ not_null((element.securityContext || `{}`).allowPrivilegeEscalation, `"unset"`) }}'
                    operator: NotEquals
                    value: false

    - name: require-drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Container securityContext.capabilities.drop must include `ALL` on every container,
          initContainer, and ephemeralContainer.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: ALL
                    operator: AnyNotIn
                    value: '{{ not_null(((element.securityContext || `{}`).capabilities || `{}`).drop, `[]`)[] || `[]` }}'
          - list: "request.object.spec.initContainers[] || `[]`"
            deny:
              conditions:
                any:
                  - key: ALL
                    operator: AnyNotIn
                    value: '{{ not_null(((element.securityContext || `{}`).capabilities || `{}`).drop, `[]`)[] || `[]` }}'
          - list: "request.object.spec.ephemeralContainers[] || `[]`"
            deny:
              conditions:
                any:
                  - key: ALL
                    operator: AnyNotIn
                    value: '{{ not_null(((element.securityContext || `{}`).capabilities || `{}`).drop, `[]`)[] || `[]` }}'

    - name: require-image-digest
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Container images must be pinned by digest (must contain `@sha256:`). A mutable
          tag such as `:latest`, or any tag without a digest, is disallowed.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.image, '@sha256:') }}"
                    operator: NotEquals
                    value: true
          - list: "request.object.spec.initContainers[] || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.image, '@sha256:') }}"
                    operator: NotEquals
                    value: true
          - list: "request.object.spec.ephemeralContainers[] || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.image, '@sha256:') }}"
                    operator: NotEquals
                    value: true
