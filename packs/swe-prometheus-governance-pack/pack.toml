[pack]
name = "swe-prometheus-governance-pack"
version = "0.1.0"
description = """
Semantic interchange contract for SWE-Prometheus-style repository retrofit
evidence. The pack fixes one exact repository/base/patch subject, the six
governance dimensions, paired base/treated scores, explicit evidence status,
behavior preservation, mutation-derived gate strength, clean-environment
receipts, and replay receipts.

Public vocabulary is reused first: repository cases and paired observations are
prov:Entity-shaped evidence; verifier receipts subclass earl:TestResult; receipt
identity reuses dcterms:identifier. The custom namespace exists for the failed
edge: PROV/EARL do not define the SWE-Prometheus six-dimension universe,
headroom-paired scores, behavior-gate strength, or fixed-base patch subject.

Violation-row gates:
010_exact_identity requires exactly one case and one repository/base/patch
identity; 020_dimension_universe requires exactly one observation for each of
D1..D6; 030_detected_requires_mutation_receipt refuses a "detected" behavior
gate without a PASS mutation receipt and receipt id; 040_paired_score_shape
requires PASS evidence to carry base/treated scores in [1,5] and refuses unknown
evidence statuses.

Authority boundary: vocabulary + structural admission gates + projection only.
This pack does not execute repository probes, compute NGI, decide ALIVE, or
actuate repository changes. autofde-lab remains the court that recomputes NGI
and applies the stronger Verified Governance Gain evidence ceiling.
"""
