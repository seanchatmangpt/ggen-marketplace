[pack]
name = "swe-prometheus-governance-pack"
version = "0.2.0"
description = """
Semantic interchange + executable-plan source contract for SWE-Prometheus-style
repository governance retrofit evidence.

v0.1 fixed one exact repository/base/patch subject, the six governance
dimensions, paired base/treated scores, explicit evidence status, behavior
preservation, mutation-derived gate strength, clean-environment receipts, and
replay receipts.

v0.2 closes the source-to-runtime gap. RDF now also declares prov:Plan-backed
ProbeSpec, VerifierSpec, and MutationSpec resources. Templates manufacture the
exact autofde-lab probe and reversible-mutation manifest schemas. Commands remain
ordered argv JSON arrays, never shell strings; cwd/path traversal, mutation
preimages, timeouts, operator payloads, enum universes, receipt bindings, and
score cardinality are all violation-row gated before generation.

Public vocabulary is reused first:
- prov:Entity for evidence/case identity;
- prov:Plan for executable probe/verifier/mutation plans;
- earl:TestResult for verifier receipts;
- dcterms:identifier for receipt identity.

The custom namespace exists only for the failed edges those standards do not
cover: SWE-Prometheus D1..D6 semantics, fixed-base patch identity,
headroom-paired score observations, gate-strength vocabulary, ordered argv
projection, exact mutation preimages/operators, and the pairing relations.

Violation-row gates:
010 exact repository/base/patch identity.
020 exact D1..D6 dimension universe.
030 detected gate requires PASS mutation receipt + id.
040 PASS paired score presence/range + evidence status.
050 closed enum universes across case/receipt/probe/mutation/verifier.
060 exactly bound clean + replay receipt shape.
070 score cardinality and stale-score rejection.
080 executable ProbeSpec/VerifierSpec/MutationSpec shape.
090 exact mutation preimage/path/operator payload.
100 argv-array/cwd/timeout execution boundaries.

Templates:
- case.json.tmpl -> autofde-lab.swe-prometheus-case/1
- probe-manifest.json.tmpl -> autofde-lab.swe-prometheus-probe-manifest/1
- mutation-manifest.json.tmpl -> autofde-lab.swe-prometheus-mutation-manifest/1

Authority boundary: ontology + gates + fixtures + deterministic projections only.
The pack never executes repository probes, applies mutations, computes NGI/VGG,
assigns ALIVE standing, or actuates target repositories. autofde-lab owns those
runtime courts. Generated consumer files are projections and must be regenerated,
not hand-edited.
"""
