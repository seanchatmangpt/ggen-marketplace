[pack]
name = "shacl-to-zod-pack"
version = "0.1.0"
description = """
Projects an admitted SHACL NodeShape into a JavaScript Zod schema while reusing
shacl-projection-pack's sp:derivedFromShape / sp:isPrimaryOutput / sp:nullable law.
Standard sh:in string lists become z.enum([...]); sp:nullable true becomes .nullable().
The pack ships zero domain individuals. Consumers must compose shacl-projection-pack
explicitly so its admission gate runs over the merged graph.
"""
