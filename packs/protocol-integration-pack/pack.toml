[pack]
name = "protocol-integration-pack"
version = "26.9.12"
description = """
Canonical protocol/transport/adapter vocabulary: an Adapter binds one
Capability to one Protocol/Transport pair by REUSING that Capability's
existing semantic definition, never redefining it. Instantiates real
individuals for a Protocol, a Transport, a Capability, an Adapter binding
that Capability to the Protocol/Transport pair, and a second Adapter binding
the SAME Capability to a distinct second Protocol without redefining its
semantics -- proving one Capability can bind to multiple Protocols without
semantic duplication. Refuses (gates/010_no_semantic_redefinition.rq) any
Adapter that asserts its own competing semanticDefinition for the Capability
it binds instead of reusing the Capability's own.
"""
