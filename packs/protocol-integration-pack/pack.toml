[pack]
name = "protocol-integration-pack"
version = "26.9.13"
description = """
Canonical protocol/transport/adapter vocabulary: an Adapter binds one
Capability to one Protocol/Transport pair by REUSING that Capability's
existing semantic definition, never redefining it. Instantiates real
individuals for a Protocol, a Transport, a Capability, an Adapter binding
that Capability to the Protocol/Transport pair, and a second Adapter binding
the SAME Capability to a distinct second Protocol without redefining its
semantics -- proving one Capability can bind to multiple Protocols without
semantic duplication. Refuses (gates/010_no_semantic_redefinition.rq) any
Adapter that asserts its own competing semanticDefinition for the Capability
it binds instead of reusing the Capability's own.

v26.9.13 (2026-09-13): added the real-dependency + adapter convention. A
pr:PriorArtAdapter individual can now carry eight admitted properties
(pr:realDependencyCoordinate, pr:realDependencyApp, pr:adapterModuleName,
pr:adapterModulePath, pr:adapterEntrypointModule, pr:adapterEntrypointFunction,
pr:adapterTestModuleName, pr:adapterTestPath) plus pr:priorArtFixtureOnly (the
opt-out marker, mirroring ash-extension-core-pack's aex:fixtureOnly idiom) and
three new templates (mix_dep_install.ex.tmpl, adapter.ex.tmpl,
adapter_test.exs.tmpl) that manufacture a real Igniter mix.exs dependency
installer, a thin real-function adapter, and a real-collaborator ExUnit test --
instead of leaving PriorArtAdapter individuals as pure description forever.
gates/010_real_dependency_adapter_contract.rq refuses any non-fixture-only
PriorArtAdapter missing one of the eight properties. This pack.toml stays
identity-only -- the real dependency itself is declared in the GENERATED
CONSUMER's own mix.exs via mix_dep_install.ex.tmpl, never in this pack.toml.

v26.9.14 (2026-09-14): added the cli-subprocess adapter convention, for real
dependencies that are compiled CLI binaries with no in-process Elixir/Mix
collaborator to call (e.g. Rust Cargo binary crates with no lib.rs, such as
open-ontologies and deepwiki-rs in kudzu-case-studies-pack -- both named that
exact gap in an rdfs:comment before this capability existed). A
pr:PriorArtAdapter individual can now set pr:integrationMode "cli-subprocess"
and carry three new properties (pr:adapterBinaryPath, pr:adapterSubcommand,
plus the existing pr:adapterModuleName/pr:adapterModulePath) alongside two new
templates (subprocess_adapter.ex.tmpl, subprocess_adapter_test.exs.tmpl) that
manufacture a thin Elixir adapter shelling out for real via System.cmd/3 --
no shell string interpolation, no Port mocking -- and a real Chicago-style
ExUnit test asserting on the real returned exit code. gates/020_subprocess_
adapter_contract.rq refuses any non-fixture-only cli-subprocess PriorArtAdapter
missing one of six required properties (adapterBinaryPath, adapterSubcommand,
adapterModuleName, adapterModulePath, adapterTestModuleName, adapterTestPath)
-- a different required set than gates/010's eight, since a cli-subprocess
adapter has no in-process dependency coordinate or entrypoint module/function
to declare. gates/010 was extended with one FILTER NOT EXISTS excluding
pr:integrationMode "cli-subprocess" individuals so the two gates never both
fire on the same individual; its original eight-property check for in-process
adapters is otherwise unchanged.
"""
