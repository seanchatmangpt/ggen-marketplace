# Frontmatter schema (ggen 26.11.5): templates carry `to:` / `sparql:`.
# Do NOT add [generation] / [validation] / [[generation.rules]] here —
# those classify DeclarativeRules and collide with [templates] (FM-CONFIG-003).
# SPARQL refusal gates live in pack.toml [metadata] prose + gates/*.rq;
# sync admission is via frontmatter templates only.
# qualification/consumer.ttl is imported so pack-local `ggen sync run` is a
# self-proof court (union of vocab + positive consumer facts).

[project]
name = "ash-rls-tenant-isolation-pack"

[ontology]
source = "ontology.ttl"
imports = ["qualification/consumer.ttl"]

[ontology.prefixes]
rls = "https://ggen.dev/packs/ash-rls-tenant-isolation#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
owl = "http://www.w3.org/2002/07/owl#"
xsd = "http://www.w3.org/2001/XMLSchema#"
dcterms = "http://purl.org/dc/terms/"
sh = "http://www.w3.org/ns/shacl#"

[templates]
dir = "templates"
