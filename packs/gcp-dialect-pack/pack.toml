[pack]
name = "gcp-dialect-pack"
version = "0.1.0"
description = """Arcus GCP-dialect pack: the pubsub.proto field-number pin
lattice and wire/signing/error-envelope laws for the GCP dialect (Dialect #2
face), ported from smalt lib/smalt/data_plane/pubsub_grpc/wire.ex (lane K-GC)
and the TS sibling lane's GCS V4 signing + error-envelope census
(verification/ts/gcp/*.probe.mjs), with closure gates for four sync-time
invariants: pin presence, wire-type closure, signing-scope law, and
error-envelope law completeness."""

[capabilities]
provides = ["urn:ggen:pack:gcp-dialect-pack"]

[validation]
gates = [
  "gates/010_required.rq",
  "gates/020_wire_closure.rq",
  "gates/030_signing_law.rq",
  "gates/040_error_law.rq",
]
