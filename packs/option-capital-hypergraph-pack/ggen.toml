[project]
name = "option-capital-hypergraph-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "opportunity-ledger"
query = { file = "queries/10-opportunity-edges.rq" }
template = { file = "templates/opportunity-ledger.json.tera" }
output_file = "generated/option-capital/ledger.json"

[[generation.rules]]
name = "pareto-frontier"
query = { file = "queries/20-pareto-frontier.rq" }
template = { file = "templates/pareto-frontier.json.tera" }
output_file = "generated/option-capital/frontier.json"

[[generation.rules]]
name = "exploration-metrics"
query = { file = "queries/30-exploration-metrics.rq" }
template = { file = "templates/exploration-metrics.json.tera" }
output_file = "generated/option-capital/metrics.json"
