[project]
name = "ggen-project-boundary-pack"
version = "26.8.11"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "boundary-observation"
query = { file = "queries/20-clean-frontier.rq" }
template = { file = "templates/boundary-observation.json.tera" }
output_file = "generated/project-boundary/observation.json"

[[generation.rules]]
name = "boundary-court"
query = { file = "queries/20-clean-frontier.rq" }
template = { file = "templates/boundary-court.py.tera" }
output_file = "generated/project-boundary/qualification_court.py"
