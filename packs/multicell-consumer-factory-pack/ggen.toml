[project]
name = "multicell-consumer-factory-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "consumer-manifest"
query = { file = "queries/30-clean-frontier.rq" }
template = { file = "templates/consumer-manifest.json.tera" }
output_file = "generated/multicell/consumer-manifest.json"

[[generation.rules]]
name = "consumer-court"
query = { file = "queries/30-clean-frontier.rq" }
template = { file = "templates/consumer-court.py.tera" }
output_file = "generated/multicell/consumer_court.py"
