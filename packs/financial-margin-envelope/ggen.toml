# Pack-local manifest: self-verification only (writes under generated/, never
# into a consumer). Consumers copy this manifest into their own project, point
# fme:EnvelopeConfig at their own envelope data, and sync.

[project]
name = "financial-margin-envelope"
version = "0.1.0"
description = "Margin-envelope admit/refuse generator (pack-local self-verification)"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "urn:fin:margin-envelope:"
imports = []

[ontology.prefixes]
fme = "urn:fin:margin-envelope:"
xsd = "http://www.w3.org/2001/XMLSchema#"

[generation]
output_dir = "."

[[generation.rules]]
name = "margin-envelope"
query = { file = "queries/margin_envelopes.rq" }
template = { file = "templates/margin_envelope.ex.tmpl" }
output_file = "generated/margin_envelope.ex"
skip_empty = false
mode = "Overwrite"

[validation]
gates = [
  "gates/010_envelope_complete.rq",
  "gates/020_margin_floor_invariant.rq",
  "gates/030_anti_vacuity_floor.rq",
]
