[project]
name = "portfolio-epistemic-observability"
version = "26.8.25"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "portfolio-frontier"
query = { file = "queries/20_actionable_frontier.rq" }
template = { file = "templates/frontier.json.tera" }
output_file = "generated/portfolio-epistemic-observability/frontier.json"

[[generation.rules]]
name = "portfolio-court"
query = { file = "queries/22_clean_current_frontier.rq" }
template = { file = "templates/court.py.tera" }
output_file = "generated/portfolio-epistemic-observability/court.py"

[[generation.rules]]
name = "r76-portfolio-structural-census"
query = { file = "queries/r76-structural-census/050_clean_structural_frontier.rq" }
template = { file = "templates/r76-structural-census-frontier.json.tera" }
output_file = "generated/portfolio-epistemic-observability/r76-structural-census-frontier.json"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "r77-exact-repository-universe-frontier"
query = { file = "queries/r77/50-clean-repository-universe-frontier.rq" }
template = { file = "templates/r77-repository-universe-frontier.json.tera" }
output_file = "generated/portfolio-epistemic-observability/r77-repository-universe-frontier.json"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "r78-tcps-ready-set-capital-plan"
query = { file = "queries/r78-tcps-ready-set/050_clean_allocation_crown.rq" }
template = { file = "templates/r78-tcps-ready-set-capital-plan.json.tera" }
output_file = "generated/portfolio-epistemic-observability/r78-tcps-ready-set-capital-plan.json"
skip_empty = true
mode = "Overwrite"
