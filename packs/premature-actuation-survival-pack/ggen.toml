[project]
name = "premature-actuation-survival-pack"
version = "26.9.25"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "survival-policy-catalog"
query = { file = "queries/30_policy_catalog.rq" }
template = { file = "templates/policies.json.tera" }
output_file = "generated/survival/policies.json"

[[generation.rules]]
name = "survival-factor-catalog"
query = { file = "queries/40_factor_catalog.rq" }
template = { file = "templates/factors.json.tera" }
output_file = "generated/survival/factors.json"

[[generation.rules]]
name = "survival-fault-catalog"
query = { file = "queries/50_fault_catalog.rq" }
template = { file = "templates/faults.json.tera" }
output_file = "generated/survival/faults.json"

[[generation.rules]]
name = "survival-analysis-catalog"
query = { file = "queries/60_analysis_catalog.rq" }
template = { file = "templates/analysis-methods.json.tera" }
output_file = "generated/survival/analysis-methods.json"
