[pack]
name = "arcus-pack"
version = "0.1.0"
description = """Arcus cloud-ingest adapter pack: one canonical RDF graph of dialects (aws-eventbridge, aws-s3, gcp-pubsub, azure-eventhubs, kafka, stripe-webhook), services, operations, shapes and fields projected into deterministic Go adapter tables, typed refusal for absent operations, and closure gates for all eight sync-time invariants: required metadata presence,
HTTP-method closure, Go initialism naming closure, dialect coverage closure,
Go type referential closure (every non-builtin goType resolves to a defined
Shape/ErrorShape), Arrow wire-field layout completeness (offset/sizeBytes/wireKind
on every WireField), SPOG array buffer-layout completeness (buffer geometry and
DenseUnion child closure), and bitmap/IPC kernel-primitive specification closure
(primName/primKind/law/seam/status + mandatory prov:wasDerivedFrom), and
flight feed closure (PG-A9 PART A step 3: feedOf/wireFormat/frameFlag closed
sets, feed<->transcoder bijection, mandatory prov:wasDerivedFrom)."""

[capabilities]
provides = ["urn:ggen:pack:arcus-pack"]

[validation]
gates = [
  "gates/010_required.rq",
  "gates/020_method_closure.rq",
  "gates/030_go_name_closure.rq",
  "gates/040_dialect_closure.rq",
  "gates/050_go_type_closure.rq",
  "gates/060_arrow_layout.rq",
  "gates/070_spog_layout.rq",
  "gates/080_bitmap_ipc.rq",
  "gates/090_feed_closure.rq",
  "gates/100_aoq_ipc.rq",
  "gates/110_uniqueness.rq",
  "gates/120_population_floor.rq",
  "gates/130_zone_enum.rq",
]
