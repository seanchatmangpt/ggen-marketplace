[pack]
name = "autofde-level4-actuation-pack"
version = "1.0.0"
description = "Admits OCEL-projected actuation logs against the real Level-4 causal-chain SHACL shapes (Actuation -> PostconditionObservation -> Receipt -> Replay, and ProbeExecuted-before-ModelInferred ordering). Validation runs the committed SHACL file itself via pyshacl; this pack does not itself produce actuation logs."
