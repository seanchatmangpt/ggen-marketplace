[pack]
name = "ip-allowlist-network-policy-pack"
version = "0.1.0"
description = """
IP allowlist + NetworkPolicy law pack for Fortune 5 / Semantic Jira perimeter
and tenant jails. Closes the catalog stub fortune5-network-law-pack (global-
network bb:commonPack in fortune5-deployment-blocks-pack) with real RDF shapes,
SPARQL refusal gates, and frontmatter templates that project admitted facts to
Kubernetes NetworkPolicy YAML and a CIDR inventory.

Surfaces modeled:
  (1) named IP allowlists of CIDR entries (admin / VPN / corp ingress);
  (2) NetworkPolicy specs with a closed egress posture vocabulary
      (ZeroEgress | DefaultDenyWithAllow | IngressAllowlistOnly);
  (3) the fnox-proven sovereign-zero-egress-jail pattern as a canonical
      individual (policyTypes: [Egress], egress: []).

Broker-only: ontology declares directActuation false. This pack never emits
cloud-provider terraform that mints IP allowlist resources. Explicitly BLOCKED
surface (gate 050): claiming github_ip_allow_list_entry / org-level GitHub IP
allow-list terraform — integrations/github has no such resource; enterprise
scope is out of band (see gh-terraform-pack flagReason on ghtf:IpAllowList*).
"""

[metadata]
category = "network"
tags = [
  "ip-allowlist",
  "cidr",
  "network-policy",
  "egress-jail",
  "zero-egress",
  "fortune5",
  "global-network",
  "sjira",
]

[capabilities]
provides = [
  "urn:ggen:pack:ip-allowlist-network-policy-pack",
  "urn:ggen:pack:fortune5-network-law-pack",
  "urn:ggen:capability:ip-allowlist",
  "urn:ggen:capability:k8s-network-policy",
  "urn:ggen:capability:zero-egress-jail",
]
requires = []

[consumer_contract]
runtime = []
peer_context = """
Consumers admit ianp:IpAllowlist / ianp:CidrEntry / ianp:NetworkPolicySpec
individuals (or reuse the pack's canonical zero-egress jail). Templates emit
YAML + Markdown only. Cloud IP-allowlist actuation (AWS SG, GCP firewall,
Azure NSG, GitHub org IP allow list) is out of scope — pin a provider pack
or document BLOCKED. CNI must enforce NetworkPolicy for runtime effect.
"""
