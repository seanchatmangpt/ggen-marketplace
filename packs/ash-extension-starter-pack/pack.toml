[pack]
name = "ash-extension-starter-pack"
version = "0.1.0"
description = """
Composition/root pack over ash-extension-core-pack, named as a deferred follow-up in
core-pack's own pack.toml (2026-08-26). Adds two REAL, review-confirmed capabilities
core-pack's fixed ash_r2rml-derived shape does not yet cover, rather than duplicating
what core-pack already has (an earlier draft of this pack wrongly re-invented
core-pack's existing aex:workflowReactor/aex:CompositionTarget as a parallel
`aexs:` vocabulary -- deleted after checking core-pack/ontology.ttl directly):

1. **Dynamic Reactor step-graph generation** (`templates/reactor_pipeline_dynamic.ex.tmpl`) --
   core-pack's own `reactor_pipeline.ex.tmpl` hardcodes ash_r2rml's specific five-step
   pipeline body (compile_resources -> verify_alignment/evaluate_differential ->
   attach_provenance -> apply_policy -> render_r2rml_turtle). A review of
   `/Users/sac/ash_r2rml` (2026-09-09, ranked #1 of 5 confirmed gaps) found this
   pipeline is really an ordered, dependency-wired step DAG with per-step
   argument/result wiring, wait_for edges, max_retries, and compensate/4 -- not a
   boolean toggle. This pack's `aex:ReactorStep` class (ontology.ttl) lets a spec
   declare an ARBITRARY step graph, so a different extension's own pipeline shape
   (not ash_r2rml's specific five steps) can be generated.

2. **Receipted-action generation** (`templates/receipted_action.ex.tmpl`) -- a review
   of `/Users/sac/xaas` (2026-09-09, finding #5) found its real `Xaas.Actuation.run/4`
   (lib/xaas/actuation.ex:427-531) is architecturally distinct from core-pack's
   `workflowReactor`: idempotency-key-gated admission, a sealed-receipt entity,
   transaction-wrapped DO, and a deterministic-replay path -- exactly the shape
   `ex4pm`'s real `Evidence.BRCE.execute/5` (admit -> pending-receipt -> run ->
   outcome-receipt) already implements, and exactly what the ash_ex4pm extension's
   planned `brce_gate` capability (/tmp/ash_ex4pm_prfaq.md, this session) needs.
   `aex:generatesReceiptedAction` lets a spec opt into this shape. Disclosed as a
   first cut, not a byte-for-byte Actuation.run/4 port: it does not yet wrap the
   target action call in an explicit outer transaction the way xaas's own module
   does (see the template's own header comment) -- named follow-up, not silently
   claimed equivalent.

**Tool-boundary disclosure (xaas review finding #4, real and previously paid-for in
this environment -- see xaas/docs/case-studies/next-read/RCA-ggen-tool-confusion.md):**
This pack, like ash-extension-core-pack, is driven by the Rust `ggen` binary
(`ggen.toml` + Tera `.tmpl` templates with `sparql:`/`for_each:` frontmatter). It is
UNRELATED to the Elixir `ggen_igniter` hex package (`mix ggen_igniter.sync
--ontology/--query/--template/--out`, EEx templates, no `ggen.toml`), despite the
similar name. A consumer whose own repo ALSO uses `ggen_igniter` for other generation
(e.g. xaas's real `lib/mix/tasks/xaas.library.manufacture.ex`, generated by
`ggen_igniter.sync --pack-dir`) must not assume this pack's templates run through
that same tool -- they are rendered via `ggen sync run` against a `ggen.toml`
pointing at this pack's (or core-pack's) `templates/` directory.

Named follow-ups from the two review passes, NOT implemented in this version (see
ontology.ttl's own follow-up comment block for the full list with file:line
citations): Reactor middleware declaration, transformer after?/before? ordering,
verifier delegate-and-join-refusals idiom, Info module getter/getter!/predicate?
triple, arbitrary N-length third-party-extension composition (xaas resources
routinely stack 3-4 extensions -- AshJsonApi + AshGraphql + AshAdmin + AshAi on one
domain, lib/xaas/library.ex:8 -- not just the ash_graphql/ash_json_api pair
aex:CompositionTarget covers today), and a multi-phase orchestrating installer
(ordered target list + `--phase` selector, matching xaas's real generated
`xaas.library.manufacture` task shape).

Verification status: ontology.ttl and both new templates are hand-reviewed against
their cited real sources (ash_r2rml's reactor_pipeline.ex, xaas's actuation.ex) but
NOT yet run through a real `ggen sync run` against a live spec fixture -- that is the
next real step before this pack can be called ALIVE rather than UNVERIFIED.
"""
