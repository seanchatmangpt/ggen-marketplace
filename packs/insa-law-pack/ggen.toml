[project]
name = "insa-law-pack"
version = "0.1.0"
description = "Eight-vow typestate order law of insa-replaw projected from RDF for graphlaw N3/LawState vow-ordering checks."
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "urn:insa-law:"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
dct = "http://purl.org/dc/terms/"
insa = "urn:insa-law:"

[validation]
gates = [
  "gates/010_exactly_8_transitions.rq",
  "gates/020_linear_chain_closure.rq",
  "gates/030_refusal_exercise.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "vow_order"
query = { file = "queries/vow_order.rq" }
template = { file = "templates/vow_order.rs.tera" }
output_file = "vow_order.rs"
skip_empty = false
mode = "Overwrite"
