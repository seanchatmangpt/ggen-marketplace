version = "0.1.0"
description = "Canonical projection of insa-replaw's eight-vow sealed typestate law (VowEngine Source->Pattern->Field->Motion->Receiver->Fruit->Receipt->Rest, eight_vow.rs L172-321) as RDF: 8 VowState individuals, 8 VowTransition individuals (fromState/toState/edgeFn/receiptBinding from eight_vow_bridge.rs L129-544), one linear OrderLaw (no skips), and 8 typed BridgeError refusal individuals mirroring the real variants (eight_vow_bridge.rs L44-48). Fail-closed gates enforce exactly 8 transitions, linear chain closure Source..Rest with no gaps/duplicates, and every BridgeError variant exercised by >= 1 transition. Classification/projection vocabulary only: nothing here grants runtime actuation authority -- consequential DO stays behind BRCE admission."

[capabilities]
