[project]
name = "ash-r2rml-reactor-paas-pack"
version = "26.8.26"
description = "Ontology-driven Ash/AshR2RML/Reactor PaaS manufacturer"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/ash-r2rml-reactor-paas#"

[ontology.prefixes]
paas = "https://ggen.dev/ontology/ash-r2rml-reactor-paas#"
skos = "http://www.w3.org/2004/02/skos/core#"
dcterms = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"
dcat = "http://www.w3.org/ns/dcat#"
odrl = "http://www.w3.org/ns/odrl/2/"
schema = "https://schema.org/"

[templates]
dir = "templates"

[generation]
output_dir = "."

[[generation.rules]]
name = "paas-domain"
query = { file = "queries/10-resources.rq" }
template = { file = "templates/paas_domain.ex.tmpl" }
output_file = "generated/ggen_paas_domain.ex"
mode = "Overwrite"
skip_empty = false

[[generation.rules]]
name = "paas-resources"
query = { file = "queries/10-resources.rq" }
template = { file = "templates/paas_resources.ex.tmpl" }
output_file = "generated/ggen_paas_resources.ex"
mode = "Overwrite"
skip_empty = false

[[generation.rules]]
name = "paas-provision-reactor"
query = { file = "queries/20-workflow.rq" }
template = { file = "templates/provision_reactor.ex.tmpl" }
output_file = "generated/ggen_paas_provision_reactor.ex"
mode = "Overwrite"
skip_empty = false

[[generation.rules]]
name = "paas-contract"
query = { file = "queries/20-workflow.rq" }
template = { file = "templates/paas_contract.ex.tmpl" }
output_file = "generated/ggen_paas_contract.ex"
mode = "Overwrite"
skip_empty = false

[law]
rules = []
