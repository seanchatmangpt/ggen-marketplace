[pack]
name = "rust-wasi-wasmex-pack"
version = "0.1.0"
description = """Unified Rust > WASM > Elixir execution pipeline: coordinates Rust guest FFI (packed-u64 or pointer-out, memory accounting, Cargo profiles, wasm32-wasip1 build flags) and Elixir Wasmex host runtime (startup digest verification, WASI import filtering, memory marshalling, fail-closed refusal mapping, and test harness) in a single canonical pack."""

[metadata]
category = "runtime"
tags = ["rust", "wasm", "wasi", "wasmex", "elixir", "ffi", "memory"]
deprecated_precursors = ["wasi-json-abi-pack", "beam-wasmex-host-pack"]
