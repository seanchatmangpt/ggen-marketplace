[project]
name = "opportunity-currentness-pack"
version = "26.8.25"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "currentness-contract"
query = { inline = '''SELECT ("opportunity-currentness" AS ?subject) WHERE {} ORDER BY ?subject''' }
template = { file = "templates/currentness-contract.json.tera" }
output_file = "generated/opportunity-currentness/contract.json"
mode = "Overwrite"
