[pack]
name = "ash-pplan-core-pack"
version = "0.1.0"
description = """KernelPack for the ash_pplan P-PLAN/PROV-O projection profile (namespace
https://w3id.org/ash-pplan#). Canonical vocabulary source: ap: classes (Projection, SemanticExecution,
ExecutionReceipt, ReleaseReceipt, FONDPolicy, Capability, Provider, Realization, Workflow, Task,
Method, InputVariable, Dsl*), receipt/workflow/provider/reactor properties, and the 13 ap:Projection
rows mapping P-PLAN and PROV-O terms onto Reactor, Ash, durable and ash_pplan runtime primitives.
Reconciled from ash_pplan ontology.ttl and priv/ggen/ash-pplan-pack at v26.11.16; contains no
specimen plans, workflows, providers or capability individuals (consumers supply those).
Gates 010_projections, 020_plan_steps and 030_plan_variables are refusal-form (a returned row is a
violation; zero rows is the pass condition). The projection/plan/step/variable SELECTs that were
previously gates now live in queries/ (reference queries; the templates embed their own); the
predicate-anchored per-query row contract is verify/cardinality.json. Templates plan_catalog.ex.tera and projection_catalog.ex.tera manufacture AshPPlan.Catalog.Plan and
AshPPlan.Catalog.Projection. Declaring a capability, provider or realization grants no authority:
SELECT to CONSTRUCT only, never DO."""

[metadata]
category = "planning"
tags = ["ash-pplan", "p-plan", "prov-o", "reactor", "ash", "projection", "kernel"]

[capabilities]
provides = ["urn:ggen:pack:ash-pplan-core-pack"]
requires = []
