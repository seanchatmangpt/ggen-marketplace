[project]
name = "ggen-platform-pack"
version = "26.9.30"
description = "Front-door pack declaring the 11 canonical ggen Marketplace packs as components of the consolidated platform topology; the vendored AIRo ontology (ontology/airo.ttl) is projected into generated/airo_surface.rs"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology/airo.ttl"
base_iri = "https://w3id.org/airo#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
owl = "http://www.w3.org/2002/07/owl#"
airo = "https://w3id.org/airo#"

[validation]
gates = [
  "gates/01-front-door-completeness.rq",
  "gates/02-airo-surface-nonempty.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "airo-surface"
query = { file = "queries/airo_surface.rq" }
template = { file = "templates/airo_surface.rs.tera" }
output_file = "airo_surface.rs"
skip_empty = false
mode = "Overwrite"
