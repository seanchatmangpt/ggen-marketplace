[project]
name = "enterprise-operating-model-pack"
version = "26.9.30"

[ontology]
source = "ontology.ttl"
base_iri = "https://seanchatmangpt.github.io/packs/enterprise-operating-model-pack#"
imports = ["ontology/enterprise-input.ttl"]

[ontology.prefixes]
eom = "https://seanchatmangpt.github.io/packs/enterprise-operating-model-pack#"
ea = "https://chatman.ai/ontology/enterprise-architecture#"
skos = "http://www.w3.org/2004/02/skos/core#"
dcterms = "http://purl.org/dc/terms/"

[generation]
output_dir = "."

[[generation.rules]]
name = "eom-requirements"
query = { file = "queries/10-requirements.rq" }
template = { file = "templates/architecture-requirements.ttl.tera" }
output_file = "generated/enterprise-operating-model/architecture-requirements.ttl"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "eom-abb-skeletons"
query = { file = "queries/20-abb-skeletons.rq" }
template = { file = "templates/abb-skeletons.ttl.tera" }
output_file = "generated/enterprise-operating-model/abb-skeletons.ttl"
skip_empty = false
mode = "Overwrite"
