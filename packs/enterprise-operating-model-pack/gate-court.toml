# Gate/witness court for enterprise-operating-model-pack.
#
# Enforcement layers, stated so existence of a gate is never read as enforcement:
#   1. This file and scripts/check_gate_witness_courts.py prove exact-stem
#      correspondence between gates/*.rq and witnesses/{pass,fail}/*.ttl only.
#   2. tests/test_enterprise_operating_model_pack.py executes every gate under real
#      rdflib against every witness: pass witnesses return zero rows, and the set of
#      REFUSED:* codes returned by a fail witness equals the set declared in the gate.
#   3. scripts/qualify_packs.py with a real ggen proves manufacture and replay.
#      Without a ggen binary that layer is BLOCKED:ggen_binary_unavailable.
[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
runner = "python3 -m pytest tests/test_enterprise_operating_model_pack.py"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true
