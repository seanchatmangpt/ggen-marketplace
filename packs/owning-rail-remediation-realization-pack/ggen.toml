[project]
name = "owning-rail-remediation-realization-pack"
version = "26.8.23"

[ontology]
source = "ontology.ttl"

[validation]
gates = ["gates/false-success.rq", "gates/repair-yield.rq"]

[generation]
output_dir = "."

[[generation.rules]]
name = "realization-receipt"
query = { file = "queries/realization-receipt.rq" }
template = { file = "templates/realization-receipt.json.tmpl" }
output_file = "measure/owning-rail-realization-receipt.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "consumer-observation"
query = { file = "queries/remediation-candidates.rq" }
template = { file = "templates/consumer-observation.py.tmpl" }
output_file = "measure/owning_rail_observation.py"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "qualification-court"
query = { file = "queries/remediation-candidates.rq" }
template = { file = "templates/qualification-court.py.tmpl" }
output_file = "tests/test_owning_rail_realization.py"
skip_empty = false
mode = "Overwrite"
