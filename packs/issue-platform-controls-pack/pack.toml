[pack]
name = "issue-platform-controls-pack"
version = "0.1.0"
description = """Thin Fortune-500 (F5) platform-controls overlay for Semantic Jira.
Defines ip:Tenant, ip:SoDConflict / conflicting roles, ip:AuditEvent, and
ip:RetentionPolicy composed WITH sj:WorkOrder via attachment properties — never
a WorkOrder subclass or fork. Each control class carries skos:exactMatch to the
matching dfcm:F5* EnterpriseControl (tenant-isolation, segregation-of-duties,
audit-ledger-export, retention-residency; plus authority-separation companion).
Admission surface: ontology.ttl + shapes/ip.shacl.ttl + gates/010..050 +
templates/010..020 + qualification/consumer.ttl + tests/mutations falsifiers.
SPARQL gates are fail-closed: any returned row is a refusal."""

[metadata]
category = "governance"
tags = [
  "f500",
  "f5",
  "dfcm",
  "semantic-jira",
  "tenant",
  "sod",
  "audit",
  "retention",
  "overlay",
]

[capabilities]
provides = ["urn:ggen:pack:issue-platform-controls-pack"]
requires = ["urn:ggen:pack:semantic-jira-pack"]

# semantic-jira-pack dep court (admitted): do NOT mount the unscoped igniter
# tree under [packs] for ggen sync. ADR-0010 witness-driver gates/*.rq are
# FM-PACK-013 false-refuses under ggen 26.x. Materialize the scoped view:
#   qualification/materialize_sj_dep_court.sh
# → real ontology.ttl + verify/*.unbound.rq installed as gates/*.rq.
# Unscoped mount remaining red is dep-gate convention impedance, not an
# overlay defect. Missing ~/ggen_igniter/.../semantic-jira-pack →
# BLOCKED:missing-semantic-jira-pack (script exit 2).

# Any row returned by a gate = refusal.
[validation]
gates = [
  "gates/010_no_workorder_fork.rq",
  "gates/020_tenant_isolation.rq",
  "gates/030_sod_conflicting_roles.rq",
  "gates/040_audit_event.rq",
  "gates/050_retention_policy.rq",
]
