[project]
name = "dfcm-selection-evidence-acquisition"
version = "0.1.0"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "acquisition-plan"
query = { file = "queries/01_decisive_experiments.sparql" }
template = { file = "templates/acquisition-plan.json.tmpl" }
output_file = "generated/selection-evidence-acquisition-plan.json"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "acquisition-court"
query = { file = "queries/01_decisive_experiments.sparql" }
template = { file = "templates/acquisition-court.py.tmpl" }
output_file = "generated/test_selection_evidence_acquisition.py"
skip_empty = true
mode = "Overwrite"
