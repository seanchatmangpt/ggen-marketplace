[pack]
name = "autofde-gymact-certification-pack"
version = "1.0.0"
description = "Real, ggen-projected typed containers for autofde-lab's GymAct Certified conformance vocabulary (CheckSeverity, ConformanceLevel, CertificationCheck, CertificationCheckResult, CertificationManifest, plus the statically-scanned Oracle.evaluate() shape taxonomy). Admits and refuses already-produced certification check results for evidence integrity -- an EVIDENCE-severity result claimed as passed must carry an independently verifiable resultEvidenceRef, and every result must reference a real, admitted check. This pack does not itself run any certification check and a CertificationManifest is never a pre-issued badge; the real checker logic lives in autofde-lab's src/autofde_lab/reasoning/gymact_certification_checker.py, hand-written, out of scope here."
