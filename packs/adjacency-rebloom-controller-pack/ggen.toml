[project]
name = "adjacency-rebloom-controller-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "rebloom-frontier"
query = { file = "queries/10-rebloom-frontier.rq" }
template = { file = "templates/rebloom-frontier.json.tera" }
output_file = "generated/rebloom/frontier.json"

[[generation.rules]]
name = "rebloom-plan"
query = { file = "queries/20-rebloom-plan.rq" }
template = { file = "templates/rebloom-plan.json.tera" }
output_file = "generated/rebloom/plan.json"

[[generation.rules]]
name = "rebloom-receipt"
query = { file = "queries/30-rebloom-receipt.rq" }
template = { file = "templates/rebloom-receipt.json.tera" }
output_file = "generated/rebloom/receipt.json"
