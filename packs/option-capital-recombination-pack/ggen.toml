[project]
name = "option-capital-recombination-pack"
version = "26.8.25"

[ontology]
source = "fixtures/frontier.ttl"
base_iri = "https://ggen.dev/ontology/option-capital-recombination#"

[generation]
output_dir = "."

[[generation.rules]]
name = "reversible-frontier"
query = { file = "queries/01-reversible-candidates.rq" }
template = { file = "templates/frontier.json.tera" }
output_file = "frontier.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "hypergraph-compositions"
query = { file = "queries/20-hypergraph-compositions.rq" }
template = { file = "templates/compositions.json.tera" }
output_file = "compositions.json"
skip_empty = false
mode = "Overwrite"
