schema = "ggen.governed-runtime-adapter.evidence/1"
pack = "governed-runtime-adapter-pack"
court_pack = "semantic-gate-witness-court-pack"
mode = "fail-closed"
positive_witness_required = true
negative_witness_required_for = [
  "execution-mode",
  "fresh-do-fence",
  "authority-policy",
  "host-capabilities",
  "resource-bounds",
  "retry-idempotency",
  "receipt-coherence",
  "replay-coherence",
  "wasm-identity",
  "external-process-identity",
  "certified-standing",
  "pi-fence",
]
receipt_fields = [
  "exact_subject",
  "gate_case",
  "gate_sha256",
  "positive_witness_sha256",
  "negative_witness_sha256",
  "court_pack",
  "standing",
]
