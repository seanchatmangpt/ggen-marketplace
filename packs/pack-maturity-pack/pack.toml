[pack]
name = "pack-maturity-pack"
version = "0.2.0"
description = """
Generates cross-cutting Level-5 promotion infrastructure for any composing
consumer without inventing domain semantics the consumer has not supplied.

Mechanical proof surfaces:
- l5p:cap03 deterministic regeneration;
- l5p:cap04 fixed-point convergence;
- l5p:cap09 generated receipt verification.

Level-5 Diátaxis infrastructure:
- generates one document in each Diátaxis quadrant: tutorial, how-to,
  reference, and explanation;
- generates a structural court that refuses missing quadrants and missing
  Level-5 evidence markers with typed L5-DOC-* failures;
- requires tutorials/how-to guides to expose verification, receipt/replay,
  falsifier, rollback, and authority-boundary sections where applicable;
- requires reference to identify semantic authority and generated surfaces;
- requires explanation to preserve rationale, exclusions, falsifiers,
  extension points, and the SELECT/CONSTRUCT/DO authority model.

The Diátaxis court proves documentation shape and correspondence obligations,
not domain behavior. Domain-specific command execution, positive/negative
witnesses, semantic source completeness, and consequential runtime behavior
must still be supplied and executed by the composing pack/consumer. This pack
therefore remains a reusable floor for L5 promotion rather than a generic way
to manufacture domain standing.
"""
