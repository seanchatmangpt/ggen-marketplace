[pack]
name = "nist-cyber-resiliency-generational-pack"
version = "26.9.26"
description = """
NIST SP 800-160 Vol. 2 Rev. 1 cyber-resiliency semantic crosswalk plus an explicitly
non-NIST generational-remanufacture profile. Encodes the fourteen NIST cyber
resiliency techniques as provenance-bound semantic capital and adds refusal gates
for generation identity, implementation non-inheritance, bounded dynamic
positioning/non-persistence, diversity, unpredictability, deception, realignment,
segmentation, privilege restriction, substantiated integrity, adaptive response,
coordinated protection, monitoring/context, and redundancy independence.
Semantic only: grants no deployment or runtime DO authority.
"""
