[project]
name = "counterfactual-frontier-replay-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "frontier-plan"
query = { file = "queries/90-pareto-frontier.rq" }
template = { file = "templates/frontier.json.tera" }
output_file = "generated/counterfactual-frontier/frontier.json"

[[generation.rules]]
name = "replay-court"
query = { file = "queries/91-replayable-frontier.rq" }
template = { file = "templates/replay_court.py.tera" }
output_file = "generated/counterfactual-frontier/replay_court.py"
