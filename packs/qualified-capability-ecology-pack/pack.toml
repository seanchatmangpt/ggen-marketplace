[pack]
name = "qualified-capability-ecology-pack"
version = "0.1.0"
description = """
Canonical semantic contract for a qualified capability ecology:
discover/classify -> candidate -> qualify -> freeze -> operate -> observe ->
propose evolution -> requalify -> substitute -> retire.

Public vocabularies first: PROV-O for lineage, EARL for verification,
DCTERMS for immutable identity/version, and SKOS for lifecycle concepts.
Custom QCE terms encode the failed edges: exact-subject qualification,
frozen execution closure, authority non-increase, consequence-preserving
substitution, replay evidence, and residual-human-work retirement.

All gates are violation-row SELECT queries: rows mean refusal. This pack is
SELECT/CONSTRUCT-only and grants no DO authority. BRCE remains the sole
consequential actuation boundary.
"""
