[project]
name = "strata-protocol-pack"
version = "0.1.0"
description = "CLAP/1.0 PDU frame constants projected from RDF for the Strata runtime"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
owl = "http://www.w3.org/2002/07/owl#"
xsd = "http://www.w3.org/2001/XMLSchema#"
pdu = "https://strata.chatman.ai/ontology/pdu#"
wire = "https://strata.chatman.ai/ontology/wire#"

[validation]
gates = [
  "gates/010_header_layout.rq",
  "gates/020_refusal_receipt_len.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "pdu-constants"
query = { file = "queries/frame_constants.rq" }
template = { file = "templates/pdu_constants.rs.tera" }
output_file = "pdu_constants.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "wire-constants"
query = { file = "queries/wire_classes.rq" }
template = { file = "templates/wire_constants.rs.tera" }
output_file = "wire_constants.rs"
skip_empty = false
mode = "Overwrite"
