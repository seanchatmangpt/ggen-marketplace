description = "Domain-neutral, evidence-bounded Eliminate-Reduce-Raise-Create value-innovation calculus for ggen consumers. Extracts ERRC into a reusable public-semantic kernel with typed actions, strategy grids, normalized factor deltas, owners, evidence obligations, falsifiers, authority boundaries, complete-grid gates, deterministic projections, and an independent replay court. ERRC remains SELECT/CONSTRUCT only: Create may propose a new capability but never acquires ambient DO authority. Uses PROV-O, DCTERMS and SKOS for provenance, identity and controlled-vocabulary interoperability."
