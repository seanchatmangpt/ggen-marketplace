[pack]
name = "value-innovation-errc-pack"
version = "0.2.0"
description = "Domain-neutral, evidence-bounded Eliminate-Reduce-Raise-Create value-innovation calculus for ggen consumers. Extends the reusable ERRC kernel with a W3C RDF Data Cube strategy canvas/value-curve model, enforced reversible Create semantics, evidence-bounded Pareto dominance with protected invariants and witnesses, and optional composition with ggen-combinatorial-maximalism DesignSpace/Candidate semantics. ERRC remains SELECT/CONSTRUCT only; verified execution standing must arrive through separate evidence and authorized actuation. Uses PROV-O, DCTERMS, SKOS and RDF Data Cube public semantics."
