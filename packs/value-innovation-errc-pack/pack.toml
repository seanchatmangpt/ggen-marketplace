[pack]
name = "value-innovation-errc-pack"
version = "0.1.0"
description = "Domain-neutral, evidence-bounded Eliminate-Reduce-Raise-Create value-innovation calculus for ggen consumers. Extracts ERRC from the GitHub-Actions-specific precedent into a reusable public-semantic kernel with typed actions, strategy grids, factor deltas, owners, evidence obligations, falsifiers, authority boundaries, complete-grid gates, and deterministic strategy projections. ERRC remains SELECT/CONSTRUCT only: Create may propose a new capability but never acquires ambient DO authority. Uses PROV-O, DCTERMS and SKOS for provenance, identity and controlled vocabulary interoperability."
