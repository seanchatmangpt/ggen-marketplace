[pack]
name = "authority-capability-pack"
version = "0.1.0"
description = """
Authority family of the v26.9.30 qualified capability ecology (lane 7). Pinned capability
identities Authority.Verify, Authority.Grant, Actuation.Execute in namespace
https://ggen.dev/ontology/authority-capability#, modeled as semantic contracts with qualified
realizations, never as implementations.

Core law encoded as gates, not prose: Policy != Authority (a policy permitting X is not
authority to do X); a request NAMING authority is not that authority; authority is leased,
typed, revocable, never ambient (an envelope is a typed qce:AuthorityEnvelope, reused from
packs/qualified-capability-ecology-pack, not a string); Authority.Grant is itself a
consequential act (granting requires authority); Actuation.Execute REQUIRES a bound authority
envelope as precondition (ProviderAvailable != Authorized); REFUSED_NO_AUTHORITY is a
first-class outcome of every consequential capability; a realization may never claim a higher
authority ceiling than its capability (no authority increase at the realization boundary).

Realizations carry provider metadata (repo, module, source file, version-pin policy) and
qualification conditions only. Inspected read-only this session: ash_graphlaw 26.9.30
(lib/ash_graphlaw/authority.ex, evidence.ex, receipt.ex, standing.ex, capability/registry.ex),
ash_affidavit 26.9.30 (lib/ash_affidavit.ex, change/receipt.ex, refusal.ex,
type/chain_hash.ex, priv/affidavit/capability-registry.json), xaas 26.9.28
(lib/xaas/actuation.ex). Consumers resolve against dcterms:identifier literals; this pack
grants no execution authority and is SELECT/CONSTRUCT-only.
"""
