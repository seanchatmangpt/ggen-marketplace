[pack]
name = "strategic-doctrine-pack"
version = "0.1.0"
description = "Doctrine-layer vocabulary for strategic strategies as RDF: applicability conditions, counterstrategies, falsifiers, and HTN method realization (via planning-policy-pack's pp:Method), reusing wdfa:ApplicabilityCondition, do:Falsifier/do:falsifiedBy, and the skos:Concept pattern from sibling packs. This version ships STRUCTURE ONLY: zero strategy individuals. Licensed strategy content (e.g. a published strategy canon) is pending a licensing decision; until then every sdo:Strategy individual anywhere in a graph must carry an explicit dcterms:rights statement and the graph's sdo:Strategy count must equal its declared sdo:strategyCount literal — gates/030_licensed_content_guard.rq refuses both smuggling and undeclared growth."
