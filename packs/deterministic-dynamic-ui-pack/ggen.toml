[project]
name = "deterministic-dynamic-ui"
version = "26.8.18"
description = "Manufacture the admitted DDUI grammar inventory and Mermaid topology from RDF"
authors = ["Sean Chatman"]
license = "AGPL-3.0"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatmangpt.com/ontology/dd-ui#"
imports = []

[ontology.prefixes]
ddui = "https://chatmangpt.com/ontology/dd-ui#"
dcterms = "http://purl.org/dc/terms/"
skos = "http://www.w3.org/2004/02/skos/core#"

[generation]
output_dir = "."

[[generation.rules]]
name = "dd-ui-grammar"
query = { file = "queries/vocabulary.rq" }
template = { file = "templates/dd-ui/grammar.json.tmpl" }
output_file = "dd-ui/grammar.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "dd-ui-topology"
query = { file = "queries/vocabulary.rq" }
template = { file = "templates/dd-ui/uiux.mmd.tmpl" }
output_file = "dd-ui/uiux.mmd"
skip_empty = false
mode = "Overwrite"
