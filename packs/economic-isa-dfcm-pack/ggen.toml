[project]
name = "economic-isa-dfcm-pack"
version = "26.9.10"

[ontology]
source = "ontology.ttl"

[templates]
dir = "templates"

[generation]
output_dir = "."

[[generation.rules]]
name = "economic-isa-registry"
query = { file = "queries/01-registry.rq" }
template = { file = "templates/registry.tsv.tmpl" }
output_file = "generated/economic_isa.registry.tsv"
mode = "Overwrite"
skip_empty = true
