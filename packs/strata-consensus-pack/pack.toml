[pack]
name = "strata-consensus-pack"
version = "0.1.0"
description = """
Strata consensus kernel (roadmap slice S8, docs/sjira/v26.10.8/STRATA-BLOCKCHAIN-ROADMAP.md):
heaviest-chain fork choice over the chain layer's block shapes, formalized as the
PN64-style transition lattice (conceptual citation only — GREENFIELD, no BUSL-1.1
code, per the roadmap S5/S8 precondition outcome). Projects the consensus
constants (work unit, tie-break, eclipse cap, spam limit) and a self-contained
engine: per-block work = 2^(PoW leading-zero bits), chain work summation,
heaviest-tip selection with deterministic lower-nonce tie-break, valid-extension
law (height/parent-hash/PoW), and the adversarial module (selfish-mining pattern
detection, eclipse guard, spam rate limit). Projects self-contained serde-free
Rust modules.
"""
[capabilities]
# requires is empty: scripts/qualify_packs.py qualifies every pack in isolation
# (single-pack [packs] capsule), so a cross-pack require can never resolve there
# (FM-PACK-018). The relationship to strata-chain-pack's Block/validate shapes
# and strata-hash-pack's SHA-256 convention is documentation-only via ontology
# comment — no owl:imports — same remediation as strata-chain-pack (S5),
# strata-tx-pack (S2), and strata-ledger-pack (S4), per roadmap slice S8.
provides = ["urn:ggen:pack:strata-consensus-pack", "urn:strata:consensus:v1"]
requires = []
