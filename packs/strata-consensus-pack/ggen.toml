[project]
name = "strata-consensus-pack"
version = "0.1.0"
description = "Strata consensus kernel: heaviest-chain fork choice, valid-extension law, and adversarial guards projected from RDF (roadmap slice S8)"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"

[validation]
gates = [
  "gates/010_consensus_layout.rq",
  "gates/020_adversarial_closure.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "consensus-consts"
query = { file = "queries/consensus_constants.rq" }
template = { file = "templates/consensus_consts.rs.tera" }
output_file = "consensus_consts.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "consensus-engine"
query = { file = "queries/consensus_constants.rq" }
template = { file = "templates/consensus_engine.rs.tera" }
output_file = "consensus_engine.rs"
skip_empty = false
mode = "Overwrite"
