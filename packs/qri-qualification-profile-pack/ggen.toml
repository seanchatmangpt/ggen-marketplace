[project]
name = "qri-qualification-profile-pack"
version = "26.9.30"

[ontology]
source = "ontology.ttl"
imports = ["ontology/alignments.ttl", "ontology/examples/graphlaw-contract.ttl", "shapes/qri.shacl.ttl"]

[generation]
output_dir = "."

[[generation.rules]]
name = "qri-wit-refusal"
query = { file = "queries/40-refusals.rq" }
template = { file = "templates/refusal.wit.tera" }
output_file = "generated/wit/refusal.wit"

[[generation.rules]]
name = "qri-wit-capability"
query = { file = "queries/10-operations.rq" }
template = { file = "templates/capability.wit.tera" }
output_file = "generated/wit/capability.wit"

[[generation.rules]]
name = "qri-abi-ledger"
query = { file = "queries/20-abi.rq" }
template = { file = "templates/abi.json.tera" }
output_file = "generated/abi.json"

[[generation.rules]]
name = "qri-rust-adapter"
query = { file = "queries/10-operations.rq" }
template = { file = "templates/adapter.rs.tera" }
output_file = "generated/adapter/src/lib.rs"

[[generation.rules]]
name = "qri-rust-adapter-cargo"
query = { file = "queries/10-operations.rq" }
template = { file = "templates/Cargo.toml.tera" }
output_file = "generated/adapter/Cargo.toml"

[[generation.rules]]
name = "qri-beam-host"
query = { file = "queries/20-abi.rq" }
template = { file = "templates/host.ex.tera" }
output_file = "generated/beam/qri_host.ex"
