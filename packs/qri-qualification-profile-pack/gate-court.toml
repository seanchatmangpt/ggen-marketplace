[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
runner = "python3 qualification/verify.py"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true

[[gate]]
stem = "010_qualified_substitution"
pass = "witnesses/pass/010_qualified_substitution.ttl"
fail = "witnesses/fail/010_qualified_substitution.ttl"

[[gate]]
stem = "020_no_mutable_standing"
pass = "witnesses/pass/020_no_mutable_standing.ttl"
fail = "witnesses/fail/020_no_mutable_standing.ttl"

[[gate]]
stem = "030_authority_not_from_capability"
pass = "witnesses/pass/030_authority_not_from_capability.ttl"
fail = "witnesses/fail/030_authority_not_from_capability.ttl"

[[gate]]
stem = "040_ambiguous_projection_unsupported"
pass = "witnesses/pass/040_ambiguous_projection_unsupported.ttl"
fail = "witnesses/fail/040_ambiguous_projection_unsupported.ttl"

[[gate]]
stem = "050_import_subset"
pass = "witnesses/pass/050_import_subset.ttl"
fail = "witnesses/fail/050_import_subset.ttl"

[[gate]]
stem = "060_invariant_complete"
pass = "witnesses/pass/060_invariant_complete.ttl"
fail = "witnesses/fail/060_invariant_complete.ttl"

[[gate]]
stem = "070_typed_import_matches_allowed"
pass = "witnesses/pass/070_typed_import_matches_allowed.ttl"
fail = "witnesses/fail/070_typed_import_matches_allowed.ttl"

[[gate]]
stem = "080_abi_family_closed"
pass = "witnesses/pass/080_abi_family_closed.ttl"
fail = "witnesses/fail/080_abi_family_closed.ttl"
