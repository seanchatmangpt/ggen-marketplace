runner = "python3 qualification/verify.py"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true

[[gate]]
stem = "070_typed_import_matches_allowed"
pass = "witnesses/pass/070_typed_import_matches_allowed.ttl"
