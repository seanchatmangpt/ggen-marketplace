# Beam-host parity projection. ggen reads only ./ggen.toml, so a consumer copies this file to ggen.toml in a
# scratch copy of the pack and runs `ggen sync run` (tests/test_qri_pack.py does exactly that). Kept out of the
# default ggen.toml on purpose: the default sync emits exactly six files and imports only graphlaw-contract.ttl.
# Each template embeds queries 50-54 verbatim (sync asserted by the tests) and renders one hand-written
# ash_graphlaw module from a qri:hostProfile contract.

[project]
name = "qri-beam-host"

[ontology]
source = "ontology.ttl"
imports = ["ontology/examples/ash-graphlaw-contract.ttl"]

[templates]
dir = "templates/beam-host"
