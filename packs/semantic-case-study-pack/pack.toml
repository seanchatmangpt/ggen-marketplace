[pack]
name = "semantic-case-study-pack"
version = "0.1.0"
description = "Canonical Semantic Case Study vocabulary per engineering-standards RFC-0003: a case is a 9-tuple (Provenance, Claims, Evidence, AuthorityCeiling, Falsifiers, Projections, Receipts, Replay, Standing) as machine-addressable RDF. Ports the proven urn:xaas:case-study: (cs:) layer from xaas:priv/packs/wd_cs2_pack verbatim (CaseStudy/Claim/NonClaim/Evidence/Assumption/Falsifier/Projection with evidencePath/exactSubject/validator/authorityCeiling/standing) instead of redefining it, aligns cs:Evidence subClassOf es:Evidence (evidence-standing-pack) and cs:Falsifier subClassOf do:Falsifier (decision-optionality-pack) following the wd-failure-analysis-pack cross-pack precedent. Ships SHACL shapes, four fail-closed SPARQL refusal gates (claim-without-evidence, unestablished-standing-rendered, projection-adds-claim, authorityCeiling>CONSTRUCT), a gate↔witness exact-stem court (gate-court.toml, schema ggen.semantic-gate-witness-court/1) with pass/fail witnesses per gate, and a semantic runner (rdflib + pyshacl) implementing the caller-supplied runner contract of semantic-gate-witness-court-pack. Rendered projections may omit claims; they may never add one."
