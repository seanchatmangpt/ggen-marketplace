[pack]
name = "clap-noun-verb-telemetry-pack"
version = "1.0.0"
description = "Generates clap-noun-verb's own Chicago TDD Telemetry and Observability module (src/telemetry.rs: AutonomicTelemetryEnvelope, W3C TraceContext, Span, Metrics, TelemetryManager) from one admitted cnv-telemetry:Config individual (schemaVersion/cliVersion -- the real parametrized envelope-stamp knobs; the hand-written module had hardcoded \"1.0.0\"/\"3.8.0\", the latter stale against the crate's real published version -- migrating to this pack fixes that staleness as a real parametrized value instead of a second hardcoded literal). All tracing/metrics logic itself is fixed framework behavior rendered verbatim by the template."
