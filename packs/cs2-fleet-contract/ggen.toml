[project]
name = "cs2-fleet-contract"
version = "1.0.0"
description = "Materialize RFC-CS2-001 fleet consumer distribution artifacts"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatman.ai/cs2/pack#"

[ontology.prefixes]
cs2 = "https://chatman.ai/cs2#"
pack = "https://chatman.ai/cs2/pack#"

[inference]

[generation]
output_dir = "."

[[generation.rules]]
name = "consumer-map"
query = { file = "queries/consumer-map.rq" }
template = { file = "templates/consumer-map.json.tera" }
output_file = "generated/consumer-map.json"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "ash-a2a-install-manifest"
query = { file = "queries/consumer-map.rq" }
template = { file = "templates/install-manifest.json.tera" }
output_file = "generated/ash-a2a.install.json"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "xaas-install-manifest"
query = { file = "queries/consumer-map.rq" }
template = { file = "templates/install-manifest.json.tera" }
output_file = "generated/xaas.install.json"
mode = "Overwrite"
skip_empty = true
