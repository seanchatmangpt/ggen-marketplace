[pack]
name = "strategic-doctrine-compiler-pack"
version = "26.9.27"
# [pack] holds ONLY name/version/description: ggen's pack loader deserializes it with
# deny-unknown-fields. The former non-admitted keys now live in ontology.ttl
# (sd:strategicDoctrineCompiler: sd:authority "NONE", sd:ceiling "CONSTRUCT",
# sd:operatorCount 14, sd:failClosed true) and mappings/compiler-contract.json.
description = "Compiler pack over the strategic-doctrine algebra: 14 operator contracts (shape, probe, conceal, reveal, concentrate, disperse, delay, accelerate, commit, withdraw, divide, combine, substitute, transform) with per-operator SHACL shapes, SPARQL admit queries and refusal fixtures, plus fail-closed gates that refuse authority smuggling and missing duals. Declares HDDL, FOND and semantic-work-order projection contracts (compiler-contract.json). Authority NONE, ceiling CONSTRUCT, fail-closed; generated outputs are never an edit root."
