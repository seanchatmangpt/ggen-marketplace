[pack]
name = "cross-repo-contract-pack"
version = "0.1.0"
description = """
Canonical cross-repo contract substrate for fnox, arcus, smalt, ggen, and
ggen-marketplace. Models shared cloud dialect invariants (GCP KMS/SM/Vertex,
AWS SQS/IAM/STS, Azure ARM api-version/LRO/ETag/200-201), A2A §9.5 disjoint
error codes, and Terraform security-attachment laws. Emits machine-readable
contract manifests and enforces anti-orphan / anti-drift SPARQL gates.
"""
category = "architecture-governance"
license = "MIT"

[capabilities]
provides = [
  "urn:ggen:pack:cross-repo-contract-pack",
  "urn:ggen:capability:cross-repo-contracts",
]
requires = []
