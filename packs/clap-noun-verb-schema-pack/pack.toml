[pack]
name = "clap-noun-verb-schema-pack"
version = "1.1.0"
description = "Public RDF vocabulary and fail-closed admission gates for manufacturing complete clap-noun-verb CLI crates without consumer-authored Rust. This pack contains no command individuals and therefore never injects specimen CLI surface into a consumer graph."
[capabilities]
provides = ["urn:ggen:pack:clap-noun-verb-schema-pack"]
# zd-28 composition-closure fix: crate-pack's generated src/lib.rs unconditionally
# declares `pub mod generated_behavior; generated_boundaries; generated_cli;`, and
# those three modules are generated by the behavior/boundary/routing packs. With
# crate-pack as the only requirement the qualification crate declared modules ggen
# never generated (cargo E0583, the pack's standing WARN); requiring the full
# compiler closure makes the generated crate complete and the WARN's honest ceiling
# ALIVE.
requires = [
  "urn:ggen:pack:clap-noun-verb-crate-pack",
  "urn:ggen:pack:clap-noun-verb-behavior-pack",
  "urn:ggen:pack:clap-noun-verb-boundary-pack",
  "urn:ggen:pack:clap-noun-verb-routing-pack",
]