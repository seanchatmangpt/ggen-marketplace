[pack]
name = "clap-noun-verb-policies-pack"
version = "1.0.0"
description = "Generates clap-noun-verb's own Autonomic CI/CD Policies module (src/policies.rs: TargetPressurePolicy, ToolchainMismatchPolicy, TrybuildChangedPolicy, GitPhaseDirtyPolicy, all suggest-only) from one admitted cnv-policies:Config individual (maxSizeGb/pruneAfterDays/trybuildPath/requireCleanTreeDefault -- the real parametrized knobs). The policy evaluation logic itself is fixed framework behavior rendered verbatim by the template, the same relationship clap-noun-verb-autonomic-pack has to a generated src/autonomic.rs."
