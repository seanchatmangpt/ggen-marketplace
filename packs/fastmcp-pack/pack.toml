[pack]
name = "fastmcp-pack"
version = "0.2.0"
description = """
Ontology-driven FastMCP server generation: projects a runnable Python MCP
server (FastMCP 3.x API) from fmcp:Server / fmcp:Tool individuals with typed
tools, descriptions, arguments, and deterministic tool behavior. Tools are
intents exposed over MCP; they carry no ambient actuation authority.
"""

[consumer_contract]
# Derived mechanically from templates/fastmcp_server.py.tmpl third-party
# imports: `from fastmcp import FastMCP` (plus stdlib __future__). No other
# non-stdlib import exists in any template.
runtime = ["fastmcp"]
peer_context = """
Consumer declares fmcp:Server and fmcp:Tool individuals (with the required
properties enforced by gates/010_admission.rq: name, hasTool, title,
description on servers; name, function, argument, argumentDescription,
returnTemplate, description on tools) in its own RDF graph — the consumer's
namespace works, the gate's class/property checks are namespace-exact — then
composes this pack via ggen.toml [packs] with a [templates] dir declared.
Projection surface is exactly one file: src/fastmcp_server.py.

Anything beyond data projection (transport, auth, deployment, additional
hand-written tools) is consumer-side and out of scope for this pack.
"""

[capabilities]
provides = ["urn:ggen:pack:fastmcp-pack"]
requires = []
