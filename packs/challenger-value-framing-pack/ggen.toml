[project]
name = "challenger-value-framing"
version = "26.8.27"
description = "Generate evidence-bound Challenger value framing, ERRC grids, and buyer projections"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatmangpt.com/ontology/challenger-value#"
imports = []

[ontology.prefixes]
cv = "https://chatmangpt.com/ontology/challenger-value#"
dcterms = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"
skos = "http://www.w3.org/2004/02/skos/core#"
odrl = "http://www.w3.org/ns/odrl/2/"
qudt = "http://qudt.org/schema/qudt/"
sh = "http://www.w3.org/ns/shacl#"

[generation]
output_dir = "."

[[generation.rules]]
name = "challenger-phases"
query = { file = "queries/phases.rq" }
template = { file = "templates/docs/challenger-phases.generated.md.tmpl" }
output_file = "docs/challenger-phases.generated.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "buyer-projections"
query = { file = "queries/buyers.rq" }
template = { file = "templates/docs/buyer-projections.generated.md.tmpl" }
output_file = "docs/buyer-projections.generated.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "errc-contract"
query = { file = "queries/errc.rq" }
template = { file = "templates/docs/errc.generated.md.tmpl" }
output_file = "docs/errc.generated.md"
skip_empty = false
mode = "Overwrite"
