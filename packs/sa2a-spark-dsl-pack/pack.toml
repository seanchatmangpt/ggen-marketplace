[pack]
name = "sa2a-spark-dsl-pack"
version = "0.2.0"
description = """
Spark DSL extension pack for AshA2A, revived from an empty husk (0.1.0 shipped
only pack.toml + a 73-line ontology with zero codegen). 0.2.0 models the REAL
landed compile-time surface as RDF -- BuildCapabilityIndex (the transformer
persisting the flat ash_a2a_* keys with the SEC-04 consequence floor),
Verify and VerifySkills (the verifiers with their named refusal codes:
refused_action_not_found, refused_action_not_public,
refused_argument_mapping_target, refused_type_not_json_serializable,
refused_lease_required_no_authorizer) -- grounded by per-individual file
citations into the ash_a2a source. Ships:
  templates/  two Tera templates generating compiling Spark.Dsl.Verifier and
              Spark.Dsl.Transformer skeletons in the landed style
              (use Spark.Dsl.Verifier, Spark.Error.DslError with module:/path:,
              named refusal codes, flat persist keys), driven by the ontology;
  queries/    SPARQL extracting verifier refusal codes from the ontology;
  gates/      010 completeness (every declared verifier/transformer has a
              codegen template), 020 promise-vs-content (each pack.toml
              promise token must be backed by a modeled individual), and 030
              projection consistency (the flat *_list codegen projections must
              not drift from the modeled individuals).
Domain-agnostic and composable across arbitrary Ash resources and domains.
"""

# Relationship note (NOT a pack.toml [dependencies] entry): the Spark DSL
# entities this pack generates `use` against the agent extension style shared
# with praxis-core-pack (0.1.0), but ggen refuses a [dependencies] entry
# unless the consumer lists that pack in its own ggen.toml [packs] table
# (FM-PACK-014), and scripts/qualify_packs.py qualifies every pack in
# isolation with a single-pack [packs] table -- so a declared dependency
# could never resolve here. The relationship is documentation-only: nothing
# in this pack's ontology or templates references praxis-core vocabulary.
# Same precedented remediation as packs/greene-licensing-case-pack
# (FM-PACK-014).
