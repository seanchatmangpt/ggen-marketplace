[pack]
name = "sa2a-spark-dsl-pack"
version = "0.1.0"
description = """
Zach Daniel Spark DSL extension pack for AshA2A.
Defines pure declarative DSL entities, sections, transformers, and compile-time
verifiers for semantic A2A skills, authority policies, knowledge hooks, and receipts.
Domain-agnostic and composable across arbitrary Ash resources and domains.
"""

[dependencies]
"praxis-core-pack" = "0.1.0"
