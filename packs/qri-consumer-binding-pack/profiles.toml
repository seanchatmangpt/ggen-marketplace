# SPDX-License-Identifier: MIT
#
# Realization-profile targets: qcb:profileId -> ggen manifest used by runners/consume.py.
# `composes` lists sibling packs that must sit beside the pack in the capsule (the qri beam-host
# templates arrive through the [packs] path dependency in that manifest).
[target.beam-wasmex]
manifest = "ggen.toml"
composes = ["qri-qualification-profile-pack"]

[target.node-wasi]
manifest = "ggen-node-wasi.toml"
composes = []

# Gates composed unchanged from a sibling pack and run by consume.py before generation (ggen forbids ".." in
# [law].gates, so they cannot be listed in a manifest). Each query selects ?subject; the typed code is fixed
# in runners/consume.py COMPOSED_GATE_CODES.
[compose.qri-qualification-profile-pack]
gates = ["gates/030_authority_not_from_capability.rq"]
