# Court: exact-stem pass/fail witness pairs per SPARQL gate (gates/*.rq). The runner keeps the
# exactly-one-gate-fires law on every fail leg. Extra fail witnesses (witnesses/extra/) are outside
# the exact-stem court and are judged by `python3 runners/semantic_runner.py --extras`.
[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true
runner = "python3 runners/semantic_runner.py --gate {gate} --witness {witness} --expectation {expectation}"

[[case]]
gate = "090_pin_present"
pass = "witnesses/pass/090_pin_present.ttl"
fail = "witnesses/fail/090_pin_present.ttl"

[[case]]
gate = "095_pin_digest_wellformed"
pass = "witnesses/pass/095_pin_digest_wellformed.ttl"
fail = "witnesses/fail/095_pin_digest_wellformed.ttl"

[[case]]
gate = "100_realization_unambiguous"
pass = "witnesses/pass/100_realization_unambiguous.ttl"
fail = "witnesses/fail/100_realization_unambiguous.ttl"

[[case]]
gate = "110_authority_ceiling_none"
pass = "witnesses/pass/110_authority_ceiling_none.ttl"
fail = "witnesses/fail/110_authority_ceiling_none.ttl"

[[case]]
gate = "120_pin_registry_match"
pass = "witnesses/pass/120_pin_registry_match.ttl"
fail = "witnesses/fail/120_pin_registry_match.ttl"

[[case]]
gate = "130_contract_digest_present"
pass = "witnesses/pass/130_contract_digest_present.ttl"
fail = "witnesses/fail/130_contract_digest_present.ttl"

[[case]]
gate = "140_profile_supported"
pass = "witnesses/pass/140_profile_supported.ttl"
fail = "witnesses/fail/140_profile_supported.ttl"

[[case]]
gate = "150_projection_type_supported"
pass = "witnesses/pass/150_projection_type_supported.ttl"
fail = "witnesses/fail/150_projection_type_supported.ttl"

[[case]]
gate = "092_pin_exactly_one"
pass = "witnesses/pass/092_pin_exactly_one.ttl"
fail = "witnesses/fail/092_pin_exactly_one.ttl"

[[case]]
gate = "105_realization_implements_contract"
pass = "witnesses/pass/105_realization_implements_contract.ttl"
fail = "witnesses/fail/105_realization_implements_contract.ttl"

[[case]]
gate = "160_no_authority_grant"
pass = "witnesses/pass/160_no_authority_grant.ttl"
fail = "witnesses/fail/160_no_authority_grant.ttl"
