# SPDX-License-Identifier: MIT
#
# Default target: beam-wasmex. Frontmatter schema (templates carry `to:`/`when:`/`sparql:`), which is
# the only ggen schema that accepts a [packs] dependency; the dependency exposes the qri beam-host
# templates (probe result: HANDWRITTEN.md "Step 0 probe"). The graph is ontology.ttl + the binding
# (inlined into ontology.ttl: alignment graph from ontology/alignments.ttl and the default binding
# from qualification/consumer.ttl -- the frozen qualification ggen v26.8.11 accepts only `source`/
# `prefixes` in [ontology], refusing `imports` with FM-CONFIG-002). runners/consume.py swaps in
# another binding and, for another profile,
# the manifest named in profiles.toml (copied over ggen.toml in a scratch capsule, the same convention
# as qri-qualification-profile-pack/ggen-beam-host.toml).
# [law].gates are the pack's own admission gates: ggen itself refuses, emitting no file, when any
# gate returns a row. consume.py runs the same gates first and prints the typed refusal.
[project]
name = "qri-consumer-binding-pack"

[ontology]
source = "ontology.ttl"
# Former `imports` are concatenated into ontology.ttl (single-source; ggen v26.8.11 has no imports key):
#   * ontology/alignments.ttl -- non-entailing skos correspondences + scopeNotes (import-only reference)
#   * qualification/consumer.ttl -- default beam-wasmex binding graph

[packs]
qri-qualification-profile-pack = { path = "../qri-qualification-profile-pack" }

[templates]
dir = "templates"

[law]
gates = [
  "gates/090_pin_present.rq",
  "gates/092_pin_exactly_one.rq",
  "gates/095_pin_digest_wellformed.rq",
  "gates/100_realization_unambiguous.rq",
  "gates/105_realization_implements_contract.rq",
  "gates/110_authority_ceiling_none.rq",
  "gates/120_pin_registry_match.rq",
  "gates/130_contract_digest_present.rq",
  "gates/140_profile_supported.rq",
  "gates/150_projection_type_supported.rq",
  "gates/160_no_authority_grant.rq",
]
