# SPDX-License-Identifier: MIT
#
# node-wasi target: no [packs] dependency (no beam-host templates), same templates dir and gates.
# Copied over ggen.toml by runners/consume.py when the binding's qcb:profileId is node-wasi.
[project]
name = "qri-consumer-binding-pack"

[ontology]
# Single source (frozen ggen v26.8.11 refuses `imports` with FM-CONFIG-002): alignments and the
# default beam-wasmex binding are inlined in ontology.ttl; runners/consume.py swaps the consumer's
# binding into the marked region before each pass (see BINDING-SWAP-REGION in ontology.ttl).
source = "ontology.ttl"

[templates]
dir = "templates"

[law]
gates = [
  "gates/090_pin_present.rq",
  "gates/092_pin_exactly_one.rq",
  "gates/095_pin_digest_wellformed.rq",
  "gates/100_realization_unambiguous.rq",
  "gates/105_realization_implements_contract.rq",
  "gates/110_authority_ceiling_none.rq",
  "gates/120_pin_registry_match.rq",
  "gates/130_contract_digest_present.rq",
  "gates/140_profile_supported.rq",
  "gates/150_projection_type_supported.rq",
  "gates/160_no_authority_grant.rq",
]
