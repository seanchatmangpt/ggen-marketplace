[pack]
name = "qri-consumer-binding-pack"
version = "26.9.30"
description = """
Consumer-side binding of a QRI capability contract to a chosen realization profile and an exact
artifact pin: the qcb delta (ConsumerBinding, RealizationProfile, ArtifactPin, GeneratedProjection,
ProjectionReceipt, authorityCeiling, generation-refusals) over qri, PROV-O, SPDX, DCAT and SHACL,
with admission gates, witnesses and typed generation refusals. Authority ceiling NONE; an
ambiguous or unpinned binding is refused and emits zero files.
"""
