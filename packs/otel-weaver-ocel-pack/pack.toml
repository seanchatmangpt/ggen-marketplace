[pack]
name = "otel-weaver-ocel-pack"
version = "0.1.0"
description = """OTEL-to-OCEL v2 process-intelligence telemetry pack. Formalizes the OpenTelemetry span/trace to \
OCEL v2 event/object mapping as an RDF ontology (Span, Event, Object, ObjectType, and the mapping rules: \
activity = span name, event time = span start time, object references derived from resource attributes), \
grounded in wasm4pm-compat's real typed Evidence<T, Admitted, Ocel20> carrier (no invented OCEL shape). \
Generates a real otel_to_ocel Rust transformer that admits a parsed OTEL span into wasm4pm-compat's typed \
OCEL v2 evidence via a named Admit impl -- never a free Raw-to-Admitted conversion. Wraps OpenTelemetry \
Weaver's real `registry check`/`registry live-check` subcommands (via chicago-tdd-tools' weaver integration, \
consumed as a path/git dependency) rather than reimplementing registry validation. gates/010 refuses any \
mapping fact that skips the resource-attribute-derived object relationship or asserts a span-to-event \
mapping without a named object type."""
