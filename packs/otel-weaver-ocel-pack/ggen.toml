[project]
name = "otel-weaver-ocel-pack"
version = "0.1.0"
description = "Generate the OTEL span to OCEL v2 event transformer from the admitted mapping-rule ontology"
authors = ["Sean Chatman"]
license = "AGPL-3.0"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatmangpt.com/ontology/otel-weaver-ocel#"

[ontology.prefixes]
otelocel = "https://chatmangpt.com/ontology/otel-weaver-ocel#"
dcterms = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"
skos = "http://www.w3.org/2004/02/skos/core#"

[generation]
output_dir = "."

[[generation.rules]]
name = "otel-to-ocel-transformer"
query = { file = "queries/mapping-rules.rq" }
template = { file = "templates/src/otel_to_ocel.rs.tmpl" }
output_file = "generated/src/otel_to_ocel.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "otel-to-ocel-lib"
query = { file = "queries/mapping-rules.rq" }
template = { file = "templates/src/lib.rs.tmpl" }
output_file = "generated/src/lib.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "otel-to-ocel-cargo-manifest"
query = { file = "queries/mapping-rules.rq" }
template = { file = "templates/Cargo.toml.tmpl" }
output_file = "generated/Cargo.toml"
skip_empty = false
mode = "Overwrite"
