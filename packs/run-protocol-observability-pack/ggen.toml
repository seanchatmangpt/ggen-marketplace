[project]
name = "run-protocol-observability"
version = "26.8.25"

[ontology]
source = "fixtures/run-protocol.ttl"
base_iri = "https://chatman.ai/ontology/run-protocol-observability#"

[generation]
output_dir = "."

[[generation.rules]]
name = "protocol-failure-projection"
query = { file = "generation/010_protocol_failure_projection.rq" }
template = { file = "templates/protocol-failure.json.tera" }
output_file = "generated/run-protocol-observability/protocol-failure.json"
skip_empty = false
mode = "Overwrite"
