# Fourth Watch brand manifest — DTCG 2025.10 + castle publish / ggen messaging.
# Hierarchy: primitive → semantic → component (BrandTheme emitter contract).
# Compiles (templates/110_theme_spacing_css.tmpl + mix ggen_igniter.brand_theme)
# into Tailwind v4 @theme fluid clamp()+cqi spacing. Units: px/rem (DTCG 2025.10).
# Curly-brace aliases ({token.path}) resolve like DTCG $value refs.
#
# Consumers:
#   - ggen / BrandTheme → primitive|semantic|component + extensions.ggen.*
#   - castle publish --public-anonymize --brand → messaging.* + tokens.* + redaction
#
# Slim twins (castle/brands, zcode-cli/brands) project BrandManifest floors only:
#   [brand], messaging.{triad,voice,cta,commercial}, redaction_court
#   (require_public_anonymize), extensions.honesty, tokens.* castle leaves.
# They omit BrandTheme-only [meta]/primitive/semantic/component/extensions.ggen.
#
# Dual-surface body type (intentional, not drift):
#   - This SoT tokens.typography.scale_body_px = 18 → BrandTheme / UI CSS surface
#   - Twin scale_body_px = 24 → LinkedIn carousel court (≥24pt); castle
#     BrandManifest::carousel_geometry() also clamps body_pt.max(24.0)
#
# Honesty: 120 Hz / WebGPU / zero-DOM / 4-Cloud RAID GA / @fnox/* GA are NOT shipping.
# Jobs blast unlock AND-gate: Live cos /readyz 200 (billing∧JWKS∧redeploy)
# ∧ 2× durable LOW-only receipts on disk. 2× LOW = required second gate (not void).

# BrandTheme / pack metadata (grid floors). Castle publish reads [brand] below.
[meta]
id = "fourth-watch"
name = "Fourth Watch"
dtcg = "2025.10"
grid_base_px = 8
grid_micro_px = 4
description = """
Mobile-first spacing brand for Zero-HITL UI layout, plus Sentinel/Steward/Shepherd
messaging for castle publish. Statutory floors: WCAG 2.2 AA reflow @ 320 CSS px;
touch Apple 44 / Material 48; base type ≥16px; ≥8px gap.
"""
short_name = "Fourth Watch"
tagline = "Sentinel, Steward, and Shepherd for Mission-Critical Infrastructure"
gtm_name = "Fourth Watch AI Cybersecurity"
domain = "fourthwatch.ai"

# Castle `BrandManifest` identity (required table name: [brand], not [meta]).
[brand]
id = "fourth-watch"
name = "Fourth Watch AI Cybersecurity"
short_name = "Fourth Watch"
tagline = "Sentinel, Steward, and Shepherd for Mission-Critical Infrastructure"
domain = "fourthwatch.ai"
intake_airlock = "https://cos.fnox.io/drop/:lease_id"
intake_policy = "self-serve-airlock-only"
discovery_calls = false
target_verticals = ["holdco", "enterprise-cyber", "church-anchor", "msp-oem"]

# ---------------------------------------------------------------------------
# MESSAGING — Sentinel / Steward / Shepherd (GTM triad; BrandTheme ignores)
# Honesty: CTA host is cos.fnox.io only. Never revops.fnox.io. Never claim
# 120 Hz, @fnox/* GA, verified 21k, or 4-Cloud RAID as shipping.
# Featured CTA must surface SlotLease/`/readyz` gate while live cos ≠ 200.
# ---------------------------------------------------------------------------

[messaging.triad]
sentinel = """
Diagnose before narrative: pinned CASTLE probes and zero-mock evidence emit a
binary Claims vs Code board — ALIVE or REFUSED — before attackers or auditors
arrive. No discovery calls; standing is measured, not pitched.
"""
steward = """
Own the rails you depend on: zero vendor custody, 0.00% transaction rent, and
client-owned infrastructure under your EIN. Multi-cloud RAID remains a target
architecture — commercial metering may name the cell; shipping RAID is not
attested until measured.
"""
shepherd = """
Protect without disruption: wrap legacy staff screens with keyless FFB shims so
workflows stay familiar and retraining stays at zero. Shim inventory is
on-disk truth only — do not claim @fnox package GA or canvas Hz as shipping.
"""

[messaging.voice]
register = "calm-decisive-protective"
prohibited_patterns = [
  "book a demo",
  "schedule a call",
  "calendly.com",
  "hop on a quick call",
  "synergy",
  "AI-powered magic",
  "revops.fnox.io",
  "120 Hz",
  "120Hz",
  "WebGPU GA",
  "WebGPU shipping",
  "zero-DOM shipping",
  "4-Cloud RAID GA",
  "verified 21k",
  "@fnox/react",
  "@fnox/* GA",
  "@fnox package GA",
  "2× LOW cleared",
  "code bar cleared",
]
# Body prose only — no https/http/www (POST_EXTERNAL_LINK). Featured URL lives
# in [messaging.cta].featured_url_template and surfaces in the first comment.
required_cta = """
Drop a read-only snapshot at Featured /drop/:lease_id on cos.fnox.io for a
binary Claims vs Code board PDF. Surface SlotLease /readyz gate when drop is
not healthy — never invent revops.fnox.io.
"""

[messaging.cta]
featured_host = "cos.fnox.io"
featured_path = "/drop/:lease_id"
featured_url_template = "https://cos.fnox.io/drop/:lease_id"
intake_policy = "self-serve-airlock-only"
discovery_calls = false
forbidden_hosts = ["revops.fnox.io"]
# Featured CTA honesty — surface on every draft until live /readyz == 200
drop_gated_note = "Featured CTA: SlotLease-gated until live cos /readyz returns 200; host stays cos.fnox.io only."

[messaging.commercial]
custom_redline_duty_usd = 25000
weekly_cell_usd = 5000
custody_pct = 0.0
transaction_rent_pct = 0.0
# weekly_cell_usd meters the white-glove cell — not a proven RAID shipping claim
target_verticals = ["holdco", "enterprise-cyber", "church-anchor", "msp-oem"]

[messaging.redaction_court]
forbid_private_client_names = true
forbid_local_user_paths = true
forbid_bearer_tokens = true
forbid_external_links_in_post_body = true
forbid_calendar_links = true
require_public_anonymize = true

# Top-level twin for castle::publish::brand::BrandManifest.redaction_court
[redaction_court]
forbid_private_client_names = true
forbid_local_user_paths = true
forbid_bearer_tokens = true
forbid_external_links_in_post_body = true
forbid_calendar_links = true
require_public_anonymize = true

[extensions.honesty]
webgpu_120hz_status = "doc-only-not-shipping"
zero_dom_status = "doc-only-not-shipping"
raid_4cloud_status = "target-not-proven"
linkedin_graph_count_status = "unverified"
intake_host_of_record = "cos.fnox.io"
# Jobs lock — blast unlock = /readyz 200 ∧ 2× durable LOW-only (required second gate)
blast_unlock_primary = "Live cos /readyz 200 (billing∧JWKS∧redeploy) ∧ 2× durable LOW-only receipts on disk — Jobs P3 blast authorized on cos drop path."
low_durable_status = "required-second-gate-0x-missing"
forbid_shipping_claims = [
  "120Hz",
  "120 Hz",
  "WebGPU",
  "zero-DOM",
  "4-Cloud RAID GA",
  "@fnox/* GA",
  "@fnox package GA",
]

# Castle-facing color / type / layout tokens (DTCG leaf shape; not @theme space)
[tokens.dtcg]
spec_version = "2025.10"
surface_target = "css-theme-spacing"
surface_target_note = "BrandTheme emits Tailwind @theme spacing. Zero-DOM WebGPU/Taffy AOT is aspirational, not this cut's shipping surface."

[tokens.color]
bg_obsidian = { value = "#0B0F14", type = "color", description = "Primary watchtower canvas" }
bg_slate = { value = "#131A22", type = "color", description = "Elevated card & sight-glass surface" }
border_steel = { value = "#24303F", type = "color", description = "1px hairline structural divider" }
text_primary = { value = "#F3F6FA", type = "color", description = "High-contrast primary copy" }
text_muted = { value = "#9AA8B8", type = "color", description = "Secondary metadata & receipt hashes" }
accent_brass = { value = "#C89B3C", type = "color", description = "Sentinel watch-lamp highlight" }
status_alive = { value = "#22C55E", type = "color", description = "Verified ALIVE standing" }
status_refused = { value = "#EF4444", type = "color", description = "Fail-closed REFUSED standing" }
status_partial = { value = "#F59E0B", type = "color", description = "PARTIAL_ALIVE / bounded caution" }

[tokens.typography]
font_display = { value = "Source Serif 4, Libre Baskerville, Georgia, serif", type = "fontFamily" }
font_mono = { value = "IBM Plex Mono, ui-monospace, monospace", type = "fontFamily" }
scale_h1_px = { value = 48, type = "dimension" }
scale_h2_px = { value = 32, type = "dimension" }
# UI/CSS body (18). LinkedIn carousel twins use 24 — see header dual-surface note.
scale_body_px = { value = 18, type = "dimension", description = "BrandTheme UI body (18px); carousel twins project 24pt LinkedIn court" }
scale_caption_px = { value = 16, type = "dimension", description = "Caption floor = base ≥16 (no sub-16 UI type)" }
base_min_px = { value = 16, type = "dimension", description = "Statutory / iOS auto-zoom floor" }

[tokens.spacing]
unit_px = { value = 8, type = "dimension" }
touch_target_min_px = { value = 44, type = "dimension", description = "Apple HIG floor (tap ≥44); prefer 48 for primary CTAs" }
touch_target_comfortable_px = { value = 48, type = "dimension" }
carousel_width_px = { value = 1080, type = "dimension" }
carousel_height_px = { value = 1350, type = "dimension" }
safe_margin_px = { value = 72, type = "dimension" }

# ---------------------------------------------------------------------------
# PRIMITIVE — raw dimension scale on the 4/8 grid (no aliases)
# ---------------------------------------------------------------------------

[primitive.space]
"$type" = "dimension"
"$description" = "4px micro / 8px baseline grid primitives"

[primitive.space."0"]
"$value" = "0px"

[primitive.space."0_5"]
"$value" = "4px"
"$description" = "Micro increment (4px)"

[primitive.space."1"]
"$value" = "8px"

[primitive.space."1_5"]
"$value" = "12px"

[primitive.space."2"]
"$value" = "16px"

[primitive.space."3"]
"$value" = "24px"

[primitive.space."4"]
"$value" = "32px"

[primitive.space."5"]
"$value" = "40px"

[primitive.space."6"]
"$value" = "48px"

[primitive.space."8"]
"$value" = "64px"

[primitive.space."10"]
"$value" = "80px"

[primitive.space."12"]
"$value" = "96px"

[primitive.fontSize]
"$type" = "dimension"

[primitive.fontSize.base]
"$value" = "1rem"
"$description" = "16px root; inputs must not go below max(16px, 1rem)"

[primitive.fontSize.floor]
"$value" = "16px"
"$description" = "Hard floor: base ≥16"

[primitive.touch]
"$type" = "dimension"

[primitive.touch.apple]
"$value" = "44px"
"$description" = "Apple HIG minimum interactive target (tap ≥44)"

[primitive.touch.material]
"$value" = "48px"
"$description" = "Material Design 3 minimum interactive target"

[primitive.touch.gap]
"$value" = "8px"
"$description" = "Minimum separation between adjacent touch bounds"

# ---------------------------------------------------------------------------
# SEMANTIC — Gestalt proximity + platform window margins (aliases + fluid)
# ---------------------------------------------------------------------------

[semantic.space]
"$type" = "dimension"
"$description" = "Gestalt proximity ladder (s_inter ≥ 2 · s_intra on 8px grid)"

[semantic.space.tight]
"$value" = "{primitive.space.0_5}"
"$description" = "4px — tightly bound pairs (title → date)"

[semantic.space.related]
"$value" = "{primitive.space.1}"
"$description" = "8px — icon-to-label, sibling chips, touch gap floor"

[semantic.space.grouped]
"$value" = "{primitive.space.2}"
"$description" = "16px — card padding, sibling rows, Compact screen margin"

[semantic.space.section]
"$value" = "{primitive.space.4}"
"$description" = "32px — distinct sh:PropertyGroup sections"

[semantic.space.topic]
"$value" = "{primitive.space.6}"
"$description" = "48px — major topic breaks"

[semantic.space.margin_compact]
"$value" = "{primitive.space.2}"
"$description" = "MD3 Compact (<600dp) screen margin 16dp"

[semantic.space.margin_medium]
"$value" = "{primitive.space.3}"
"$description" = "MD3 Medium/Expanded screen margin 24dp"

[semantic.space.pane_gap]
"$value" = "{primitive.space.3}"
"$description" = "MD3 pane spacer 24dp on Medium+"

# Fluid slopes (preferred uses cqi; never register these with @property)
[semantic.space.fluid_inset]
"$value" = "clamp(1rem, 0.5rem + 2.5cqi, 1.5rem)"
"$description" = "Screen inset: 16px → 24px across container inline size"

[semantic.space.fluid_stack]
"$value" = "clamp(0.5rem, 0.25rem + 1.25cqi, 1rem)"
"$description" = "Vertical stack gap: 8px → 16px"

[semantic.space.fluid_section]
"$value" = "clamp(1.5rem, 0.75rem + 3.75cqi, 3rem)"
"$description" = "Section rhythm: 24px → 48px"

[semantic.touch]
"$type" = "dimension"

[semantic.touch.target_min]
"$value" = "{primitive.touch.apple}"
"$description" = "Default floor (Apple 44); prefer material for primary CTAs"

[semantic.touch.target_comfortable]
"$value" = "{primitive.touch.material}"
"$description" = "Material 48dp comfortable / primary CTA floor"

[semantic.touch.gap_min]
"$value" = "{primitive.touch.gap}"

[semantic.viewport]
"$type" = "dimension"

[semantic.viewport.height]
"$value" = "100dvh"
"$description" = "Prefer dvh over vh to avoid mobile URL-bar clip"

[semantic.viewport.prose_max]
"$value" = "40rem"
"$description" = "WCAG-friendly measure (~65ch at 1rem; cap ≤80ch / px·rem only)"

[semantic.viewport.container_max]
"$value" = "65rem"
"$description" = "≈1040px wide-monitor cap (840–1040dp band)"

# ---------------------------------------------------------------------------
# COMPONENT — CCS / layout roles (aliases into semantic + fluid)
# ---------------------------------------------------------------------------

[component.card]
"$type" = "dimension"

[component.card.padding]
"$value" = "clamp(1rem, 0.333rem + 3.333cqi, 2rem)"
"$description" = "Brief example: --spacing-card fluid card padding"

[component.card.gap]
"$value" = "{semantic.space.related}"

[component.property_group]
"$type" = "dimension"

[component.property_group.gap]
"$value" = "{semantic.space.section}"
"$description" = "Inter-group gap for sh:PropertyGroup sections"

[component.property_group.intra_gap]
"$value" = "{semantic.space.grouped}"
"$description" = "Intra-group field stack"

[component.control]
"$type" = "dimension"

[component.control.min_size]
"$value" = "{semantic.touch.target_min}"

[component.control.min_size_primary]
"$value" = "{semantic.touch.target_comfortable}"

[component.control.gap]
"$value" = "{semantic.touch.gap_min}"

[component.shell]
"$type" = "dimension"

[component.shell.height]
"$value" = "{semantic.viewport.height}"

[component.shell.safe_top]
"$value" = "env(safe-area-inset-top, 0px)"

[component.shell.safe_right]
"$value" = "env(safe-area-inset-right, 0px)"

[component.shell.safe_bottom]
"$value" = "env(safe-area-inset-bottom, 0px)"

[component.shell.safe_left]
"$value" = "env(safe-area-inset-left, 0px)"

[component.input]
"$type" = "dimension"

[component.input.font_size]
"$value" = "max(16px, 1rem)"
"$description" = "Blocks iOS auto-zoom on focus; enforces base ≥16"

# Utopia / Miriam Suzanne stability bound (documented; emit checks elsewhere):
# (s_wide / s_narrow) * (r_wide / r_narrow)^n ≤ 2.5
[extensions.ggen.utopia]
s_narrow = "1rem"
s_wide = "1.25rem"
r_narrow = "1.2"
r_wide = "1.25"
n_max = 5
stability_max = 2.5

[extensions.ggen.invariants]
no_property_on_cqi = true
no_container_type_with_subgrid = true
units_px_rem_only = true
touch_floor_apple_px = 44
touch_floor_material_px = 48
touch_gap_min_px = 8
font_base_min_px = 16
grid_base_px = 8
grid_micro_px = 4
no_shipping_120hz = true
no_shipping_webgpu = true
