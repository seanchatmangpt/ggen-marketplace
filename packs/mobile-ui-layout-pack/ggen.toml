# ggen.toml — frontmatter schema (templates/*.tmpl|*.tera with `to:` headers).
# Do NOT set [project].version here: that marker is declarative-only and
# triggers FM-CONFIG-101 when paired with [templates].dir.
#
# Drift gate (NOT `git diff == 0`):
#   ggen sync run --dry-run
# After a clean materialize, planned_writes must be [] / "unchanged: content identical".
# ea.graph.json is an empty FM-LAW-015 scaffold (same pattern as scim-lifecycle-pack).

[project]
name = "mobile-ui-layout-pack"

[ontology]
source = "ontology.ttl"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
sh = "http://www.w3.org/ns/shacl#"
shui = "http://www.w3.org/ns/shacl-ui/"

[templates]
dir = "templates"
