[pack]
name = "mobile-ui-layout-pack"
version = "0.1.0"
description = """
Zero-HITL Mobile-First UI Layout pack. Expresses Crystallized Control Surfaces
(CCS) as public SHACL UI: sh:PropertyGroup / sh:group / sh:order with
shui:editor, shui:viewer, and shui:PropertyRole annotations.

CCS mapping (public terms only — no private pack namespace in the graph):
- Sight Glass ≈ data-viewer roles (shui:viewer + LabelRole / DescriptionRole)
- Human Circuit Breaker ≈ human trigger/editor (shui:editor widgets)

Sibling lanes own brand.toml, gates/*.rq, and spatial-court templates under
this pack directory. This scaffold is ontology + pack manifest only.
"""

[metadata]
category = "ui"
tags = [
  "mobile-first",
  "zero-hitl",
  "shacl-ui",
  "shui",
  "property-group",
  "crystallized-control-surfaces",
  "sight-glass",
  "human-circuit-breaker",
]

[capabilities]
provides = ["urn:ggen:pack:mobile-ui-layout-pack"]
requires = []
