[project]
name = "evidence-capital-policy-realization"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "policy-realization-observation"
query = { file = "queries/generation-context.rq" }
template = { file = "templates/policy-realization.json.tmpl" }
output_file = "generated/evidence-capital-policy-realization/observation.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "policy-realization-court"
query = { file = "queries/generation-context.rq" }
template = { file = "templates/policy-realization-court.py.tmpl" }
output_file = "generated/evidence-capital-policy-realization/qualification_court.py"
skip_empty = false
mode = "Overwrite"
