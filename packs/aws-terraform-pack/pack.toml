[pack]
name = "aws-terraform-pack"
version = "26.11.14"
description = """Deterministic AWS Terraform HCL (deploy/aws/<slug>/*.tf) generated from ontology.ttl, an RDF fact model of an ECS Fargate run-to-completion task (aws_ecs_cluster + aws_ecs_task_definition + aws_cloudwatch_log_group). Layout mirrors packs/azure-terraform-pack. Region/image/cluster name are Terraform variables; os family, cpu, memory, network mode, log retention and container name/command are SPARQL-bound from the ontology. UNVERIFIED: not yet run under ggen sync or terraform validate; see STANDING.md. No ggen.toml extra_ontologies required."""
[capabilities]
provides = ["urn:ggen:pack:aws-terraform-pack"]
requires = []
