[pack]
name = "jotp-benchmark-site-shadcn-pack"
version = "0.2.0"
description = """
  Semantic-profile pack admitting /Users/sac/jotp/benchmark-site, a Next.js 16 / React 19
  app (package name jotp-benchmark-monitor), into the marketplace. shadcn/ui usage is real
  and confirmed on disk: a components.json (style base-nova, baseColor neutral, ui alias
  @/components/ui) configures the shadcn registry, lib/utils.ts defines the canonical cn()
  helper via clsx + tailwind-merge, class-variance-authority (cva) is used in
  components/ui/button.tsx and components/ui/badge.tsx, and 19 shadcn primitive files
  exist under components/ui/ (accordion, badge, benchmark-card, button, card, chart,
  dialog, dropdown-menu, input, link, metric-display, popover, scroll-area, select,
  separator, status-badge, switch, tabs, textarea, tooltip), consumed via @radix-ui
  imports across 18+ app/ pages and components/ files. deck.gl was checked for and is
  absent: no deck.gl or @deck.gl/* dependency in package.json and no
  DeckGL/Layer/ScatterplotLayer/GeoJsonLayer/HexagonLayer/ArcLayer references anywhere in
  source.
  """

[capabilities]
provides = ["urn:ggen:pack:jotp-benchmark-site-shadcn-pack"]

# Mechanically derived from template imports (grep over templates/*.tmpl bodies):
# react + cva + @radix-ui/react-slot (button/badge), @radix-ui/themes +
# @radix-ui/react-icons (benchmark-card), cn() = clsx + tailwind-merge via the
# projected lib/utils.ts. This pack MIXES two Radix families: @radix-ui/themes
# (contextual theme provider recommended) alongside per-primitive
# @radix-ui/react-*/react-slot packages; both groups are listed here.
[consumer_contract]
runtime = [
  "react",
  "class-variance-authority",
  "@radix-ui/react-slot",
  "@radix-ui/themes",
  "@radix-ui/react-icons",
  "clsx",
  "tailwind-merge",
]
tooling = ["typescript"]
peer_context = """
  @/lib/utils path alias -> projected lib/utils.ts; @radix-ui/themes consumers should
  mount <Theme> (or css reset import); @radix-ui/react-* primitives additionally expect
  @types/react as an unauto-installed peer
  """
projected_helpers = ["jotp-benchmark-site-shadcn-pack/lib/utils.ts"]
