[project]
name = "human-value-runtime-crown-pack"
version = "26.8.26"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/human-value-runtime#"

[generation]
output_dir = "."

[[generation.rules]]
name = "dynamic-provider"
query = { file = "queries/01-dynamic-provider.rq" }
template = { file = "templates/provider.ex.tera" }
output_file = "generated/human_value/provider.ex"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "ash-world"
query = { file = "queries/02-ash-resource.rq" }
template = { file = "templates/world.ex.tera" }
output_file = "generated/human_value/world.ex"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "liveview-gemba"
query = { file = "queries/03-liveview.rq" }
template = { file = "templates/liveview.ex.tera" }
output_file = "generated/web/human_value_live.ex"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "playwright-journey"
query = { file = "queries/04-playwright.rq" }
template = { file = "templates/human_value.spec.js.tera" }
output_file = "generated/e2e/human_value.spec.js"
skip_empty = true
mode = "Overwrite"
