[pack]
name = "process-capability-pack"
version = "0.1.0"
description = """
Qualified capability contracts for the OTP/BEAM process family:
Process.Spawn, Process.Supervise, Process.Signal, Process.Link
(plus minted siblings Process.Monitor, Process.Unlink).

A capability here is a semantic identity with inputs, outputs, preconditions,
postconditions, typed outcomes, evidence and authority requirements and
execution properties. A realization is a qualified provider binding
(hex/reactor_process, OTP stdlib) carrying provider metadata and
qualification conditions. CAPABILITY != IMPLEMENTATION: no package or
version is ever named as a capability.

Composes the qce: qualified-capability-ecology vocabulary (capabilities are
qce:CapabilityVersion subclasses; realizations carry qce:admitted) and the
public prov/earl/dcterms/skos sets. All gates are violation-row SELECTs:
rows mean refusal. SELECT/CONSTRUCT only; grants no DO authority; BRCE
remains the sole consequential actuation boundary.
"""
