[pack]
name = "ash-a2a-app-pack"
version = "0.1.0"
description = """
Projects a complete Ash + AshA2A application from Turtle alone: Ash.Domain,
Ash.Resource modules (ETS data layer, attributes, actions, optional a2a skill
overrides) and an AshA2A.Agent per aap:Agent. Consumer edits only the .ttl and
runs ggen; generated modules compile and serve an A2A agent card.
"""

[capabilities]
provides = ["urn:ggen:pack:ash-a2a-app-pack"]
requires = []

[consumer_contract]
runtime = ["ash", "ash_a2a"]
