[pack]
name = "strata-hash-pack"
version = "0.1.0"
description = """
Cryptographic primitives slice (S1) for Strata: BLAKE3/SHA-256 digest
constants plus a Merkle tree (root + inclusion proofs) over 32-byte
digests, property-tested. Projects a Rust module of `pub const` hash
algorithm constants and a self-contained (no external crates) SHA-256
(FIPS 180-4) + Merkle implementation with property tests. The generated
counterpart of the hand-written runtime hashing module — generation over
hand-writing per doctrine. Roadmap: docs/sjira/v26.10.8/STRATA-BLOCKCHAIN-ROADMAP.md S1.
"""
[capabilities]
# requires is empty: scripts/qualify_packs.py qualifies every pack in isolation
# (single-pack [packs] capsule), so a cross-pack require (the digest constants
# frame against the CLAP-PDU protocol types consumed by later slices S2+) can
# never resolve there (FM-PACK-018). The composition relationship is documented
# in the description and the relationship note below.
provides = ["urn:ggen:pack:strata-hash-pack"]
requires = []

# Relationship note (NOT a pack.toml [dependencies] entry): the digest
# constants and Merkle projection frame against the CLAP-PDU protocol types
# modeled in packs/strata-protocol-pack (0.1.0) and are consumed by the later
# roadmap slices (strata-tx-pack S2, strata-chain-pack S5) per
# docs/sjira/v26.10.8/STRATA-BLOCKCHAIN-ROADMAP.md, but ggen refuses a
# [dependencies] entry unless the consumer lists that pack in its own ggen.toml
# [packs] table (FM-PACK-014), and scripts/qualify_packs.py qualifies every pack
# in isolation with a single-pack [packs] table -- so a declared dependency
# could never resolve here. The relationship is documentation-only via
# [capabilities].requires above. Same precedented remediation as
# packs/a2a-durability-pack (FM-PACK-014) and packs/strata-pn64-pack.
