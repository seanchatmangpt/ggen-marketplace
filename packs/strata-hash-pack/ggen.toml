[project]
name = "strata-hash-pack"
version = "0.1.0"
description = "BLAKE3/SHA-256 digest constants + Merkle module projected from RDF for the Strata runtime"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"

[validation]
gates = [
  "gates/010_digest_length.rq",
  "gates/020_algorithm_closure.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "hash-constants"
query = { file = "queries/hash_algos.rq" }
template = { file = "templates/hash_consts.rs.tera" }
output_file = "hash_consts.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "hash-merkle"
query = { file = "queries/hash_algos.rq" }
template = { file = "templates/hash_merkle.rs.tera" }
output_file = "hash_merkle.rs"
skip_empty = false
mode = "Overwrite"
