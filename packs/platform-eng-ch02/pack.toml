[pack]
name = "platform-eng-ch02"
version = "0.1.0"
description = "Chapter 2 ('Building the Cluster Foundation') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch02' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. This chapter teaches you how to configure production-ready Kubernetes platform clusters across environments using declarative Infrastructure as Code (Pulumi), GitOps principles (Flux), service mesh technology (Istio), and policy enforcement (OPA/Gatekeeper). The code demonstrates building secure, observable, and resilient container orchestration platforms that serve as the foundation for developer-focused engineering platforms."
