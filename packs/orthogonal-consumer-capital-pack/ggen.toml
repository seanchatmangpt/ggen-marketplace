[project]
name = "orthogonal-consumer-capital"
version = "26.8.25"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatman.ai/ontology/orthogonal-consumer-capital#"

[generation]
output_dir = "."

[[generation.rules]]
name = "orthogonal-consumer-manufacturing-plan"
query = { file = "queries/051_manufacturing_plan_projection.rq" }
template = { file = "templates/consumer-manufacturing-plan.json.tera" }
output_file = "generated/orthogonal-consumer-capital/consumer-manufacturing-plan.json"
skip_empty = false
mode = "Overwrite"
