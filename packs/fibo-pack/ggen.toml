[project]
name = "fibo-pack"
version = "0.1.0"

[ontology]
source = "ontology/walkthrough-fibo.ttl"
base_iri = "https://fortnox.example/data/walkthrough/"
imports = []

[ontology.prefixes]
wt = "https://fortnox.example/data/walkthrough/"
prov = "http://www.w3.org/ns/prov#"
xsd = "http://www.w3.org/2001/XMLSchema#"

[generation]
output_dir = "dist"

[[generation.rules]]
name = "fibo_map"
query = { file = "queries/map.rq" }
template = { file = "templates/fibo_map.py.tmpl" }
output_file = "fibo_map.py"
skip_empty = false
mode = "Overwrite"
