[pack]
name = "regression-fixtures-pack"
version = "26.9.1"
description = """
A DOCUMENTED regression corpus (ontology + fixture specs), not an execution
gym. Encodes 9 historical Claude-orchestration failure classes as named
`rfx:RegressionFixture` individuals under fixtures/*.md: wrong-subject,
stale-plan, build-collision, false-claim, unbounded-loop, unchanged-retry,
destructive-dependency, placeholder-evidence, and dirty-diverged-repo (a
real, cited incident from this account's own ~/.claude/big-loop/tracker.md
Cycle 12 history, not a synthesized scenario). Each fixture names its setup,
its expected sensor/gate verdict, and -- where one genuinely already exists
elsewhere in this marketplace -- cites the real SPARQL/Python gate that
already encodes it, by file path, rather than re-deriving or fabricating a
new one. No generic execution gym exists on this machine as of authoring
time; this pack is the corpus such a gym would consume, not the gym itself.
See README.md's Scope section for exactly what a future execution gym would
need to actually RUN these fixtures.

`ggen sync run` refuses (this pack's own 5 gates) when a registered
`rfx:RegressionFixture` is missing rfx:setup/rfx:expectedBehavior/rfx:specPath,
when two fixtures share an rfx:name, when an expectedBehavior loosely
mentions REFUSED without the REFUSED[CODE] shape, when an rfx:citedGate
value doesn't look like a real marketplace-relative file path, or when an
rfx:FixtureCorpus's declared rfx:memberCount drifts from the real asserted
count -- the last one deliberately mirrors this repo's own
source-of-truth-check discipline (a restated count going stale next to its
own ground truth).
"""
