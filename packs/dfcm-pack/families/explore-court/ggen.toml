[project]
name = "dfcm-explore-court"
version = "26.8.24"
description = "Generate a deterministic DfCM candidate comparison court"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/dfcm-explore#"
imports = []

[ontology.prefixes]
ex = "https://ggen.dev/ontology/dfcm-explore#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
dct = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"

[generation]
output_dir = "."

[[generation.rules]]
name = "candidate-matrix"
query = { file = "queries/all-candidates.rq" }
template = { file = "templates/candidate-matrix.md.tmpl" }
output_file = "consumer/dfcm-explore/CANDIDATE_MATRIX.md"
skip_empty = false
mode = "Overwrite"
