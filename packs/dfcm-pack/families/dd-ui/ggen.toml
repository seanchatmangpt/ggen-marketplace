[project]
name = "dfcm-dd-ui"
version = "26.8.18"
description = "Generate deterministic dynamic UI constitutional references from admitted RDF"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatman.ai/ontology/dd-ui#"

[ontology.prefixes]
ddui = "https://chatman.ai/ontology/dd-ui#"
dfcm = "https://chatman.ai/ontology/dfcm#"
brce = "https://chatman.ai/ontology/brce#"
prov = "http://www.w3.org/ns/prov#"
sh = "http://www.w3.org/ns/shacl#"

[generation]
output_dir = "."

[[generation.rules]]
name = "dd-ui-contract-reference"
query = { file = "queries/contract.rq" }
template = { file = "templates/DDUI_CONTRACT.md.tmpl" }
output_file = "DDUI_CONTRACT.md"
skip_empty = false
mode = "Overwrite"
