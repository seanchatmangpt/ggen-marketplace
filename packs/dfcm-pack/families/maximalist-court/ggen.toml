[project]
name = "dfcm-maximalist-court-consumer"
version = "26.8.24"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/dfcm-maximalist-court#"

[generation]
output_dir = "."

[[generation.rules]]
name = "candidate-matrix"
query = { file = "queries/candidates.rq" }
template = { file = "templates/candidates.json.tmpl" }
output_file = "consumer/dfcm-court/candidates.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "qualification-queue"
query = { file = "queries/qualification.rq" }
template = { file = "templates/qualification.json.tmpl" }
output_file = "consumer/dfcm-court/qualification.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "select-opportunities"
query = { file = "queries/select.rq" }
template = { file = "templates/select.json.tmpl" }
output_file = "consumer/dfcm-court/select.json"
skip_empty = false
mode = "Overwrite"
