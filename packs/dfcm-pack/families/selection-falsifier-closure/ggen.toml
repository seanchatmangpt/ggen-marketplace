[project]
name = "dfcm-selection-falsifier-closure"
version = "0.1.0"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "selection-contract"
query = { file = "queries/admissible-frontier.rq" }
template = { file = "templates/selection-contract.json.tmpl" }
output_file = "generated/dfcm-selection-falsifier-closure/selection-contract.json"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "qualification-court"
query = { file = "queries/admissible-frontier.rq" }
template = { file = "templates/qualification-court.py.tmpl" }
output_file = "generated/dfcm-selection-falsifier-closure/qualification_court.py"
mode = "Overwrite"
skip_empty = true
