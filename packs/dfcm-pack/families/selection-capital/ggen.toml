[project]
name = "dfcm-selection-capital-pack"
version = "26.8.23"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "ctq-matrix"
query = { file = "queries/010_ctq_frontier.rq" }
template = { file = "templates/selection-matrix.csv.tmpl" }
output_file = "selection/CTQ_MATRIX.csv"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "decisive-experiment"
query = { file = "queries/040_falsifier_pressure.rq" }
template = { file = "templates/decisive-experiment.md.tmpl" }
output_file = "selection/DECISIVE_EXPERIMENT.md"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "selection-receipt"
query = { file = "queries/010_ctq_frontier.rq" }
template = { file = "templates/selection-receipt.json.tmpl" }
output_file = "receipts/selection.json"
mode = "Overwrite"
skip_empty = true
