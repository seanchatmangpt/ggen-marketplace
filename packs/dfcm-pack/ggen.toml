[project]
name = "dfcm-deployment-consumer"
version = "1.0.0"
description = "Manufacture DfCM deployment contracts for the full Chatman ecosystem"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/dfcm#"
imports = []

[ontology.prefixes]
dfcm = "https://ggen.dev/ontology/dfcm#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
skos = "http://www.w3.org/2004/02/skos/core#"
prov = "http://www.w3.org/ns/prov#"
odrl = "http://www.w3.org/ns/odrl/2/"

[generation]
output_dir = "."

[[generation.rules]]
name = "deployment-blueprint"
query = { file = "queries/components.rq" }
template = { file = "templates/DFCM_DEPLOYMENT.md.tmpl" }
output_file = "consumer/dfcm/DFCM_DEPLOYMENT.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "option-graph"
query = { file = "queries/edges.rq" }
template = { file = "templates/OPTION_GRAPH.json.tmpl" }
output_file = "consumer/dfcm/OPTION_GRAPH.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "selection-ledger"
query = { file = "queries/invariants.rq" }
template = { file = "templates/SELECT_LEDGER.json.tmpl" }
output_file = "consumer/dfcm/SELECT_LEDGER.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "brce-policy"
query = { file = "queries/operations.rq" }
template = { file = "templates/BRCE_POLICY.json.tmpl" }
output_file = "consumer/dfcm/BRCE_POLICY.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "receipt-contract"
query = { file = "queries/morphisms.rq" }
template = { file = "templates/RECEIPT_CONTRACT.json.tmpl" }
output_file = "consumer/dfcm/RECEIPT_CONTRACT.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "replay-contract"
query = { file = "queries/pipeline.rq" }
template = { file = "templates/REPLAY.md.tmpl" }
output_file = "consumer/dfcm/REPLAY.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "initial-state"
query = { file = "queries/statuses.rq" }
template = { file = "templates/deployment-state.json.tmpl" }
output_file = "consumer/dfcm/deployment-state.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "standing"
query = { file = "queries/falsifiers.rq" }
template = { file = "templates/STANDING.json.tmpl" }
output_file = "consumer/dfcm/STANDING.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "verifier"
query = { file = "queries/statuses.rq" }
template = { file = "templates/verify.py.tmpl" }
output_file = "consumer/dfcm/verify.py"
skip_empty = false
mode = "Overwrite"
