[project]
name = "dfcm-deployment-consumer"
version = "2.0.0"
description = "Manufacture DfCM deployment and Fortune-5 enterprise readiness contracts for the full Chatman ecosystem"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/dfcm#"
imports = []

[ontology.prefixes]
dfcm = "https://ggen.dev/ontology/dfcm#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
skos = "http://www.w3.org/2004/02/skos/core#"
prov = "http://www.w3.org/ns/prov#"
odrl = "http://www.w3.org/ns/odrl/2/"

[generation]
output_dir = "."

[[generation.rules]]
name = "deployment-blueprint"
query = { file = "queries/components.rq" }
template = { file = "templates/DFCM_DEPLOYMENT.md.tmpl" }
output_file = "consumer/dfcm/DFCM_DEPLOYMENT.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "deployment-contract"
query = { file = "queries/components.rq" }
template = { file = "templates/DEPLOYMENT.toml.tmpl" }
output_file = "consumer/dfcm/DEPLOYMENT.toml"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "observation-carrier"
query = { file = "queries/statuses.rq" }
