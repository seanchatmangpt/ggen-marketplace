[project]
name = "dfcm-deployment-consumer"
version = "2.2.0"
description = "Manufacture DfCM deployment, Fortune-5 readiness, autonomous-agent governance, and wall-clock-first CI optimization contracts for the full Chatman ecosystem"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology/deployment.ttl"
base_iri = "https://ggen.dev/ontology/dfcm#"
imports = [
  "ontology/candidate-compatibility-portfolio.ttl",
  "ontology/dd-ui.ttl",
  "ontology/develop-maximalist.ttl",
  "ontology/explore-candidate-factory.ttl",
  "ontology/explore-court.ttl",
  "ontology/explore-maximalist.ttl",
  "ontology/full-deployment.ttl",
  "ontology/maximalist-court.ttl",
  "ontology/maximalist-selection-control.ttl",
  "ontology/option-capital.ttl",
  "ontology/selection-capital.ttl",
  "ontology/selection-evidence-acquisition.ttl",
  "ontology/selection-falsifier-closure.ttl",
  "ontology/selection-frontier-execution.ttl",
  "ontology/selection-portfolio-consensus.ttl",
]

[ontology.prefixes]
dfcm = "https://ggen.dev/ontology/dfcm#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
skos = "http://www.w3.org/2004/02/skos/core#"
prov = "http://www.w3.org/ns/prov#"
odrl = "http://www.w3.org/ns/odrl/2/"

[validation]
gates = [
  "gates/010_required_core.rq",
  "gates/020_foundational_order.rq",
  "gates/030_status_distinctions.rq",
  "gates/040_select_construct_do.rq",
  "gates/050_brce_authority.rq",
  "gates/060_receipt_replay.rq",
  "gates/070_alive_evidence.rq",
  "gates/080_extension_closure.rq",
  "gates/090_failed_edge_topology.rq",
  "gates/100_public_ontology_alignment.rq",
  "gates/110_enterprise_profile.rq",
  "gates/120_assurance_domain_coverage.rq",
  "gates/130_candidate_contract.rq",
  "gates/130_tier0_slo.rq",
  "gates/140_candidate_standing_closed.rq",
  "gates/140_resilience_topology.rq",
  "gates/150_authority_segregation.rq",
  "gates/150_candidate_authority.rq",
  "gates/160_break_glass_brce.rq",
  "gates/160_selection_policy_closed.rq",
  "gates/170_portfolio_integrity.rq",
  "gates/170_supply_chain.rq",
  "gates/180_data_boundaries.rq",
  "gates/180_generation_binding_closure.rq",
  "gates/190_progressive_release.rq",
  "gates/190_projection_owner.rq",
  "gates/200_observability_incident.rq",
  "gates/210_audit_evidence.rq",
  "gates/220_capacity_targets.rq",
  "gates/230_chaos_dr.rq",
  "gates/240_no_enterprise_self_crown.rq",
  "gates/240_post_agi_targets.rq",
  "gates/250_portability_finops.rq",
  "gates/260_control_well_formed.rq",
  "gates/dccp_01_exact_subject.rq",
  "gates/dccp_02_authority.rq",
  "gates/dfd_010_required.rq",
  "gates/dfd_020_invariants.rq",
  "gates/dfd_030_fortune5_required.rq",
  "gates/dmc_all_candidates_have_falsifiers.rq",
  "gates/dmc_all_candidates_have_rollback.rq",
  "gates/dmc_all_candidates_require_receipts.rq",
  "gates/dmc_develop_no_do.rq",
  "gates/dmc_experiment_realization.rq",
  "gates/dmsc_010_exact_subject.rq",
  "gates/dmsc_020_authority.rq",
  "gates/dmsc_030_evidence_bounds.rq",
  "gates/dsc_010_exact_subject.rq",
  "gates/dsc_020_authority.rq",
  "gates/dsc_030_reversibility.rq",
  "gates/dsc_040_uncertainty.rq",
  "gates/dsea_01_exact_candidate_subject.rq",
  "gates/dsea_02_evidence_gap.rq",
  "gates/dsea_03_no_ambient_do.rq",
  "gates/dsfc_authority.rq",
  "gates/dsfc_closure.rq",
  "gates/dsfc_exact_subject.rq",
  "gates/dsfc_uncertainty.rq",
  "gates/dsfe_authority.rq",
  "gates/dsfe_exact_subject.rq",
  "gates/dsfe_frontier_evidence.rq",
  "gates/dspc_010_exact_subject.rq",
  "gates/dspc_020_no_ambient_do.rq",
]

[generation]
output_dir = "."

[[generation.rules]]
name = "deployment-blueprint"
query = { file = "queries/components.rq" }
template = { file = "templates/DFCM_DEPLOYMENT.md.tmpl" }
output_file = "consumer/dfcm/DFCM_DEPLOYMENT.md"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "deployment-contract"
query = { file = "queries/components.rq" }
template = { file = "templates/DEPLOYMENT.toml.tmpl" }
output_file = "consumer/dfcm/DEPLOYMENT.toml"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "observation-carrier"
query = { file = "queries/statuses.rq" }
template = { file = "templates/O.star.toml.tmpl" }
output_file = "consumer/dfcm/O.star.toml"
