[project]
name = "semantic-documentation-contract-pack"
version = "26.9.14"

[ontology]
source = "ontology.ttl"

[templates]
dir = "templates"

[generation]
output_dir = "."

[[generation.rules]]
name = "open-ontologies-community-pack"
query = { file = "queries/01-open-ontologies-community-pack.rq" }
template = { file = "templates/open-ontologies-community-pack.json.tmpl" }
output_file = ".generated/open-ontologies-community-pack.json"
mode = "Overwrite"
skip_empty = true

[[generation.rules]]
name = "projection-bundle"
query = { file = "queries/02-projection-bundle.rq" }
template = { file = "templates/projection-bundle.json.tmpl" }
output_file = ".generated/projection-bundle.json"
mode = "Overwrite"
skip_empty = true
