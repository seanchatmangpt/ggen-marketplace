[pack]
name = "semantic-documentation-contract-pack"
version = "26.9.14"
description = """
Revision-bound semantic documentation contract. Compiler/source evidence and
provenance are canonical RDF; prose, C4, Diataxis, agent context, and registry
records are non-sovereign projections. Requires exact repository+revision
identity, complete evidence lineage, explicit no-DO authority, and typed
admission standing. Reuses W3C PROV-O and the semantic-projection-pack boundary
instead of inventing a parallel provenance/projection model.
"""
