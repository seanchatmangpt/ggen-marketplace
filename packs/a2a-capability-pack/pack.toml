[pack]
name = "a2a-capability-pack"
version = "26.9.0"
description = """
Qualified capability-contract pack for distributed agent-to-agent (SA2A)
invocation: the semantic capability layer a capability-resolution engine
(ash_pplan) resolves against. Pinned dotted IDs (dcterms:identifier and
rdfs:label): A2A.Invoke, A2A.Discover, A2A.Await, namespace
https://ggen.dev/ontology/a2a-capability#.

CAPABILITY != IMPLEMENTATION: aacap:Capability is semantic identity only;
aacap:Realization carries provider metadata (repo, module, source file,
version-pin policy) plus qualification conditions. Worked realizations are
transcribed from direct read-only source inspection of ~/ash_a2a at
fbea18c5d58c5b38776b70b477d9cd24c96963a8 (2026-09-30); the operator's
provisional name mapping (Distributed.Invoke / AwaitResponse /
CapabilityDiscover) was verified against the real tree and CORRECTED --
none of those module names exist; the real surface is
AshA2A.Reactor.ExecuteCommand / AshA2A.CommandBus.run/4 /
AshA2A.Dispatcher.dispatch/6 (invoke), AshA2A.A2ATransport.TaskEvents +
AshA2A.TaskStore.Ekv (await), AshA2A.CapabilityIndex +
CapabilityIndex.Compiler + AgentCardBuilder (discover).

Encoded invariants: Plan!=Execution (realizations grant no DO authority),
Policy!=Authority (endpoint admission is not authority),
ProviderAvailable!=Authorized (reachability is not authority),
Projection!=Source (the capability index is derived from Ash introspection),
Generated!=Admitted (generated agent cards qualify only through declared
qualification conditions). Remote authority is never ambient: every remote
A2A.Invoke realization requires a qce:AuthorityEnvelope (composed verbatim
from packs/qualified-capability-ecology-pack) with aacap:validAtEnd
"remote"|"both" -- valid at the REMOTE end. Evidence: consequence-bearing
capabilities must declare a remote-receipt/ack-provenance evidence
requirement (composing sa2a-semantic-evidence-pack's envelope schema by
reference). A2A.Await composes Workflow.Resume (dcap pinned dotted ID) by
dotted-ID reference only; the join happens in the resolver, not in-tree.

Composes existing sa2a-family packs by reference (ema:, s2b:, sa2a:,
qce:, dcp:); custom aacap: terms exist only on recorded failed edges
(see README.md). Gates are violation-row SELECTs: rows mean refusal.
SELECT/CONSTRUCT-only; grants no DO authority; BRCE remains the sole
consequential actuation boundary.
"""
