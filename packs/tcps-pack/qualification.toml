# Isolated marketplace qualification (scripts/qualify_packs.py) loads only a
# pack's root ontology.ttl; the five absorbed crate modules are unioned in here
# so the qualification render projects the real family (same mechanism as
# packs/greene-licensing-case-pack/qualification.toml). The pack's 10 gates run
# over this same union (semantic_ggen_toml [validation] gates), and the pack's
# own exact-stem witness court (qualification/verify.py) unions the modules
# independently of this file.
[consumer]
extra_ontologies = [
  "ontology/core.ttl",
  "ontology/cli.ttl",
  "ontology/ffi.ttl",
  "ontology/std.ttl",
  "ontology/wasm.ttl",
]
