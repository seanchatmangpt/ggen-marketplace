[pack]
name = "tcps-pack"
version = "26.9.0"
description = """
Toyota Production System (TCPS) crate family (豊田コード生産方式), consolidated
from five per-crate packs into ONE admission unit (2026-09-30 wave): tcps-core
(the kernel: 24-module no_std module set), tcps-cli (2 binaries), tcps-ffi
(stable C ABI over tcps-core), tcps-std (receipt persistence + environment
observation), tcps-wasm (WebAssembly capability boundary). One version, one
court, five disjoint namespace modules joined only by the consumer workspace —
the O(N^2) drift law applied to the crate family, per the capability-ecology
precedent.

Per-crate namespaces are conserved verbatim (disjoint IRIs, no two-owner IRIs):
tcps: = .../packs/tcps-core# (kernel module, content anchors),
tcps: = .../packs/tcps-cli#, tcps_ffi: = .../packs/tcps-ffi#,
tcps_std: = .../packs/tcps-std#, tcps_wasm: = .../packs/tcps-wasm#.
All 40 per-crate template targets are conserved with disjoint output paths
(src/*.rs, crates/tcps-{cli,ffi,std,wasm}/**); only the four colliding
cargo_toml.tmpl and four colliding lib.rs.tmpl template FILE names gained
family prefixes. Gates are family-prefixed exact stems (10) with
exact-stem witnesses under one uniform court (qualification/verify.py).

The canonical vendored product snapshot lives at reference/製品版/ (moved from
tcps-core-pack; 132 files, 43 of them hash-verified by source-manifest.json).
The byte-identical duplicates it had accumulated were retired with provenance
manifests: tcps-release-pack/reference/ (91 files, all byte-identical) and the
older internal 豊田コード生産方式_v26.7.19 second snapshot (40 files, 27
byte-identical + 13 unique to that older revision) — see
reference/SOURCE_MANIFEST.retired-豊田コード生産方式_v26.7.19.sha256 and
tcps-release-pack/SOURCE_MANIFEST.sha256.

Grants no execution authority; BRCE remains the sole actuation boundary.
Supersedes tcps-core-pack, tcps-cli-pack, tcps-ffi-pack, tcps-std-pack,
tcps-wasm-pack (0.1.0 each). tcps-release-pack stays a separate pack (its 85
infra/** targets are its own release-engineering surface).
"""
