# Pack-local manifest: self-verification only (writes under generated/, never
# into a consumer). Consumers copy this manifest, bind fa:DossierConfig via
# SPARQL, and sync: the query joins their bindings and the template renders
# their exporter. Templates never hardcode module names or subject ids --
# gates/000 refuses the hardcoded-binding failure mode.
[project]
name = "forensic-audit-dossier-pack"
version = "0.1.0"
description = "Deterministic OCEL 2.0 forensic audit dossier exporter (pack-local self-verification)"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "urn:forensic:audit:"
imports = []

[ontology.prefixes]
fa = "urn:forensic:audit:"
xsd = "http://www.w3.org/2001/XMLSchema#"

[generation]
output_dir = "."

[[generation.rules]]
name = "dossier-exporter"
query = { file = "queries/exporter.rq" }
template = { file = "templates/dossier_exporter.py.tmpl" }
output_file = "generated/dossier_exporter.py"
skip_empty = false
mode = "Overwrite"
