[project]
name = "github-live-evidence-ingestion"
version = "26.8.25"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "ingestion-reference"
query = { inline = '''SELECT ("github-live-evidence-ingestion" AS ?subject) WHERE {} ORDER BY ?subject''' }
template = { file = "templates/ingestion-reference.tera" }
output_file = "ingestion-reference.json"
skip_empty = false
mode = "Overwrite"
