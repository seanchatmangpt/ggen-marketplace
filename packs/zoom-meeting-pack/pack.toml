[pack]
name = "zoom-meeting-pack"
version = "0.1.0"
description = """Zoom meeting domain ontology and SHACL validation shapes (`zoom:`): defines
`zoom:Meeting`, `zoom:Participant`, `zoom:Recording`, `zoom:Transcript`, `zoom:TranscriptCue`,
`zoom:ActionItem`, and `zoom:WebhookEvent` (`endpoint.url_validation`, `meeting.started`,
`meeting.ended`, `recording.completed`, `recording.transcript_completed`)."""

[metadata]
category = "integration"
tags = ["zoom", "meetings", "recordings", "transcripts", "webhooks", "shacl", "ontology"]

[capabilities]
provides = ["urn:ggen:pack:zoom-meeting-pack"]
requires = []

# Any row returned by a gate = refusal.
[validation]
gates = [
  "gates/010_webhook_hmac_required.rq",
  "gates/020_transcript_provenance.rq",
  "gates/030_no_static_zoom_secrets.rq",
]
