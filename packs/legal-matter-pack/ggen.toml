[project]
name = "legal-matter-pack"
version = "26.10.16"

[ontology]
source = "ontology.ttl"

[[generation.rules]]
name = "juror-persona-contract"
query = { file = "queries/juror-persona.rq" }
template = { file = "templates/juror-persona.contract.ts.tera" }
output_file = "generated/juror-persona.contract.ts"
mode = "Overwrite"

[[generation.rules]]
name = "judge-contract"
query = { file = "queries/judge.rq" }
template = { file = "templates/judge.contract.ts.tera" }
output_file = "generated/judge.contract.ts"
mode = "Overwrite"

[[generation.rules]]
name = "simulation-contract"
query = { file = "queries/simulation.rq" }
template = { file = "templates/simulation.contract.ts.tera" }
output_file = "generated/simulation.contract.ts"
mode = "Overwrite"

[[generation.rules]]
name = "case-space-contract"
query = { file = "queries/case-space.rq" }
template = { file = "templates/case-space.contract.ts.tera" }
output_file = "generated/case-space.contract.ts"
mode = "Overwrite"
