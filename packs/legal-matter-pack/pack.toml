[pack]
name = "legal-matter-pack"
version = "26.10.16"
description = """
Legal matter decision-simulation ontology pack. Models the athena decision-
simulation domain as RDF (lm: namespace): LegalMatter, JurorPersona, JudgeProfile,
CaseSpec, Motion, JudgeRuling, Positioning (plaintiff/neutral/defendant shares
with the sum-to-100 constraint), CaseStrength, SimulationResult, CaseSpace
(tenantId/firmId/caseId custody binding, server-side container derivation),
and a typed refusal vocabulary following refusal-vocabulary-pack's rv: pattern.
Projects zod v3 .strict() TypeScript contract modules (juror-persona, judge,
simulation, case-space) via ggen sync. Consumed by cai/athena
playground/src/lib/{jury,judge,simulation,case-space} — the projected contracts
are the source of truth; lib modules re-export them and keep only logic.
Authority ceiling NONE: certifies shapes, never decides cases.
"""

[capabilities]
provides = ["urn:ggen:pack:legal-matter-pack"]
requires = ["urn:ggen:pack:refusal-vocabulary-pack"]
