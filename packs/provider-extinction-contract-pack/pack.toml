[pack]
name = "provider-extinction-contract-pack"
version = "0.1.0"
description = """
The provider-neutral execution contract as RDF + violation-row gates: what an
ExecutionRequest, an ExecutionProvider and an ExecutionReceipt are, such that a
provider can go EXTINCT (be cancelled, rate-killed, sunset, replaced) while the
work order survives unchanged. This pack carries the CONTRACT half of the
ALOOP-ZCODE-DOGFOOD-001 provider-neutrality law: WorkOrder identity, authority,
planner, acceptance, receipt-schema and replay carry NO provider identity --
provider appears only as the left segment of a capabilityId ("provider:id") and
in the provider's own runtime descriptor (capabilities, transport, availability,
cost, concurrency, authority ceiling, receipt protocol).

PUBLIC vocabulary first: ExecutionProvider is a prov:SoftwareAgent subclass,
the request/receipt/capability spine is prov:Entity/Activity, metadata via
dcterms, and the receipt field names are the ALOOP ExecutionReceipt contract
verbatim (workOrderId, originAuthority, provider, providerExecutionId,
subjectBefore, subjectAfter, commands, consequences, evidence, exitStatus,
timestamps, replayBinding). The custom pec: namespace exists ONLY for the
failed edges recorded in ontology.ttl: no public vocabulary expresses an
extinction invariant (cancelling a provider changes only capacity/latency/cost/
capability-set, never work-order identity) or a routing-totality obligation
over enabled providers. COMPOSITION: with packs/aloop-episode-ontology-pack
wired, a consumer dual-types its work orders (pec:WorkOrder alongside
aloop:WorkOrder) and the two gate sets compose over one graph; this pack
stands alone without it (zero cross-pack IRIs in gates/ or ontology.ttl).

Gates (violation-row SELECT: returning rows = refusal, FM-PACK-013):
010_no_provider_identity_in_workorder (provider names in WorkOrder/authority/
acceptance SEMANTIC literals -- title/description -- are violations; minted
identifiers are exempt, a recorded failed edge: the dogfood episode identifier
"ALOOP-ZCODE-DOGFOOD-001" embeds its bootstrap provider name because the
operator minted it pre-epoch, and an identifier is an upstream pointer, not
work semantics), 020_routing_totality (every
executable capability resolves to >= 1 enabled provider individual, else a
violation row naming it), 030_receipt_shape (an ExecutionReceipt missing any
of the 12 contract fields is a violation row). Anti-vacuity fixtures ship
under qualification/fixtures/ (neg-* must fire, pos-* must be clean).

Authority boundary: contract description and admission gates ONLY. NOT claimed:
any actuation authority (describing an ExecutionProvider does not authorize
one), provider selection POLICY (the gates enforce totality of routing, never
which provider wins), cancellation authority (pec:Cancellation DESCRIBES an
extinction event; executing one is outside this pack), or receipt validation
of provider-specific payloads (gate 030 checks the 12 contract fields,
nothing deeper). Consumers mint their own request/provider/receipt
individuals; this pack ships zero consumer individuals except the dogfood
provider/request/receipt triple named in ontology.ttl that witnesses the
gates clean.
"""
