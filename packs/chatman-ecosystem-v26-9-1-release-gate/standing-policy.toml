schema = "urn:chatman:ecosystem:standing-policy:v1"

[standing]
allowed = ["UNKNOWN", "PARTIAL_ALIVE", "ALIVE", "BLOCKED", "BUILD_BROKEN", "UNSUPPORTED"]
release_required = "ALIVE"
inspection_is_execution = false
workflow_is_execution = false
connector_object_is_mounted_tree = false

[refusal]
required_typed_refusals = [
  "REFUSED:AMBIENT_DO_AUTHORITY",
  "REFUSED:OBSERVATION_POSTCONDITION_DISAGREEMENT",
  "REFUSED:TAMPERED_RECEIPT",
  "REFUSED:REPLAY_DIVERGENCE",
  "REFUSED:EXACT_SUBJECT_MISMATCH",
]

[proof]
require_exact_subject = true
require_observed_execution = true
require_independent_observation = true
require_receipt_verification = true
require_ocel_correspondence = true
require_deterministic_replay = true
