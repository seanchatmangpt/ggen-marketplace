[pack]
name = "chatman-ecosystem-v26-9-1-release-gate"
version = "26.9.2"
description = "Manufactures the bounded Chatman Ecosystem v26.9.1 release gate: exact-subject admission, SELECT/CONSTRUCT/DO separation, BRCE consequence receipts, OCEL correspondence, deterministic replay, and cross-repository release standing. v26.9.2: fixed a role-vocabulary and subject-set defect where ontology.ttl declared a disjoint cer: standing/authority vocabulary instead of reusing chatman-ecosystem-release-pack's er: vocabulary, and release-manifest.example.toml named a 5-repo subject set (gymact, autofde-lab, process-intelligence, wasm4pm-compat, ggen) with role values (EXERCISE_DO_RECEIPT_REPLAY, SELECT_CONSTRUCT_REPLAN, ...) that shared zero terms with the real hub's ~/chatman-ecosystem/ecosystem.lock, which as observed 2026-08-16 pins 9 subjects under these exact roles: truex=receipt-reference (7da0500926ddd0374e91f6ab8d58244f6611fe4a), mcpp=capability-reference (9995559a9042806ba18cd8177b1f5dd4c064008b), wasm4pm=process-evidence (44f1bca8ff8cb05b1d8f5561c20c827e33d2b5fd), ferroplan=planner (282fae46a7cf4f71ab473e33b5f3fdb4d73433c9), mfw=oracle (e4fbda46f13d8213b86aa4f981d2387638983066), ggen=manufacturer (c36d72161b847b13555c24132819281f17e40e40), mfact=certifier (308384002a15b9946acbcd6f560c5819723d79dc), unrdf=semantic-admission (a7b5a907d029dbca1af1bc2734ef1f7fb981a98d), chatman-ecosystem=actuation-authority (14cfd7b01aac25b3271963378d07357eb0c55af6). ontology.ttl now subclasses er:Release and uses er:authorityClass/er:StandingState/er:AuthorityClass directly instead of a duplicate cer: vocabulary, and declares er:requiredRole values matching the lock's 9 roles exactly. release-manifest.example.toml now names those 9 real repositories under those 9 real roles, using er:Component-shaped fields (repository/ref/sha/role/disposition/standing/required/ref_check_mode) so a consumer manifest built from it is checkable by chatman-ecosystem-release-pack's own gates/*.rq. Exact commit SHAs remain REPLACE_WITH_EXACT_SHA placeholders and are not duplicated into marketplace source, per chatman-ecosystem-release-pack's stated law that exact release-instance identity is consumer-owned; ~/chatman-ecosystem/release/v26.9.1/manifest.toml, the hub's separate 16-component dependency-closure manifest with a broader role vocabulary (public-ontology, research, process-type-law, ...), is a related but distinct artifact this gate pack does not attempt to mirror — this fix targets the 9-subject/9-role ecosystem.lock vocabulary the gate pack's own G07 (ecosystem-release-verifier) gate is scoped to."
license = "MIT OR Apache-2.0"

[authority]
do_authority = false
claim_ceiling = "RELEASE_GATE_MANUFACTURE_ONLY"

[inputs]
required = [
  "release-manifest.toml",
  "standing-policy.toml",
]

[outputs]
files = [
  "generated/release-gate.md",
  "generated/release-verifier.json",
]

[law]
pipeline = "graph -> query -> ggen -> admission -> SELECT/CONSTRUCT -> GymAct BRCE DO -> independent observation -> receipt -> OCEL -> replay -> release standing"

[[law.invariants]]
id = "planner-authority-separation"
text = "Planner != Policy != Role != Agent != Authority"

[[law.invariants]]
id = "zero-unreceipted-actuation"
text = "All consequential DO paths cross BRCE and produce a receipt."

[[law.invariants]]
id = "generated-is-not-authorized"
text = "Generated artifacts, MCP calls, planner output, semantic derivation, and hooks have no ambient execution authority."

[[law.invariants]]
id = "exact-subject-standing"
text = "ALIVE requires observed execution against the exact admitted subject."

[[law.invariants]]
id = "replay-required"
text = "Release standing requires deterministic receipt verification and replay correspondence."

[[gate]]
id = "G01"
name = "architecture-freeze"
requires = ["canonical-pipeline", "authority-separation"]

[[gate]]
id = "G02"
name = "gymact-consolidation"
requires = ["single-release-subject", "no-duplicate-world-law"]

[[gate]]
id = "G03"
name = "brce-end-to-end"
requires = ["authority-refusal", "brce-do", "independent-observation", "receipt", "tamper-refusal", "replay"]

[[gate]]
id = "G04"
name = "autofde-to-gymact"
requires = ["select-construct-only", "authority-none-handoff", "independent-gymact-admission"]

[[gate]]
id = "G05"
name = "process-intelligence-feedback"
requires = ["ocel-correspondence", "observed-state-replanning"]

[[gate]]
id = "G06"
name = "gdmcp-deterministic-path"
requires = ["ontology-first-mcp", "known-class-zero-llm", "mcp-not-authority"]

[[gate]]
id = "G07"
name = "ecosystem-release-verifier"
requires = ["exact-repo-shas", "generated-digests", "receipt-dag", "fail-closed-standing"]

[[gate]]
id = "G08"
name = "fortune5-capstone"
requires = ["synthetic-enterprise-world", "authority-refusal", "receipted-consequence", "ocel", "replay", "replanning"]

[[gate]]
id = "G09"
name = "immutable-release"
requires = ["post-merge-execution", "tag-v26.9.1", "sbom", "checksums", "release-receipts", "clean-tag-replay"]
