[pack]
name = "chatman-ecosystem-v26-9-1-release-gate"
version = "26.9.3"
description = "DEPRECATED AS A REUSABLE RELEASE-LAW AUTHORITY. Compatibility release-instance/profile for Chatman Ecosystem v26.9.1, governed by chatman-ecosystem-release-pack as the canonical exact-SHA dependency-closed release ontology. This profile retains the v26.9.1 gate composition, standing policy, manifest fixture, SELECT/CONSTRUCT/DO separation, BRCE receipts, OCEL correspondence and replay requirements, but future release versions must be represented as consumer-owned release-instance facts/profiles under the generic release law rather than minting a new semantic pack per version."
license = "MIT OR Apache-2.0"

[authority]
do_authority = false
claim_ceiling = "RELEASE_GATE_MANUFACTURE_ONLY"

[inputs]
required = [
  "release-manifest.toml",
  "standing-policy.toml",
]

[outputs]
files = [
  "generated/release-gate.md",
  "generated/release-verifier.json",
]

[law]
pipeline = "graph -> query -> ggen -> admission -> SELECT/CONSTRUCT -> GymAct BRCE DO -> independent observation -> receipt -> OCEL -> replay -> release standing"

[[law.invariants]]
id = "planner-authority-separation"
text = "Planner != Policy != Role != Agent != Authority"

[[law.invariants]]
id = "zero-unreceipted-actuation"
text = "All consequential DO paths cross BRCE and produce a receipt."

[[law.invariants]]
id = "generated-is-not-authorized"
text = "Generated artifacts, MCP calls, planner output, semantic derivation, and hooks have no ambient execution authority."

[[law.invariants]]
id = "exact-subject-standing"
text = "ALIVE requires observed execution against the exact admitted subject."

[[law.invariants]]
id = "replay-required"
text = "Release standing requires deterministic receipt verification and replay correspondence."

[[gate]]
id = "G01"
name = "architecture-freeze"
requires = ["canonical-pipeline", "authority-separation"]

[[gate]]
id = "G02"
name = "gymact-consolidation"
requires = ["single-release-subject", "no-duplicate-world-law"]

[[gate]]
id = "G03"
name = "brce-end-to-end"
requires = ["authority-refusal", "brce-do", "independent-observation", "receipt", "tamper-refusal", "replay"]

[[gate]]
id = "G04"
name = "autofde-to-gymact"
requires = ["select-construct-only", "authority-none-handoff", "independent-gymact-admission"]

[[gate]]
id = "G05"
name = "process-intelligence-feedback"
requires = ["ocel-correspondence", "observed-state-replanning"]

[[gate]]
id = "G06"
name = "gdmcp-deterministic-path"
requires = ["ontology-first-mcp", "known-class-zero-llm", "mcp-not-authority"]

[[gate]]
id = "G07"
name = "ecosystem-release-verifier"
requires = ["exact-repo-shas", "generated-digests", "receipt-dag", "fail-closed-standing"]

[[gate]]
id = "G08"
name = "fortune5-capstone"
requires = ["synthetic-enterprise-world", "authority-refusal", "receipted-consequence", "ocel", "replay", "replanning"]

[[gate]]
id = "G09"
name = "immutable-release"
requires = ["post-merge-execution", "tag-v26.9.1", "sbom", "checksums", "release-receipts", "clean-tag-replay"]
