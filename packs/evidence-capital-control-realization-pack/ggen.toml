[project]
name = "evidence-capital-control-realization"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "control-realization-observation"
query = { inline = '''SELECT
  ("qualification-fixture" AS ?repo)
  ("0000000000000000000000000000000000000000" AS ?sha)
  ("qualification-fixture-decision" AS ?decision_id)
  ("DEFER" AS ?strategy)
  (0.0 AS ?predicted_gain)
  (0.0 AS ?realized_gain)
WHERE {}
ORDER BY ?repo ?sha ?decision_id ?strategy ?predicted_gain ?realized_gain
''' }
template = { file = "templates/control-realization-observation.json.tmpl" }
output_file = "generated/evidence-capital-control-realization/observation.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "control-realization-court"
query = { inline = '''SELECT
  ("0000000000000000000000000000000000000000" AS ?sha)
WHERE {}
ORDER BY ?sha
''' }
template = { file = "templates/control-realization-court.py.tmpl" }
output_file = "generated/evidence-capital-control-realization/qualification_court.py"
skip_empty = false
mode = "Overwrite"
