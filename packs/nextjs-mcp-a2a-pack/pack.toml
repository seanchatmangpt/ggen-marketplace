[pack]
name = "nextjs-mcp-a2a-pack"
version = "0.2.0"
description = """
Projects Next.js 16+ App Router typed-data modules for the Model Context
Protocol (MCP) and Agent-to-Agent (A2A) protocol: MCP tool registries and
agent fleet declarations, bounded by READ_ONLY/PROPOSAL authority law and
loopback-only endpoint law. Pure data projection: projected modules import
nothing; endpoints, execution harnesses, and self-play engines are
consumer-side.
"""

[consumer_contract]
# Projected artifacts are pure typed-data modules: zero npm imports, zero
# framework imports, zero side effects. runtime = none. The consumer supplies
# all individuals (McpTool, A2AAgent) in its own ontology graph and composes
# this pack via ggen.toml [packs]; gates run over the merged graph at sync.
runtime = []
peer_context = """
Consumer declares nma:McpTool and nma:A2AAgent individuals (with required
properties per gates/010 and gates/020) in its own RDF graph, then composes
this pack in ggen.toml [packs]. There is no runtime npm dependency: the two
projected .ts artifacts are self-contained exported const arrays of typed
objects, valid in any TypeScript project (strict mode included) with no
imports at all.

Projection surface is exactly two files:
- generated/mcp-registry.ts  (GENERATED_MCP_TOOLS)
- generated/a2a-fleet.ts     (GENERATED_A2A_FLEET)

Anything beyond data projection (route handlers, execution harnesses,
self-play engines) is consumer-side and out of scope for this pack.
"""

[capabilities]
provides = ["urn:ggen:pack:nextjs-mcp-a2a-pack"]
requires = []
