[project]
name = "nextjs-mcp-a2a-pack"
version = "0.1.0"

[ontology]
source = "ontology.ttl"

[[generation.rules]]
name = "mcp-registry"
query = { inline = """
PREFIX nma: <https://ggen.dev/packs/nextjs-mcp-a2a#>
SELECT ?toolName ?toolDescription ?authority ?inputSchemaJson WHERE {
  ?tool a nma:McpTool ;
        nma:toolName ?toolName ;
        nma:toolDescription ?toolDescription ;
        nma:authority ?authority ;
        nma:inputSchemaJson ?inputSchemaJson .
} ORDER BY ?toolName
""" }
template = { inline = """
// Generated by ggen nextjs-mcp-a2a-pack. Do not hand-edit.

export interface GeneratedMcpTool {
  name: string;
  description: string;
  authority: "READ_ONLY" | "PROPOSAL";
  inputSchema: Record<string, unknown>;
}

export const GENERATED_MCP_TOOLS: GeneratedMcpTool[] = [
{% for row in results %}  {
    name: "{{ row.toolName }}",
    description: "{{ row.toolDescription }}",
    authority: "{{ row.authority }}",
    inputSchema: {{ row.inputSchemaJson }},
  },
{% endfor %}];
""" }
output_file = "generated/mcp-registry.ts"
mode = "Overwrite"

[[generation.rules]]
name = "a2a-fleet"
query = { inline = """
PREFIX nma: <https://ggen.dev/packs/nextjs-mcp-a2a#>
SELECT ?agentId ?agentName ?role ?defaultModel ?personaPrompt WHERE {
  ?agent a nma:A2AAgent ;
         nma:agentId ?agentId ;
         nma:agentName ?agentName ;
         nma:role ?role ;
         nma:defaultModel ?defaultModel ;
         nma:personaPrompt ?personaPrompt .
} ORDER BY ?agentId
""" }
template = { inline = """
// Generated by ggen nextjs-mcp-a2a-pack. Do not hand-edit.

export interface GeneratedA2AAgent {
  id: string;
  name: string;
  role: string;
  defaultModel: string;
  personaPrompt: string;
}

export const GENERATED_A2A_FLEET: GeneratedA2AAgent[] = [
{% for row in results %}  {
    id: "{{ row.agentId }}",
    name: "{{ row.agentName }}",
    role: "{{ row.role }}",
    defaultModel: "{{ row.defaultModel }}",
    personaPrompt: {{ row.personaPrompt | json_encode | safe }},
  },
{% endfor %}];
""" }
output_file = "generated/a2a-fleet.ts"
mode = "Overwrite"
