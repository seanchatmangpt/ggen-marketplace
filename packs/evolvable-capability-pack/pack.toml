[pack]
name = "evolvable-capability-pack"
version = "0.1.0"
description = """
Ontology-backed manufacturing contract for evolve -> paired-evidence ->
admit -> release -> freeze -> select. The pack represents candidate,
admitted, released, and retired capability states; champion/candidate paired
evidence; promotion evidence; and immutable execution closures.

Public vocabulary is reused first: PROV-O carries artifact/activity lineage,
EARL carries court-result semantics, SKOS carries lifecycle concepts, and
DCTERMS carries identifiers/version metadata. The ecap namespace exists for
the failed edge public vocabularies do not express directly: promotion must
be backed by paired champion/candidate evidence, and deployment closure
membership is legal only for explicitly released capability versions.

Violation-row gates refuse promotion without paired evidence, released
capabilities without admission/release evidence, non-released closure
members, and closure/member identities lacking immutable digests.

This pack is CONSTRUCT-only. It creates semantic artifacts and gates; it
never grants runtime authority. SA2A/BRCE remains the execution authority
boundary.
"""
