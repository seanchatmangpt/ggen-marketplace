[pack]
name = "sa2a-bridge-pack"
version = "26.9.20"
description = "Marketplace-first XaaS outer-control-plane to autofde-lab SA2A (Semantic Agent-to-Agent) BEAM-port bridge with generated contract, edge catalog, proof, SHACL and test projections. Same edge-chain / proof-obligation / SHA-pinning shape as xaas-castle-bridge-pack, composed rather than reinvented, targeting autofde-lab's beam_port_bridge.py stdio JSON-lines port (five sa2a_* ops: validate/admit/plan/execute/replay) instead of a Rust BRCE binary."
