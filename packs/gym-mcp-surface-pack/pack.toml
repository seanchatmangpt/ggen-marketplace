[pack]
name = "gym-mcp-surface-pack"
version = "26.9.1"
description = "Gym-agnostic MCP tool-surface projection. Generalizes chatgptgym-gymact-bridge-pack's per-gym mcp_tool_schema.rs.tmpl: the tool-name namespace, descriptions, input schemas, replay safety, and the admission obligation are all graph facts, so one template projects any gym whose operation surface is expressed as sosa:Procedure with GymAct consequence classes. Carries no runtime actuation authority; consequential DO stays behind GymAct/BRCE admission, enforced by gates/010_mcp_authority_boundary.rq as a graph obligation rather than a pack-local name whitelist."
