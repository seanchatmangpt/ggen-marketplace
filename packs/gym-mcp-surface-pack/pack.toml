[pack]
name = "gym-mcp-surface-pack"
version = "26.9.30"
description = "Single MCP tool-surface kernel pack (v26.9.30 consolidation): gym-agnostic projection generalized from chatgptgym-gymact-bridge-pack's per-gym mcp_tool_schema.rs.tmpl — the tool-name namespace, descriptions, input schemas, replay safety, and the admission obligation are all graph facts, so one template set projects any gym whose operation surface is expressed as sosa:Procedure with GymAct consequence classes. Absorbs ggen-ecosystem-mcp-surface-pack and autofde-lab-mcp-surface-pack, whose shape/gate/templates were byte-identical: one kernel copy each of shapes/mcp_surface.shacl.ttl, gates/010_mcp_authority_boundary.rq, templates/mcp_tool_surface.rs.tmpl (owns src/mcp_tool_surface.rs) and templates/mcp_tools_list.json.tmpl (owns mcp/tools_list.json); the two derived instance surfaces live on as family modules ontology/ggen-ecosystem.ttl and ontology/autofde-lab.ttl (referencing the kernel vocabulary by IRI literal, no import), with their derivation scripts in families/ and per-family regeneration cadence (ggen: live-introspect; autofde-lab: curated) documented in families/*.md and README.md. One rendering graph holds exactly one urn:gymmcp:McpServer — the gate refuses two, and qualification/verify.py proves the union guard fires so modules never merge into the kernel graph. Carries no runtime actuation authority; consequential DO stays behind GymAct/BRCE admission, enforced by the gate as a graph obligation rather than a pack-local name whitelist."
