[project]
name = "strata-ledger-pack"
version = "0.1.0"
description = "Strata ledger state machine: account state transition fn with conservation, double-spend valve refusal, overflow refusal, and receipt chaining projected from RDF (roadmap slice S4)"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
lg = "https://strata.chatman.ai/ontology/ledger#"

[validation]
gates = [
  "gates/010_ledger_layout.rq",
  "gates/020_transition_law.rq",
  "gates/030_ocel_conformance.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "ledger-consts"
query = { file = "queries/ledger_constants.rq" }
template = { file = "templates/ledger_consts.rs.tera" }
output_file = "ledger_consts.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "ledger-state"
query = { file = "queries/ledger_constants.rq" }
template = { file = "templates/ledger_state.rs.tera" }
output_file = "ledger_state.rs"
skip_empty = false
mode = "Overwrite"
