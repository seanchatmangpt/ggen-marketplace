[pack]
name = "evidence-capability-pack"
version = "0.1.0"
description = """
Evidence/provenance family of the v26.9.30 qualified capability ecology (lane 7). Pinned
capability identities Evidence.Establish, Evidence.Bind, Receipt.Sign, Provenance.Record in
namespace https://ggen.dev/ontology/evidence-capability#, modeled as semantic contracts with
qualified realizations, never as implementations.

Core law encoded as gates, not prose: a receipt is a receipt only when it carries all five
fields — identity, authority, consequence, replay, standing — and a claim that an artifact is
a receipt is refused when any field is missing; evidence is admissible only when bound to an
exact subject by SHA-256 digest (unbound evidence is refused); standing is derived from a
result and bound to the exact input digest, never stored, and admission alone never yields
ALIVE. Receipts and replay receipts are REUSED from packs/qualified-capability-ecology-pack
(qce:QualificationReceipt, qce:ReplayReceipt and their digest properties) rather than
redefined; standing uses the public APS individuals.

Realizations carry provider metadata (repo, module, source file, version-pin policy) and
qualification conditions only. Inspected read-only this session: ash_affidavit 26.9.30
(lib/ash_affidavit.ex, change/receipt.ex, refusal.ex, type/chain_hash.ex,
priv/affidavit/capability-registry.json) and ash_graphlaw 26.9.30 (lib/ash_graphlaw/evidence.ex,
receipt.ex, standing.ex). Consumers resolve against dcterms:identifier literals; this pack
grants no execution authority and is SELECT/CONSTRUCT-only.
"""
