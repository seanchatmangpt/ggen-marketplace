[pack]
name = "platform-eng-ch04"
version = "0.1.0"
description = "Chapter 4 ('Observability from Day One') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch04' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. This directory contains comprehensive, production-ready examples for implementing observability in platform engineering using OpenTelemetry, Prometheus, Grafana, and Jaeger. The code demonstrates the three pillars of observability (metrics, logs, traces), integrates with the OTEL Collector, and shows how to build persona-specific dashboards and observability-driven deployment practices."
