[pack]
name = "a2a-hex-migration-pack"
version = "0.1.0"
description = """
Capitalized, regenerable migration from the standalone {:a2a, "~> 0.2"} hex
package (a2a 0.3.0 lineage) onto ash_a2a v26.10.3's vendored protocol surface
(AshA2A.Protocol.* under lib/ash_a2a/protocol/; the :a2a package is no longer
needed).

The single authority is ash_a2a's migration guide
(docs/how-to/migrate-from-a2a-hex.md, grep-verified against
lib/ash_a2a/protocol/* on the 26.10.3 tree). This pack is a projection of that
guide: ontology individuals cite the guide's sections and grounding lines; the
generated mix task applies the guide's 9 verified literal mappings, prints the
guide's 4 wire-shape deltas as a checklist, and runs the guide's section-7
sweep as its own pass gate (zero A2A. refs, zero {:a2a, ...} deps).

Consumer class (guide header): xaas (ash_a2a git ref 3325032... + {:a2a,
"~> 0.2"}, /Users/sac/xaas/mix.exs:103-111) and ggen_igniter ({:ash_a2a,
"~> 26.9"}, mix.exs:271; installer assertion at
test/ggen_igniter_semantic_a2a_manufacture_test.exs:66).

Format reference: ash-extension-pack (dual-branch Igniter/plain Mix.Task
installer shape, gate = violation-returning SPARQL, template frontmatter with
for_each/sparql).
"""
