[project]
name = "dfcm-selection-frontier-execution-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[validation]
gates = ["gates/authority.rq", "gates/exact-subject.rq", "gates/frontier-evidence.rq"]

[generation]
output_dir = "."

[[generation.rules]]
name = "pareto-frontier"
query = { file = "queries/pareto-frontier.rq" }
template = { file = "templates/pareto-frontier.md.tmpl" }
output_file = "generated/PARETO_FRONTIER.md"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "decisive-experiment"
query = { file = "queries/decisive-experiment.rq" }
template = { file = "templates/decisive-experiment.md.tmpl" }
output_file = "generated/DECISIVE_EXPERIMENTS.md"
skip_empty = true
mode = "Overwrite"
