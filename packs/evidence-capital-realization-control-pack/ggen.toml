[project]
name = "evidence-capital-realization-control"
version = "0.1.0"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "control-receipt"
query = { inline = '''SELECT
  ("qualification-fixture-subject" AS ?subject)
  ("qualification-fixture-ggen" AS ?ggen)
  ("DEFER" AS ?selection)
  ("qualification-fixture-standing" AS ?standing)
WHERE {}
ORDER BY ?subject ?ggen ?selection ?standing
''' }
template = { file = "templates/control-receipt.json.tmpl" }
output_file = "generated/control-receipt.json"
skip_empty = false
mode = "Overwrite"
