[pack]
name = "clap-noun-verb-autonomic-pack"
version = "1.0.0"
description = "Generates clap-noun-verb's own Autonomic Layer (src/autonomic.rs: Effects, Guards, and a hash-chained Receipt ledger) from an admitted cnv-autonomic:Config individual, so the framework's own source is manufactured the same way it manufactures consumer CLIs -- no hand-authored src/autonomic.rs in the consuming repo. The env var name, default ledger path, and fallback file name are the real parametrized knobs; the Effect/Guard/Receipt logic itself is fixed framework behavior rendered verbatim by the template (the same relationship clap-noun-verb-crate-pack has to a generated main.rs: the template is the compiler, not hand-typed output). Composes no other pack -- this vocabulary is self-contained and does not extend cnv:Cli/cnv:Command."
