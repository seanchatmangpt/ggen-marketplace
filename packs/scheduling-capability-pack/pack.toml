[pack]
name = "scheduling-capability-pack"
version = "0.1.0"
description = """
Qualified capability contracts for the scheduling family:
Schedule.At, Schedule.Cron, Schedule.Delay (plus minted sibling
Schedule.Interval).

A capability here is a semantic identity carrying temporal semantics
(one-shot vs recurring, timezone anchoring, missed-fire policy
catch_up/skip/drop), typed outcomes, evidence and authority requirements.
A realization is a qualified provider binding (hex oban 2.24.1, hex
quantum 3.5.3, OTP timer) carrying provider metadata and qualification
conditions. CAPABILITY != IMPLEMENTATION. Precondition encoded as law:
Schedule.At on a consequential target requires bound authority.

Composes the qce: qualified-capability-ecology vocabulary and the public
prov/earl/dcterms/skos sets. All gates are violation-row SELECTs: rows
mean refusal. SELECT/CONSTRUCT only; grants no DO authority; BRCE remains
the sole consequential actuation boundary.
"""
