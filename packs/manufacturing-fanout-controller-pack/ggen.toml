[project]
name = "manufacturing-fanout-controller-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "fanout-plan"
query = { file = "queries/30-high-y-frontier.rq" }
template = { file = "templates/fanout-plan.json.tera" }
output_file = "generated/fanout/plan.json"

[[generation.rules]]
name = "fanout-court"
query = { file = "queries/30-high-y-frontier.rq" }
template = { file = "templates/fanout-court.py.tera" }
output_file = "generated/fanout/qualification_court.py"
