[pack]
name = "gymact-capability-schema-pack"
version = "0.1.0"
description = "v0.1.0: closes gymact's payload-schema gap named in ~/.claude/plans/how-do-we-use-jolly-tarjan.md #2 -- today `Capability.title` (~/gymact/src/gymact/providers.py) folds a DO capability's actuate() payload shape into free text (e.g. 'Payload: {\"key\": <str>, \"amount\": <number, default 1>}.'), because nothing in gymact's admitted RDF/SHACL profile (~/gymact/src/gymact/semantic.py, ProfileAuthority.validate_capabilities, profile.shacl.ttl's <urn:gymact:shape:capability> shape) describes a capability's payload, only its identity (dct:title/dct:type). Schema-only pack (github-actions-pack v0.2.0 / dspy-pack contract): ontology.ttl ships ZERO gcs:CapabilityPayloadShape individuals; a consumer (gymact) supplies real ones in its own instance-data .ttl. Follows gymact's own semantic-authority rule (ProfileAuthority._custom_tbox_terms refuses a competing urn:gymact:-prefixed custom TBox) by reusing SHACL's sh:NodeShape/sh:PropertyShape/sh:property/sh:path/sh:datatype/sh:minCount/sh:maxCount/sh:name/sh:description/sh:defaultValue/sh:closed and gymact's already-admitted sosa:Procedure verbatim -- a payload shape IS structurally what SHACL property shapes already are, so nothing there is reinvented. Only two new gcs: terms are minted, because no standard predicate covers either relation: gcs:CapabilityPayloadShape (rdfs:subClassOf sh:NodeShape, prov:Entity -- prov:Entity reused from gymact's own <urn:gymact:profile:v26.8.7> a prof:Profile, prov:Entity pattern) names the ROLE a NodeShape plays; gcs:payloadShapeOf links it to the sosa:Procedure it constrains (SHACL's four target-declaration predicates all mean 'shape validates properties reached FROM this node', the wrong relation for a runtime payload dict passed ALONGSIDE actuate(), not stored ON the capability resource). qudt:hasUnit is documented as an available real optional annotation for physical-quantity payload fields, not fabricated into the worked example since gymact's real MemoryProvider payloads are unitless. templates/capability_payloads.py.tmpl (self-contained to:/sparql: frontmatter, no for_each -- one output file aggregating every shape row, same single-file multi-row-aggregation shape as star-toml-pack's star_toml_config.rs.tmpl) renders one Pydantic v2 BaseModel per gcs:CapabilityPayloadShape, mapping sh:datatype xsd: IRIs to Python types (string/anyURI->str, integer->int, double/decimal/float->float, boolean->bool, dateTime->datetime, else Any) and sh:minCount>=1 to a required field vs Optional-with-default otherwise -- never a template-hardcoded field type. gates/010_required.rq refuses (a) a Consequence.DO sosa:Procedure with no gcs:CapabilityPayloadShape naming it via gcs:payloadShapeOf, (b) a gcs:CapabilityPayloadShape with zero sh:property, (c) a gcs:CapabilityPayloadShape with no gcs:payloadShapeOf target; a Consequence.READ capability is correctly NOT required to declare one (observe()/checkpoint() take no payload). Verified end-to-end against a real isolated consumer (ggen 26.8.8, outside this repo, not assumed): facts.ttl declaring gymact's real MemoryProvider.increment capability (urn:gymact:memory:capability:increment) plus a real gcs:CapabilityPayloadShape synced cleanly and rendered gymact_capability_payloads.py containing IncrementPayload(BaseModel) with key: str (required) and amount: float | None = 1 (optional, real default) -- confirmed via ast.parse, python3 -m py_compile, and a real pydantic 2.12.5 import: instantiation with/without amount, ValidationError on a missing key, ValidationError on an unknown field (extra='forbid'). A second consumer with a real DO capability (urn:gymact:memory:capability:delete) and no payload shape was REFUSED by the gate at ggen sync run time ([FM-PACK-013], first row { ?missing = gcs:payloadShapeOf, ?s = urn:gymact:memory:capability:delete }). A third consumer with a real READ capability (urn:gymact:memory:capability:observe) and no payload shape synced cleanly, confirming no false positive. Re-running sync against the first consumer with no ontology change produced written:[]/skipped:[...], confirming idempotency. Known, disclosed v0.1.0 scope limits (not hidden): every generated field is single-valued regardless of sh:maxCount > 1 (list-valued payload fields not yet projected); sh:defaultValue is quoted for xsd:string/xsd:anyURI and emitted bare otherwise, not specially cased for xsd:boolean (Python needs True/False, not true/false) -- neither gap is exercised by gymact's real current capabilities, named here for a future consumer to extend rather than assume covered."
