[pack]
name = "process-intelligence-pack"
version = "26.9.12"
description = """
Canonical vocabulary and worked example for event/object observation, process
models, conformance checking, lifecycle reconstruction, and drift analysis.
Instantiates real individuals for an Event, an Object, a ProcessModel derived
from two or more Events, a ConformanceCheck comparing observed Events against
the model, and a Drift individual when the observed behavior diverges from
the model. Refuses (gates/010_conformance_requires_compared_event.rq) any
ConformanceCheck asserted as pi:conformant without at least one pi:comparesEvent
link to a real pi:Event.
"""
