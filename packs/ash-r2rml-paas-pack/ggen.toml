[project]
name = "ash-r2rml-paas"
version = "26.8.27"
description = "Manufacture a provider-neutral Ash/AshR2RML/Reactor PaaS kernel from admitted public semantics"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatmangpt.com/ontology/ash-r2rml-paas#"
imports = []

[ontology.prefixes]
paas = "https://chatmangpt.com/ontology/ash-r2rml-paas#"
cv = "https://chatmangpt.com/ontology/challenger-value#"
schema = "https://schema.org/"
prov = "http://www.w3.org/ns/prov#"
dcat = "http://www.w3.org/ns/dcat#"
dcterms = "http://purl.org/dc/terms/"
odrl = "http://www.w3.org/ns/odrl/2/"
qudt = "http://qudt.org/schema/qudt/"
skos = "http://www.w3.org/2004/02/skos/core#"
sh = "http://www.w3.org/ns/shacl#"
rr = "http://www.w3.org/ns/r2rml#"

[validation]
gates = ["gates/invalid-paas-model.rq"]

[generation]
output_dir = "."

[[generation.rules]]
name = "mix-project"
query = { file = "queries/platform.rq" }
template = { file = "templates/mix.exs.tmpl" }
output_file = "consumer/paas/mix.exs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "paas-runtime"
query = { file = "queries/platform.rq" }
template = { file = "templates/lib/paas.ex.tmpl" }
output_file = "consumer/paas/lib/paas.ex"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "paas-court"
query = { file = "queries/platform.rq" }
template = { file = "templates/test/paas_test.exs.tmpl" }
output_file = "consumer/paas/test/paas_test.exs"
skip_empty = false
mode = "Overwrite"
