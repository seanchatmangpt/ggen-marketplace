[pack]
name = "soc2-readiness-pack"
version = "0.2.0"
description = """SOC 2 readiness BINDER for real consumer projects: a combinatorial cross-product of every AICPA Trust Services criterion (all 5 categories, 28 leaf criteria -- CC1-CC9 Security, A1.1-1.3 Availability, C1.1-1.2 Confidentiality, PI1.1-1.5 Processing Integrity, P1-P8 Privacy) against every readiness dimension, rendered as one visible row per criterion whether or not the consumer has supplied evidence yet -- gaps are seen, not omitted. 9 generated documents: 00 index with real SPARQL-computed coverage stats, 01 system description, 02 management's own draft assertion, 03 the full 28-criterion control matrix, 04 flat evidence inventory, 05 the CPA firm's own side (rehearsed test procedures/results mirroring a real report's Section 4), 06 all 10 engagement phases in order, 07 exception log with risk levels and remediation tracking, 08 subservice organizations and complementary user-entity controls. Reuses the same verified, public AICPA TSC vocabulary (SKOS/PROV/ORG/DCMI, no private namespace) soc2-audit-pack established for its PDDL case study, extended here to the full taxonomy and made self-contained. COMPLIANCE-OVERCLAIM FENCE, enforced structurally not just documented: gates/010_no_compliance_verdict.rq refuses any fact on a prov:Entity, prov:Activity, org:Organization, or dcterms:Standard subject asserting compliance/certification/attestation/a rendered auditor opinion -- verified against a real adversarial fact in a real ggen sync run, not just written and trusted. We cannot self-certify, but we can model the auditor's process and results exactly: every document models what a real Type II report's Sections 3-4 would contain; Section 1 (the auditor's actual opinion) is the one section named, explained, and left structurally blank in every generated document that would otherwise carry it."""
