[pack]
name = "frozen-duckdb-pack"
version = "0.1.1"
description = "frozen-duckdb domain laws as marketplace facts: the consumer crate version mirrors the bundled upstream DuckDB engine release, and the upstream duckdb-rs crate encodes the engine as MAJOR.(MAJOR*10000+MINOR*100+PATCH).0 (1.10505.0 <-> DuckDB 1.5.5); release assets are libduckdb_{arch}.{dylib|so} matching ensure_binary() download URLs, with macOS assets universal (arm64+x86_64) since DuckDB 1.5.x; every acquisition path normalizes ~/.frozen-duckdb/cache/v{version}-{arch}/ (pinned headers under duckdb/, plain libduckdb.{dylib,so} link name beside the arch-suffixed binary); DOCS_RS=1 builds generate bindings from vendored headers and skip library linking and rpath emission; DuckDB >= 1.5 dylibs carry the neutral install name @rpath/libduckdb.dylib so consumers embed -Wl,-rpath,{lib_dir} at link time and compatibility symlinks (libduckdb.dylib/.1.dylib/.1.4.dylib) keep older loaders working. Wave-4/5 ggen-composition laws: on the declarative ggen 26.8.18 schema packs bind through [ontology].imports (absolute paths, tilde not expanded) while [[ontology.pack]] is refused (FM-CONFIG-003), [packs] is schema-ambiguous (FM-CONFIG-101) and pack frontmatter templates do not auto-bind; every rendered file is owned by exactly one generation rule and hand-unioned blocks are clobbered by the next sync; source fact files are single-writer per concern (TTL has no 3-way merge -- multi-writer unions drop sibling fact blocks, the FM-GEN-008 TEMPLATE_VARIABLE_MISSING class); ggen receipt state (.ggen/, .ggen-v2/) is untracked runtime state under the secrets law, BLAKE3-chained and signed, validated by ggen receipt verify. Projects these laws into a consumer-facing law reference and a frozen-duckdb-sys build.rs consequence; SPARQL gates verify law completeness, evidence-anchor resolvability, the version-encoding arithmetic and config-form statuses (operative/refused with FM- error-code anchors), and an executable structural gate checks pack/fixture shape, asset naming, version pins, cache layout, rendered-consequence ownership, receipt runtime state and single-writer fact files."
