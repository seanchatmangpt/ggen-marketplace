[pack]
name = "frozen-duckdb-pack"
version = "0.1.0"
description = "frozen-duckdb domain laws as marketplace facts: the consumer crate version mirrors the bundled upstream DuckDB engine release, and the upstream duckdb-rs crate encodes the engine as MAJOR.(MAJOR*10000+MINOR*100+PATCH).0 (1.10505.0 <-> DuckDB 1.5.5); release assets are libduckdb_{arch}.{dylib|so} matching ensure_binary() download URLs, with macOS assets universal (arm64+x86_64) since DuckDB 1.5.x; every acquisition path normalizes ~/.frozen-duckdb/cache/v{version}-{arch}/ (pinned headers under duckdb/, plain libduckdb.{dylib,so} link name beside the arch-suffixed binary); DOCS_RS=1 builds generate bindings from vendored headers and skip library linking and rpath emission; DuckDB >= 1.5 dylibs carry the neutral install name @rpath/libduckdb.dylib so consumers embed -Wl,-rpath,{lib_dir} at link time and compatibility symlinks (libduckdb.dylib/.1.dylib/.1.4.dylib) keep older loaders working. Projects these laws into a consumer-facing law reference and a frozen-duckdb-sys build.rs consequence; SPARQL gates verify law completeness, evidence-anchor resolvability and the version-encoding arithmetic, and an executable structural gate checks pack/fixture shape, asset naming and version pins."
