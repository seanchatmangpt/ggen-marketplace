[pack]
name = "cnv-any-manifest-pack"
version = "1.0.0"
description = "Generates a clap-noun-verb-any manifest (cnv-any.json, the exact clap_noun_verb_deploy::CliSchema JSON shape) from the same admitted cnv:Cli/cnv:Noun/cnv:Command/cnv:Argument RDF graph clap-noun-verb-crate-pack/-routing-pack already compile into a real Rust CLI. Composes clap-noun-verb-schema-pack for vocabulary and every admission gate unchanged -- this pack adds no new classes, properties, or gates, only one new projection of the same law. Every cnv:Command in a graph feeding this pack must carry cnv:CustomBehavior (the existing, explicit, non-generative escape-hatch behavior kind) since the command's real behavior lives in the wrapped foreign executable, not in generated Rust -- this pack never emits Rust source, only the schema manifest an external process is admitted to be invoked through."
