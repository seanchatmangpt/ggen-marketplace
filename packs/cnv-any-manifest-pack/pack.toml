[pack]
name = "cnv-any-manifest-pack"
version = "1.0.0"
description = "Generates a clap-noun-verb-any manifest (cnv-any.json, the exact clap_noun_verb_deploy::CliSchema JSON shape) from the same admitted cnv:Cli/cnv:Noun/cnv:Command/cnv:Argument RDF graph clap-noun-verb-crate-pack/-routing-pack already compile into a real Rust CLI. Composes clap-noun-verb-schema-pack for vocabulary and every admission gate unchanged -- this pack adds no new classes, properties, or gates, only one new projection of the same law. The projection is behavior-agnostic (it only reads name/about/argument shape, never cnv:hasBehavior) so it accepts a graph describing a truly external target (conventionally marked cnv:CustomBehavior, since the real behavior lives in the wrapped foreign executable) as well as a graph that also compiles to a real generated Rust CLI via the other packs -- this pack never emits Rust source, only the schema manifest an executable is admitted to be invoked through."
