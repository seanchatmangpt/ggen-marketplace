[pack]
name = "platform-eng-ch12"
version = "0.1.0"
description = "Chapter 12 ('Cost Optimization (FinOps)') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch12' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. This chapter addresses one of the most critical challenges in platform engineering: understanding and optimizing the cost of running Kubernetes infrastructure without sacrificing performance or scalability. You'll learn how to make the tradeoffs between these three concerns explicit and defensible through FinOps practices, cost observability, autoscaling strategies, and cost governance."
