version: "1.0.0"
title: "Pack Qualification & Verification Loop"
description: "Execute Chicago-style qualification courts, check SPARQL gates, and verify deterministic projection."
instructions: |
  Run marketplace.py validate, execute pytest test courts, and audit byte-reproducibility. Target scope: current_workspace by default; override per invocation.
prompt: |
  Validate pack admission, execute gates with fail-witnesses, and inspect receipt chains.
# The goose v1.53.0 recipe schema rejects extra parameter definitions
# ("Unnecessary parameter definitions: target_scope"); the target-scope
# semantics this param used to carry live in `instructions` below.
activities:
  - "message: Ready to run recipe Pack Qualification & Verification Loop"
  - "Execute default task"
  - "Run verification suite"
extensions:
  - type: builtin
    name: developer
    bundled: true
    timeout: 300
retry:
  max_retries: 3
  timeout_seconds: 60
  checks:
    - type: shell
      command: "git status"
