version: "1.0.0"
title: "Pack Qualification & Verification Loop"
description: "Execute Chicago-style qualification courts, check SPARQL gates, and verify deterministic projection."
instructions: |
  Run marketplace.py validate, execute pytest test courts, and audit byte-reproducibility.
prompt: |
  Validate pack admission, execute gates with fail-witnesses, and inspect receipt chains.
parameters:
  - key: target_scope
    input_type: string
    requirement: optional
    default: "current_workspace"
    description: "Target directory or module scope"
activities:
  - "message: Ready to run recipe Pack Qualification & Verification Loop"
  - "Execute default task"
  - "Run verification suite"
extensions:
  - type: builtin
    name: developer
    bundled: true
    timeout: 300
retry:
  max_retries: 3
  timeout_seconds: 60
  checks:
    - type: shell
      command: "git status"