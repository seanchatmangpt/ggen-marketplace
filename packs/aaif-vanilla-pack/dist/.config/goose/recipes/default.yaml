version: "1.0.0"
title: "Formal Decision Solve Loop"
description: "Match a scikit-decide solver to a registered domain and run a bounded rollout via the autofde MCP tools."
instructions: |
  Call decision_catalog, then decision_match, then decision_solve; report standing and receipt_sha256. Target scope: current_workspace by default; override per invocation.
prompt: |
  Solve the requested decision domain and report the receipt.
# The goose v1.53.0 recipe schema rejects extra parameter definitions
# ("Unnecessary parameter definitions: target_scope"); the target-scope
# semantics this param used to carry live in `instructions` below.
activities:
  - "message: Ready to run recipe Formal Decision Solve Loop"
  - "Execute default task"
  - "Run verification suite"
extensions:
  - type: builtin
    name: developer
    bundled: true
    timeout: 300
retry:
  max_retries: 3
  timeout_seconds: 60
  checks:
    - type: shell
      command: "git status"
