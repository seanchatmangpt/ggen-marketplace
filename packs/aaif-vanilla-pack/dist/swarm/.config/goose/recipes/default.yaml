version: "1.0.0"
title: "Swarm Multi-Agent Coordination Loop"
description: "Coordinate qualification and projection passes across the agent swarm."
instructions: |
  Coordinator receives request on {{target_scope}}, delegates qualification to qualifier, delegates synthesis to projector.
prompt: |
  Execute full swarm loop with receipts.
parameters:
  - key: target_scope
    input_type: string
    requirement: optional
    default: "current_workspace"
    description: "Target directory or module scope"
activities:
  - "message: Ready to run recipe Swarm Multi-Agent Coordination Loop"
  - "Execute default task"
  - "Run verification suite"
extensions:
  - type: builtin
    name: developer
    bundled: true
    timeout: 300
retry:
  max_retries: 3
  timeout_seconds: 60
  checks:
    - type: shell
      command: "git status"