[pack]
name = "aaif-vanilla-pack"
version = "0.1.0"
description = """
Vanilla configuration pack for the Agentic AI Foundation (AAIF) standards suite:
- A2A Protocol (.well-known/agent.json per a2a-protocol.org)
- Model Context Protocol (mcp_servers.json per modelcontextprotocol.io)
- Agentgateway (config.json per agentgateway/agentgateway)
- Agent Router / Envoy AI Gateway (Kubernetes CRDs per theagentrouter/agent-router)
- Goose agent client (config.yaml per aaif-goose/goose)
- AGENTS.md open specification
"""
