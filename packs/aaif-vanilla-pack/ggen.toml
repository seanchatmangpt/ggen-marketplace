# ggen generation contract for aaif-vanilla-pack.
#
# DeclarativeRules schema: each [[generation.rules]] binds one SPARQL SELECT
# (queries/*.rq) to one template (templates/*.tmpl) and projects it to the
# exact output path the legacy render_aaif_pack.py frontmatter targeted.
# No [templates] section: mixing DeclarativeRules with template-dir markers is
# refused by ggen (FM-GEN-002 class).

[project]
name = "aaif-vanilla-pack"
version = "0.3.0"

[ontology]
source = "ontology.ttl"
imports = ["fixtures/marketplace_agent.ttl"]

[generation]
output_dir = "dist"

# A2A agent card -> .well-known/agent.json
[[generation.rules]]
name = "a2a_agent_card"
mode = "Overwrite"
query = { file = "queries/a2a_agent_card.rq" }
template = { file = "templates/a2a_agent_card.json.tmpl" }
output_file = ".well-known/agent.json"

# Agent Router / Envoy AI Gateway CRDs -> k8s/agent-router.yaml
[[generation.rules]]
name = "agent_router_crds"
mode = "Overwrite"
query = { file = "queries/agent_router_crds.rq" }
template = { file = "templates/agent_router_crds.yaml.tmpl" }
output_file = "k8s/agent-router.yaml"

# Agentgateway L7 proxy config -> agentgateway/config.json
[[generation.rules]]
name = "agentgateway_config"
mode = "Overwrite"
query = { file = "queries/agentgateway_config.rq" }
template = { file = "templates/agentgateway_config.json.tmpl" }
output_file = "agentgateway/config.json"

# Repository guidelines -> AGENTS.md
[[generation.rules]]
name = "agents_md"
mode = "Overwrite"
query = { file = "queries/agents_md.rq" }
template = { file = "templates/AGENTS.md.tmpl" }
output_file = "AGENTS.md"

# Goose client config -> .config/goose/config.yaml
[[generation.rules]]
name = "goose_config"
mode = "Overwrite"
query = { file = "queries/goose_config.rq" }
template = { file = "templates/goose_config.yaml.tmpl" }
output_file = ".config/goose/config.yaml"

# Goose project hints -> .goosehints
[[generation.rules]]
name = "goose_hints"
mode = "Overwrite"
query = { file = "queries/goose_hints.rq" }
template = { file = "templates/goose_hints.tmpl" }
output_file = ".goosehints"

# Goose recipe -> .config/goose/recipes/default.yaml
[[generation.rules]]
name = "goose_recipe"
mode = "Overwrite"
query = { file = "queries/goose_recipe.rq" }
template = { file = "templates/goose_recipe.yaml.tmpl" }
output_file = ".config/goose/recipes/default.yaml"

# MCP server bindings -> mcp/mcp_servers.json
[[generation.rules]]
name = "mcp_servers"
mode = "Overwrite"
query = { file = "queries/mcp_servers.rq" }
template = { file = "templates/mcp_servers.json.tmpl" }
output_file = "mcp/mcp_servers.json"

[validation]
# ggen 26.9.28 does not expand globs in [validation].gates at config-validation
# time (FM-CONFIG-003 treats the glob as a literal path), so list the gates
# explicitly, sorted.
gates = [
  "gates/010_agent_required_properties.rq",
  "gates/020_gateway_binds.rq",
  "gates/030_router_backends.rq",
  "gates/040_swarm_topology.rq",
  "gates/050_swarm_member_roles.rq",
  "gates/060_agent_security_schemes.rq",
  "gates/070_envelope_defense_policy.rq",
  "gates/080_skill_attestation_contract.rq",
  "gates/090_agent_passport_monotonic_delegation.rq",
  "gates/100_trace_compliance_attestation.rq",
  "gates/110_bidi_streaming_steering_contract.rq",
  "gates/120_unified_ash_autofde_runtime.rq",
  "gates/130_spiffe_authzen_identity.rq",
  "gates/140_inline_dlp_residency.rq",
  "gates/150_sre_graceful_drain.rq",
  "gates/160_affidavit_post_quantum_seal.rq",
  "gates/170_cmek_encryption_policy.rq",
  "gates/180_finops_budget_guardrail.rq",
  "gates/190_siem_telemetry_egress.rq",
]
