[pack]
name = "control-plane-invariants-pack"
version = "26.9.1"
description = """
Reusable manufacturing capital for a multi-agent control plane's own
integrity. Makes `ggen sync run` refuse when: a ctrl:SubjectReceipt shows an
agent's real observed subject did not match what it claimed to be working
on; a ctrl:Claim was asserted with no matching verdict fact (an unverified
claim treated as standing); two ctrl:BuildLease individuals collide on the
same resourceKey while both unreleased; a ctrl:RetryAttempt after the first
recorded no change from the previous attempt (the UnchangedRetryGym
defect); a ctrl:WorkQueueItem was crowned ctrl:status ALIVE with no
ctrl:Claim backing it; a ctrl:Claim verdict REFUTED left its parent
ctrl:WorkQueueItem still ALIVE; a ctrl:SubjectResolutionCheck declared
ACTUALLY_UNRESOLVABLE with no real remote check behind it; a
ctrl:DependencyLockCheck reported PASS while its staleEntryCount was
nonzero (declared/locked dependency presence treated as proof of
actually-materialized dependency state); or a ctrl:ProductionReference
pointed at a ctrl:ScopedComponent whose declaredScope is DEV_ONLY or
TEST_ONLY (a dev/test-only component leaking into a production build/
projection).

Consumer contract: an orchestrator (a Workflow script, a fleet dispatcher)
authors ctrl:WorkQueueItem, ctrl:ClaimsManifest, and PLAN ctrl:Claim facts
(claimId/claimText/evidenceCommand/forItem) in its own ontology source,
wires this pack in [packs], has every dispatched agent run
scripts/subject-receipt.sh as its mandatory first action, runs
scripts/claims-verify.sh to execute each unverdicted claim's
evidenceCommand for real and record its verdict, and records
ctrl:BuildLease / ctrl:RetryAttempt facts as leases are acquired/released
and retries are dispatched. `ggen sync run` refuses on any of the nine
invariants above; once green it renders CONTROL_REPORT.md from the
admitted plan + evidence facts.
"""
