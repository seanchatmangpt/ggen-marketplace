[pack]
name = "projection-matrix-pack"
version = "0.1.0"
description = "Subject-independent N×N semantic projection manufacturing"

[[generation]]
name = "consumer-manifest"
query = "queries/projection-matrix.rq"
template = "templates/consumer-manifest.toml.tera"
target = "{{ targetPath }}/ggen.projection.toml"

[[generation]]
name = "binding"
query = "queries/projection-matrix.rq"
template = "templates/binding.ttl.tera"
target = "{{ targetPath }}/projection.binding.ttl"
