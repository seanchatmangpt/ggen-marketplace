[pack]
name = "sa2a-umbrella-pack"
version = "0.1.0"
description = """
UmbrellaPack: a stable consumer entry point that names the sa2a-* pack family
and a2a-conformance-pack as composition members. Owns composition only; no
domain semantics, no templates, no gates, no generated targets. Each member
keeps its own authority ceiling; this umbrella grants no DO authority and
widens no member's SELECT -> CONSTRUCT ceiling. Standing: UNKNOWN.
"""
[capabilities]
provides = ["urn:ggen:pack:sa2a-umbrella-pack"]
requires = [
  "urn:ggen:pack:sa2a-bridge-pack",
  "urn:ggen:pack:sa2a-chicago-court-pack",
  "urn:ggen:pack:sa2a-semantic-diataxis-pack",
  "urn:ggen:pack:sa2a-semantic-evidence-pack",
  "urn:ggen:pack:sa2a-spark-dsl-pack",
  "urn:ggen:pack:sa2a-fastapi-pack",
  "urn:ggen:pack:sa2a-governed-process-pack",
  "urn:ggen:pack:a2a-conformance-pack",
]
