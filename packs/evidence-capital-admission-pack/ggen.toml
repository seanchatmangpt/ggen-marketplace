[project]
name = "evidence-capital-admission"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "evidence-capital-court"
query = { inline = '''PREFIX eca: <https://seanchatmangpt.github.io/eca#>
SELECT (CONCAT(?repo, "@", ?sha) AS ?subject) ?min_effective_capital ?max_false_independent_rate WHERE {
  eca:Subject eca:repository ?repo ; eca:sha ?sha .
  ?p a eca:EvidenceCapitalPolicy ; eca:minEffectiveCapital ?min_effective_capital ; eca:maxFalseIndependentRate ?max_false_independent_rate .
}
ORDER BY ?subject ?min_effective_capital ?max_false_independent_rate
''' }
template = { file = "templates/evidence-capital-court.py.tmpl" }
output_file = "generated/evidence-capital-admission/qualification_court.py"
skip_empty = false
mode = "Overwrite"
