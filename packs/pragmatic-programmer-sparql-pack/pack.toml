[pack]
name = "pragmatic-programmer-sparql-pack"
version = "0.1.0"
description = "A 100-court SPARQL policy pack that operationalizes a paraphrased Pragmatic Programmer practice surface as opt-in RDF observations, refusals, evidence requirements, cardinality checks, and kaizen signals. The pack contains reusable source only; consumer repositories opt subjects into individual courts with pp:governedBy. No copyrighted book text is reproduced."
