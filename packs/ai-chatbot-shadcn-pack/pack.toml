[pack]
name = "ai-chatbot-shadcn-pack"
version = "0.2.0"
description = "Semantic-profile pack (6 shadcn/ui new-york primitive templates: alert, badge, button, card, dialog, input) admitting real evidence scanned from the local Next.js project /Users/sac/ai-chatbot. Framework: Next.js 16 / React 19, TypeScript, Tailwind CSS 4. shadcn/ui usage confirmed real, not merely a listed dependency: components.json is present (style=new-york, baseColor=neutral, cssVariables=true), 18 shadcn/ui primitive files exist on disk under components/ui/ (alert.tsx, avatar.tsx, badge.tsx, button.tsx, card.tsx, carousel.tsx, collapsible.tsx, command.tsx, dialog.tsx, dropdown-menu.tsx, hover-card.tsx, input-group.tsx, input.tsx, progress.tsx, scroll-area.tsx, select.tsx, textarea.tsx, tooltip.tsx), the cn() utility is called in 46 source files, class-variance-authority (cva) is used in 5 files (input-group.tsx, alert.tsx, badge.tsx, button.tsx, message.tsx), and @radix-ui/* primitives are imported in 13 files. deck.gl is absent: no deck.gl/@deck.gl packages in package.json and no DeckGL/ScatterplotLayer/layer-class references found anywhere in source."
[capabilities]
provides = ["urn:ggen:pack:ai-chatbot-shadcn-pack"]
requires = []

[consumer_contract]
# Derived mechanically from templates/*.tmpl bare imports (grep census over
# all 6 templates; react itself is the ambient JSX peer, not listed):
#   alert  -> class-variance-authority
#   badge  -> @radix-ui/react-slot, class-variance-authority
#   button -> @radix-ui/react-slot, class-variance-authority
#   card   -> (none beyond react + cn)
#   dialog -> @radix-ui/react-dialog, lucide-react
#   input  -> (none beyond react + cn)
runtime = [
  "@radix-ui/react-dialog",
  "@radix-ui/react-slot",
  "class-variance-authority",
  "lucide-react",
]
peer_context = """
All six primitives import { cn } from "@/lib/utils". This pack does NOT
project lib/utils.ts; the consumer must provide it (clsx +
tailwind-merge cn body, or the `cn` npm package re-export per shadcn
September 2026 changelog). Tailwind CSS 4 with the shadcn theme variables
(bg-card, text-muted-foreground, ring, ...) is assumed present."""
projected_helpers = []