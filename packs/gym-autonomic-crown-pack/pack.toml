[pack]
name = "gym-autonomic-crown-pack"
version = "26.8.28"
description = "Turns gym-ecosystem/artifacts/autonomic-crown.json from a hand-reconciled receipt into a generated one. Ships a sosa/prov/dcat-grounded ontology of the 13-edge submodule graph, a read-only observer (git ls-tree + git ls-remote --symref) that lifts real git facts into RDF, and a Tera template that re-emits the v2 crown receipt byte-for-byte identical to the committed artifact. Authority boundary: gitlinks+lock-only, observation only -- this pack carries NO runtime actuation authority; submodule checkout, lock rewrite, commit and compare-and-swap promotion stay behind the superproject's GymAct/BRCE-admitted crown workflow. License: AGPL-3.0-or-later."
