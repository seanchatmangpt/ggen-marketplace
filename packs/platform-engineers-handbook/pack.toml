[pack]
name = "platform-engineers-handbook"
version = "0.1.0"
description = "The Platform Engineer's Handbook (Packt, Ajay Chankramath) companion source captured as one complete project, not split by book chapter. seanchatmangpt/Platform-Engineer-s-Handbook (upstream PacktPublishing/Platform-Engineer-s-Handbook) ships its 14 chapters as separate Ch01..Ch14/ directories, each a chapter-scoped slice of the same evolving platform build. This pack layers them in chapter order (Ch01 -> Ch14, each chapter's files copied over the accumulating tree at their real project-relative path, later chapters overwriting same-path files from earlier ones -- e.g. README.md, load-secrets.sh, .circleci/config.yml) to reconstruct the single cumulative final-state repository the book builds toward, then captures that as one ggen-create pack via 'ggen-create start platform-engineers-handbook' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. 279 templated files (300 source files minus 21 lost to same-path chapter overwrites, minus 1 file excluded for containing a literal Tera {% raw %} sentinel that trips ggen-create's TERA_RAW_SENTINEL_REFUSED fail-closed check)."
