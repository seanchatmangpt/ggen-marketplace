[pack]
name = "platform-engineers-handbook"
version = "0.3.0"
description = "The Platform Engineer's Handbook (Packt, Ajay Chankramath) companion source captured as one complete project, not split by book chapter. seanchatmangpt/Platform-Engineer-s-Handbook (upstream PacktPublishing/Platform-Engineer-s-Handbook) ships its 14 chapters as separate Ch01..Ch14/ directories, each a chapter-scoped slice of the same evolving platform build. This pack layers them in chapter order (Ch01 -> Ch14, each chapter's files copied over the accumulating tree at their real project-relative path, later chapters overwriting same-path files from earlier ones -- e.g. README.md and load-secrets.sh take Ch14's form, .circleci/config.yml takes Ch02's, the last chapter that has it) to reconstruct the single cumulative final-state repository the book builds toward, then captures that as one ggen-create pack via 'ggen-create start platform-engineers-handbook' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. 294 templated files (300 source files minus 21 lost to same-path chapter overwrites, minus 1 excluded for containing a literal Tera {% raw %} sentinel that trips ggen-create's TERA_RAW_SENTINEL_REFUSED fail-closed check, plus 15 added back: 13 restored per-chapter READMEs plus an index under chapter-readmes/, and 1 new provider-kubernetes RBAC fix). Ships two real, out-of-the-box Ch09 bugs fixed in-pack (XRD publishConnectionDetailsTo schema gap; missing provider-kubernetes RBAC via a declarative Group-based ClusterRoleBinding) and documents two more left open (Provider/ProviderConfig apply-ordering; a function-patch-and-transform v0.7.0 connectionDetails-aggregation gap). Near-zero content is actually templatized (see PACK.md) -- this is a qualified, verified reference snapshot, not a parameterized generator. See PACK.md and QUALIFICATION.md in this directory for full detail."
