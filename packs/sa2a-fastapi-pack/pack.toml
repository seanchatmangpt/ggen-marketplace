[pack]
name = "sa2a-fastapi-pack"
version = "0.2.0"
description = """
Projects protocol-integration Capability semantics into a Python/FastAPI SA2A
surface. It reuses the capability semantic definition, carries explicit
observation/mutation/authority/receipt metadata, and refuses consequential
capabilities that omit authority. The projected Python surface imports
fastapi + pydantic (see [consumer_contract]); route bodies raise
NotImplementedError — the consumer supplies the candidate producer.
"""

[capabilities]
provides = ["urn:ggen:pack:sa2a-fastapi-pack"]

[consumer_contract]
# Derived mechanically from templates/sa2a_gateway.py.tmpl non-stdlib imports:
# "from fastapi import APIRouter" and "from pydantic import BaseModel".
runtime = [
  "fastapi",
  "pydantic",
]
# The template raises NotImplementedError in the route body: the projected
# gateway is a candidate surface only. The consumer must supply the actual
# capability logic at application composition time.
peer_context = """consumer supplies pi:Capability individuals plus an
s2a:FastAPISA2ASurface with s2a:CapabilityProjection metadata; the pack
projects the HTTP gateway over them and never defines capability semantics
itself"""
projected_helpers = []
