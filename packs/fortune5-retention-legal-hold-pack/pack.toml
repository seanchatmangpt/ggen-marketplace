[pack]
name = "fortune5-retention-legal-hold-pack"
version = "26.7.31"
description = """
Constitutional retention and legal-hold law for Fortune 5 object and
evidence storage. Implements the fortune5-deployment-blocks-pack
object-storage bb:commonPack catalog identity fortune5-retention-pack
and expands it with legal-hold that blocks delete and export. Declares
retention schedules, hold matters, held objects, and evidence
requirements. SPARQL gates and SHACL shapes refuse incomplete
retention/hold contracts, holds that do not block delete/export, and any
ontology-declared direct cloud actuation. Frontmatter templates project
inventory + contract TTL under infrastructure/data/object-storage/.
Broker-only: BRCE remains the actuation boundary. No secrets or sealed
matter payloads are minted.
"""

[metadata]
category = "governance"
tags = [
  "fortune5",
  "f500",
  "f5",
  "retention",
  "legal-hold",
  "object-storage",
  "broker-only",
]

[capabilities]
provides = [
  "urn:ggen:pack:fortune5-retention-legal-hold-pack",
  "urn:ggen:pack:fortune5-retention-pack",
]
requires = []

[consumer_contract]
runtime = []
elixir_tier = "none (law pack; Ash/data-plane owned by downstream provider packs)"
peer_context = "catalog sibling fortune5-object-storage-law-pack (directory absent on disk — composition court BLOCKED); industry-legal-ediscovery is a related emulator pack, not this catalog id"
projected_outputs = [
  "infrastructure/data/object-storage/retention_inventory.md",
  "infrastructure/data/object-storage/retention_contract.ttl",
]

# Frontmatter-schema pack (ggen 26.11.5): gates in pack.toml, not ggen.toml.
# Any row returned by a gate = refusal.
[validation]
gates = [
  "gates/010_retention_contract.rq",
  "gates/020_legal_hold_blocks_delete.rq",
  "gates/030_broker_only_no_actuation.rq",
]
