[pack]
name = "cscb-pack"
version = "0.1.0"
description = """CBMQS qualification pack: the Chicago Bare-Metal Qualification Standard v1 (arcus docs/jira/v26.11.3/cbmqs-standard.md, AF-13) modeled as RDF — the 7 gates g1..g7 with thresholds in exact receipted form (G1 floor = AB-19's receipted 100k ops/s; G7 structural-no-ceiling per AF-2 row 1 UNSUPPORTED, never 18.1 ns), the stress-receipt lanes ab-2/3/6/9/10/11/12/16/17/19 + af-7 with measuredValues where receipted, gate-to-lane prov reference edges, and the 6 TARGET-UNMEASURED rows of the AF-2 honesty audit as a standing work queue with named benches. Projected into the deployment matrix (docs/cscb-gates-table.md) and the open-targets queue (docs/cscb-targets-open.md), with 4 sync-time gates: closed gate-id band, no TARGET standing on a gate's threshold reference, gate reference-receipt closure, and a no-refuted-threshold fence (the refuted 18.1 ns literal must never appear in the union graph)."""

[capabilities]
provides = ["urn:ggen:pack:cscb-pack"]

[validation]
# Declarative list; the 26.10.11 runner enumerates every gates/*.rq under
# this pack's gates/ directory in sorted filename order (the directory
# listing, not this list, is the runner's truth) and evaluates each as ASK
# (true = violation) or SELECT (any row = violation) against the union
# graph; any violation refuses the sync with [FM-PACK-013]. Witnessed
# per-gate: ggen docs/jira/v26.11.3/receipts/ga-11-cscb-pack.md.
gates = [
  "gates/010_gate_band_closure.rq",
  "gates/020_no_target_threshold_ref.rq",
  "gates/030_gate_reference_closure.rq",
  "gates/040_no_refuted_threshold.rq",
]
