[project]
name = "ash-revops-structural-factory-pack"
version = "26.8.26"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/ash-revops-structural#"

[generation]
output_dir = "."

[[generation.rules]]
name = "ash-domain"
query = { file = "queries/10-ash-surface-frontier.rq" }
template = { file = "templates/ash_domain.ex.tera" }
output_file = "generated/ash/domain.ex"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "dual-revops-workspace"
query = { file = "queries/20-dual-revops-frontier.rq" }
template = { file = "templates/revops_workspace.ex.tera" }
output_file = "generated/revops/workspace.ex"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "ocel-value-evidence"
query = { file = "queries/30-ocel-value-evidence.rq" }
template = { file = "templates/ocel_projection.json.tera" }
output_file = "generated/ocel/value_evidence.json"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "ash-resource"
query = { file = "queries/90-ash-resources.rq" }
template = { file = "templates/ash_resource.ex.tera" }
output_file = "generated/ash/resource.ex"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "ash-policy"
query = { file = "queries/110-ash-policies.rq" }
template = { file = "templates/ash_policy.ex.tera" }
output_file = "generated/ash/policy.ex"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "reactor-pipeline"
query = { file = "queries/140-reactor-steps.rq" }
template = { file = "templates/reactor.ex.tera" }
output_file = "generated/reactor/pipeline.ex"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "liveview-workspace"
query = { file = "queries/150-liveview-surfaces.rq" }
template = { file = "templates/liveview.ex.tera" }
output_file = "generated/ui/workspace_live.ex"
skip_empty = true
mode = "Overwrite"
