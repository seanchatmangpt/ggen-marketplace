[pack]
name = "invariant-gate-pack"
version = "0.1.0"
description = """
Renders stdlib-only executable invariant gates for RDF-profile repos from
declared ivg:InvariantCheck facts: a Python checker (exit 0 = all declared
invariants hold, 1 = any violated) plus a positive/negative fixture harness
(each mutated fixture copy must refuse, proving the gate is non-vacuous).
Invariant kinds: tokens-present, skos-topconcepts-count, preflabel-set,
prefix-allowlist, turtle-blank-subjects, jsonl-records. Consumers declare
their own invariant + fixture facts in their own ontology and wire this pack
via ggen.toml [packs] path resolution. Admitted from the
storehouse-infrastructure Cell8 checker experiment (2026-09-16), whose
HANDWRITTEN.md rows this pack retires.
"""
