# shapes.toml — subjects for 020_compile_shape_scan.py, pack-local.
#
# The positive fixture is the registered pass subject. The banned-token
# laws are stated here (per-subject override replaces the gate's TS-shaped
# defaults with JSON-shaped regexes, since the pack fixtures are JSON
# fixtures):
#
#   no-parallel             — "type": "parallel" banned (flat-machine law)
#   no-as-const             — shared `as const` / as-const config refs banned
#   no-explicit-annotation  — dual `{ context: X; event: Y }` param annotations
#                             banned (lawful v5 form: separate context/events
#                             keys under setup.types)
#   no-relative-cross-level — targets must be state-local or root-absolute;
#                             `../` traversal banned
#   no-stray-comment-token  — stray `*/` comment terminators banned
#
# Required seam (hardcoded in the gate): setup-seam — `setup(` present.
# Missing-`initial` is NOT enforceable by this scanner (required-seams are
# not per-subject overridable in 020); it is gated by construct_gate /
# 030 conformance, per divergent-notes.md.
#
# Run against the pack's own positive subject:
#   python3 gates/020_compile_shape_scan.py
# Divergent court (self-test): point --config at a divergent variant (see
# divergent-notes.md); the court must exit 1.

[[subjects]]
path = "../fixtures/positive-machine.json"

banned = [
  ["no-parallel", '"type"\s*:\s*"parallel"'],
  ["no-as-const", 'as-const|as\s+const'],
  ["no-explicit-annotation", '\{\s*context\s*:\s*[^;}]+\s*;\s*event\s*:'],
  ["no-relative-cross-level", '"\.\./'],
  ["no-stray-comment-token", '\*/'],
]
