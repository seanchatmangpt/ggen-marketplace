# Semantic gate witness court (scripts/check_gate_witness_courts.py): every gate in gates/
# has a same-stem witness under witnesses/pass and witnesses/fail. Gates and witnesses are
# owned by the pack's gate lane. No `runner` key: the pack ships no qualification/verify.py,
# and the structural checker reads only the keys below.
[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true
