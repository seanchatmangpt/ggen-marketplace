[pack]
name = "graphlaw-ash-capability-pack"
version = "26.9.30"
description = """
Projects a typed Elixir capability surface (behaviour, registry, per-operation modules, API, lossless result structs, reference docs, and a pure surface test) from the GraphLaw capability registry (schema graphlaw.capability-registry/1). Also projects typed value models (Lease, SignedLease, Receipt, Attestation, Plan, Action, PolicyEntry, PolicyOutcome) with tolerant :extra-preserving structs, informational enum lists, and a Limits module carrying scope, unit and source. Qualified by deterministic render and SPARQL gates over the registry RDF; not qualified by domain execution against the GraphLaw engine. Grants no execution authority.
"""
