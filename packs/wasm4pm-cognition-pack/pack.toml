[pack]
name = "wasm4pm-cognition-pack"
version = "0.2.0"
description = "wasm4pm cognition breed catalog and typed dispatch-surface skeleton over the stable 6-verb ABI (cognition_show/run/verify/replay, system_build/verify); catalog/caller surface only — evidence and analysis stay in wasm4pm. v0.2.0 (2026-10-01, v26.9.30 consolidation): declares the compat: vocabulary ONLY — the 55 compat:CognitionBreed individuals moved to the single owner wasm4pm-facts-pack (which absorbed this pack's 55 unique compat:breedFamily facts); the join is the IRI literal compat:CognitionBreed + property IRIs (capability-ecology dotted-ID pattern, NO cross-pack import): templates render against the consumer's union graph, so wiring this pack alone yields an empty catalog (declared) and wiring wasm4pm-facts-pack alongside yields the full 55-breed catalog. qualification/verify.py is the court: scoped gates silent, fail witness fires (anti-vacuity), pass witness silent, join resolves 55 breeds / 13 families. Generates: src/w4pm_cognition_catalog.rs (typed catalog + compat:breedFamily grouping), src/w4pm_cognition_dispatch.rs (always-regenerated per-breed wrappers, force:true), src/w4pm_cognition_dispatch_handler.rs (hand-completed once, unless_exists:true freeze slot -- regen-safe across new breeds), docs/generated/W4PM_COGNITION_BREED_CATALOG.md, an lib.rs mod-wiring injection for the handler module, tests/w4pm_cognition_proof.rs (8-row hand-transcribed spot proof) and tests/w4pm_cognition_proof_full.rs (SPARQL-generated full 55-row round-trip proof, plus a second structurally-independent join-free COUNT aggregate query cross-checked against the catalog to catch a class of shared-query bug the row-enumeration check alone cannot)"
