# Court: exact-stem pass/fail witness pairs per SPARQL gate (gates/*.rq).
# 040_no_mock_crypto.py is a python verifier gate (exit 0 ALIVE / exit 2
# REFUSED naming file:line:literal) and sits OUTSIDE this witness court: the
# semantic runner judges .rq gates only. 040 is witnessed by direct execution
# against the pack tree; its non-vacuity proof is a planted literal in a
# scratch pack dir that the gate must name before refusing (see lane receipts).
[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true
runner = "python3 runners/semantic_runner.py --gate {gate} --witness {witness} --expectation {expectation}"

# Exact-stem case table (wave-3 v2, lane W3-L8): every .rq gate is enumerated
# with its pass+fail witness pair, so a missing witness fails the court loudly
# instead of silently shrinking coverage. 040_no_mock_crypto.py stays OUTSIDE
# this table (python verifier gate, witnessed by direct execution). The runner
# keeps the exactly-one-gate-fires law on every fail leg.
[[case]]
gate = "010_profile_algorithm_supported_set"
pass = "witnesses/pass/010_profile_algorithm_supported_set.ttl"
fail = "witnesses/fail/010_profile_algorithm_supported_set.ttl"

[[case]]
gate = "020_envelope_field_closure"
