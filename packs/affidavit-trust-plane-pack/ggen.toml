output_file = "generated/crypto_trust_provider.rs"

# 12. nonce-store — disk-backed nonce journal: the envelope module's replay
#     window law persisted across process restarts (v26.9.28 consolidation
#     port; the in-memory NonceJournal alone dies with the process).
[[generation.rules]]
name = "nonce-store"
mode = "Overwrite"
query = { file = "queries/nonce-store.rq" }
