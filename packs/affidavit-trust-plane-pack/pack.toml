[pack]
name = "affidavit-trust-plane-pack"
version = "26.9.28"
description = """Cryptographic trust substrate for the affidavit ecosystem —
CryptoProfile classical|hybrid|pqc, key identity/custody, canonicalization (JCS),
SignatureEnvelope with alg+kid+nonce+epochs inside the signed bytes,
ES256/ML-DSA-65/SLH-DSA-SHA2-128s + hybrid, verification → cryptographic standing.
Interlocks with RFC-SA2A-007-errata; envelope consumed by SA2A for authorization —
this pack NEVER grants authority."""
