[pack]
name = "kudzu-case-studies-pack"
version = "0.2.0"
description = """
Identity-only catalog of candidate integrations between ggen-marketplace's
real-dependency+adapter convention (as established by
protocol-integration-pack's enterprise_kudzu.ttl) and five real repos:
beam4pm, ash_ex4pm, deepwiki-rs, ash_a2a, open-ontologies. This pack does
NOT ship working adapter code. It records, per repo, which are real
ALIVE_LOCAL candidates (beam4pm, ash_ex4pm, ash_a2a, open-ontologies) ready
for a Workflow-driven pilot, and which are BLOCKED (deepwiki-rs -- no
in-process Rust library API, CLI-only) pending a new subprocess-adapter
template family this pack does not yet define.

0.2.0: real Workflow-driven pilots were actually run against all five repos
(scratch apps / real subprocess calls, never committed as live pack code
per the marketplace's pack-source-hierarchy law). Real outcomes: beam4pm,
ash_ex4pm, and ash_a2a are now VERIFIED ALIVE (real mix compile + mix test
output, no mocks, evidence in each individual's rdfs:comment and in
docs/reference/kudzu-case-study-pilot-receipts/). deepwiki-rs is now also
VERIFIED ALIVE, using the new cli-subprocess integrationMode and the new
subprocess-adapter template family (protocol-integration-pack
gates/020_subprocess_adapter_contract.rq) added in this same release --
its real subcommand (sync-knowledge) requires no LLM API key and was
proven via a real built binary and a real passing ExUnit test.
open-ontologies remains BLOCKED, but for a different, re-derived real
reason: its own cargo build --release fails today with 70 pre-existing
compilation errors (a BreedOutput struct/field mismatch in src/swarm.rs),
not merely "build not yet attempted" as previously recorded.
"""
