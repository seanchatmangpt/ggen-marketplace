[pack]
name = "platform-eng-ch09"
version = "0.1.0"
description = "Chapter 9 ('Self-Service Infrastructure (Crossplane)') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch09' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. Chapter 9 addresses infrastructure provisioning as a self-service capability. The chapter demonstrates how to deploy Crossplane to enable declarative infrastructure management, create composable infrastructure blueprints that teams can consume through simple configurations, establish guardrails that enforce governance without blocking innovation, and integrate infrastructure provisioning with the demo application."
