[project]
name = "fleet-projection-closure"
version = "26.9.27"
description = "Exact-subject fleet projection matrix"

[ontology]
source = "ontology.ttl"
imports = [
  "projections/ash-a2a/elixir.ttl",
  "projections/ash-a2a/json-ld.ttl",
  "projections/ash-a2a/json-schema.ttl",
  "projections/ash-a2a/json.ttl",
  "projections/ash-a2a/openapi.ttl",
  "projections/ash-a2a/protobuf.ttl",
  "projections/ash-a2a/python.ttl",
  "projections/ash-a2a/rust.ttl",
  "projections/ash-a2a/sql.ttl",
  "projections/ash-a2a/typescript.ttl",
  "projections/ash-a2a/yaml.ttl",
  "projections/beam4pm/json-schema.ttl",
  "projections/beam4pm/openapi.ttl",
  "projections/beam4pm/typescript.ttl",
  "projections/beam4pm/yaml.ttl",
  "projections/ggen-marketplace/elixir.ttl",
  "projections/ggen-marketplace/graphql.ttl",
  "projections/ggen-marketplace/json-ld.ttl",
  "projections/ggen-marketplace/json.ttl",
  "projections/ggen-marketplace/openapi.ttl",
  "projections/ggen-marketplace/protobuf.ttl",
  "projections/ggen-marketplace/python.ttl",
  "projections/ggen-marketplace/rust.ttl",
  "projections/ggen-marketplace/sql.ttl",
  "projections/ggen-marketplace/typescript.ttl",
  "projections/ggen-marketplace/yaml.ttl",
  "projections/gymact/elixir.ttl",
  "projections/gymact/graphql.ttl",
  "projections/gymact/json-ld.ttl",
  "projections/gymact/json-schema.ttl",
  "projections/gymact/protobuf.ttl",
  "projections/gymact/python.ttl",
  "projections/gymact/sql.ttl",
  "projections/gymact/yaml.ttl",
  "projections/semantic-jira/elixir.ttl",
  "projections/semantic-jira/graphql.ttl",
  "projections/semantic-jira/json-schema.ttl",
  "projections/semantic-jira/json.ttl",
  "projections/semantic-jira/openapi.ttl",
  "projections/semantic-jira/protobuf.ttl",
  "projections/semantic-jira/python.ttl",
  "projections/semantic-jira/rust.ttl",
  "projections/semantic-jira/sql.ttl",
  "projections/semantic-jira/typescript.ttl",
  "projections/xaas/elixir.ttl",
  "projections/xaas/json-ld.ttl",
  "projections/xaas/openapi.ttl",
  "projections/xaas/protobuf.ttl",
  "projections/xaas/rust.ttl",
  "projections/xaas/sql.ttl",
  "projections/xaas/yaml.ttl",
]

[validation]
gates = [
  "gates/010_required_identity.rq",
  "gates/020_authority_none.rq",
  "gates/030_unique_target.rq",
  "gates/040_exact_source_sha.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "package-index"
query = { file = "queries/project_matrix.rq" }
template = { file = "templates/package-index.json.tera" }
output_file = "package-index.jsonl"
skip_empty = false
mode = "Overwrite"
