[pack]
name = "platform-eng-ch08"
version = "0.1.0"
description = "Chapter 8 ('Progressive Delivery Pipelines') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch08' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. This directory contains comprehensive examples and tools for implementing CI/CD as a composable platform service. The code demonstrates modern platform engineering practices including reusable workflow components, progressive delivery strategies, observability integration, and automated rollback mechanisms."
