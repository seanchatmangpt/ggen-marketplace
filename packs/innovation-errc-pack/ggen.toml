[project]
name = "innovation-errc-pack"
version = "26.8.27"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "errc-portfolio-json"
query = { file = "queries/10-errc-portfolio.rq" }
template = { file = "templates/errc-portfolio.json.tera" }
output_file = "generated/innovation/errc-portfolio.json"

[[generation.rules]]
name = "errc-grid-markdown"
query = { file = "queries/10-errc-portfolio.rq" }
template = { file = "templates/errc-grid.md.tera" }
output_file = "generated/innovation/ERRC.md"
