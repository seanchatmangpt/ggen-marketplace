[pack]
name = "capability-ecology-pack"
version = "26.9.0"
description = """
Qualified capability contracts for the runtime families a capability-resolution
engine (consumer: ash_pplan v26.9.30) resolves against, consolidated from ten
per-family packs into ONE binding pack (one version, one admission unit, no
cross-family version skew). Kernel vocabulary is NOT redefined here:
qce: (packs/qualified-capability-ecology-pack) stays the pure lifecycle kernel;
this pack is its N-family binding — one calculus, one court, ten family
modules (the O(N^2) drift law applied to the wave's ten parallel gate courts).

Family modules (ontology/<family>.ttl, disjoint namespaces, joined by the
consumer resolver via pinned dotted-ID literals, never in-tree imports):
filesystem fscap (File/Dir), network ncap (Http/Remote), process pcap (OTP
supervision), scheduling scap (temporal firing policies), event-state escap
(delivery/observation semantics), observation ocap (evidence-bound taps),
durability dcap (checkpoint/replay/resume), a2a aacap (SA2A invocation),
authority authcap (Policy != Authority, REFUSED_NO_AUTHORITY), evidence ecap
(five-field receipts, SHA-bound provenance).

Doctrine held throughout: capability != implementation (File.Write is the
capability; Reactor.File.WriteFile a realization), Plan != Execution,
ProviderAvailable != Authorized, Projection != Source, Generated != Admitted.
Supersedes filesystem/network/process/scheduling/event-state/observation/
durability/a2a/authority/evidence-capability-pack (0.1.0 each; a2a 26.9.0).
Gate scoping note: every gate is family-scoped by its predicates; the union
graph is qualified by real ggen as one admission unit. Grants no execution
authority; BRCE remains the sole actuation boundary.
"""
