[project]
name = "dfcm-explore-maximalist-consumer"
version = "26.8.24"
description = "Generate reversible EXPLORE comparison courts from admitted candidate facts"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/dfcm-explore#"
imports = []

[ontology.prefixes]
ex = "https://ggen.dev/ontology/dfcm-explore#"
dct = "http://purl.org/dc/terms/"

[generation]
output_dir = "."

[[generation.rules]]
name = "candidate-matrix"
query = { file = "queries/candidates.rq" }
template = { file = "templates/candidate_matrix.json.tera" }
output_file = "consumer/explore/candidate_matrix.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "selection-court"
query = { file = "queries/candidates.rq" }
template = { file = "templates/selection_court.py.tera" }
output_file = "consumer/explore/selection_court.py"
skip_empty = false
mode = "Overwrite"
