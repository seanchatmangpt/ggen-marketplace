[pack]
name = "cs2-semantic-work"
version = "26.9.27"
description = "Exact-subject, source-bound CS2 work and batch projections"
authority = "NONE"

[projection]
query = "queries/project_work.rq"
schema = "schemas/work-projection.schema.json"

[batch_projection]
dependency_query = "queries/project_dependencies.rq"
schema = "schemas/work-projection-batch.schema.json"
template = "templates/work-projection-batch.json.tera"

[consumer]
root = "consumer"
authority = "NONE"
admission_contract = "consumer/contracts/admission-result.schema.json"
work_contract = "consumer/contracts/consumer-work.schema.json"
dag_contract = "consumer/contracts/dependency-dag.schema.json"
request_contract = "consumer/contracts/materialization-request.schema.json"
result_contract = "consumer/contracts/materialization-result.schema.json"

[consumer.runtime]
topological_order = "consumer/runtime/topological-order.json"
idempotency = "consumer/runtime/idempotency-key.json"
refusal = "consumer/runtime/refusal-envelope.json"
retry = "consumer/runtime/retry-policy.json"
digest_binding = "consumer/runtime/digest-binding.json"
replay = "consumer/runtime/replay-envelope.json"

[[gates]]
path = "gates/010_exact_subject.rq"
[[gates]]
path = "gates/020_source_binding.rq"
[[gates]]
path = "gates/030_authority_none.rq"
[[gates]]
path = "gates/040_unique_work_key.rq"
[[gates]]
path = "gates/050_single_subject.rq"
[[gates]]
path = "gates/060_single_source_binding.rq"
[[gates]]
path = "gates/070_dependency_target_exists.rq"
[[gates]]
path = "gates/080_no_self_dependency.rq"

[[templates]]
path = "templates/work-projection.json.tera"
[[templates]]
path = "templates/work-projection-batch.json.tera"
