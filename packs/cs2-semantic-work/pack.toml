[pack]
name = "cs2-semantic-work"
version = "26.9.27"
description = "Exact-subject, source-bound CS2 work projections"
authority = "NONE"

[projection]
query = "queries/project_work.rq"
schema = "schemas/work-projection.schema.json"

[[gates]]
