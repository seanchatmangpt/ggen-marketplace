[pack]
name = "cs2-semantic-work"
version = "26.9.27"
description = """
Exact-subject, source-bound CS2 producer projections (per-item JSON, batch JSON)
and authority-free consumer projections (consumer JSON surfaces, Elixir admission
adapters). authority = NONE: every projection carries authority "NONE" and gates
030/095 refuse any work item that claims otherwise. Gates 010-095 run as ggen
pack gates (violation-row SELECT, FM-PACK-013). Consumer gates under
consumer/gates are ASK-form contracts NOT enforced by ggen (see README).
"""

[projection]
query = "queries/project_work.rq"
schema = "schemas/work-projection.schema.json"

[batch_projection]
dependency_query = "queries/project_dependencies.rq"
schema = "schemas/work-projection-batch.schema.json"
template = "templates/work-projection-batch.json.tera"

[consumer]
work_query = "consumer/queries/project_consumer_work.rq"
dependency_query = "consumer/queries/project_consumer_dependencies.rq"
source_query = "consumer/queries/project_consumer_sources.rq"
batch_query = "consumer/queries/project_consumer_batch.rq"
schema = "consumer/schemas/consumer-work.schema.json"
template = "consumer/templates/consumer-work.json.tera"
authority = "NONE"

[[gates]]
path = "gates/010_exact_subject.rq"
[[gates]]
path = "gates/020_source_binding.rq"
[[gates]]
path = "gates/030_authority_none.rq"
[[gates]]
path = "gates/040_unique_work_key.rq"
[[gates]]
path = "gates/050_single_subject.rq"
[[gates]]
path = "gates/060_single_source_binding.rq"
[[gates]]
path = "gates/070_dependency_target_exists.rq"
[[gates]]
path = "gates/080_no_self_dependency.rq"
[[gates]]
path = "gates/100_projection_required.rq"

[[templates]]
path = "templates/work-projection.json.tera"
[[templates]]
path = "templates/work-projection-batch.json.tera"
