[project]
name = "frontier-derivative-pack"
version = "26.8.25"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/frontier-derivative#"

[generation]
output_dir = "."

[[generation.rules]]
name = "marginal-unlocks"
query = { file = "queries/10-marginal-unlocks.rq" }
template = { file = "templates/frontier.json.tera" }
output_file = "frontier.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "pareto-gradient"
query = { file = "queries/20-pareto-gradient.rq" }
template = { file = "templates/frontier.json.tera" }
output_file = "pareto-gradient.json"
skip_empty = false
mode = "Overwrite"
