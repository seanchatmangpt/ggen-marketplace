[project]
name = "fleet-package-compose"
version = "26.9.27"

[ontology]
source = "ontology.ttl"
imports = [
  "families/elixir.ttl",
  "families/graphql.ttl",
  "families/json-ld.ttl",
  "families/json-schema.ttl",
  "families/json.ttl",
  "families/openapi.ttl",
  "families/protobuf.ttl",
  "families/python.ttl",
  "families/rust.ttl",
  "families/sql.ttl",
  "families/typescript.ttl",
  "families/yaml.ttl",
  "mappings/elixir.ttl",
  "mappings/graphql.ttl",
  "mappings/json-ld.ttl",
  "mappings/json-schema.ttl",
  "mappings/json.ttl",
  "mappings/openapi.ttl",
  "mappings/protobuf.ttl",
  "mappings/python.ttl",
  "mappings/rust.ttl",
  "mappings/sql.ttl",
  "mappings/typescript.ttl",
  "mappings/yaml.ttl",
  "consumers/ash-a2a.ttl",
  "consumers/beam4pm.ttl",
  "consumers/ggen-marketplace.ttl",
  "consumers/gymact.ttl",
  "consumers/semantic-jira.ttl",
  "consumers/xaas.ttl",
  "fixtures/cs2-fleet.ttl",
]

[validation]
gates = [
  "gates/010_required_identity.rq",
  "gates/020_authority_none.rq",
  "gates/030_target_repo.rq",
  "gates/040_target_path.rq",
  "gates/050_source_sha.rq",
  "gates/060_family_declared.rq",
  "gates/070_consumer_declared.rq",
  "gates/080_unique_target.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "package-plan"
query = { file = "queries/project_package_plan.rq" }
template = { file = "templates/json.tera" }
output_file = "package-plan.jsonl"
skip_empty = true
mode = "Overwrite"
