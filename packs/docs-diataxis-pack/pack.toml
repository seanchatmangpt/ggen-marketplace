[pack]
name = "docs-diataxis-pack"
version = "0.1.0"
description = "Generalizes readme-diataxis-pack from a single README-shaped page set into a multi-page Diataxis corpus: consumer RDF facts declare a Book singleton plus ordered Page entries, each Page carries a quadrant (tutorial|how-to|reference|explanation), a title, a relative output path, and a markdown body; gates refuse missing required properties (typed FM-PACK-013 refusal), quadrant values outside the four-quadrant enum, duplicate output paths (write collision), duplicate positions within a quadrant (nondeterministic ordering), and non-.md output paths; templates project one markdown file per Page plus a quadrant-grouped SUMMARY.md navigation file and an index.md entry point."

[capabilities]
provides = ["urn:ggen:pack:docs-diataxis-pack"]
