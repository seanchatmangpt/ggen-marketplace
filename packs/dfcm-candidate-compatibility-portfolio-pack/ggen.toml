[project]
name = "dfcm-candidate-compatibility-portfolio"
version = "0.1.0"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "selection-receipt"
query = { file = "queries/01_compatible_candidates.sparql" }
template = { file = "templates/selection-receipt.json.tmpl" }
output_file = "generated/selection-receipt.json"
mode = "Overwrite"
skip_empty = false
