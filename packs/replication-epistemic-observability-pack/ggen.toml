[project]
name = "replication-epistemic-observability"
version = "26.8.25"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/replication-epistemic#"

[generation]
output_dir = "."

[[generation.rules]]
name = "replication-standing-report"
query = { file = "queries/013_standing_distribution.rq" }
template = { file = "templates/standing-report.json.tera" }
output_file = "generated/replication-epistemic-observability/standing-report.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "multiplier-evidence-report"
query = { file = "queries/050_1000x_shortfall.rq" }
template = { file = "templates/multiplier-report.json.tera" }
output_file = "generated/replication-epistemic-observability/multiplier-report.json"
skip_empty = false
mode = "Overwrite"
