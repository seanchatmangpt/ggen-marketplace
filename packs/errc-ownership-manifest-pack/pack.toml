[pack]
name = "errc-ownership-manifest-pack"
version = "26.9.25"
description = """
Canonical ownership declarations for exact-subject ERRC accounting.
The pack generates the ownership-manifest JSON consumed by
@unrdf/manufacturing's unrdf-errc-receipt CLI.

Only evidenced generated/reused/materialized claims are emitted. Missing or
under-evidenced paths remain absent so the UNRDF accounting layer charges them
as handwritten. This pack grants no execution authority.
"""
