[project]
name = "errc-ownership-manifest-pack"
version = "26.9.25"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "errc-ownership-manifest"
query = { file = "queries/10-ownership-manifest.rq" }
template = { file = "templates/ownership-manifest.json.tera" }
output_file = "generated/ownership-manifest.json"

[[generation.rules]]
name = "errc-ownership-receipts"
query = { file = "queries/20-receipt-projection.rq" }
template = { file = "templates/ownership-receipts.ndjson.tera" }
output_file = "generated/ownership-receipts.ndjson"
