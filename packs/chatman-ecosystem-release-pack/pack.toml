[pack]
name = "chatman-ecosystem-release-pack"
version = "0.4.0"
description = "Reusable semantic law and projections for dependency-closed, exact-SHA ecosystem releases: component identity, dependency closure, required-role coverage, standing bounds, zero ambient DO authority, explicit external ref-observation evidence, and (0.2.0) a total legacy-role crosswalk: every required role of a lifted predecessor release (er:LegacyRelease) gets exactly one typed role boundary (REQUIRED, SUCCESSOR, BLOCKED, UNSUPPORTED, REFUSED) from the imported fleet classification, an explicit decision, or the no-court-reference successor rule, with fleet CriticalPath and court-executed repositories forced into the required set, constitutional role mappings, and generated release manifest, crosswalk and requirement projections, and (0.3.0) imported upstream checkpoint crowns: a stop-court receipt directory lifted to er:ImportedCrown facts is admitted only when STOP is ALIVE, the required number of distinct gates are ALIVE at the crown subject and against the paired subject, both SHAs equal the importing release's exact component commits, and LLM_INVOCATIONS_ON_KNOWN_REFERENCE_PATH and UNRECEIPTED_ACTUATION are present and 0, with a generated imported-crown projection, and (0.4.0) an exact-head release court and root release receipt: a generated court script per release (er:Gate commands in er:gateOrder order under set -euo pipefail, typed exit per failing gate, imported files re-hashed first, er:Probe observations written back as Turtle), a typed-checks list of non-success checks each with one of six failure classes, a boundary and evidence, and the root receipt rendered unsealed in the chatman Receipt shape and in the fleet R schema with standing_after derived from the observed gate exits and admitted only for a transition chatman Standing::permits allows (UNKNOWN->ALIVE refused; the nine permitted pairs and the six failure classes are closed tables in gates 097 and 095, so a consumer triple cannot extend either law), plus an IMPORTS.sha256 manifest for shasum -a 256 -c --strict. Exact release-instance facts, including which checks form the court and any release STOP check, remain consumer-owned."
