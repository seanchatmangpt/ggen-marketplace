[pack]
name = "chatman-ecosystem-release-pack"
version = "0.2.0"
description = "Reusable semantic law and projections for dependency-closed, exact-SHA ecosystem releases: component identity, dependency closure, required-role coverage, standing bounds, zero ambient DO authority, explicit external ref-observation evidence, and (0.2.0) a total legacy-role crosswalk: every required role of a lifted predecessor release (er:LegacyRelease) gets exactly one typed role boundary (REQUIRED, SUCCESSOR, BLOCKED, UNSUPPORTED, REFUSED) from the imported fleet classification, an explicit decision, or the no-court-reference successor rule, with fleet CriticalPath and court-executed repositories forced into the required set, constitutional role mappings, and generated release manifest, crosswalk and requirement projections. Exact release-instance facts remain consumer-owned."
