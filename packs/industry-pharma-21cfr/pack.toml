[pack]
name = "industry-pharma-21cfr"
version = "26.10.0"
description = """
industry-pharma-21cfr: 21 CFR Part 11 / EU Annex 11 electronic-records compliance pack.
Audit trail is PROV-O (W3C PROVENANCE-O, https://www.w3.org/ns/prov-o#): attribution,
generation, start/end times carry who/what/when; the minimal p11: vocabulary adds the
Part 11 faces the W3C vocabulary does not name (why, e-signature bound to a prov:Agent,
deviation/CAPA quality loop, WORM immutability). SHACL shapes render from the ontology's
own requiresProperty annotations; four refusal gates (signature-missing,
audit-trail-missing, capa-missing, mutation-non-WORM) are witnessed both ways.
Grants no execution authority.
"""

[capabilities]
