[pack]
name = "beam4pm-pro-entitlement-pack"
version = "0.1.1"
description = "MP3 (entitlement reconciliation) + MP6 (billing/usage dedup) local substrate for beam4pm_pro, manufactured from an admitted bpm:RecordType graph. Reuses the beam4pm-process-model-pack vocabulary verbatim (bpm:RecordType / bpm:Field / bpm:recordName / bpm:recordDoc / bpm:hasField / bpm:fieldName / bpm:fieldType / bpm:fieldDoc / bpm:fieldRequired / bpm:fieldOrder) and introduces no parallel vocabulary. Schema-only pack (same contract as beam4pm-pro-infra-pack): ships zero individuals of its own -- a consumer supplies its own entitlement_event/entitlement_state/usage_event/billing_reconciliation bpm:RecordType facts in its own ontology.ttl. Provider lane: Google Cloud Marketplace / Cloud Commerce Partner Procurement API (event_type's 13 values and status's 8 values are the real ENTITLEMENT_* notification and EntitlementState enums from Google's Partner Procurement API docs, read 2026-08-30, not invented). MP3: beam4pm_entitlement.{erl,ex}.tmpl carry struct/record generation plus a hand-designed reconcile_entitlement/2 fold applying an at-least-once, arbitrarily-reordered notification stream to one entitlement_state under a strict (effective_at, event_id) watermark -- a replayed event and a stale out-of-order event are both exact no-ops, and validate_event_shape/1 refuses (never silently drops or poisons on) a malformed effective_at or an empty event_id. MP6: beam4pm_billing.{erl,ex}.tmpl carry struct/record generation plus a hand-designed reconcile_billing/reconcile(events, entitlement_id, metric_name, {period_start, period_end}) fold that filters to one partition and one caller-supplied half-open period BEFORE deduplicating by event_id and summing -- the period argument is what makes it impossible for the same event to be double-billed across two adjacent reconciliation calls. Chicago-style (zero mocks) adversarial EUnit/ExUnit suites cover apply-twice idempotency, out-of-order no-op, duplicate CREATE, CANCEL-after-SUSPEND plus duplicate CANCEL, malformed-input refusal, N-times-repeat/shuffled/cross-group billing dedup, and the exact cross-period double-billing scenario the period argument exists to prevent. This pack ships no gates of its own in this pass -- it inherits beam4pm-process-model-pack's gates/010_required.rq and gates/020_field_type_enum.rq only; enum-closure gates for event_type/status are a named open item. Standing ceiling: both folds are verified against synthetic events only -- MP3 and MP6 remain BLOCKED on real Partner Procurement API access and a seller account; this pack manufactures the adapters those gates will need and does not itself close either gate. Named limits not solved here: the notification fold alone cannot reach ENTITLEMENT_SUSPENDED (a reachable status with no corresponding event type) or fully populate ENTITLEMENT_OFFER_ENDED/ENTITLEMENT_DELETED's downstream effects (marked UNVERIFIED design choices); a real MP3 implementation needs a second, authoritative path (reading the entitlement resource's own state) reconciled against this watermark. v0.1.1 (2026-08-30): Q2 cross-language semantic-identity review found and fixed four Erlang/Elixir projection divergences, each reproduced live against the compiled modules before fixing: (1) strict-vs-value equality on partition keys (Erlang =:= vs Elixir ==/!=) let an integer vs float key produce DIFFERENT billing totals (0.0 vs 5.0) and opposite wrong_partition outcomes per language -- the Elixir projections now use ===/!== to mirror =:= exactly; (2) validate_event_shape/1 built its byte_size/re:run tuple eagerly in Erlang, so a non-binary position-defining field (undefined/nil passes the constructors' presence-only check) crashed with badarg while Elixir returned a typed empty_event_id refusal for the same input and returned :ok outright for a nil event_id with a valid effective_at -- both projections now check sequentially and refuse non-binary/empty event_id as empty_event_id and non-binary/non-ISO8601 effective_at as invalid_effective_at, with no crash path and no silent admit; (3) the Erlang constructor templates checked string-literal-required fields before boolean-literal-required ones, a latent divergence in which first {missing_field, _} is reported under a consumer graph mixing literal types -- now a single admitted-field_order pass mirroring the Elixir cond, rendering byte-identically for all-string graphs; (4) missing is_map/is_list guards on the Erlang constructors and reconcile_billing/4 vs their Elixir counterparts -- misuse crash shapes are now function_clause in both languages. Well-formed-input behavior is unchanged: both languages' full adversarial suites (11 EUnit + 21 ExUnit) pass against the fixed projections, and a 15-case cross-language probe matrix returned identical results in every case."
