[project]
name = "sa2a-semantic-evidence"
version = "26.9.29"
description = "Manufacture portable authority-free semantic evidence contracts"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://graphlaw.dev/sa2a#"
imports = []

[ontology.prefixes]
sa2a = "https://graphlaw.dev/sa2a#"
prov = "http://www.w3.org/ns/prov#"
sh = "http://www.w3.org/ns/shacl#"
xsd = "http://www.w3.org/2001/XMLSchema#"

[validation]
gates = [
  "gates/010_authority_none.rq",
  "gates/020_exact_subject.rq",
  "gates/030_replay_identity.rq",
  "gates/040_contract_identity.rq"
]

[generation]
output_dir = "."

[[generation.rules]]
name = "evidence-contract"
query = { file = "queries/contract.rq" }
template = { file = "templates/lib/sa2a_evidence_contract.ex.tmpl" }
output_file = "consumer/lib/sa2a_evidence_contract.ex"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "evidence-schema"
query = { file = "queries/contract.rq" }
template = { file = "templates/priv/sa2a-evidence-envelope.schema.json.tmpl" }
output_file = "consumer/priv/sa2a-evidence-envelope.schema.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "evidence-court"
query = { file = "queries/contract.rq" }
template = { file = "templates/test/sa2a_evidence_contract_test.exs.tmpl" }
output_file = "consumer/test/sa2a_evidence_contract_test.exs"
skip_empty = false
mode = "Overwrite"
