[project]
name = "evidence-capital-policy-adaptive-control"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "adaptive-control-contract"
query = { inline = '''SELECT
  ("qualification-fixture" AS ?subject)
  (0 AS ?generation)
  ("DEFER" AS ?selected)
WHERE {}
ORDER BY ?subject ?generation ?selected
''' }
template = { file = "templates/control-contract.json.tmpl" }
output_file = "generated/evidence-capital-policy-adaptive-control/control-contract.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "adaptive-control-court"
query = { inline = '''SELECT
  ("qualification-fixture" AS ?subject)
  (0 AS ?generation)
  ("DEFER" AS ?selected)
WHERE {}
ORDER BY ?subject ?generation ?selected
''' }
template = { file = "templates/qualification-court.py.tmpl" }
output_file = "generated/evidence-capital-policy-adaptive-control/qualification_court.py"
skip_empty = false
mode = "Overwrite"
