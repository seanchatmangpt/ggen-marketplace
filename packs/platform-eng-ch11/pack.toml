[pack]
name = "platform-eng-ch11"
version = "0.1.0"
description = "Chapter 11 ('Policy as Code and Compliance') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch11' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. This chapter demonstrates how to implement **Policy-as-Code** using **Open Policy Agent (OPA)** and its Kubernetes admission controller variant, **OPA Gatekeeper**. Rather than treating compliance as a retroactive audit activity, you will learn to enforce policies proactively at the Kubernetes API boundary, catching misconfigurations before they reach production."
