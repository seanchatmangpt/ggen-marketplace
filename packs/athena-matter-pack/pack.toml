[pack]
name = "athena-matter-pack"
version = "26.10.16"
description = """
Athena security-control ontology pack. Models the security-control domain of
athena's private matter surface as RDF: AccessGrant (principal -> roles ->
matterIds with mandatory expiry — the J7 identity-admission contract),
EncryptedRecord (scheme/keyVersion/wrappedDek/iv/ciphertext — the W2-2 sealed
envelope), RegionPin (allowedRegions membership set), AuditEvent (actor/action/
target/outcome/prevHash — the sentinel-audit hash chain), and CaseSpace
(per-case isolated custody surface). Projects TypeScript zod .strict()
contract modules (athena style) via ggen sync; verify/*.unbound.rq are
zero-rows inverted gates over the graph.
"""

[capabilities]
provides = ["urn:ggen:pack:athena-matter-pack", "urn:ggen:pack:athena-matter-pack#security-controls"]
requires = []
