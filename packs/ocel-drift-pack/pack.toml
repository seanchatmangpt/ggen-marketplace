[pack]
name = "ocel-drift-pack"
version = "1.0.1"
description = "Project-wide OCEL coverage admission gate for ggen generation. Consumes one cnv-ocel:DriftReport produced from a real merged OCEL corpus and refuses generation when observed coverageRatio falls below minCoverageRatio. This pack owns only the aggregate project-health floor; per-command feedback, process discovery, conformance, fitness, precision, variants, and drift computation remain external analysis concerns. No nonexistent ocel-feedback-pack dependency or sibling authority is implied."
