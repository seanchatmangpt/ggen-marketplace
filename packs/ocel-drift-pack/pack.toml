[pack]
name = "ocel-drift-pack"
version = "1.0.0"
description = "Closes clap_noun_verb::ocel::drift_report's coverage ratio into a real ggen generation decision, complementing ocel-feedback-pack's per-command prune gate with a project-wide health floor. Consumes one cnv-ocel:DriftReport individual (produced by clap_noun_verb::ocel::write_drift_pack from a real merged fleet-wide OCEL corpus and a chosen coverage floor) composed alongside a project's own cnv:Cli graph. Ships one fail-closed gate: refuses generation when the observed coverageRatio falls below minCoverageRatio -- real evidence that too much of the admitted surface has never been exercised at all blocks the next sync, distinct from ocel-feedback-pack's per-command refusal (this gate looks at the aggregate ratio, not any single command)."
