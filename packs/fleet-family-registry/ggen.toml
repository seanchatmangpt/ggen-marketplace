# Project-profile self-proof: renders the family registry from this pack's own graph.
# (Replaces the former non-schema [pack]/[projection] tables, which ggen refused with FM-CONFIG-102.)
[project]
name = "fleet-family-registry"
version = "0.1.0"

[ontology]
source = "ontology.ttl"
imports = [
  "families/elixir.ttl", "families/graphql.ttl", "families/json-ld.ttl", "families/json-schema.ttl",
  "families/json.ttl", "families/openapi.ttl", "families/protobuf.ttl", "families/python.ttl",
  "families/rust.ttl", "families/sql.ttl", "families/typescript.ttl",
]

[generation]
output_dir = "."

[[generation.rules]]
name = "registry"
mode = "Overwrite"
query = { file = "queries/project_registry.rq" }
template = { file = "templates/registry.json.tmpl" }
output_file = "generated/registry.json"
