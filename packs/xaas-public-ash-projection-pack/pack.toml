[pack]
name = "xaas-public-ash-projection-pack"
version = "0.2.0"
description = "Thin compatibility consumer of xaas-ash-core-pack: supplies only the initial XaaS public-ontology SHACL application profile (ontology.ttl) and projects it through xaas-ash-core-pack's canonical Ash/Igniter generator-command query, template and admission gates (composed by sibling reference, never copied). Declares no XaaS business/domain classes or properties; output path xaas-public-ash-GENERATED.sh is preserved for existing consumers."
