[project]
name = "xaas-public-ash-projection-pack"
version = "0.2.0"
description = "Public SHACL application profile to canonical Ash/Igniter construction program"
authors = ["Sean Chatman"]
[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.io/profile/xaas/ash-shape#"
imports = []
# ggen's declarative schema cannot mix a `[packs]` table with
# `[[generation.rules]]` (FM-CONFIG-101), and xaas-ash-core-pack is a
# declarative project pack, so the composition edge is expressed as
# `../xaas-ash-core-pack/...` file references.
[validation]
gates = [
  "../xaas-ash-core-pack/gates/010_no_custom_vocabulary.rq",
  "../xaas-ash-core-pack/gates/020_public_target_classes.rq",
  "../xaas-ash-core-pack/gates/030_profile_well_formed.rq",
  "../xaas-ash-core-pack/gates/040_resource_name_collisions.rq",
  "../xaas-ash-core-pack/gates/050_supported_datatypes.rq",
  "../xaas-ash-core-pack/gates/060_object_property_projection_pending.rq",
]

[generation]
output_dir = "."
[[generation.rules]]
name = "xaas-public-ash-construction"
query = { file = "../xaas-ash-core-pack/queries/ash-gen-commands.rq" }
template = { file = "../xaas-ash-core-pack/templates/gen-commands.sh.tmpl" }
output_file = "xaas-public-ash-GENERATED.sh"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "xaas-public-ash-semantic-map"
query = { file = "queries/semantic-map.rq" }
template = { file = "templates/semantic-map.ttl.tmpl" }
output_file = "xaas-public-ash-semantic-map-GENERATED.ttl"
skip_empty = false
mode = "Overwrite"
