[project]
name = "xaas-public-ash-projection-pack"
version = "0.1.0"
description = "Public SHACL application profile to canonical Ash/Igniter construction program"
authors = ["Sean Chatman"]

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.io/profile/xaas/ash-shape#"
imports = []

[ontology.prefixes]
sh = "http://www.w3.org/ns/shacl#"
fno = "https://w3id.org/function/ontology#"
dcat = "http://www.w3.org/ns/dcat#"
org = "http://www.w3.org/ns/org#"
prov = "http://www.w3.org/ns/prov#"
odrl = "http://www.w3.org/ns/odrl/2/"
sosa = "http://www.w3.org/ns/sosa/"
pplan = "http://purl.org/net/p-plan#"
qudt = "http://qudt.org/schema/qudt/"

[generation]
output_dir = "."

[[generation.rules]]
name = "xaas-public-ash-construction"
# The query file is deliberately minimal (see its header): ggen's engine
# refuses VALUES in a file-referenced .rq (error[E0010]) and drops some
# computed UNION-branch columns, so all string composition lives in the
# template below, not in SPARQL BINDs.
query = { file = "queries/ash-gen-commands.rq" }
template = { file = "templates/gen-commands.sh.tmpl" }
output_file = "xaas-public-ash-GENERATED.sh"
skip_empty = false
mode = "Overwrite"

