[project]
name = "xaas-public-ash-projection-pack"
version = "0.2.0"
description = "Public SHACL application profile to deterministic Ash/Igniter + semantic-map + witness manufacture"
authors = ["Sean Chatman"]
[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.io/profile/xaas/ash-shape#"
imports = []
[generation]
output_dir = "."
[[generation.rules]]
name = "ash-construction"
query = { file = "queries/ash-gen-commands.rq" }
template = { file = "templates/gen-commands.sh.tmpl" }
output_file = "xaas-public-ash-GENERATED.sh"
skip_empty = false
mode = "Overwrite"
[[generation.rules]]
name = "semantic-map"
query = { file = "queries/ash-gen-commands.rq" }
template = { file = "templates/semantic-map.ttl.tera" }
output_file = "xaas-public-ash-semantic-map-GENERATED.ttl"
skip_empty = false
mode = "Overwrite"
[[generation.rules]]
name = "projection-witness"
query = { file = "queries/ash-gen-commands.rq" }
template = { file = "templates/projection_witness.exs.tera" }
output_file = "xaas_public_ash_projection_witness_GENERATED.exs"
skip_empty = false
mode = "Overwrite"
