[pack]
name = "beam4pm-contracts-pack"
version = "0.2.0"
description = """
Beam4PM wire/contract vocabulary and renderers, consolidated (v26.9.30 wave)
from beam4pm-ai-contracts-pack (v0.1.1) + beam4pm-mcp-contracts-pack (v0.1.0)
into ONE admission unit with two disjoint family modules:
ontology/ai.ttl (aic: — the seven canonical AI-contract data shapes from the
post-LLM capability roadmap, plus the shared aic:FieldType closed reference
vocabulary) and ontology/mcp.ttl (mcp: — the ten canonical MCP wire-message
shapes per modelcontextprotocol.io spec 2025-06-18, including the five
mcp:wireName camelCase overrides). The Erlang/Elixir renderer template families
stay disjoint (18 templates, ai_*/mcp_* prefixed); consolidation measured all
9 cross-family template pairs 0.558-0.953 similar — none byte/near-equal with
genuinely equivalent bodies (the closest, _codec.erl at 0.953, diverges on the
load-bearing codec lines: aic's isAtomCodec vocabulary join vs mcp's wireName
COALESCE + hardcoded atom check), so all 9 stay as family variants inside the
one pack. Gates: family-prefixed exact-stem ladder; ai's anti-join field-type
enum gate is THE single archetype — mcp's hardcoded STR NOT IN form is retired
and mcp_020 anti-joins the same aic:FieldType vocabulary, so a 9th field type
admits at exactly one site. One uniform exact-stem witness court
(qualification/verify.py, 5 gates x pass/fail witnesses). Data shapes only —
no execution authority, admission, or actuation semantics of any kind live
here; those remain the exclusive responsibility of beam4pm-post-llm-runtime-
pack's rt: vocabulary. Grants no execution authority.
"""
