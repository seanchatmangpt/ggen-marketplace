[pack]
name = "strata-pn64-pack"
version = "0.1.0"
description = """
PN64/OCEL64 dual-word ABI for Strata: one Petri-net transition per 64-bit word
(marking/W-/W+/tid/flags fields) plus the six canonical RONR procedural
transitions as pre/post place masks. Projects a Rust module of `pub const`
PRE/POST mask tables — the generated counterpart of the hand-written dispatch
table (generation over hand-writing per doctrine).
"""
[capabilities]
provides = ["urn:ggen:pack:strata-pn64-pack"]
requires = ["urn:ggen:pack:strata-protocol-pack"]

[dependencies]
strata-protocol-pack = "0.1.0"
