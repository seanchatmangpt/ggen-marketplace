[project]
name = "strata-pn64-pack"
version = "0.1.0"
description = "PN64/OCEL64 dual-word ABI mask tables projected from RDF for the Strata runtime"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"

[validation]
gates = []

[generation]
output_dir = "generated"

[[generation.rules]]
name = "pn64-masks"
query = { file = "queries/transitions.rq" }
template = { file = "templates/pn64_masks.rs.tera" }
output_file = "pn64_masks.rs"
skip_empty = false
mode = "Overwrite"
