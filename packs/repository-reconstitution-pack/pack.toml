[pack]
name = "repository-reconstitution-pack"
version = "26.9.28"
description = """
Semantic manufacturing pack for bounded legacy repository reconstitution.

The pack does not copy predecessor source or implement a universal semantic
equivalence decider. It projects an admitted observable contract into a
machine-readable reconstitution manifest that preserves exact subject,
capability owners, authority ceilings, verification requirements, replay, and
separate Release/Sunset Admission.

Designed for ggen-legacy v26.9.28 and reusable by any consumer that can provide
the rr:ReconstitutionSpec ontology shape.
"""
