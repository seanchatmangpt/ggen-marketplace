[pack]
name = "network-capability-pack"
version = "0.1.0"
description = """
Qualified capability contract for the network/HTTP family: the five pinned
semantic capabilities (Http.Request, Http.Get, Http.Post, Remote.Invoke,
Endpoint.Resolve) plus three provider-closed siblings (Http.Put, Http.Delete,
Http.Head), dcterms:identifier dotted IDs per the v26.9.30 pinned resolutions,
that a capability-resolution engine resolves against qualified realizations.

CAPABILITY is not IMPLEMENTATION: each capability is a semantic identity with
inputs, outputs, preconditions, postconditions, typed outcomes (success plus
dns-failure, connect-timeout, read-timeout, http-4xx, http-5xx, tls-error and
an explicit nondeterministic retry stance), evidence requirements, authority
requirements and determinism/retry semantics. Realizations carry provider
metadata cited from hex/hexdocs listings only (reactor_req 0.1.7 wrapping Req;
Erlang/OTP :inet) -- reactor_req has no local checkout and nothing here claims
code-level inspection.

Failed edges recorded in README: no `reactor_http` package exists on hex
(hex.pm API 404, 2026-09-30), so the family realizes via reactor_req; and
reactor_req 0.1.7 ships no endpoint-resolution DSL entity (witnessed
api-reference listing), so Endpoint.Resolve realizes via OTP :inet.getaddr/2.

Gates are violation-row SELECTs (rows mean refusal): capability-without-
realization, realization-without-qualification-conditions, typed-network-
failure-set-missing, authority-unbound-on-consequential (ProviderAvailable is
not Authorized -- Remote.Invoke on a consequential endpoint requires a bound
authority envelope, never mere endpoint reachability), endpoint-resolution-
precondition-required (family falsifier: no Http.*/Remote.Invoke capability
without endpoint resolution bound first), retry-semantics-declared (the
nondeterministic set names its retry stance). Every gate has a witnessed
negative fixture; python3 qualification/verify.py is the anti-vacuity court.

This pack is SELECT-only and grants zero execution authority: a plan is not an
execution, a reachable endpoint is not an authorization, and a generated
projection is not an admission. Consequential actuation remains outside this
pack behind BRCE.
"""
