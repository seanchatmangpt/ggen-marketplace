[pack]
name = "xaas-public-ontology-profile"
version = "0.1.0"
description = """Profiles the XaaS semantic universe as a constrained composition of real, retrieved, hash-pinned public ontologies (O_public --profile+align+constrain--> O*_xaas), instead of inventing a standalone xaas.ttl and writing templates against it. profile.ttl declares xaas:Profile as a real prof:Profile (W3C Profiles Vocabulary) composing PROV-O, PROF, DCAT, ORG, SKOS, ODRL, SOSA, OWL-Time, QUDT, SPDX, P-PLAN, and FnO via prof:isProfileOf -- never owl:imports (deliberate axiom-closure inclusion) nor owl:equivalentClass/equivalentProperty (asserted identity) until an equivalence is actually demonstrated by a competency-question check, per this pack's own gates. locks/*.lock.toml record per-ontology provenance (canonical IRI, source URL, SHA-256, publisher, license/status) for every ontology admitted into the profile -- a live URL is never silently treated as build truth. queries/competency/ holds the 20 XaaS competency questions (CQ01-CQ20) this profile is checked against; only a competency question with zero satisfying public term earns a native xaas: term -- none have been added yet, because the coverage check has not been run. mappings/ is reserved for non-RDF public standards (NIST SP 800-145, TOSCA 2.0, FOCUS, OpenTelemetry semantic conventions, Kubernetes OpenAPI, Terraform provider schemas) that inform O*_xaas without themselves being RDF -- ggen maps them in, they are not admitted as ontology sources. STANDING: public ontology retrieval is PARTIAL_ALIVE (9 real ontologies fetched and hash-pinned this session, batch 1 -- ggen-marketplace commit 135d9ec; GeoSPARQL/CoCoOn/NML/INDL/OMN explicitly not yet obtained, disclosed in ontologies/public/xaas-profile-batch-1/MANIFEST.md, not silently dropped). Profile composition (this pack's profile.ttl) is ALIVE as a real, loadable RDF graph. Qualification (logical consistency, SHACL conformance, namespace-collision, competency-question coverage) is UNKNOWN -- not yet run. No xaas: native term has been admitted; this pack intentionally contains zero xaas:-prefixed classes pending that check."""
