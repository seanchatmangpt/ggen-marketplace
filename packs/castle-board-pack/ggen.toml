[project]
name = "castle-board"
version = "26.8.15"
description = "Generate DfCM-derived Fortune-5 board admission requirements and prohibited board-failure goals"
authors = ["Sean Chatman"]
license = "AGPL-3.0"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatmangpt.com/ontology/castle#"
imports = []

[ontology.prefixes]
castle = "https://chatmangpt.com/ontology/castle#"
dcterms = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"

[generation]
output_dir = "."

[[generation.rules]]
name = "castle-board-requirements"
query = { file = "queries/board-requirements.rq" }
template = { file = "templates/src/board.generated.ts.tmpl" }
output_file = "src/board.generated.ts"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "castle-board-goals"
query = { file = "queries/board-goals.rq" }
template = { file = "templates/src/board-goals.generated.ts.tmpl" }
output_file = "src/board-goals.generated.ts"
skip_empty = false
mode = "Overwrite"