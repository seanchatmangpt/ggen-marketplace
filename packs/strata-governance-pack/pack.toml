[pack]
name = "strata-governance-pack"
version = "0.1.0"
description = """
Strata governance layer (X5 candidate 1, construction lane T11):
constitutional-diff gate over sealed consensus constants. GovernanceCommitment
individuals seal consensus constants to exact values (matching
strata-chain-pack's GENESIS_CONSTANTS); any sync whose projected constants
drift from the sealed commitment is refused with violation rows citing the
commitment. Falsifier: an out-of-constitution edit (change a projected
constant) must fire the gate.
"""
[capabilities]
# requires is empty: scripts/qualify_packs.py qualifies every pack in isolation
# (FM-PACK-018). The relationship to strata-chain-pack's GENESIS_CONSTANTS is
# documentation-only via ontology comments — no owl:imports — same as the
# rest of the strata family.
provides = ["urn:ggen:pack:strata-governance-pack", "urn:strata:governance:v1"]
requires = []
