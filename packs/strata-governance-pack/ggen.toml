[project]
name = "strata-governance-pack"
version = "0.1.0"
description = "Strata governance layer: constitutional-diff gate over sealed consensus constants (X5 candidate 1)"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"

[validation]
gates = [
  "gates/010_constitutional_diff.rq",
  "gates/020_commitment_closure.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "governance-report"
query = { file = "queries/governance_report.rq" }
template = { file = "templates/governance_report.rs.tera" }
output_file = "governance_report.rs"
skip_empty = false
mode = "Overwrite"
