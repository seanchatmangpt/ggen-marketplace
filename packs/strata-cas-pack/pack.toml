[pack]
name = "strata-cas-pack"
version = "0.1.0"
description = """
Content-addressed storage for Strata: Merkle commits, knowledge wormholes
(addressable cross-graph links), and snapshots. Frames commits over the
CLAP-PDU protocol types from strata-protocol-pack.
"""
[capabilities]
provides = ["urn:ggen:pack:strata-cas-pack"]
requires = ["urn:ggen:pack:strata-protocol-pack"]

[dependencies]
strata-protocol-pack = "0.1.0"
