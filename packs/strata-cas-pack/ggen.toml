[project]
name = "strata-cas-pack"
version = "0.1.0"
description = "Content-addressed storage (Merkle commit / KnowledgeWormhole / Snapshot) frame types projected from RDF for the Strata runtime"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"

[validation]
gates = [
  "gates/010_snapshot_abutment.rq",
  "gates/020_wormhole_digest_shape.rq",
  "gates/030_cas_chain_composition.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "cas-merkle"
query = { file = "queries/commits.rq" }
template = { file = "templates/cas.rs.tera" }
output_file = "cas.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "cas-chain"
query = { file = "queries/cas_chain.rq" }
template = { file = "templates/cas_chain.rs.tera" }
output_file = "cas_chain.rs"
skip_empty = false
mode = "Overwrite"
