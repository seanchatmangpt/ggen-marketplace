[project]
name = "strata-temprun-pack"
version = "0.1.0"
description = "Actuation arena fuel-lease tables projected from RDF for the Strata temprun runtime"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"

[validation]
gates = ["gates/010_fuel_positive.rq"]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "temprun-arenas"
query = { file = "queries/arenas.rq" }
template = { file = "templates/arena.rs.tera" }
output_file = "arena.rs"
skip_empty = false
mode = "Overwrite"
