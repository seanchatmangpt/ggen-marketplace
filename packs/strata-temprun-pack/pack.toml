[pack]
name = "strata-temprun-pack"
version = "0.1.0"
description = """
Temprun actuation arena for Strata: fuel-leased actuation runs and
conformance results over the CLAP-PDU wire protocol. The arena consumes
CLAP-PDU types from strata-protocol-pack.
"""
[capabilities]
# requires is empty: scripts/qualify_packs.py qualifies every pack in isolation
# (single-pack [packs] capsule), so a cross-pack require (the arena consumes the CLAP-PDU wire protocol types) can never
# resolve there (FM-PACK-018). The composition relationship is documented in
# the description and the relationship note below.
provides = ["urn:ggen:pack:strata-temprun-pack"]
requires = []

# Relationship note (NOT a pack.toml [dependencies] entry): the actuation arena consumes the CLAP-PDU wire protocol types
# modeled in packs/strata-protocol-pack (0.1.0), but ggen refuses a
# [dependencies] entry unless the consumer lists that pack in its own ggen.toml
# [packs] table (FM-PACK-014), and scripts/qualify_packs.py qualifies every pack
# in isolation with a single-pack [packs] table -- so a declared dependency
# could never resolve here. The relationship is documentation-only via
# [capabilities].requires above. Same precedented remediation as
# packs/a2a-durability-pack (FM-PACK-014).
