[project]
name = "strata-chain-pack"
version = "0.1.0"
description = "Strata chain layer: block header chaining, chain-validity law, deterministic PoW and fork choice projected from RDF (roadmap slice S5)"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "https://strata.chatman.ai/ontology#"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd = "http://www.w3.org/2001/XMLSchema#"
st = "https://strata.chatman.ai/ontology#"

[validation]
gates = [
  "gates/010_block_layout.rq",
  "gates/020_chain_law.rq",
]

[generation]
output_dir = "generated"

[[generation.rules]]
name = "chain-consts"
query = { file = "queries/chain_constants.rq" }
template = { file = "templates/chain_consts.rs.tera" }
output_file = "chain_consts.rs"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "chain-engine"
query = { file = "queries/chain_constants.rq" }
template = { file = "templates/chain_engine.rs.tera" }
output_file = "chain_engine.rs"
skip_empty = false
mode = "Overwrite"
