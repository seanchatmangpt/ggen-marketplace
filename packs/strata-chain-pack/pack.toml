[pack]
name = "strata-chain-pack"
version = "0.1.0"
description = """
Strata chain layer (roadmap slice S5, docs/sjira/v26.10.8/STRATA-BLOCKCHAIN-ROADMAP.md):
block header with parent-hash chaining over Merkle tx commits, chain-validity law
(height continuity, parent-hash binding, tx Merkle root, tx cap, duplicate-tx refusal,
monotonic timestamp slot, deterministic PoW), and deterministic fork choice
(longest valid chain wins; equal-height tie resolved by lower tip nonce).
Law provenance: S5 REUSE-ADAPTED for the gate law, greenfield for header/chain
logic, per the roadmap S5/S8 precondition outcome. Projects self-contained
serde-free Rust modules.
"""
[capabilities]
# requires is empty: scripts/qualify_packs.py qualifies every pack in isolation
# (single-pack [packs] capsule), so a cross-pack require can never resolve there
# (FM-PACK-018). The relationship to strata-hash-pack's Merkle primitives and
# strata-tx-pack's Tx framing is documentation-only via ontology comment — no
# owl:imports — same remediation as strata-tx-pack (S2) and strata-ledger-pack
# (S4), per docs/sjira/v26.10.8/STRATA-BLOCKCHAIN-ROADMAP.md slice S5.
provides = ["urn:ggen:pack:strata-chain-pack", "urn:strata:chain:v1"]
requires = []
