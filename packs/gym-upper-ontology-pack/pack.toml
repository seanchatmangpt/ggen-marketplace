[pack]
name = "gym-upper-ontology-pack"
version = "26.9.1"
description = """
Shared upper ontology for the gym-ecosystem packs. Introduced only for concepts
that are provably re-minted incompatibly across existing packs, each cited to the
real file it was read from:

  consequence class : 4 encodings -- chatgptgym dct:type <urn:gymact:consequence:do>,
                      lifegym (byte-identical SHACL copy, sha256 c6b0a7db..., over ZERO
                      sosa:Procedure individuals -- a dead constraint), ww3gym
                      dct:relation "DO" string, domain-capability-pack dcp:consequence
                      "DO" string. Neither <urn:gymact:consequence:read> nor :do is
                      TYPED by any file in the marketplace; this pack defines them.
  capability        : sosa:Procedure (chatgptgym, ww3gym) vs dcp:Capability (dcp).
  authority policy  : urn:lifegym:authority-policy and urn:ww3gym:policy-safe-scope,
                      both bare odrl:Policy with no shared class.
  world profile     : urn:lifegym:world-profile, eco:ggen-ecosystem, w:ontology.
  standing          : eco:Standing (concept only) vs stl:StandingState (10 states).

Published vocabularies are reused, never replaced: sosa:, dcat:, dcterms:, odrl:,
prov:, skos:. Only the crosswalk itself is minted.

Authority boundary preserved verbatim from chatgptgym-gymact-bridge-pack: gu:DO is an
INTENT class. This pack carries no runtime actuation authority; consequential DO stays
behind external GymAct/BRCE admission.
"""
