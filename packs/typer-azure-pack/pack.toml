[pack]
name = "typer-azure-pack"
version = "26.10.22"
description = """
Projection profile: Azure CLI-style Typer command modules GENERATED from the
real microsoft/bicep-types-az schema. Vendors a minimal frozen excerpt of the
bicep type index (one RP: Microsoft.Storage/storageAccounts@2022-09-01),
mints a typer: vocabulary ontology (ResourceType -> TyperSubApp,
Property -> TyperOption: kebab-case flag from the Azure parameter name, python
type from the property type, required from required[], enum -> typer:choice
flattened sh:in equivalents), and projects a Typer sub-app module via one
generation rule (queries/typer.rq -> templates/typer_commands.py.tera).
Gates refuse a generated module missing a required option and a non-Typer
module; the qualification consumer renders the storage sub-app, py_compiles
it, asserts exact az flag names, and proves both gates non-vacuous by
mutation.
"""

[capabilities]
provides = ["urn:ggen:pack:typer-azure-pack", "urn:ggen:pack:typer-azure-pack#typer-commands"]
requires = []
