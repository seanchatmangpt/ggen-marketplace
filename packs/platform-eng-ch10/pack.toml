[pack]
name = "platform-eng-ch10"
version = "0.1.0"
description = "Chapter 10 ('Starter Kits and Templates') companion source from Packt's 'The Platform Engineer's Handbook' (seanchatmangpt/Platform-Engineer-s-Handbook, upstream PacktPublishing/Platform-Engineer-s-Handbook), captured verbatim as a ggen-create pack via 'ggen-create start platform-eng-ch10' + 'add -r' + 'usename PlatformEngineersHandbook' + 'generate'. This directory contains the code examples from Chapter 10 of 'The Platform Engineer's Handbook'. This chapter teaches you how to create and publish starter kit templates that give teams a production-ready foundation from day one, encode best practices for project structure, CI/CD integration, and observability instrumentation, and solve the upgrade problem with Renovate."
