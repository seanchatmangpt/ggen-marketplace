[project]
name = "capability-lineage-propagation-pack"
version = "26.8.24"

[ontology]
source = "ontology.ttl"

[generation]
output_dir = "."

[[generation.rules]]
name = "propagation-plan"
query = { file = "queries/30-clean-plan.rq" }
template = { file = "templates/propagation-plan.json.tera" }
output_file = "generated/propagation/plan.json"

[[generation.rules]]
name = "propagation-court"
query = { file = "queries/30-clean-plan.rq" }
template = { file = "templates/propagation-court.py.tera" }
output_file = "generated/propagation/qualification_court.py"
