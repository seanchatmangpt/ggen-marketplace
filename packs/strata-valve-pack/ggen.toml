[project]
name = "strata-valve-pack"
version = "0.1.0"
description = "Strata valve refusal taxonomy projected from RDF to Elixir refusal skeletons"
authors = ["Chatman Ecosystem"]
license = "MIT"

[ontology]
source = "ontology.ttl"
base_iri = "urn:strata:valve:"

[ontology.prefixes]
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
owl = "http://www.w3.org/2002/07/owl#"
xsd = "http://www.w3.org/2001/XMLSchema#"
valve = "urn:strata:valve#"
wire = "urn:strata:protocol:wire#"

[validation]
gates = []

[generation]
output_dir = "generated"

[[generation.rules]]
name = "valve-refusals"
query = { file = "queries/refusals.rq" }
template = { file = "templates/refusals.ex.tera" }
output_file = "refusals.ex"
skip_empty = false
mode = "Overwrite"
