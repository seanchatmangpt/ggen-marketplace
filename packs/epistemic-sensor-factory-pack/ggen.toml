[project]
name = "epistemic-sensor-factory"
version = "26.8.25"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/epistemic-sensor-factory#"

[generation]
output_dir = "."

[[generation.rules]]
name = "sensor-family-plan"
query = { file = "queries/010_sensor_specs.rq" }
template = { file = "templates/sensor-family-plan.json.tera" }
output_file = "generated/epistemic-sensor-factory/sensor-family-plan.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "replication-plan"
query = { file = "queries/260_replication_targets.rq" }
template = { file = "templates/replication-plan.json.tera" }
output_file = "generated/epistemic-sensor-factory/replication-plan.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "evidence-return-protocol"
query = { file = "queries/400_evidence_return_protocol.rq" }
template = { file = "templates/evidence-return-protocol.json.tera" }
output_file = "generated/epistemic-sensor-factory/evidence-return-protocol.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "closed-loop-assimilation-plan"
query = { file = "queries/501_closed_loop_assimilation_plan.rq" }
template = { file = "templates/closed-loop-assimilation-plan.json.tera" }
output_file = "generated/epistemic-sensor-factory/closed-loop-assimilation-plan.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "next-wave-plan"
query = { file = "queries/502_next_wave_plan.rq" }
template = { file = "templates/next-wave-plan.json.tera" }
output_file = "generated/epistemic-sensor-factory/next-wave-plan.json"
skip_empty = false
mode = "Overwrite"
