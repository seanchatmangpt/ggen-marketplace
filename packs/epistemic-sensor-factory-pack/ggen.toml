[project]
name = "epistemic-sensor-factory"
version = "26.8.25"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/epistemic-sensor-factory#"

[generation]
output_dir = "."

[[generation.rules]]
name = "sensor-family-plan"
query = { file = "queries/010_sensor_specs.rq" }
template = { file = "templates/sensor-family-plan.json.tera" }
output_file = "generated/epistemic-sensor-factory/sensor-family-plan.json"
skip_empty = false
mode = "Overwrite"
