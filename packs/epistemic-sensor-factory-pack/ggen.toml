[project]
name = "epistemic-sensor-factory"
version = "26.8.25"

[ontology]
source = "ontology.ttl"
base_iri = "https://ggen.dev/ontology/epistemic-sensor-factory#"

[generation]
output_dir = "."

[[generation.rules]]
name = "sensor-family-plan"
query = { file = "queries/010_sensor_specs.rq" }
template = { file = "templates/sensor-family-plan.json.tera" }
output_file = "generated/epistemic-sensor-factory/sensor-family-plan.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "replication-plan"
query = { file = "queries/260_replication_targets.rq" }
template = { file = "templates/replication-plan.json.tera" }
output_file = "generated/epistemic-sensor-factory/replication-plan.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "evidence-return-protocol"
query = { file = "queries/400_evidence_return_protocol.rq" }
template = { file = "templates/evidence-return-protocol.json.tera" }
output_file = "generated/epistemic-sensor-factory/evidence-return-protocol.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "causal-propagation-plan"
query = { file = "queries/610_causal_propagation_plan.rq" }
template = { file = "templates/causal-propagation-plan.json.tera" }
output_file = "generated/epistemic-sensor-factory/causal-propagation-plan.json"
skip_empty = false
mode = "Overwrite"

[[generation.rules]]
name = "production-function-report"
query = { file = "queries/810_r57_production_function_projection.rq" }
template = { file = "templates/production-function-report.json.tera" }
output_file = "generated/epistemic-sensor-factory/production-function-report.json"
skip_empty = false
mode = "Overwrite"
