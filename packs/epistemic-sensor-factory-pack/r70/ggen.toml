[project]
name = "autocatalytic-capital-yield-r70"
version = "26.8.25"

[ontology]
source = "ontology.ttl"
base_iri = "https://chatman.ai/ontology/autocatalytic-capital-yield#"

[generation]
output_dir = "."

[[generation.rules]]
name = "capital-yield-report"
query = { file = "queries/900_capital_yield_projection.rq" }
template = { file = "templates/capital-yield-report.json.tera" }
output_file = "generated/r70/capital-yield-report.json"
skip_empty = false
mode = "Overwrite"
