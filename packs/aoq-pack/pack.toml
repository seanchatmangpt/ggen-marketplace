[pack]
name = "aoq-pack"
version = "0.1.0"
description = """AOQ (Async Ordered Queue) wire-law pack: the canonical AOQ RDF graph — 64-byte AOQ1 frame header field table (R-1 ruling: prefix-compatible with the cgap-arrow IPC1 MetaHeader, magic 0x414F_5131, version 2, FNV-1a32 over bytes [0x00,0x3C) at 0x3C), status constants in the frozen band 0x4347_A001..A009 (A009 = UNSUPPORTED_VERSION, KD-1 band extension), the KEM hand-law seam (BLOCKED-class provenance, never projected), and closed Epoch/StreamType enums — projected into deterministic Rust kind-enums and status maps, with nine sync-time closure gates: header-field TX-5 name closure (cName/rustName/goName), status-band closure, AOQ1 offset contiguity chain, wire-kind closed set, epoch/stream enum closure, KEM seam fence, frozen-pin collision fence (retired cgap pins 0x4347_0004/0006 must never appear), template linkage, and AOQ1 grounding law (64 bytes, magic, version)."""

[capabilities]
provides = ["urn:ggen:pack:aoq-pack"]

[validation]
# Declarative list; the 26.10.11 runner enumerates every gates/*.rq under this
# pack's gates/ directory in sorted filename order (the directory listing, not
# this list, is the runner's truth) and evaluates each as ASK (true = violation)
# or SELECT (any row = violation) against the union graph; any violation refuses
# the sync with [FM-PACK-013]. Witnessed per-gate: ar-1-gates-witness.md.
gates = [
  "gates/010_header_field_closure.rq",
  "gates/020_status_band.rq",
  "gates/030_offset_contiguity.rq",
  "gates/040_wire_kind_closure.rq",
  "gates/050_epoch_stream_closure.rq",
  "gates/060_kem_seam.rq",
  "gates/070_no_frozen_pin_collision.rq",
  "gates/080_template_linkage.rq",
  "gates/090_grounding_regex.rq",
  "gates/100_partition_stream_binding.rq",
  "gates/110_cursor_slot_layout.rq",
  "gates/120_wrap_safe_ordering.rq",
]
