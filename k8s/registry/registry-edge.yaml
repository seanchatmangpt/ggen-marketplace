# Registry host for ggen-marketplace.fnox.io (ggen-marketplace-18).
# Edge: /Users/sac/fnox/infra/gcp/edge/main.tf maps the host to a Cloud Run service;
# this manifest is a PLACEHOLDER in-cluster equivalent (nginx welcome page, no registry content;
# no deploy path uses it; a 200 from it is NOT evidence the registry is served). Not applied; see receipts/fnox-io-hosting-2026-11-14.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ggen-marketplace-registry
  labels: {app: ggen-marketplace-registry}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ggen-marketplace-registry}
  template:
    metadata:
      labels: {app: ggen-marketplace-registry}
    spec:
      containers:
        - name: registry
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: ggen-marketplace-registry
spec:
  selector: {app: ggen-marketplace-registry}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ggen-marketplace-registry
spec:
  rules:
    - host: ggen-marketplace.fnox.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: ggen-marketplace-registry, port: {number: 80}}
