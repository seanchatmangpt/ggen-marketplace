kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# No `name:` here by design (audit F2): setup_kind_cluster.sh always passes
# --name, and kind refuses a --name that differs from the config's name.
# The script's --name is authoritative.
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 8080
    protocol: TCP
  - containerPort: 30443
    hostPort: 8443
    protocol: TCP
- role: worker
