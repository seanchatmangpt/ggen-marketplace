# ggen generation contract for the autofde-lab AAIF wrap projection.
#
# DeclarativeRules consumer (see solutions/enterprise-aaif/ggen.toml for the
# same pattern): queries are pinned from aaif-vanilla-pack (extracted at
# 7dc8caa4f); templates are the pack's frontmatter-free templates vendored at
# templates/ (byte-identical to packs/aaif-vanilla-pack/templates).
# No [templates] dir section: frontmatter-stripped templates give a
# template-dir manifest zero rules (written: []), so routing is declared here.

[project]
name = "autofde-lab-aaif"
version = "26.10.5"

[ontology]
source = "autofde_agent.ttl"

[generation]
output_dir = "."

# A2A agent card -> .well-known/agent.json
[[generation.rules]]
name = "a2a_agent_card"
mode = "Overwrite"
query = { file = "../../packs/aaif-vanilla-pack/queries/a2a_agent_card.rq" }
template = { file = "templates/a2a_agent_card.json.tmpl" }
output_file = ".well-known/agent.json"

# Agent Router / Envoy AI Gateway CRDs -> k8s/agent-router.yaml
[[generation.rules]]
name = "agent_router_crds"
mode = "Overwrite"
query = { file = "../../packs/aaif-vanilla-pack/queries/agent_router_crds.rq" }
template = { file = "templates/agent_router_crds.yaml.tmpl" }
output_file = "k8s/agent-router.yaml"

# Agentgateway L7 proxy config -> agentgateway/config.json
[[generation.rules]]
name = "agentgateway_config"
mode = "Overwrite"
query = { file = "../../packs/aaif-vanilla-pack/queries/agentgateway_config.rq" }
template = { file = "templates/agentgateway_config.json.tmpl" }
output_file = "agentgateway/config.json"

# Repository guidelines -> AGENTS.md (deployed to autofde-lab docs/aaif/)
[[generation.rules]]
name = "agents_md"
mode = "Overwrite"
query = { file = "../../packs/aaif-vanilla-pack/queries/agents_md.rq" }
template = { file = "templates/AGENTS.md.tmpl" }
output_file = "AGENTS.md"

# Goose client config -> .config/goose/config.yaml
[[generation.rules]]
name = "goose_config"
mode = "Overwrite"
query = { file = "../../packs/aaif-vanilla-pack/queries/goose_config.rq" }
template = { file = "templates/goose_config.yaml.tmpl" }
output_file = ".config/goose/config.yaml"

# Goose project hints -> .goosehints
[[generation.rules]]
name = "goose_hints"
mode = "Overwrite"
query = { file = "../../packs/aaif-vanilla-pack/queries/goose_hints.rq" }
template = { file = "templates/goose_hints.tmpl" }
output_file = ".goosehints"

# Goose recipe -> .config/goose/recipes/default.yaml
[[generation.rules]]
name = "goose_recipe"
mode = "Overwrite"
query = { file = "../../packs/aaif-vanilla-pack/queries/goose_recipe.rq" }
template = { file = "templates/goose_recipe.yaml.tmpl" }
output_file = ".config/goose/recipes/default.yaml"

# MCP server bindings -> mcp/mcp_servers.json
[[generation.rules]]
name = "mcp_servers"
mode = "Overwrite"
query = { file = "../../packs/aaif-vanilla-pack/queries/mcp_servers.rq" }
template = { file = "templates/mcp_servers.json.tmpl" }
output_file = "mcp/mcp_servers.json"
