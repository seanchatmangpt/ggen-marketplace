version: "1.0.0"
title: "Formal Decision Solve Loop"
description: "Match a scikit-decide solver to a registered domain and run a bounded rollout via the autofde MCP tools."
instructions: |
  Call decision_catalog, then decision_match, then decision_solve; report standing and receipt_sha256 for {{target_scope}}.
prompt: |
  Solve the requested decision domain and report the receipt.
parameters:
  - key: target_scope
    input_type: string
    requirement: optional
    default: "current_workspace"
    description: "Target directory or module scope"
activities:
  - "message: Ready to run recipe Formal Decision Solve Loop"
  - "Execute default task"
  - "Run verification suite"
extensions:
  - type: builtin
    name: developer
    bundled: true
    timeout: 300
retry:
  max_retries: 3
  timeout_seconds: 60
  checks:
    - type: shell
      command: "git status"